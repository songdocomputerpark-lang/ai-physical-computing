  pg: pyautugoui_소스코드/pg (1).zip
  bt-opmp: 블루투스통신_소스코드/3.(응용)(값을 던짐)-한개의 값을 던지는 경우/opencvmediapipe_블루투스.zip
  bt-thonny-send: 블루투스통신_소스코드/3.(응용)(값을 던짐)-한개의 값을 던지는 경우/thonny_블루투스.zip
