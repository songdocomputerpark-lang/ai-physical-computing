  # 사이트판(PD-10)이 필요한 파일은 원본을 그대로 두고 담당 구역이 …-site.py를 따로 만든다(f058·f059 판정 구간, f062, f064 write(), f074 줄 번호).
  # 2026-09-18: f058·f059·f062 사이트판은 P3-03(구역 A), f074 사이트판은 P3-05(구역 C)에서 만들었다. 사이트판은 이관 기록이 아니라 이 목록에 없고(examples:verify 대상 아님)
