# 예제 이관 목록과 기록(PLAN §8.0 PD-33) — scripts/import-examples.mjs가 읽고 기록을 적어요.
#
# 원본 자료(교과서·교안 코드 압축 파일)의 어떤 파일을 examples/의 어디로 옮겼는지, 옮긴 결과가 원본과 같은지(줄 수·SHA-256·구문)를 한 곳에 적어요.
# 원본 코드 파일은 줄 끝(CRLF → LF)만 바꾸고 한 글자도 고치지 않아요(줄 번호가 교과서와 같아야 해요, PD-10). 제목·설명은 코드 파일이 아니라
# 옆의 사이드카(<이름>.meta.yaml)에 적어요 — 처음 옮길 때 아래 meta로 만들고, 그 뒤로는 사이드카를 직접 고쳐요(스크립트가 덮어쓰지 않아요).
#
# 필드
#   materials_root  원본 폴더 위치(저장소 뿌리 기준). 운영자 PC는 "."(원본 폴더들이 저장소 뿌리에 있음, git 제외).
#                   클라우드·다른 PC는 --materials <폴더>로 비공개 자료 저장소의 originals/를 가리켜요.
#   sources         원본 zip의 짧은 이름 → 경로(materials_root 기준). 코드 id·경로는 docs/CODE_MAPPING.md §2와 같아요.
#   examples[]      id(CODE_MAPPING 코드 id), source(sources 이름 또는 낱개 파일이면 file), member(zip 안 경로 또는 파일 경로),
#                   target(examples/ 아래 대상 경로: 영문 소문자·숫자·하이픈, PD-09), author(operator | third_party — third_party는 third-party/ 폴더 아래),
#                   expect_syntax_error(원본 결함으로 구문 오류가 나는 파일만 true, 예: f074), meta(사이드카 씨앗: title·description·lesson·page·tags·packages,
#                   ESP32 예제는 배선 parts(src/lab/README.md 7.4)와 스모크 기대 결과 smoke(tests/e2e/examples-smoke.spec.ts)도)
#   기록(스크립트가 씀)  lines(줄 수)·sha256(옮긴 파일)·syntax(ok | error-expected)·syntax_checker(python-ast | node-light)·imported(날짜)
#
# 확인: node scripts/import-examples.mjs --verify (원본 없이 기록과 대조, npm test에도 들어 있음)

materials_root: .

