# 키트 장치 도감 — 장치별 분류·가상 보드 배선 표 (판 1.5.0, 구역 K1)
#
# scripts/kit/generate-kit.mjs가 .cache/v150/kit.json(브릭셀 쪽에서 뽑은 장치·코드)과 이 표를 합쳐
# examples/esp32/kit/**(코드 + 사이드카)와 content/kit/devices.yaml을 만들어요. 이 표는 "사람이 정한 것"만 담아요.
# 코드 글은 이 표에 없어요(브릭셀 쪽 글 그대로 옮겨요) — 코드가 쓰는 문자 LCD(I2cLcd)는 생성기가 코드를 보고 배선에 저절로 더해요.
#
# 칸(장치 id = d-<장>-<번호 두 자리>)
#   support   A    지금 있는 가상 보드 부품·흉내로 끝까지 돼요
#             B1   판 1.5.0의 범용 부품 4종(sensor-digital·sensor-analog·joystick·output-digital)으로 돼요
#             B2   부품 + 흉내 모듈(SPI·I2C 칩 레지스터·dht·1-Wire·UART 프레임 …)이 더 있어야 해서 이번 판에는 실제 보드에서만
#             C    더 어려운 것(타이밍 파형·상태 기계·큰 초기화 순서·파일 시스템) — 실제 보드에서만
#   virtual   (선택) 가상 보드에서 되는 정도. full 끝까지 / partial 돌지만 일부 모습이 달라요 / real-only 실제 보드에서만.
#             적지 않으면 A·B1은 full, B2·C는 real-only. 코드마다 다르면 virtual_steps: [1단계, 2단계].
#   reason    partial·real-only인 까닭 한 문장("…아직 없어서" 꼴 — 연습 방법과 도감 쪽에 그대로 보여요)
#   parts     가상 보드 배선(예제 사이드카 parts와 같은 모양 — src/lab/modules/board/wiring-spec.ts). 핀은 브릭셀 실드 V3 규칙 그대로.
#             문자 LCD는 코드에 I2cLcd( 가 있으면 생성기가 더하므로 적지 않아요.
#             options는 범용 부품의 화면 표시용 값(color 등)이에요.
#   tags      갤러리·검색 낱말(장 이름·연결 방식·문자 LCD 낱말은 생성기가 더해요)
#   slug      예제 파일 이름에 쓰는 영문 이름(적지 않으면 회로 그림 파일 이름에서)
#   note      도감 쪽에 보일 참고 글
#   libs      라이브러리 목록을 손으로 고칠 때(적지 않으면 카드의 Library 칸과 코드의 import로 정함)
#
# 새 장치를 더하는 법은 content/kit/devices.yaml 머리말을 보세요.

