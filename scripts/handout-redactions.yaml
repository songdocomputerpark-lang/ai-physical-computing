# 가린 편집본 교안 — 가릴 곳 목록 + 쪽별 눈 확인 기록(PLAN §8.5 P5-14, PD-31)
#
# scripts/redact-handouts.py가 이 파일을 읽어 원본(블루투스 통신 수업 교안 PDF, PyAutoGUI 수업 슬라이드 PPTX)에서
# 교사용 자료실에 둘 가린 편집본 PDF를 만들고 검사해요. 원본 PDF·PPTX는 저장소와 자료실 어디에도 올리지 않아요(C6).
#
#   python scripts/redact-handouts.py build            # 두 편집본을 다시 만들고 바로 검사(원본 폴더 필요 — 운영자 PC)
#   python scripts/redact-handouts.py check            # 저장소의 편집본만 검사(원본 없이)
#   python scripts/redact-handouts.py preview bt       # 쪽 그림(.cache/handouts/bt/pNN.png) — 눈 확인용
#
# 문서마다 적는 것
#   source      원본 약칭(scripts/lib/lesson-images.mjs의 SOURCES: BT·PPT)과 원본 파일 SHA-256·쪽 수.
#               원본이 바뀌면(SHA-256이 다르면) 도구가 멈춰요 — 좌표를 다시 확인해야 하기 때문이에요.
#   output      편집본 경로(파일 이름은 src/components/lesson/handouts.ts의 HANDOUT_DOCS와 같게)와 SHA-256·크기.
#               build가 알려 주는 값을 사람이 적어요. 편집본이 바뀌면 아래 review를 다시 해요(check가 SHA-256을 대조해요).
#   title·lang  새 문서 제목과 언어(원본 메타데이터는 모두 지우고 이 둘만 새로 붙여요).
#   notice      표지에 붙이는 안내 한 줄(무엇을 가렸는지).
#   outline     새 책갈피([단계, 제목, 쪽]). 원본의 "슬라이드 N" 책갈피는 지워요. 쪽 번호는 원본과 같아요(쪽을 빼거나 더하지 않아요 —
#               차시 frontmatter handouts의 쪽 번호와 #page= 링크가 그대로 맞게).
#   photos      사진(원본이 JPEG인 그림)을 다시 인코딩하는 설정: 화면에 놓인 크기 기준 최대 dpi, JPEG 품질.
#   redactions  가릴 곳. page = 원본 쪽 번호(PDF 쪽 = 슬라이드 번호), rects = [x0, y0, x1, y1] pt(쪽 왼쪽 위 기준, 쪽 크기 1440×810),
#               kind = face(얼굴) · path(기관 계정 폴더 경로·사적인 폴더·파일 이름) · device-address(블루투스 기기 주소) ·
#               classroom(학급 게시물 화면) · desktop(바탕화면 아이콘 이름·작업 표시줄 날짜),
#               label = 상자에 적는 글(비우면 적지 않아요, 상자가 작아 글이 안 들어가도 적지 않아요), reason = 왜 가리는지.
#               ※ 가린 내용 자체(경로·주소·이름)는 이 파일에도 적지 않아요 — 이 파일도 공개 저장소에 올라가요.
#   review      쪽마다 한 줄 눈 확인 기록(모든 쪽). 편집본(output.sha256)을 쪽 그림으로 한 장씩 열어 보고 적어요.
#               by·date(YYYY-MM-DD)·result("통과"로 시작) — 무엇이 보이는지, 가린 곳, 얼굴·경로·파일명·기기 주소·학교명 확인 결과.
#
# 운영자 결정(docs/DECISIONS.md)
#   O9  블루투스 교안 p9·p84·p91 실행 화면 속 얼굴은 운영자·공동 저자 본인 → 가리지 않아요. p5 외부 홍보 이미지 속 인물은 가려요.
#   O11 학교명 공개 → 표지(p1)의 학교명을 가리지 않아요(PLAN §13 "허락하면 편집본 p1 가림 해제").
#   개인정보 예외(DECISIONS §1)는 그대로: 기관 계정 경로·사적인 파일 이름·기기 주소·학급 게시물 화면은 가려요.

