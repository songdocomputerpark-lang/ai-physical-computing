# 공개 이미지 눈 확인 기록 — 옛 공용 기록(scripts/check-repo.mjs가 읽음, PLAN §8.0·§9.3, PD-18·PD-32)
#
# ※ 원고(교과서·블루투스 교안·PyAutoGUI 슬라이드)에서 꺼내는 차시 그림은 여기에 적지 않아요. 차시마다 따로인 그림 목록
#   content/lessons/<단원 폴더>/<차시>.images.yaml에 적고 원고 이미지 추출 도구(npm run images:extract -- <차시>)로 꺼내요
#   (P5-01, 2026-09-25 — 절차는 MAINTENANCE.md 3-1). 저장소 검사는 이 파일과 모든 차시 목록을 함께 읽어요(git 인덱스 = 스테이징한 내용).
#   이 파일은 차시 밖 그림(사이트 화면 그림, 테스트 그림 등)과 도구가 생기기 전에 손으로 꺼낸 그림(아래 1-1-1 삽화 3장)에 써요.
#   같은 그림의 기록을 두 곳에 두면 검사가 막아요.
#
# 저장소 어디에든(tests/·.github/·뿌리 포함) 커밋하는 래스터 이미지(png·jpg·gif·webp·avif·bmp·tif·heic·ico)와
# 글·코드 파일(SVG·마크다운·Astro·CSS 등) 안에 data: 주소로 넣은 래스터 그림은 한 장씩 열어 보고 기록해야 커밋할 수 있어요.
# 글·코드 파일 안에 넣은 그림은 그 파일의 경로를 적어요(되도록 그림 파일로 빼서 public/images/에 두어요).
# 확인할 것: 얼굴, 이름, 화면 속 경로·파일명, 기기 주소(MAC 등), 학교명이 없는지.
# 문제가 있으면 기록하지 말고 이미지를 고치거나(가리기·자르기) 빼요.
#
# 적는 모양
# images:
#   - path: public/images/lessons/u1/pixel-grid.png   # 저장소 뿌리 기준 정확한 경로(패턴 아님)
#     reviewed:
#       by: claude                                     # 확인한 사람
#       date: 2026-09-20                               # 확인한 날짜 YYYY-MM-DD
#       result: 통과 — 얼굴·이름·경로·파일명·기기 주소·학교명 없음   # "통과"로 시작해야 해요
# 도구가 생기기 전에 손으로 꺼낸 이미지는 use(쓰는 곳)·source(꺼낸 곳)·processing(다시 저장한 방법)을 함께 적어요.
# 그림 안의 메타데이터(EXIF·XMP·ICC·글 조각)도 저장소 검사가 막아요.

images:
  # ── 1-1-1 인공지능 응용 프로그램과 에이전트(배우기 견본 차시, PLAN §8.1 P1-06) ──
  # 원고 인쇄 009쪽 "인간 지능의 세 가지 핵심 요소" 표 안의 삽화 3장. 이미지 이름표(XMP 제목)가 출판 편집 삽화 표기라
  # INVENTORY §5.2 "출판 편집 삽화·캐릭터"(운영자 자료, O2·O4)로 보고 sources.yaml의 원고 항목(public/images/lessons/**)에 속해요.
  # 같은 펼침면의 008쪽 도입 그림(스톡 추정)과 010~011쪽 스톡 제작자 표기 그림(third_party 대상)은 쓰지 않았어요.
  - path: public/images/lessons/u1/1-1-1-recognition.webp
    use: 1-1-1 핵심 개념 표의 "인식" 예시(스마트폰에 말하는 학생 삽화)
    source: 교과서 원고 I단원 PDF 2쪽(인쇄 009쪽) 표 안의 래스터 삽화(PDF 이미지 번호 18)
    processing: 픽셀만 새 이미지로 옮겨 WebP(품질 86)로 저장, 415×415, 12,442바이트. EXIF·XMP·ICC 없음(sharp metadata 확인, WebP 조각은 VP8 하나)
    reviewed:
      by: claude
      date: 2026-09-16
      result: 통과 — 그린 인물 삽화(실존 인물 사진 아님). 얼굴 사진·이름·화면 속 경로·파일명·기기 주소·학교명 없음
  - path: public/images/lessons/u1/1-1-1-learning.webp
    use: 1-1-1 핵심 개념 표의 "학습" 예시(강아지·고양이를 보고 배운 AI가 새 그림을 나누는 삽화)
    source: 교과서 원고 I단원 PDF 2쪽(인쇄 009쪽) 표 안의 벡터 삽화. PDF 좌표 (851, 586)~(998, 719) 영역을 288dpi로 그린 뒤 표 테두리 선이 들어간 가장자리를 잘라냄
    processing: 픽셀만 새 이미지로 옮겨 가로 420으로 줄이고 WebP(품질 86)로 저장, 420×307, 10,338바이트. EXIF·XMP·ICC 없음(sharp metadata 확인, WebP 조각은 VP8 하나)
    reviewed:
      by: claude
      date: 2026-09-16
      result: 통과 — 동물 얼굴 그림과 "AI" 글자만 있음. 사람 얼굴·이름·화면 속 경로·파일명·기기 주소·학교명 없음, 잘라낸 가장자리에 표 선·본문 글자 없음
  - path: public/images/lessons/u1/1-1-1-reasoning.webp
    use: 1-1-1 핵심 개념 표의 "추론" 예시(도로 상황을 살피는 자율주행 자동차 삽화)
    source: 교과서 원고 I단원 PDF 2쪽(인쇄 009쪽) 표 안의 래스터 삽화(PDF 이미지 번호 20)
    processing: 픽셀만 새 이미지로 옮겨 가로 420으로 줄이고 WebP(품질 86)로 저장, 420×416, 17,840바이트. EXIF·XMP·ICC 없음(sharp metadata 확인, WebP 조각은 VP8 하나)
    reviewed:
      by: claude
      date: 2026-09-16
      result: 통과 — 자동차·도로 그림. 사람·얼굴·이름·화면 속 경로·파일명·기기 주소·학교명 없음, 번호판은 0000 무늬
