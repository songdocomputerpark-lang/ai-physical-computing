# 저장소 검사 허용 목록(scripts/check-repo.mjs가 읽음, PLAN §8.0 PD-32)
#
# 저장소 검사는 원본 자료 형식(.pdf .pptx .hwp .hwpx .zip .pyc)과
# 5MB(5,242,880바이트)를 넘는 파일의 커밋을 막아요.
# 꼭 올려야 하는 파일만 아래에 경로와 이유를 적어요. 경로 패턴 문법은 sources.yaml과 같아요(** * ?).
#
# original_formats: 올려도 되는 원본 형식 파일
#   - path: public/teacher/bt-handout-redacted.pdf
#     reason: 블루투스 교안 가린 편집본(PD-31). 쪽별 눈 확인 기록 위치도 함께 적어요.
#
# large_files: 5MB를 넘어도 되는 파일(모델·펌웨어·편집본 PDF)
#   - path: public/models/*.task
#     reason: MediaPipe 모델(PD-13)
#     max_mb: 10   # 이보다 크면 여전히 막아요. 적지 않으면 50(GitHub는 50MB가 넘는 파일에 경고해요).
#
# privacy_exceptions: 개인정보 모양 검사의 예외. public/licenses/ 아래의 제3자 라이선스 고지 원문과 package-lock.json(npm이 기록하는
#   다른 패키지의 deprecated 안내문)만 적을 수 있고, kinds는 email(저작자가 스스로 적은 공개 주소)만 돼요.
#   운영자·학생의 정보는 어떤 경우에도 예외로 두지 않아요.
#   - path: public/licenses/codemirror.txt
#     kinds: [email]
#     reason: MIT 라이선스 고지 원문의 저작권 표기(저작자가 공개한 주소). 고지 원문은 고치지 않고 그대로 실어야 해요.
#
# history_reviewed: git 기록 훑기(npm run check:repo -- --history, 2026-09-26 P6-05)가 알린 옛 파일 내용 가운데 사람이 보고
#   개인정보가 아니라고 확인한 것. 기록은 고치거나 지울 수 없어서(기록 재작성 금지) 확인한 사실만 적어요. 커밋 전 훅·CI의 저장소 검사는
#   이 목록을 쓰지 않아요(지금 파일은 늘 고칠 수 있으니까요). 진짜 개인정보였다면 여기에 적지 말고 운영자에게 알려요.
#   - blob: 0123456789abcdef0123456789abcdef01234567   # git blob 번호(16진수 10~40자리 — 헷갈리지 않게 40자리 전부를 적어요)
#     reason: 무엇이었고 왜 개인정보가 아닌지(언제 어느 커밋에서 바뀌었는지)

# 가린 편집본 PDF(PD-31, P5-14 — Phase 5 통합 2026-09-25). 쪽 번호가 원본과 같아 차시 frontmatter handouts의 #page=가 그대로 맞아요.
# 2026-09-26(P6-04): 두 편집본 끝에 사이트가 만든 출처·라이선스 쪽을 한 장씩 덧붙였어요(블루투스 교안 92쪽, 슬라이드 24쪽 — 원본 쪽은 그대로).
original_formats:
  - path: public/teacher/handouts/bt-lesson-plan-redacted.pdf
    reason: 블루투스 통신 수업 교안의 가린 편집본(PD-31, P5-14). 만든 도구 scripts/redact-handouts.py, 가릴 곳과 쪽별 눈 확인 기록은 scripts/handout-redactions.yaml(output.sha256이 이 파일과 같아야 해요 — 저장소 검사 handout-review 규칙과 python scripts/redact-handouts.py check).
  - path: public/teacher/handouts/pyautogui-slides-redacted.pdf
    reason: PyAutoGUI 수업 슬라이드를 PDF로 바꾼 가린 편집본(PD-31, P5-14). 도구와 기록은 위와 같아요.

# MediaPipe 모델(public/models/, PD-13 커밋 대상)은 5MB를 넘는 파일이 있어요(손 랜드마커 약 7.8MB, 자세 랜드마커 lite 약 5.5MB·full 약 9.4MB).
# 모델을 내려받는 묶음(P2-08 손, P2-09 얼굴·자세)이 파일마다 항목을 더해요 — 패턴이 아니라 파일 경로 하나씩, max_mb는 10 이하(PLAN §5.2).
# 출처 항목은 sources.yaml "MediaPipe 모델"이 public/models/**를 이미 덮어요. 예:
#   - path: public/models/hand_landmarker.task
#     reason: MediaPipe 손 랜드마커 모델(float16 v1, Apache-2.0 모델 카드, PD-13). 사이트가 같은 사이트에서 내보내 학생 브라우저가 외부 모델 서버에 접속하지 않아요.
#     max_mb: 10
large_files:
  # MediaPipe 모델(P2-08·P2-09). 2026-09-18에 운영자가 공식 주소에서 받아 검증한 파일 5개가 public/models/에 들어 있다(이미 배포 중).
  # 크기·MD5는 sources.yaml "MediaPipe 모델" 항목 주석에 있다. 판을 올릴 때는 실제 크기를 다시 재고 max_mb를 함께 고친다.
  - path: public/models/hand_landmarker.task
    max_mb: 8
    reason: MediaPipe 손 랜드마커 모델(float16/1, Apache-2.0 모델 카드, 7.46MB). 같은 사이트에서 내보내야 학생 브라우저가 외부 모델 서버에 접속하지 않는다(PD-02·PD-03, PD-13).
  - path: public/models/face_landmarker.task
    max_mb: 4
    reason: MediaPipe 얼굴 그물 모델(float16/1, Apache-2.0 모델 카드, 3.58MB). 같은 사이트에서 내보내야 외부 요청 0건을 지킬 수 있다(PD-02·PD-03).
  - path: public/models/pose_landmarker_full.task
    max_mb: 10
    reason: MediaPipe 자세 모델 full(float16/1, Apache-2.0 모델 카드, 8.96MB). 레거시 model_complexity=1·2가 쓰는 등급이다(PD-20).
  - path: public/models/pose_landmarker_lite.task
    max_mb: 6
    reason: MediaPipe 자세 모델 lite(float16/1, Apache-2.0 모델 카드, 5.51MB). model_complexity=0과 조절 패널의 저사양 모드가 쓴다(PD-20).

privacy_exceptions:
  - path: public/licenses/codemirror.txt
    kinds: [email]
    reason: CodeMirror·Lezer·보조 라이브러리의 MIT 라이선스 고지 원문. 저작권 표기에 저작자(Marijn Haverbeke)가 스스로 적은 공개 주소가 있고, MIT 라이선스는 이 표기를 그대로 싣도록 요구해요(2026-09-16 P2-02).
  - path: package-lock.json
    kinds: [email]
    reason: npm이 잠금 파일에 기록하는 다른 패키지의 deprecated 안내문(glob 11.1.0 — workbox-build 7.4.1의 의존성)에 그 패키지 저작자가 스스로 적은 공개 주소가 들어 있어요. 잠금 파일은 npm이 만들고 사람이 고치지 않는 파일이라 그대로 둬요(2026-09-16 병렬 제작 준비).
  - path: public/licenses/opencv-3rd-party.txt
    kinds: [email]
    reason: opencv-python 휠 안 LICENSE-3RD-PARTY.txt 원문(FFmpeg·libpng·FreeType 등 구성요소 저작자 표기의 공개 주소). 같은 사이트 예비본으로 휠을 재배포하므로 고지 원문을 고치지 않고 그대로 실어요(PD-19, 2026-09-16 P2-05).
  - path: public/licenses/mqtt.txt
    kinds: [email]
    reason: MQTT.js 5.15.2와 그 의존성(ws·debug·readable-stream·process 등)의 MIT·ISC 라이선스 고지 원문. 저작권 표기에 저작자가 스스로 적은 공개 주소가 있고, MIT·ISC는 이 표기를 그대로 싣도록 요구해요(2026-09-18 Phase 4 준비).
  - path: public/licenses/numpy-3rd-party.txt
    kinds: [email]
    reason: numpy 휠 안 dist-info/licenses/ 고지 원문 16개(pocketfft·PCG·Mersenne Twister·libdivide 등 구성요소 저작자가 스스로 적은 공개 주소). opencv와 같은 까닭으로 휠을 재배포하므로 원문을 고치지 않고 그대로 실어요(PD-19, 2026-09-17 P2 검토 반영).
  # 2026-09-26(P6-04) 새 고지 파일 넷 — 모두 공식 저장소의 라이선스 원문을 글자 그대로 옮긴 것이라 저작자가 스스로 적은 공개 주소가 들어 있어요.
  - path: public/licenses/micropython-esp32-firmware.txt
    kinds: [email]
    reason: MicroPython ESP32 펌웨어 안 구성요소의 고지 원문(ESP-IDF COPYRIGHT.rst의 wpa_supplicant·USB 드라이버 저작자, Newlib COPYING.NEWLIB의 기여자, wpa_supplicant·SD/MMC 머리말의 저작자 주소). 펌웨어를 다시 나누며 MIT·BSD가 요구하는 저작권 표기를 고치지 않고 싣는 것이에요(운영자 할 일 19번).
  - path: public/licenses/pyodide-wheels-3rd-party.txt
    kinds: [email]
    reason: Pyodide 휠 안 구성요소의 고지 원문(zlib LICENSE의 Jean-loup Gailly·Mark Adler 주소, FreeType FTL.TXT의 연락 주소). 휠을 다시 나누며 고지를 그대로 싣는 것이에요(PD-19).
  - path: public/licenses/pyodide-core-3rd-party.txt
    kinds: [email]
    reason: Pyodide 코어 안 구성요소의 고지 원문(CPython Doc/license.rst의 제3자 코드 저작자, zlib·bzip2 LICENSE의 저작자 주소). 코어 파일을 같은 사이트 예비본으로 다시 나누며 고지를 그대로 싣는 것이에요.
  - path: public/licenses/mediapipe-wasm-3rd-party.txt
    kinds: [email]
    reason: MediaPipe WebAssembly 안 fft2d(Ooura FFT)의 라이선스 원문에 저작자가 스스로 적은 공개 주소. wasm을 같은 사이트에서 내보내며 고지를 그대로 싣는 것이에요.

# git 기록 훑기에서 확인한 옛 파일 내용(2026-09-26 P6-05 개인정보 최종 점검 — 기록 속 파일 내용 2,905개 가운데 알린 3개, 모두 개인정보 아님).
history_reviewed:
  - blob: 6aacd294ee6b03b4993125a01a4b2ad94f9bb56f
    reason: tests/unit/repo-check.test.ts의 옛 판(150130b·f481671, 2026-09-16)이 OneDrive 경로 검사를 시험하려고 가짜 기관 이름("어느 기관")으로 만든 경로 조각이에요. 실제 기관·계정 이름이 아니고, 지금 판은 낱말을 조각으로 나눠 만들어요.
  - blob: 1ce953152415102abf0cc2704582da483037ae7f
    reason: src/lab/bridge/message.ts의 옛 판(e9e06a0, 2026-09-18)이 제어 문자 정규식에 NUL 글자를 그대로 적어 글로 읽히지 않았던 것이에요. NUL을 빈칸으로 바꿔 개인정보 규칙으로 다시 훑었더니 걸린 것이 없었어요(5394f61에서 이스케이프 글자로 고침).
  - blob: 500d90c707532d05842042063377efbe05c8b257
    reason: 같은 src/lab/bridge/message.ts의 더 옛 판(81745d7, 2026-09-18)으로 까닭이 위와 같아요. NUL을 빈칸으로 바꿔 다시 훑었더니 걸린 것이 없었어요.
  - blob: 682440d19b4c2d3bd0bd0f58d3e32cbe77f5f415
    reason: src/lab/serial/mock/mini-python.ts의 옛 판(fd86632, 2026-09-17 — Phase 3 모의 시리얼)이 모의 보드 machine.unique_id()의 흉내 값으로 적은 연속 바이트(0a부터 0f까지 차례로 늘어나는 여섯 값)예요. 실제 기기의 주소가 아니에요. 2026-09-26 Phase 6 안전 검토 지적 5로 unique_id(ESP32에서는 공장 MAC)를 기기 주소 낱말로 보게 되면서 걸렸고, 지금 판은 사이트 가상 주소 모양(02:00:00:00:00:0f)으로 바꿨어요.
