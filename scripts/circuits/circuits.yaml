# 회로 구성 그림 목록 — 키트 업체의 회로 구성 도구(https://circuit.gorillacell.kr/)로 그리는 배선 그림 23장.
#
# 이 파일이 "그림의 원본 설명"이다. 한 그림 = 보드(ESP32 실드 V3) 하나 + 부품과 핀 번호. 거기서
#   npm run circuits:build    → scripts/circuits/<id>.circuit (도구가 읽는 회로 파일, 손으로 고쳐도 되지만 이 목록과 달라지면 테스트가 알려 줘요)
#   npm run circuits:export   → 도구를 열어 .circuit을 불러오고 [이미지 저장] → .cache/v140-staging/circuits/<id>.png   (운영자 PC에서, 인터넷 필요)
#   npm run circuits:import   → 투명 여백을 자르고 WebP로 바꿔 public/images/circuits/third-party/kit-vendor/<id>.webp, 아래 `image`를 채움
# 순서로 만든다(자세한 절차는 각 스크립트 머리말에 있다).
#
# 핀은 출판본 교과서 코드를 따른다(결정 C137). 출판본 쪽 글은 .cache/v140/textbook/pNNN.txt. 출판본과 사이트 예제가 다르면 `notes`에 적었다.
# 실드 V3에 없는 핀(GPIO 2)은 그리지 않고 아래 `undrawable`에 남겼다.
#
# 칸 설명
#   id             차시-번호. 파일 이름(<id>.circuit·<id>.png·<id>.webp)이 된다.
#   lesson         차시 label(사이트 차시 번호).
#   textbook_page  출판본에서 이 배선을 그린 쪽(쪽 번호는 출판본 그대로).
#   parts          부품 이름은 차시 frontmatter `examples[].parts`와 같은 이름(lcd-i2c·oled-i2c·touch-digital·touch-analog-4ch·rgb-led·laser·
#                  neopixel·buzzer·mp3·fan-motor·servo·uart-converter). pins의 글자는 부품 안 핀 이름이고 값은 보드 GPIO 번호다.
#                  mp3는 module_tx(모듈 TX가 닿는 보드 핀)·module_rx(모듈 RX가 닿는 보드 핀),
#                  uart-converter는 converter_tx·converter_rx(변환기 TX·RX가 닿는 보드 핀).
#   caption        그림 설명(캡션) 한 줄. 캡션 맨 끝에 붙일 고정 문장은 `caption_note`.
#   alt            그림을 못 보는 사람이 읽을 대체 글(고1이 읽는 말, "~예요"체, 위치 낱말 없이).
#   notes          출판본과 사이트 예제가 다르거나 그림에서 정한 것.
#   image          circuits:import가 채운다(file·width·height·bytes·sha256·png_sha256). 손으로 쓰지 않는다.

version: 1
