  - id: 3-1-2-1
    lesson: 3-1-2
    textbook_page: 190
    title: UART 변환기와 레이저 연결
    parts:
      - { part: laser, pins: { pin: 18 } }
      - { part: uart-converter, pins: { converter_tx: 17, converter_rx: 16 } }
    caption: 레이저(18번)와 USB-UART 변환기(보드 TX 16번·RX 17번)를 연결해요.
    alt: ESP32 실드 V3 보드 아래에 레이저 모듈과 USB-UART 변환기가 놓여 있어요. 레이저는 검정 선(GND), 빨강 선(VCC), 노란 선으로 18번 핀 줄에 이어요. 변환기는 검정 선(GND)과 노란 선 두 개만 쓰는데, 두 선은 서로 엇갈려 변환기의 TX가 17번, RX가 16번 핀 줄로 가요.
    notes:
      - 출판본 코드(190·191쪽) UART(2, baudrate=115200, tx=16, rx=17)를 따랐다 — 보드 TX(16번)는 변환기 RX로, 변환기 TX는 보드 RX(17번)로 간다(엇갈림).
      - 출판본 그림 글(190쪽)은 GND·VCC·GPIO 16번 핀·GPIO 17번 핀 순서라 변환기 TX→16·RX→17(곧은 연결)로 읽혀 코드와 맞지 않는다. 사이트 예제 3-1-2-uart-laser-site.py는 그림에 맞춰 tx=17, rx=16으로 고쳐 두었다 — 이 그림(코드 기준)과 반대다. 예제나 그림 중 하나를 맞춰야 한다.
      - 변환기의 VCC 선은 잇지 않았다(변환기는 따로 C 타입 USB 케이블로 노트북에 연결 — 190쪽 안내). 실물 확인 전.
