    alt: ESP32 실드 V3 보드 아래에 MP3 플레이어와 스피커가 놓여 있어요. 검정 선(GND)과 빨강 선(VCC), 노란 선 두 개로 플레이어의 TX와 RX를 보드의 16번·17번 핀 줄에 잇고, 스피커의 두 선은 플레이어의 스피커 연결단에 이어요.
    notes:
