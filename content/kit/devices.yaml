          - 시작할 때 잰 값을 «자석 없음» 기준으로 써요.
          - 기준보다 THRESH 이상 오르면 N, 내려가면 S 로 판정하고, 새로 다가올 때마다 한 번 세요.
          - 문에 자석을 붙이면 문이 열리고 닫힌 횟수를 셀 수 있어요.
