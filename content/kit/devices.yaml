          - 온도를 재려면 약 0.75초가 걸려서 sleep_ms(750) 으로 기다려요.
          - 방 안 공기, 차가운 물, 따뜻한 물에서 LCD 값이 어떻게 다른지 비교해 보세요.
      - n: 2
        kind: 심화 예제
