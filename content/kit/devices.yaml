  - id: d-5-10
    number: "5.10"
    chapter: 5
    name: 제스처 센서 (APDS9960)
    name_en: Gesture Sensor (APDS9960)
    description: APDS9960 칩을 사용하는 제스처, 근접, 주변광, 색상 센서.
    interface: Serial I2C
    pins: 6 pins (GND, VCC, SDA, SCL, INT, LED)
    gpio: SDA=GPIO 21, SCL=GPIO 22
    part: i2c-008-gesture-sensor-apds9960
    libraries:
      - name: apds9960
        file: apds9960.py
        site: false
        url: https://brixel.gorillacell.kr/07_thonny/03_esp32/downloads/libs/Library%206.18%20apds9960.py
      - name: i2c_lcd
        file: i2c_lcd.py
        site: true
    wiring:
      - GND → GND
      - VCC → 3V3
      - SDA → GPIO 21
      - SCL → GPIO 22
      - LCD SDA → GPIO 21
      - LCD SCL → GPIO 22
      - LCD VCC → 5V
      - LCD GND → GND
    circuit: d-5-10.webp
    steps:
      - n: 1
        kind: 기본 동작 테스트
        title: 손 동작(제스처) 읽기
        file: esp32/kit/ch5/5-10-gesture-1.py
        virtual: real-only
        points:
          - isGestureAvailable() 이 True 일 때 readGesture() 로 움직임 방향을 읽어요.
          - 방향은 왼쪽·오른쪽·위·아래·가까이·멀리 숫자(1~6)로 나오고, LCD 에는 영어(LEFT 등)로 보여 줘요.
          - 손을 너무 느리게 움직이면 인식이 안 돼요. 부드럽고 빠르게 휙!
      - n: 2
        kind: 심화 예제
        title: 손 가까이 감지와 밝기 알림
        file: esp32/kit/ch5/5-10-gesture-2.py
        virtual: real-only
        points:
          - readProximity() 는 손이 가까울수록 커지는 0~255 값이에요.
          - readAmbientLight() 는 주변이 밝을수록 커져요. 손으로 가리면 줄어들어요.
          - NEAR , DARK 숫자는 방 밝기에 따라 다르니 LCD 의 값을 보고 바꿔 주세요.
    support: C
    virtual: real-only
    virtual_reason: APDS9960 제스처 센서 칩의 측정 대기열 흉내가 가상 보드에 아직 없어서
    note: 이 제스처 센서 라이브러리(apds9960.py)는 사용 조건(GPL)이 사이트에 싣기에 맞지 않아 싣지 않았어요. 브릭셀 쪽에서 내려받아 보드에 올려요.
  - id: d-5-11
    number: "5.11"
    chapter: 5
    name: 공기질 센서 (SGP30)
    name_en: 3.62. 공기질 센서 (SGP30)
    description: 공기 속 eCO2(등가 이산화탄소)와 TVOC(휘발성 유기화합물)를 알려 주는 I2C 센서예요. 냄새·환기 실험에 좋아요.
    interface: I2C
    pins: 4 pins (G, V, SDA, SCL)
    gpio: SDA=GPIO 21, SCL=GPIO 22 (LCD 와 같은 I2C 선, SGP30 주소 0x58)
    part: i2c-004-co2-sgp30-sensor
    libraries:
      - name: i2c_lcd
        file: i2c_lcd.py
        site: true
    wiring:
      - G → GND
      - V → 3V3
      - SDA → GPIO 21
      - SCL → GPIO 22
      - LCD SDA → GPIO 21
      - LCD SCL → GPIO 22
      - LCD VCC → 5V
      - LCD GND → GND
    circuit: d-5-11.webp
    steps:
      - n: 1
        kind: 기본 동작 테스트
        title: eCO2·TVOC 읽기
        file: esp32/kit/ch5/5-11-sgp30-1.py
        virtual: real-only
        points:
          - LCD 와 SGP30 이 같은 i2c 선을 쓰고 주소만 달라요(LCD 0x20, SGP30 0x58).
          - 0x2003 명령으로 측정을 시작하고, 1초마다 0x2008 명령으로 6바이트를 읽어요.
          - 켠 뒤 15초 동안은 400ppm / 0ppb 가 나와요. 그동안 기다려 주세요.
      - n: 2
        kind: 심화 예제
        title: 공기 상태 판단과 환기 알림
        file: esp32/kit/ch5/5-11-sgp30-2.py
        virtual: real-only
        points:
          - eCO2 와 TVOC 를 각각 단계로 나눠 알려 줘요.
          - 둘 중 하나라도 나쁘면 보드 LED 가 켜져요.
          - recent 로 최근 10번 평균을 내서 값이 튀어도 흐름을 볼 수 있어요.
    support: B2
    virtual: real-only
    virtual_reason: SGP30 공기질 센서 칩(명령과 CRC)의 흉내가 가상 보드에 아직 없어서
  - id: d-5-12
    number: "5.12"
    chapter: 5
    name: 공기질 센서 (CCS811)
    name_en: 3.63. 공기질 센서 (CCS811)
    description: eCO2 와 TVOC 를 알려 주는 또 하나의 I2C 공기질 센서예요. SGP30 과 값을 비교해 보면 재미있어요.
    interface: I2C
    pins: 4 pins (G, V, SDA, SCL)
    gpio: SDA=GPIO 21, SCL=GPIO 22 (LCD 와 같은 I2C 선, CCS811 주소 0x5A/0x5B)
    part: i2c-005-co2-ccs811-sensor
    libraries:
      - name: i2c_lcd
        file: i2c_lcd.py
        site: true
    wiring:
      - G → GND
      - V → 3V3
      - SDA → GPIO 21
      - SCL → GPIO 22
      - LCD SDA → GPIO 21
      - LCD SCL → GPIO 22
      - LCD VCC → 5V
      - LCD GND → GND
    circuit: d-5-12.webp
    steps:
      - n: 1
        kind: 기본 동작 테스트
        title: eCO2·TVOC 읽기
        file: esp32/kit/ch5/5-12-ccs811-1.py
        virtual: real-only
        points:
          - 0xF4 로 측정 프로그램을 시작하고 MEAS_MODE (0x01)에 0x10 을 써서 1초마다 측정해요.
          - 0x02 번 레지스터에서 8바이트를 읽으면 앞 4바이트가 eCO2·TVOC 예요.
          - 처음 20분쯤은 센서가 길들여지는 시간이라 값이 흔들려요.
      - n: 2
        kind: 심화 예제
        title: 변화 화살표와 환기 알리미
        file: esp32/kit/ch5/5-12-ccs811-2.py
        virtual: real-only
        points:
          - 이전 값과 비교해 올라가는지/내려가는지/비슷한지 알려 줘요.
          - eCO2 가 1500 이상이거나 TVOC 가 220 이상이면 보드 LED 가 켜져요.
          - max_eco2 는 켠 뒤로 가장 나빴던 값을 기억해요.
