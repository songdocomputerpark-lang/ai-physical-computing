        virtual: real-only
        points:
          - min , max 로 지금까지의 가장 낮은 값과 높은 값을 계속 갱신해요.
          - TARGET 를 바꾸면 알림이 켜지는 온도를 바꿀 수 있어요.
          - LCD 윗줄은 지금 온도, 아랫줄은 최저·최고 온도예요.
