          - rtc.get_time() 은 년·월·일·시·분·초·요일을 한꺼번에 돌려줘요.
          - "시각이 틀리면 set_time 줄의 # 을 지우고 지금 시각으로 한 번만 실행한 뒤 다시 # 을 붙이세요."
