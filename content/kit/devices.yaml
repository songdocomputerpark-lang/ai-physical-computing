    virtual: full
  - id: d-3-18
    number: "3.18"
    chapter: 3
    name: 미세먼지 센서 (PMS7003)
    name_en: 3.59. 미세먼지 센서 (PMS7003)
    description: 공기 중 미세먼지(PM1.0·PM2.5·PM10)의 양을 레이저로 재서 알려 주는 센서예요. 어댑터 없이 4핀으로 바로 연결해요.
    interface: UART
    pins: 4 pins (G, V, RX, TX)
    gpio: "모듈 TX=GPIO 25 (보드 RX), 모듈 RX=GPIO 26 (보드 TX) (+ LCD: SDA=GPIO 21, SCL=GPIO 22)"
    part: d-004-pms7003-sensor
    libraries:
      - name: i2c_lcd
        file: i2c_lcd.py
        site: true
    wiring:
      - GND → GND
      - VCC → 5V
      - TX (모듈) → GPIO 25
      - RX (모듈) → GPIO 26
      - LCD SDA → GPIO 21
      - LCD SCL → GPIO 22
      - LCD VCC → 5V
      - LCD GND → GND
    circuit: d-3-18.webp
    steps:
      - n: 1
        kind: 기본 동작 테스트
        title: 미세먼지 값 읽기
        file: esp32/kit/ch3/3-18-pms7003-1.py
        virtual: real-only
        points:
          - 센서가 1초마다 32바이트 묶음을 보내요. 머리글자 0x42 0x4D 로 시작을 찾아요.
          - 묶음의 앞 30바이트를 더한 값이 마지막 2바이트와 같을 때만 믿고 PM 값을 꺼내요.
          - 단위는 ug/m3 예요. 켠 직후 30초쯤은 값이 불안정해요.
      - n: 2
        kind: 심화 예제
        title: 미세먼지 단계와 최근 평균
        file: esp32/kit/ch3/3-18-pms7003-2.py
        virtual: real-only
        points:
          - PM2.5 값으로 좋음/보통/나쁨/매우 나쁨을 알려 줘요.
          - recent 에 최근 10개를 모아 평균을 내서 값이 튀어도 흐름을 볼 수 있어요.
          - 나쁨 이상이면 보드 LED 가 켜져요. 기준 숫자를 바꿔 보세요.
    support: B2
    virtual: real-only
    virtual_reason: 미세먼지 센서가 UART로 보내는 값(32바이트 프레임)의 흉내가 가상 보드에 아직 없어서
  - id: d-3-19
    number: "3.19"
