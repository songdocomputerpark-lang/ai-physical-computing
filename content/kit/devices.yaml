        file: esp32/kit/ch3/3-14-rotary-2.py
        virtual: real-only
        points:
          - RANGE_BOUNDED 는 0과 19 끝에서 멈춰요. (끝에서 안 넘어가요)
          - duty_u16 숫자가 클수록 LED 가 밝아져요.
