    circuit: d-5-09.webp
    steps:
      - n: 1
        kind: 기본 동작 테스트
        title: 거리 재기
        file: esp32/kit/ch5/5-09-vl53l0x-1.py
        virtual: real-only
        points:
          - tof.read() 는 밀리미터(mm) 단위로 거리를 돌려줘요. 10mm = 1cm 예요.
          - 빛을 쏘고 돌아오는 시간으로 재서 아주 정확해요(약 3cm ~ 120cm).
          - 검은 물체나 투명한 물체는 거리가 부정확할 수 있어요.
      - n: 2
        kind: 심화 예제
        title: 주차 도우미 (가까울수록 빠르게 깜빡)
        file: esp32/kit/ch5/5-09-vl53l0x-2.py
        virtual: real-only
        points:
          - 거리가 가까울수록 gap (깜빡 간격)이 짧아져서 LED 가 빨리 깜빡여요.
          - 100mm 아래에서는 LED 가 계속 켜지고 LCD 에 STOP! 이 나와요. 숫자를 바꿔 보세요.
          - 멈추면 finally 로 센서를 끄고 LED 도 꺼요.
    support: C
    virtual: real-only
