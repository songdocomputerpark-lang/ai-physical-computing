    virtual: full
    note: 사이트 교과서 예제의 MP3 모듈은 TX 17·RX 16이지만, 이 도감의 브릭셀 실드 배선은 모듈 TX→25번, 모듈 RX→26번이에요.
  - id: d-8-01
