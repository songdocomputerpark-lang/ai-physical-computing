      - LCD GND → GND
    circuit: d-4-30.webp
    steps:
      - n: 1
        kind: 기본 동작 테스트
        title: 자기장 값 보기
        file: esp32/kit/ch4/4-30-magnet-1.py
        virtual: full
        points:
          - 자석을 가까이 대면 값이 기준에서 오르거나 내려가요 — 어느 쪽인지는 극(N/S)에 따라 달라요.
