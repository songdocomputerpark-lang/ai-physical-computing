    virtual: real-only
    virtual_reason: CCS811 공기질 센서 칩(앱 시작·상태 레지스터)의 흉내가 가상 보드에 아직 없어서
  - id: d-6-01
    number: "6.01"
    chapter: 6
    name: 진동 모터
    name_en: Vibration Motor
    description: 햅틱 피드백(진동)을 위한 불균형 질량의 DC 모터.
