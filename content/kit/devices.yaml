          - 물이 차면 보드의 파란 LED 가 깜빡이고 LCD 에 FULL! OVERFLOW 가 나와요.
          - 수위가 바뀔 때마다 '켠 뒤 몇 초'와 '앞 상태가 얼마나 유지됐는지'를 출력 창에 적어요.
          - 30ms 동안 같은 값일 때만 변화로 인정해서 물결에 의한 떨림을 걸러요.
