          - 켜질 때와 꺼질 때 딸깍 소리가 나요.
          - value(1) = COM 과 NO 연결, value(0) = COM 과 NC 연결이에요.
          - 안전을 위해 선생님과 함께 낮은 전압(건전지 정도)만 연결하세요.
      - n: 2
        kind: 심화 예제
        title: 버튼 누르면 5초 동안 켜지는 타이머
        file: esp32/kit/ch7/7-03-relay-2.py
        virtual: full
        points:
          - 복도 센서등처럼 «한 번 누르면 잠깐 켜지는» 장치를 만드는 방법이에요.
          - 켜진 동안 또 누르면 시간이 연장돼요.
          - ON_TIME 을 바꿔 켜 두는 시간을 조절해 보세요.
    support: B1
    virtual: full
  - id: d-7-04
    number: "7.04"
    chapter: 7
    name: 펌프 릴레이 V2 + 워터 펌프
    name_en: 4.12. 펌프 릴레이 V2 + 워터 펌프
    description: 디지털 신호 하나로 워터 펌프를 켜고 끄는 모듈이에요. 릴레이와 펌프 구동 회로가 하나로 합쳐져 있어요.
    interface: Digital
    pins: 3 pins (G, V, S) + 펌프 2 pins
    gpio: S=GPIO 23
    part: o-006-pump-relay-v2
    libraries: []
    wiring:
      - G → GND
      - V → 5V
      - S → GPIO 23
      - 펌프 → 릴레이 모듈의 펌프 단자 2개에 연결
    circuit: d-7-04.webp
    steps:
      - n: 1
        kind: 기본 동작 테스트
        title: 펌프 2초 켜고 끄기
        file: esp32/kit/ch7/7-04-pumprelay-1.py
        virtual: full
        points:
          - relay.value(1) 이면 릴레이가 켜져 펌프가 돌고, 0 이면 꺼져요.
          - 펌프를 물 없이 오래 돌리면 고장 나요. 물에 담근 상태에서만 시험해요.
          - 멈출 때도 finally 로 꼭 꺼서 펌프가 계속 돌지 않게 해요.
      - n: 2
        kind: 심화 예제
        title: 버튼으로 급수 + 안전 차단
        file: esp32/kit/ch7/7-04-pumprelay-2.py
        virtual: full
        points:
          - BOOT 버튼을 누르고 있는 동안만 펌프가 돌아요(물 주기 버튼).
          - 5초가 넘으면 자동으로 꺼요. 한 번 떼었다가 다시 눌러야 켜져요.
          - MAX_MS 를 바꿔 우리 화분이나 실험에 맞는 안전 시간을 정해 보세요.
    support: B1
    virtual: full
  - id: d-7-05
    number: "7.05"
    chapter: 7
    name: MP3 플레이어
    name_en: MP3 Player
