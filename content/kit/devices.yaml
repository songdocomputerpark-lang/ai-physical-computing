          - getPress() 는 Pa 단위라서 100 으로 나누면 hPa(헥토파스칼)가 돼요. 보통 1000 안팎이에요.
          - 고도는 바다 높이의 기압을 기준으로 한 계산값이라 날씨에 따라 몇십 m 틀릴 수 있어요.
          - 센서를 손으로 감싸면 LCD 의 온도가 올라가는 것을 볼 수 있어요.
      - n: 2
        kind: 심화 예제
        title: 높이가 얼마나 변했나 (상대 고도)
        file: esp32/kit/ch5/5-08-bmp280-2.py
        virtual: real-only
        points:
          - 높이가 올라갈수록 기압이 조금씩 낮아져요. 이 차이로 높이 변화를 알아요.
          - 5번 읽은 평균을 써서 숫자가 덜 흔들려요.
          - 1m 이상 바뀌면 LED 가 켜져요. LCD 에는 높이 변화와 UP/DOWN/SAME 이 나와요.
    support: B2
    virtual: real-only
    virtual_reason: BMP280 기압 센서 칩(보정 계수 레지스터)의 흉내가 가상 보드에 아직 없어서
  - id: d-5-09
    number: "5.09"
    chapter: 5
    name: 거리 센서 (VL53L0X)
    name_en: Distance Sensor (VL53L0X)
