  - id: d-6-06
    number: "6.06"
    chapter: 6
    name: 긱 서보모터 (그린·그레이·오렌지 등)
    name_en: 4.11. 긱 서보모터 (그린·그레이·오렌지 등)
    description: 보드에 바로 연결해서 쓰는 서보모터예요. 연속회전형은 펄스 폭으로 속도와 방향을, 각도형은 정해진 각도를 정해요.
    interface: PWM
    pins: 3 pins (G, V, S)
    gpio: S=GPIO 25
    part: m-022-green-geek-servo-motor
    part_variants:
      - part: m-024-grey-geek-servo-360
        label: 회색 긱 서보(360도 각도형)
      - part: m-023-orange-geek-servo-motor
        label: 주황 긱 서보
      - part: m-008-geek-servo-360-5kg
        label: 긱 서보 360도 5Kg
      - part: m-009-gray-lego-servo
        label: 그레이 레고 서보
    libraries: []
    wiring:
      - G → GND
      - V → 5V
      - S → GPIO 25
    circuit: d-6-06.webp
    steps:
      - n: 1
        kind: 기본 동작 테스트
        title: 정지·정방향·역방향
        file: esp32/kit/ch6/6-06-geekservo-1.py
        virtual: partial
        points:
          - 서보는 50Hz(20ms 마다) 펄스의 폭으로 움직여요. 1500µs 가 가운데(정지)예요.
          - 연속회전형(초록·360도형)은 각도 대신 속도예요. 1.5ms 정지, 더 크면 정방향, 더 작으면 역방향이에요.
          - SPEED 를 키우면 더 빨라져요. 각도형 서보는 돌지 않고 정해진 각도로 움직여요.
          - 꼭 try/finally 로 끝에서 정지 펄스를 보내고 deinit() 해요.
      - n: 2
        kind: 심화 예제
        title: BOOT 버튼으로 속도 단계 바꾸기
        file: esp32/kit/ch6/6-06-geekservo-2.py
        virtual: partial
        points:
          - levels 리스트에 펄스 폭 10단계가 들어 있어요. 버튼을 누를 때마다 다음 단계로 가요.
          - 정지에서 멀수록(1500 − 펄스 폭의 차이가 클수록) 빨라요. 출력 창에 속도(%)가 나와요.
          - 정지(1500µs)에서도 서보가 조금 돌면, 서보 뒤의 작은 나사(트림)를 돌려 맞춰요.
    support: B1
    virtual: partial
    virtual_reason: 가상 보드의 서보 그림은 각도를 보여 주는 서보라서 연속 회전 서보의 회전 속도와 방향은 그림으로 나오지 않아서(보내는 펄스 폭은 그대로 확인할 수 있어요)
