        virtual: full
        points:
          - 물에 뜨는 부력체가 올라가면 값이 바뀌어요( 1 또는 0 ).
          - 컵에 물을 천천히 채우면서 LCD 의 FULL / LOW 가 바뀌는 순간을 찾아보세요.
          - 값이 반대로 나오면 WET 을 0 으로 바꿔요.
      - n: 2
        kind: 심화 예제
