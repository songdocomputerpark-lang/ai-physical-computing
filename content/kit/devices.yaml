    description: 마이크로SD(TF) 카드에 파일을 저장하고 읽는 모듈이에요. 센서 값을 기록하는 데이터 로거를 만들 수 있어요.
    interface: SPI
    pins: 6 pins (GND, VCC, MOSI, MISO, SCK, CS)
    gpio: "VSPI 단자: SI(MOSI)=23, SO(MISO)=19, SCK=18, CS=5"
    part: o-008-tf-card-adapter-v2
    libraries: []
    wiring:
      - G → GND (VSPI 단자)
      - V → 3V3 (VSPI 단자)
      - SI → GPIO 23 (MOSI)
      - SO → GPIO 19 (MISO)
      - SCK → GPIO 18
      - CS → GPIO 5
    circuit: d-8-09.webp
    steps:
      - n: 1
        kind: 기본 동작 테스트
        title: 카드 연결 + 파일 쓰기·읽기·목록
        file: esp32/kit/ch8/8-09-tfcard-1.py
        virtual: real-only
        points:
          - SDCard(slot=2, …) 로 카드를 만들고 os.mount(sd, '/sd') 로 '/sd' 폴더처럼 쓸 수 있게 해요.
          - 그 뒤로는 일반 파일처럼 open('/sd/파일') 로 쓰고 읽어요.
          - 프로그램을 끝낼 때 os.umount('/sd') 로 연결을 끊어야 카드를 안전하게 뺄 수 있어요.
