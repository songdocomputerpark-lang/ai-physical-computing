          - dht.DHT22 로 만든 센서에서 measure() 를 부른 뒤 온도와 습도를 꺼내요.
          - DHT22 는 2초에 한 번만 읽을 수 있어서 2초마다 값이 바뀌어요.
          - 센서를 손으로 감싸 쥐면 온도가, 입김을 불면 습도가 올라가요.
      - n: 2
        kind: 심화 예제
        title: 불쾌지수와 최저·최고 온도
        file: esp32/kit/ch3/3-13-dht22-2.py
        virtual: real-only
        points:
          - 온도와 습도를 식에 넣어 불쾌지수를 계산하고 4단계로 알려 줘요.
          - 불쾌지수가 75 이상이면 보드의 LED 가 켜져요.
          - t_min , t_max 는 켠 뒤로 가장 낮았던/높았던 온도를 기억해요.
    support: B2
    virtual: real-only
    virtual_reason: 온습도 센서를 읽는 dht 모듈과 센서 흉내가 가상 보드에 아직 없어서
  - id: d-3-14
    number: "3.14"
