        kind: 기본 동작 테스트
        title: 지문 센서 연결 확인
        file: esp32/kit/ch3/3-21-fingerprint-1.py
        virtual: real-only
        points:
          - 센서에 짧은 메시지를 보내 대답이 오면 연결이 맞는 거예요. 선이 반대면 자동으로 바꿔서 다시 해 봐요.
          - 연결이 되면 저장된 지문 개수와 손가락이 올려졌는지를 출력 창과 LCD 로 알려 줘요.
          - "'연결 성공' 에 나온 TX_PIN , RX_PIN 숫자를 2단계 코드에 똑같이 적어 주세요."
      - n: 2
        kind: 심화 예제
        title: 지문 등록하고 알아맞히기 (BOOT 버튼으로 등록)
        file: esp32/kit/ch3/3-21-fingerprint-2.py
        virtual: real-only
        points:
          - BOOT 버튼을 누르면 같은 손가락을 두 번 읽어 서로 같을 때만 저장해요.
          - 손가락을 올리면 저장된 지문과 비교해 번호와 일치 점수를 알려 주고, LCD 에도 결과가 나와요.
          - 지문이 일치하면 LED 가 1초 켜져요. 지문 정보는 센서 안에만 저장돼요.
    support: C
    virtual: real-only
    virtual_reason: 지문 센서의 UART 통신 규약(등록·검색·삭제) 흉내가 가상 보드에 아직 없어서
    note: 이 지문 센서 라이브러리(pyfingerprint.py)는 사용 조건이 사이트에 싣기에 맞지 않아 싣지 않았어요. 브릭셀 쪽에서 내려받아 보드에 올려요.
  - id: d-4-01
    number: "4.01"
    chapter: 4
    name: 가변저항
    name_en: Potentiometer
    description: 아날로그 입력용 가변저항(회전식).
    interface: Analog
    pins: 3 pins (G, V, S)
    gpio: "GPIO 32 (+ LCD: SDA=GPIO 21, SCL=GPIO 22)"
    part: a-025-rotation-sensor
    libraries:
      - name: i2c_lcd
        file: i2c_lcd.py
        site: true
    wiring:
      - G → GND
      - V → 3V3
      - S → GPIO 32
      - LCD SDA → GPIO 21
      - LCD SCL → GPIO 22
      - LCD VCC → 5V
      - LCD GND → GND
    circuit: d-4-01.webp
    steps:
      - n: 1
        kind: 기본 동작 테스트
        title: 가변저항 값 읽기
        file: esp32/kit/ch4/4-01-potentiometer-1.py
        virtual: full
        points:
          - 손잡이를 돌리면 값이 0에서 4095까지 변해요.
          - ATTN_11DB 는 0~3.3V 전체를 읽도록 하는 설정이에요.
      - n: 2
        kind: 심화 예제
        title: LED 밝기 조절 다이얼
        file: esp32/kit/ch4/4-01-potentiometer-2.py
        virtual: full
        points:
          - v * 16 으로 0~4095 를 0~65520 으로 키워요.
          - "막대( # )가 길수록 밝은 거예요."
          - 멈추면 LED 설정이 해제돼요.
    support: B1
    virtual: full
  - id: d-4-02
    number: "4.02"
    chapter: 4
    name: 연속 회전 가변저항
    name_en: Continuous Rotation Potentiometer
    description: 연속 회전 가변저항(무한 회전).
    interface: Analog
    pins: 3 pins (G, V, S)
    gpio: "GPIO 32 (+ LCD: SDA=GPIO 21, SCL=GPIO 22)"
    part: a-026-infinite-rotation-sensor
    libraries:
      - name: i2c_lcd
        file: i2c_lcd.py
        site: true
    wiring:
      - G → GND
      - V → 3V3
      - S → GPIO 32
      - LCD SDA → GPIO 21
      - LCD SCL → GPIO 22
      - LCD VCC → 5V
      - LCD GND → GND
    circuit: d-4-02.webp
    steps:
      - n: 1
        kind: 기본 동작 테스트
        title: 연속 회전 가변저항 값 읽기
        file: esp32/kit/ch4/4-02-cont-rotation-pot-1.py
        virtual: full
        points:
          - 끝없이 돌아가는 가변저항이에요. 한 바퀴 돌면 값이 처음으로 돌아와요.
          - 돌리는 방향에 따라 값이 커지거나 작아져요.
      - n: 2
        kind: 심화 예제
        title: 회전 방향과 바퀴 수 세기
        file: esp32/kit/ch4/4-02-cont-rotation-pot-2.py
        virtual: full
        points:
          - 값이 40 넘게 커지면 한쪽, 작아지면 반대쪽으로 돌리는 중이에요.
          - 값이 2000 이상 갑자기 뛰면 한 바퀴 돈 거예요.
          - turns 가 양수면 한쪽, 음수면 반대쪽으로 돈 바퀴 수예요.
    support: B1
    virtual: full
  - id: d-4-03
    number: "4.03"
    chapter: 4
    name: 슬라이더 가변저항
    name_en: Slider Switch Potentiometer
    description: 선형 아날로그 입력을 위한 슬라이더형 가변저항.
    interface: Analog
    pins: 3 pins (G, V, S)
    gpio: "GPIO 32 (+ LCD: SDA=GPIO 21, SCL=GPIO 22)"
    part: a-027-slider
    libraries:
      - name: i2c_lcd
        file: i2c_lcd.py
        site: true
    wiring:
      - G → GND
      - V → 3V3
      - S → GPIO 32
      - LCD SDA → GPIO 21
      - LCD SCL → GPIO 22
      - LCD VCC → 5V
      - LCD GND → GND
    circuit: d-4-03.webp
    steps:
      - n: 1
        kind: 기본 동작 테스트
        title: 슬라이더 값 읽기
        file: esp32/kit/ch4/4-03-slider-1.py
        virtual: full
        points:
          - 왼쪽 끝은 0에 가깝고 오른쪽 끝은 4095 에 가까워요.
          - 값이 반대로 나오면 슬라이더 방향이 반대일 수 있어요.
      - n: 2
        kind: 심화 예제
        title: 5단계 레벨 표시기
        file: esp32/kit/ch4/4-03-slider-2.py
        virtual: full
        points:
          - 값을 4096 으로 나눈 몫으로 5단계(0~4)로 나눠요.
          - 단계가 바뀔 때만 글자를 보여 줘서 출력 창이 조용해요. LCD 는 계속 갱신돼요.
          - wait 계산식을 바꾸면 깜빡임 속도가 달라져요.
    support: B1
    virtual: full
  - id: d-4-04
    number: "4.04"
    chapter: 4
    name: 조이스틱
    name_en: Joystick
    description: X, Y 출력을 가진 2축 아날로그 조이스틱.
    interface: Analog
    pins: 4 pins (GND, VCC, X, Y)
    gpio: "X=GPIO 32, Y=GPIO 33 (+ LCD: SDA=GPIO 21, SCL=GPIO 22)"
    part: a-028-joystick
    libraries:
      - name: i2c_lcd
        file: i2c_lcd.py
        site: true
    wiring:
      - GND → GND
      - VCC → 3V3
      - X → GPIO 32
      - Y → GPIO 33
      - LCD SDA → GPIO 21
      - LCD SCL → GPIO 22
      - LCD VCC → 5V
      - LCD GND → GND
    circuit: d-4-04.webp
    steps:
      - n: 1
        kind: 기본 동작 테스트
        title: 조이스틱 X·Y 값 읽기
        file: esp32/kit/ch4/4-04-joystick-1.py
        virtual: full
        points:
          - X 는 좌우, Y 는 위아래 값이에요.
          - 아무것도 안 건드려도 정확히 가운데 값이 아닐 수 있어요.
      - n: 2
        kind: 심화 예제
        title: 방향 알아맞히기 (위·아래·왼쪽·오른쪽)
        file: esp32/kit/ch4/4-04-joystick-2.py
        virtual: full
        points:
          - X, Y 중 더 많이 벗어난 쪽을 밀린 방향으로 정해요.
          - GAP 이 클수록 더 세게 밀어야 방향이 인식돼요.
          - 실제 위/아래·좌/우가 반대면 dx , dy 앞에 - 를 붙여 보세요.
    support: B1
    virtual: full
  - id: d-4-05
    number: "4.05"
    chapter: 4
    name: 조도 센서 (LDR)
    name_en: Light Sensor (LDR)
    description: 광의존성 저항(LDR)은 빛의 강도에 따라 저항이 변합니다.
    interface: Analog
    pins: 3 pins (G, V, S)
    gpio: "GPIO 32 (+ LCD: SDA=GPIO 21, SCL=GPIO 22)"
    part: a-006-light-sensor
    libraries:
      - name: i2c_lcd
        file: i2c_lcd.py
        site: true
    wiring:
      - G → GND
      - V → 3V3
      - S → GPIO 32
      - LCD SDA → GPIO 21
      - LCD SCL → GPIO 22
      - LCD VCC → 5V
      - LCD GND → GND
    circuit: d-4-05.webp
    steps:
      - n: 1
        kind: 기본 동작 테스트
        title: 밝기 값 읽기
        file: esp32/kit/ch4/4-05-light-1.py
        virtual: full
        points:
          - 빛이 밝을수록 값이 커져요.
          - 손으로 가리면 값이 뚝 떨어지는 걸 볼 수 있어요.
      - n: 2
        kind: 심화 예제
        title: 자동 가로등
        file: esp32/kit/ch4/4-05-light-2.py
        virtual: full
        points:
          - 켜는 기준(60%)과 끄는 기준(75%)을 다르게 해서 깜빡거림을 막아요.
          - 시작할 때의 밝기를 기준으로 삼아서 어느 방에서나 쓸 수 있어요.
          - 60, 75 숫자를 바꾸면 민감도가 달라져요.
    support: B1
    virtual: full
  - id: d-4-06
    number: "4.06"
    chapter: 4
    name: 아날로그 터치 센서
    name_en: Analog Touch Sensor
    description: 단일 아날로그 핀에 4개의 고유 터치 입력이 있는 정전식 터치 센서.
    interface: Analog
    pins: 3 pins (G, V, S)
    gpio: "GPIO 32 (+ LCD: SDA=GPIO 21, SCL=GPIO 22)"
    part: a-022-analog-touch-sensor
    libraries:
      - name: i2c_lcd
        file: i2c_lcd.py
        site: true
    wiring:
      - G → GND
      - V → 3V3
      - S → GPIO 32
      - LCD SDA → GPIO 21
      - LCD SCL → GPIO 22
      - LCD VCC → 5V
      - LCD GND → GND
    circuit: d-4-06.webp
    steps:
      - n: 1
        kind: 기본 동작 테스트
        title: 몇 번 버튼을 눌렀는지 확인
        file: esp32/kit/ch4/4-06-analog-touch-1.py
        virtual: full
        points:
          - 한 개의 핀으로 4개의 버튼을 구별해요. 버튼마다 값이 달라요.
          - 값이 조금 다르게 나오면 범위 숫자를 바꿔 보세요.
      - n: 2
        kind: 심화 예제
        title: 비밀번호 맞추기 (1-3-2-4)
        file: esp32/kit/ch4/4-06-analog-touch-2.py
        virtual: full
        points:
          - 버튼을 뗐다가 다시 눌러야 다음 숫자로 인정해요.
          - SECRET 리스트를 바꾸면 나만의 비밀번호를 만들 수 있어요.
          - 값 범위가 안 맞으면 1단계에서 값을 확인하고 숫자를 고쳐 보세요.
    support: A
    virtual: full
  - id: d-4-07
    number: "4.07"
    chapter: 4
    name: FSR 압력 센서
    name_en: FSR Sensor
    description: 압력 감지 저항 - 물리적 압력에 따라 저항이 변합니다.
    interface: Analog
    pins: 3 pins (GND, VCC, SIG)
    gpio: "GPIO 32 (+ LCD: SDA=GPIO 21, SCL=GPIO 22)"
    part: a-023-fsr-sensor
    libraries:
      - name: i2c_lcd
        file: i2c_lcd.py
        site: true
    wiring:
      - GND → GND
      - VCC → 3V3
      - SIG → GPIO 32
      - LCD SDA → GPIO 21
      - LCD SCL → GPIO 22
      - LCD VCC → 5V
      - LCD GND → GND
    circuit: d-4-07.webp
    steps:
      - n: 1
        kind: 기본 동작 테스트
        title: 누르는 힘 값 읽기
        file: esp32/kit/ch4/4-07-fsr-1.py
        virtual: full
        points:
          - "세게 누를수록 값이 커지고 막대( # )가 길어져요."
          - 아무것도 안 누르면 값이 0 근처예요.
      - n: 2
        kind: 심화 예제
        title: 누른 힘 측정기 (최대 힘 기록)
        file: esp32/kit/ch4/4-07-fsr-2.py
        virtual: full
        points:
          - 누르는 동안 가장 큰 값( peak )을 계속 기억해요.
          - 손가락을 뗐을 때 최대 값으로 약함/보통/세게를 알려 줘요.
          - 300, 1000, 2500 숫자를 바꿔 기준을 조절해 보세요.
    support: B1
    virtual: full
  - id: d-4-08
    number: "4.08"
    chapter: 4
    name: 토양 수분 센서
    name_en: Soil Moisture Sensor
    description: 정전식 토양 수분 센서(부식 방지).
    interface: Analog
    pins: 3 pins (GND, VCC, AOUT)
    gpio: GPIO 32
    part: a-008-moisture-sensor
    libraries:
      - name: i2c_lcd
        file: i2c_lcd.py
        site: true
    wiring:
      - GND → GND
      - VCC → 3V3
      - AOUT → GPIO 32
      - LCD SDA → GPIO 21
      - LCD SCL → GPIO 22
      - LCD VCC → 5V
      - LCD GND → GND
    circuit: d-4-08.webp
    steps:
      - n: 1
        kind: 기본 동작 테스트
        title: 수분 값 읽기
        file: esp32/kit/ch4/4-08-soil-moisture-1.py
        virtual: full
        points:
          - soil.read() 는 0~4095 사이 숫자를 돌려줘요. 물이 많을수록 숫자가 작아져요.
          - 출력 창과 LCD 에 같은 값이 나와요. 공기 중과 물컵(선까지만)에서 값을 비교해 보세요.
          - 센서 아랫부분의 하얀 선 위로는 물에 담그지 마세요.
      - n: 2
        kind: 심화 예제
        title: 흙이 말랐는지 알려 주는 화분 도우미
        file: esp32/kit/ch4/4-08-soil-moisture-2.py
        virtual: full
        points:
          - 10번 읽은 값의 평균을 써서 숫자가 덜 흔들려요.
          - AIR , WATER 숫자를 내 센서에 맞게 고치면 %가 정확해져요.
          - LCD 에는 퍼센트와 상태(영어)가 나오고, 30% 아래면 보드 LED 도 켜져요.
    support: B1
    virtual: full
  - id: d-4-09
    number: "4.09"
    chapter: 4
    name: NTC 온도 센서
    name_en: NTC Temperature Sensor
    description: 온도 측정을 위한 NTC(부온도 계수) 서미스터.
    interface: Analog
    pins: 3 pins (G, V, S)
    gpio: GPIO 32
    part: a-005-ntc-temp
    libraries:
      - name: i2c_lcd
        file: i2c_lcd.py
        site: true
    wiring:
      - G → GND
      - V → 3V3
      - S → GPIO 32
      - LCD SDA → GPIO 21
      - LCD SCL → GPIO 22
      - LCD VCC → 5V
      - LCD GND → GND
    circuit: d-4-09.webp
    steps:
      - n: 1
        kind: 기본 동작 테스트
        title: 온도 센서 값 읽기
        file: esp32/kit/ch4/4-09-ntc-temp-1.py
        virtual: full
        points:
          - ntc.read() 는 0~4095 숫자예요. 온도가 바뀌면 숫자도 바뀌어요.
          - 손가락으로 센서를 10초 감싸면 LCD 숫자가 어느 쪽으로 움직이는지 관찰해 보세요.
          - 손을 떼면 서서히 처음 값으로 돌아와요.
      - n: 2
        kind: 심화 예제
        title: 온도가 바뀌면 알려 주는 감시기
        file: esp32/kit/ch4/4-09-ntc-temp-2.py
        virtual: full
        points:
          - 처음 값의 평균을 기준값으로 삼아요.
          - LIMIT 를 작게 하면 더 예민하게 알려 줘요.
          - LCD 에 기준(Base)과 지금(Now) 값이 같이 나와요.
    support: B1
    virtual: full
  - id: d-4-10
    number: "4.10"
    chapter: 4
    name: 사운드 센서·마이크
    name_en: Sound Sensor | Microphone
    description: 소리 레벨을 감지하는 사운드 센서/마이크 모듈.
    interface: Analog
    pins: 3 pins (G, V, S)
    gpio: GPIO 32
    part: a-030-sound-v2
    libraries:
      - name: i2c_lcd
        file: i2c_lcd.py
        site: true
    wiring:
      - G → GND
      - V → 3V3
      - S → GPIO 32
      - LCD SDA → GPIO 21
      - LCD SCL → GPIO 22
      - LCD VCC → 5V
      - LCD GND → GND
    circuit: d-4-10.webp
    steps:
      - n: 1
        kind: 기본 동작 테스트
        title: 소리 크기 읽기
        file: esp32/kit/ch4/4-10-sound-1.py
        virtual: full
        points:
          - 소리는 값이 위아래로 흔들리는 거라서, 짧은 시간 동안 가장 큰 값과 가장 작은 값의 차이를 소리 크기로 봐요.
          - "조용할 때와 박수칠 때 막대( # )가 얼마나 달라지는지 출력 창과 LCD 에서 보세요."
          - 센서 뒤쪽 파란 나사로 민감도를 조절할 수 있는 모델도 있어요.
      - n: 2
        kind: 심화 예제
        title: 박수 세기와 LED 켜고 끄기
        file: esp32/kit/ch4/4-10-sound-2.py
        virtual: full
        points:
          - 처음 1초 동안 조용한 소리 크기를 재서 박수 기준( threshold )을 자동으로 정해요.
          - 한 번 친 소리가 길게 이어져도 한 번으로 세도록 0.4초 동안은 다시 세지 않아요.
          - LCD 에는 박수 횟수와 지금 소리 크기(Lv), 기준(T)이 나와요.
    support: B1
    virtual: full
  - id: d-4-11
    number: "4.11"
    chapter: 4
    name: 미세먼지 센서
    name_en: Fine Dust Sensor
    description: 대기질 모니터링을 위한 미세먼지(PM) 센서.
    interface: Analog
    pins: 4 pins (G, V, S, LED)
    gpio: S=GPIO 32, LED=GPIO 33
    part: a-016-fine-dust
    libraries:
      - name: i2c_lcd
        file: i2c_lcd.py
        site: true
    wiring:
      - G → GND
      - V → 5V
      - S → GPIO 32
      - LED → GPIO 33
      - LCD SDA → GPIO 21
      - LCD SCL → GPIO 22
      - LCD VCC → 5V
      - LCD GND → GND
    circuit: d-4-11.webp
    steps:
      - n: 1
        kind: 기본 동작 테스트
        title: 미세먼지 센서 값 읽기
        file: esp32/kit/ch4/4-11-fine-dust-1.py
        virtual: full
        points:
          - 센서 안의 LED 를 아주 짧게(0.28ms) 켜고 그 순간의 빛 세기를 읽는 방식이에요.
          - 20번 읽은 평균을 써서 값이 덜 흔들려요.
          - 먼지(향 연기, 먼지떨이)를 센서 구멍 근처에서 만들면 값이 올라가요.
      - n: 2
        kind: 심화 예제
        title: 공기 상태 신호등 (좋음·보통·나쁨)
        file: esp32/kit/ch4/4-11-fine-dust-2.py
        virtual: full
        points:
          - 처음 기준값과 비교해서 rise (올라간 정도)로 상태를 나눠요.
          - 50, 200 숫자를 바꾸면 신호등이 바뀌는 기준을 바꿀 수 있어요.
          - 향이나 분필 가루를 센서 앞에서 흔들어 LCD 가 BAD! 로 바뀌는지 해 보세요.
    support: B1
    virtual: full
  - id: d-4-12
    number: "4.12"
    chapter: 4
    name: 자외선 센서 V2 (GUVA-S12SD)
    name_en: 3.48. 자외선 센서 V2 (GUVA-S12SD)
    description: 햇빛 속 자외선(UV)의 세기를 전압으로 알려 주는 센서예요. 전압이 높을수록 자외선이 강해요.
    interface: Analog
    pins: 3 pins (G, V, S)
    gpio: "S=GPIO 32 (+ LCD: SDA=GPIO 21, SCL=GPIO 22)"
    part: a-007-uv-sensor-v2
    libraries:
      - name: i2c_lcd
        file: i2c_lcd.py
        site: true
    wiring:
      - G → GND
      - V → 3V3
      - S → GPIO 32
      - LCD SDA → GPIO 21
      - LCD SCL → GPIO 22
      - LCD VCC → 5V
      - LCD GND → GND
    circuit: d-4-12.webp
    steps:
      - n: 1
        kind: 기본 동작 테스트
        title: 자외선 전압 읽기
        file: esp32/kit/ch4/4-12-uv-1.py
        virtual: full
        points:
          - read_mv() 가 0~4095 값(원시값)과 전압(mV)을 함께 돌려줘요.
          - 센서에 밝은 빛을 비추면 전압이 올라가요. 손으로 가리면 내려가요.
      - n: 2
        kind: 심화 예제
        title: UV 지수와 오늘의 단계
        file: esp32/kit/ch4/4-12-uv-2.py
        virtual: full
        points:
          - 전압(mV)을 100으로 나누면 UV 지수가 돼요. (근사식이라 대략적인 값이에요)
          - 3 미만 낮음, 6 미만 보통, 8 미만 높음, 그 이상 매우 높음으로 나눠요.
          - max_uvi 는 켠 뒤로 가장 센 자외선 값을 기억해요. 햇빛 아래에서 얼마나 올라가는지 보세요.
          - 자외선 지수가 높을 땐 모자와 선크림이 필요해요.
    support: B1
    virtual: full
  - id: d-4-13
    number: "4.13"
    chapter: 4
    name: pH 센서 (E-201-C 프로브 + 변환 모듈)
    name_en: 3.49. pH 센서 (E-201-C 프로브 + 변환 모듈)
    description: 물이 산성인지 염기성(알칼리성)인지 pH 값으로 알려 주는 센서예요. 사용 전에 꼭 보정(맞춤)이 필요해요.
    interface: Analog
    pins: 3 pins (G, V, S)
    gpio: "S=GPIO 32 (+ LCD: SDA=GPIO 21, SCL=GPIO 22)"
    part: a-009-ph-sensor
    libraries:
      - name: i2c_lcd
        file: i2c_lcd.py
        site: true
    wiring:
      - G → GND
      - V → 3V3
      - S → GPIO 32
      - LCD SDA → GPIO 21
      - LCD SCL → GPIO 22
      - LCD VCC → 5V
      - LCD GND → GND
    circuit: d-4-13.webp
    steps:
      - n: 1
        kind: 기본 동작 테스트
        title: pH 전압 읽기
        file: esp32/kit/ch4/4-13-ph-1.py
        virtual: full
        points:
          - pH 센서는 물의 성질에 따라 전압이 조금씩 달라져요.
          - 프로브 끝(유리 부분)은 깨지기 쉬우니 부딪히지 않게 조심해요.
          - 이 전압을 pH 숫자로 바꾸려면 2단계의 '보정'이 필요해요.
      - n: 2
        kind: 심화 예제
        title: pH 값 계산 + 산성/중성/염기성 판정
        file: esp32/kit/ch4/4-13-ph-2.py
        virtual: full
        points:
          - 10번 평균을 내서 값이 덜 흔들려요.
          - PH7_MV 와 SLOPE_MV 를 내 센서에 맞게 바꾸면 pH 가 정확해져요.
          - pH 6.5 미만은 산성, 7.5 초과는 염기성, 그 사이는 중성이에요.
          - 식초·레몬즙·비눗물을 재 보고 예상과 비교해 보세요(먼저 선생님과 함께).
    support: B1
    virtual: full
  - id: d-4-14
    number: "4.14"
    chapter: 4
    name: 전기전도도(TDS) 센서
    name_en: 3.50. 전기전도도(TDS) 센서
    description: 물에 녹아 있는 물질의 양(TDS, ppm)을 전기가 통하는 정도로 알려 주는 센서예요.
    interface: Analog
    pins: 3 pins (G, V, S)
    gpio: "S=GPIO 32 (+ LCD: SDA=GPIO 21, SCL=GPIO 22)"
    part: a-011-electrical-conduction
    libraries:
      - name: i2c_lcd
        file: i2c_lcd.py
        site: true
    wiring:
      - G → GND
      - V → 3V3
      - S → GPIO 32
      - LCD SDA → GPIO 21
      - LCD SCL → GPIO 22
      - LCD VCC → 5V
      - LCD GND → GND
    circuit: d-4-14.webp
    steps:
      - n: 1
        kind: 기본 동작 테스트
        title: TDS 값 읽기
        file: esp32/kit/ch4/4-14-tds-1.py
        virtual: full
        points:
          - 전압(v)을 식에 넣어 TDS(ppm)를 구해요. 숫자가 클수록 물에 녹은 물질이 많아요.
          - 센서를 공기 중에 두면 0 근처, 물에 담그면 올라가요.
          - 프로브 금속 부분이 모두 물에 잠기게 해 주세요.
      - n: 2
        kind: 심화 예제
        title: 물 종류 알아맞히기 (정수 / 수돗물 / 소금물)
        file: esp32/kit/ch4/4-14-tds-2.py
        virtual: full
        points:
          - 20번 평균을 내서 숫자가 덜 튀어요.
          - 50 미만은 정수, 500 미만은 수돗물, 그 이상은 소금물로 나눠요. 숫자를 바꿔 보세요.
          - 소금을 조금씩 더 넣으면 TDS 가 어떻게 올라가는지 관찰해 보세요.
    support: B1
    virtual: full
  - id: d-4-15
    number: "4.15"
    chapter: 4
    name: 탁도 센서 (TSW-30)
    name_en: 3.51. 탁도 센서 (TSW-30)
    description: 물이 얼마나 흐린지(탁한 정도)를 빛이 통과하는 양으로 알려 주는 센서예요. 맑을수록 전압이 높아요.
    interface: Analog
    pins: 3 pins (G, V, S)
    gpio: "S=GPIO 32 (+ LCD: SDA=GPIO 21, SCL=GPIO 22)"
    part: a-013-turbidity-sensor
    libraries:
      - name: i2c_lcd
        file: i2c_lcd.py
        site: true
    wiring:
      - G → GND
      - V → 3V3
      - S → GPIO 32
      - LCD SDA → GPIO 21
      - LCD SCL → GPIO 22
      - LCD VCC → 5V
      - LCD GND → GND
    circuit: d-4-15.webp
    steps:
      - n: 1
        kind: 기본 동작 테스트
        title: 탁도 전압 읽기
        file: esp32/kit/ch4/4-15-turbidity-1.py
        virtual: full
        points:
          - 맑은 물일수록 빛이 잘 통과해서 전압이 높아요.
          - 물에 우유를 한두 방울 떨어뜨리면 값이 내려가는 걸 볼 수 있어요.
          - 센서의 전자 부분(전선 쪽)이 물에 젖지 않게 조심해요.
      - n: 2
        kind: 심화 예제
        title: 맑음/탁함 3단계와 변한 정도(%)
        file: esp32/kit/ch4/4-15-turbidity-2.py
        virtual: full
        points:
          - 켤 때의 값( base )을 기준으로 지금 값이 몇 %인지 계산해요.
          - 90% 이상 맑음, 60% 이상 약간 탁함, 그보다 낮으면 탁함이에요. 숫자를 바꿔 보세요.
          - 깨끗한 물에서 시작한 뒤 흙·우유를 조금씩 넣어 변화를 확인해 보세요.
    support: B1
    virtual: full
  - id: d-4-16
    number: "4.16"
    chapter: 4
    name: 빗물 감지 센서
    name_en: Rain Sensor
    description: 센서 판의 노출된 무늬(트레이스)에 빗물이 닿으면 저항이 줄어 아날로그 값이 올라가는 빗물 감지 센서. 젖은 면적이 넓을수록 값이 커져 비의 세기를 짐작할 수 있다.
    interface: Analog
    pins: 3 pins (G, V, S)
    gpio: "S=GPIO 32 (+ LCD: SDA=GPIO 21, SCL=GPIO 22)"
    part: a-015-water-sensor
    libraries:
      - name: i2c_lcd
        file: i2c_lcd.py
        site: true
    wiring:
      - G → GND
      - V → 3V3
      - S → GPIO 32
      - LCD SDA → GPIO 21
      - LCD SCL → GPIO 22
      - LCD VCC → 5V
      - LCD GND → GND
    circuit: d-4-16.webp
    steps:
      - n: 1
        kind: 기본 동작 테스트
        title: 빗물 값 보기
        file: esp32/kit/ch4/4-16-rain-1.py
        virtual: full
        points:
          - 물방울이 무늬 사이를 이으면 전기가 흘러 값이 올라가요. 젖은 곳이 넓을수록 더 커져요.
          - 마르면 값이 다시 내려가요 — 휴지로 닦아 보세요.
      - n: 2
        kind: 심화 예제
        title: 비 세기 판정 + 비 시작 알림
        file: esp32/kit/ch4/4-16-rain-2.py
        virtual: full
        points:
          - 시작할 때 잰 «마른 값» 보다 얼마나 올랐는지로 맑음·이슬비·비·폭우를 나눠요.
          - LEVELS 의 숫자를 바꾸면 판정 기준이 바뀌어요.
          - 비가 오기 시작하면 출력 창에 알림이 뜨고 보드 LED 가 켜져요.
    support: B1
    virtual: full
  - id: d-4-17
    number: "4.17"
    chapter: 4
    name: 진동 센서 (아날로그, 피에조)
    name_en: 3.53. 진동 센서 (아날로그, 피에조)
    description: 두드리거나 흔들릴 때 생기는 진동을 전압으로 알려 주는 센서예요. 값이 순간적으로 확 튀어요.
    interface: Analog
    pins: 3 pins (G, V, S)
    gpio: "S=GPIO 32 (+ LCD: SDA=GPIO 21, SCL=GPIO 22)"
    part: a-019-vibration-sensor
    libraries:
      - name: i2c_lcd
        file: i2c_lcd.py
        site: true
    wiring:
      - G → GND
      - V → 3V3
      - S → GPIO 32
      - LCD SDA → GPIO 21
      - LCD SCL → GPIO 22
      - LCD VCC → 5V
      - LCD GND → GND
    circuit: d-4-17.webp
    steps:
      - n: 1
        kind: 기본 동작 테스트
        title: 진동 값 읽기
        file: esp32/kit/ch4/4-17-vibration-analog-1.py
        virtual: full
        points:
          - 가만히 있을 땐 값이 0 근처고, 두드리면 순간 커져요.
          - 값이 너무 빨리 변해서 출력 창이 빠르게 올라가요. 두드릴 때 값을 잘 보세요.
      - n: 2
        kind: 심화 예제
        title: 두드림 세기와 두드린 횟수
        file: esp32/kit/ch4/4-17-vibration-analog-2.py
        virtual: full
        points:
          - 50ms 동안 가장 큰 값을 '두드림 세기'로 써요. 순간값보다 훨씬 안정적이에요.
          - THRESH 를 넘으면 한 번 센 뒤 200ms 쉬어서 한 번 두드린 걸 여러 번 세지 않아요.
          - 세게 두드리면 Power 숫자가 커지는지 비교해 보세요.
    support: B1
    virtual: full
  - id: d-4-18
    number: "4.18"
    chapter: 4
    name: 전류 센서 1A (ACS712 계열)
    name_en: 3.54. 전류 센서 1A (ACS712 계열)
    description: 전선에 흐르는 전류의 세기를 알려 주는 센서예요. 전류가 0일 때 출력은 전원 전압의 절반쯤이에요.
    interface: Analog
    pins: 3 pins (G, V, S)
    gpio: "S=GPIO 32 (+ LCD: SDA=GPIO 21, SCL=GPIO 22)"
    part: a-032-current-sensor-1a
    libraries:
      - name: i2c_lcd
        file: i2c_lcd.py
        site: true
    wiring:
      - G → GND
      - V → 3V3
      - S → GPIO 32
      - LCD SDA → GPIO 21
      - LCD SCL → GPIO 22
      - LCD VCC → 5V
      - LCD GND → GND
    circuit: d-4-18.webp
    steps:
      - n: 1
        kind: 기본 동작 테스트
        title: 전류 센서 값 읽기
        file: esp32/kit/ch4/4-18-current-1.py
        virtual: full
        points:
          - 측정 단자에 아무것도 연결하지 않으면 전류가 0이라서 값이 거의 일정해요.
          - 이 값이 '영점'이에요. 2단계에서 시작할 때 영점을 스스로 잡아요.
      - n: 2
        kind: 심화 예제
        title: 전류(mA) 재기와 최대 전류
        file: esp32/kit/ch4/4-18-current-2.py
        virtual: full
        points:
          - 켤 때 영점을 100번 평균으로 잡아서, 지금 전압과의 차이로 전류를 계산해요.
          - SENS 를 내 모듈 감도에 맞게 바꿔야 mA 가 정확해요.
          - max_ma 는 켠 뒤 가장 컸던 전류를 기억해요.
    support: B1
    virtual: full
  - id: d-4-19
    number: "4.19"
    chapter: 4
    name: 전압 센서 (분압 5:1)
    name_en: 3.55. 전압 센서 (분압 5:1)
    description: 건전지나 배터리의 전압을 안전하게 재는 센서예요. 입력 전압을 5분의 1로 줄여서 ESP32 가 읽어요.
    interface: Analog
    pins: 3 pins (G, V, S)
    gpio: "S=GPIO 32 (+ LCD: SDA=GPIO 21, SCL=GPIO 22)"
    part: a-034-voltage-sensor
    libraries:
      - name: i2c_lcd
        file: i2c_lcd.py
        site: true
    wiring:
      - G → GND
      - V → 3V3
      - S → GPIO 32
      - LCD SDA → GPIO 21
      - LCD SCL → GPIO 22
      - LCD VCC → 5V
      - LCD GND → GND
    circuit: d-4-19.webp
    steps:
      - n: 1
        kind: 기본 동작 테스트
        title: 전압 재기
        file: esp32/kit/ch4/4-19-voltage-1.py
        virtual: full
        points:
          - ADC 전압에 5를 곱하면 재려는 건전지의 전압이 돼요.
          - 측정 단자의 + 와 - 를 맞게 연결해야 해요.
          - 아무것도 연결하지 않으면 0V 근처가 나와요.
      - n: 2
        kind: 심화 예제
        title: 건전지 잔량 알아보기
        file: esp32/kit/ch4/4-19-voltage-2.py
        virtual: full
        points:
          - 1.3V 이상은 새것, 1.1V 이상은 쓸만함, 그보다 낮으면 교체예요. 숫자를 바꿔 보세요.
          - 20번 평균으로 숫자가 덜 흔들려요.
          - 새 건전지와 오래 쓴 건전지를 비교해 보세요.
    support: B1
    virtual: full
  - id: d-4-20
    number: "4.20"
    chapter: 4
    name: 고온 센서 (K형 열전대)
    name_en: 3.58. 고온 센서 (K형 열전대)
    description: K형 열전대 프로브로 수백 °C 까지 재는 고온 센서. 모듈 안의 증폭 회로가 온도를 아날로그 전압(S 핀)으로 내보낸다 — 얼음물·끓는 물 두 점으로 보정해 °C 로 바꾼다.
    interface: Analog
    pins: 3 pins (G, V, S) + 열전대 프로브(나사 단자)
    gpio: "S=GPIO 32 (+ LCD: SDA=GPIO 21, SCL=GPIO 22)"
    part: a-001-high-temperature-sensor
    libraries:
      - name: i2c_lcd
        file: i2c_lcd.py
        site: true
    wiring:
      - G → GND
      - V → 3V3
      - S → GPIO 32
      - 프로브 → 나사 단자(+/−)
      - LCD SDA → GPIO 21
      - LCD SCL → GPIO 22
      - LCD VCC → 5V
      - LCD GND → GND
    circuit: d-4-20.webp
    steps:
      - n: 1
        kind: 기본 동작 테스트
        title: 출력 전압 보기
        file: esp32/kit/ch4/4-20-ktype-1.py
        virtual: full
        points:
          - 모듈이 열전대의 아주 작은 전압을 키워 S 핀으로 내보내요.
          - 프로브 끝을 데우면 mV 값이 올라가요. 모듈마다 값이 달라 2단계에서 보정해요.
      - n: 2
        kind: 심화 예제
        title: 두 점 보정 + 과열 경보
        file: esp32/kit/ch4/4-20-ktype-2.py
        virtual: full
        points:
          - MV_0C · MV_100C 에 얼음물·끓는 물에서 잰 값을 넣으면 °C 로 바뀌어요.
          - ALARM_C 를 넘으면 보드 LED 가 켜지고 LCD 에 HOT! 이 떠요.
          - 뜨거운 물은 꼭 어른과 함께 다뤄요.
    support: B1
    virtual: full
  - id: d-4-21
    number: "4.21"
    chapter: 4
    name: MQ2 가스 센서
    name_en: MQ2 Gas Sensor
    description: LPG, 연기를 감지하는 가스 센서. 가스 농도에 비례하는 아날로그 출력.
    interface: Analog
    pins: 3 pins (G, V, S)
    gpio: GPIO 32
    part: a-050-gas-mq2-lpg-smoke
    libraries:
      - name: i2c_lcd
        file: i2c_lcd.py
        site: true
    wiring:
      - G → GND
      - V → 3V3
      - S → GPIO 32
      - LCD SDA → GPIO 21
      - LCD SCL → GPIO 22
      - LCD VCC → 5V
      - LCD GND → GND
    circuit: d-4-21.webp
