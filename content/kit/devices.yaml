  - id: d-5-02
    number: "5.02"
    chapter: 5
    name: 무게 센서 (HX711)
    name_en: Weight Sensor (HX711)
    description: 로드셀 무게 모듈. 모듈 안의 마이컴이 무게(g)를 계산해 I2C(주소 0x63)로 보내 줍니다 — 3바이트 [0xFF, 상위, 하위] , 무게 = 상위×256 + 하위. 모듈의 PEEL 버튼 = 영점, CALIBRATE = 보정.
    interface: I2C (주소 0x63, 100kHz)
    pins: 4 pins (GND, VCC, SDA, SCL)
    gpio: SDA=GPIO 21, SCL=GPIO 22 (I2C 주소 0x63, LCD 도 같은 I2C 단자)
    part: i2c-010-weight-sensor-i2c-hx711
    libraries:
      - name: i2c_lcd
        file: i2c_lcd.py
        site: true
    wiring:
      - GND → GND
      - VCC → 3V3
      - SDA → GPIO 21
      - SCL → GPIO 22
      - LCD SDA → GPIO 21
      - LCD SCL → GPIO 22
      - LCD VCC → 5V
      - LCD GND → GND
    circuit: d-5-02.webp
    steps:
      - n: 1
        kind: 기본 동작 테스트
        title: 무게 읽기 (I2C)
        file: esp32/kit/ch5/5-02-weight-1.py
        virtual: real-only
        points:
          - 이 무게 센서는 안에 작은 컴퓨터가 있어서 무게를 g 로 계산해 I2C 로 보내 줘요. 주소는 0x63 이에요.
          - i2c.readfrom(0x63, 3) 으로 3바이트를 받아 상위 x 256 + 하위 로 무게를 만들어요.
          - LCD(0x20)와 무게 센서(0x63)는 SDA·SCL 두 선을 함께 쓰고 주소로 구별해요.
      - n: 2
        kind: 심화 예제
        title: 물건 올림 감지 + 최대 무게 기록
        file: esp32/kit/ch5/5-02-weight-2.py
        virtual: real-only
        points:
          - BOOT 버튼을 누르면 지금 무게를 0으로 삼아서 그릇 무게를 뺄 수 있어요.
          - LIMIT 보다 무거워지는 순간과 가벼워지는 순간을 알아내서 올림/내림을 알려 줘요.
          - 가장 무거웠던 무게( biggest )를 기억해서 LCD 아랫줄에 보여 줘요.
    support: B2
    virtual: real-only
    virtual_reason: 무게 센서 모듈(I2C 주소 0x63)의 흉내가 가상 보드에 아직 없어서
