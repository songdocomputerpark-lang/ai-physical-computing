devices:
  - id: d-2-01
    number: "2.01"
    chapter: 2
    name: LED
    name_en: LED
    description: LED(발광 다이오드)는 순방향 전압이 인가되면 빛을 방출합니다. 키트에는 빨강, 초록, 파랑, 노랑 4가지 색상이 포함됩니다.
    interface: Digital / PWM
    pins: 3 pins (G, V, S)
    gpio: GPIO 4
    part: dis-004-led-red
    part_variants:
      - part: dis-005-led-yellow
        label: 노란 LED
      - part: dis-006-led-blue
        label: 파란 LED
      - part: dis-007-led-green
        label: 초록 LED
    libraries: []
    wiring:
      - G → GND
      - V → 3V3
      - S → GPIO 4
    circuit: d-2-01.webp
    steps:
      - n: 1
        kind: 기본 동작 테스트
        title: LED 켜고 끄기
        file: esp32/kit/ch2/2-01-led-1.py
        virtual: full
        points:
          - led.on() 으로 켜고 led.off() 로 꺼요. 1초마다 번갈아 바뀌어요.
          - 출력 창에 '켜짐/꺼짐' 이 같이 나와요. LED 가 안 보이면 S 선이 GPIO 4 인지 확인하세요.
          - sleep(1) 의 숫자를 바꿔 깜빡이는 속도를 바꿔 보세요.
      - n: 2
        kind: 심화 예제
        title: 숨쉬는 LED (PWM 밝기 조절)
        file: esp32/kit/ch2/2-01-led-2.py
        virtual: full
        points:
          - PWM 은 켜고 끄기를 아주 빠르게 반복해서 밝기를 조절해요. duty_u16 값이 클수록 밝아요.
          - BOOT 버튼을 누르면 '숨쉬기' 와 '깜빡이' 모드가 바뀌어요.
          - step 숫자를 줄이면 더 천천히 숨 쉬어요.
    support: B1
    virtual: full
  - id: d-2-02
    number: "2.02"
    chapter: 2
    name: 신호등 LED
    name_en: Traffic Light LED
    description: 3개의 LED(빨강, 노랑, 초록)가 있는 미니 신호등입니다.
    interface: Digital / PWM
    pins: 5 pins (GND, VCC, Green, Yellow, Red)
    gpio: GPIO 23, 25, 26
    part: dis-003-traffic-light-led
    libraries: []
    wiring:
      - GND → GND
      - VCC → 5V
      - Green → GPIO 23
      - Yellow → GPIO 25
      - Red → GPIO 26
    circuit: d-2-02.webp
    steps:
      - n: 1
        kind: 기본 동작 테스트
        title: 신호등 불 하나씩 켜기
        file: esp32/kit/ch2/2-02-traffic-led-1.py
        virtual: full
        points:
          - 초록 → 노랑 → 빨강 순서로 0.7초씩 켜졌다 꺼져요.
          - 출력 창에 지금 켜진 색이 나와요. 순서가 다르면 선이 바뀌어 꽂힌 거예요.
          - lights 목록의 순서를 바꿔 보세요.
      - n: 2
        kind: 심화 예제
        title: 보행자 버튼 신호등
        file: esp32/kit/ch2/2-02-traffic-led-2.py
        virtual: full
        points:
          - 초록불이 켜진 동안 BOOT 버튼을 누르면 곧바로 초록불이 깜빡이고 노란불, 빨간불로 바뀌어요.
          - wait() 함수가 시간을 기다리면서 버튼도 같이 살펴봐요.
          - wait(8000) 과 sleep_ms(5000) 의 숫자를 바꿔 신호 시간을 조절해 보세요.
    support: B1
    virtual: full
  - id: d-2-03
    number: "2.03"
    chapter: 2
    name: RGB LED
    name_en: RGB LED
    description: 하나의 패키지에 3색 LED(빨강, 초록, 파랑). 여러 LED를 켜서 색상을 조합합니다.
    interface: Digital / PWM
    pins: 5 pins (GND, VCC, Red, Green, Blue)
    gpio: GPIO 23, 25, 26
    part: dis-002-rgb-led
    libraries: []
    wiring:
      - GND → GND
      - VCC → 5V
      - Red → GPIO 23
      - Green → GPIO 25
      - Blue → GPIO 26
    circuit: d-2-03.webp
    steps:
      - n: 1
        kind: 기본 동작 테스트
        title: 일곱 가지 색 켜기
        file: esp32/kit/ch2/2-03-rgb-led-1.py
        virtual: full
        points:
          - 빨강·초록·파랑을 켜고(1) 끄는(0) 조합으로 일곱 색을 만들어요.
          - 출력 창에 지금 색 이름이 나와요. 색이 이름과 다르면 선 순서를 확인하세요.
          - colors 목록에 (이름, 빨강, 초록, 파랑) 을 더해 보세요.
      - n: 2
        kind: 심화 예제
        title: 무지개 색으로 변하는 LED
        file: esp32/kit/ch2/2-03-rgb-led-2.py
        virtual: full
        points:
          - PWM 으로 세 색의 밝기를 따로 정해 수많은 색을 만들어요.
          - wheel() 이 번호(0~255) 하나를 무지개 색으로 바꿔 줘요.
          - BOOT 버튼을 누르면 밝기가 약 → 중 → 강으로 바뀌어요.
    support: A
    virtual: full
  - id: d-2-04
    number: "2.04"
    chapter: 2
    name: 레이저
    name_en: LASER
    description: LASER(유도 방출에 의한 광 증폭)는 매우 좁은 광선을 생성합니다.
    interface: Digital / PWM
    pins: 3 pins (G, V, S)
    gpio: GPIO 4
    part: dis-008-laser-90
    part_variants:
      - part: dis-009-laser-180
        label: 레이저 180
    libraries: []
    wiring:
      - G → GND
      - V → 3V3
      - S → GPIO 4
    circuit: d-2-04.webp
    steps:
      - n: 1
        kind: 기본 동작 테스트
        title: 레이저 켜고 끄기
        file: esp32/kit/ch2/2-04-laser-1.py
        virtual: full
        points:
          - 1초 켜고 1초 끄기를 계속 반복해요. 출력 창에도 상태가 나와요.
          - 레이저는 사람이나 동물의 눈에 절대 비추지 마세요. 벽이나 종이에 비춰 확인하세요.
          - 멈추기 버튼을 누르면 레이저가 꺼져요.
      - n: 2
        kind: 심화 예제
        title: 레이저 SOS 신호 보내기
        file: esp32/kit/ch2/2-04-laser-2.py
        virtual: full
        points:
          - 모스 부호로 S(짧게 3번) O(길게 3번) S(짧게 3번) 를 보내요.
          - DOT 숫자를 바꾸면 신호 속도가 바뀌어요.
          - 벽에 비춰 친구가 신호를 읽어 보게 해 보세요.
    support: A
    virtual: full
  - id: d-2-05
    number: "2.05"
    chapter: 2
    name: I2C LCD 디스플레이
    name_en: LCD with I2C Interface
    description: HD44780 드라이버의 16x2 LCD, PCF8574 I2C 인터페이스(주소 0x20)로 간편화.
    interface: Serial I2C
    pins: 4 pins (GND, VCC, SDA, SCL)
    gpio: SDA=GPIO 21, SCL=GPIO 22
    part: dis-001-i2c-1602-lcd
    libraries:
      - name: i2c_lcd
        file: i2c_lcd.py
        site: true
    wiring:
      - GND → GND
      - VCC → 5V
      - SDA → GPIO 21
      - SCL → GPIO 22
    circuit: d-2-05.webp
    steps:
      - n: 1
        kind: 기본 동작 테스트
        title: 기능 하나씩 보기 → 마지막 글자 남기기
        file: esp32/kit/ch2/2-05-lcd-i2c-1.py
        virtual: full
        points:
          - 기능을 하나 할 때마다 sleep() 으로 1~2초 기다려서 화면이 바뀌는 걸 눈으로 볼 수 있어요.
          - lcd.clear() 는 화면을 지우는 것이라 마지막에 쓰지 않아요 — 끝 글자가 남아 있어야 성공을 확인할 수 있어요.
          - lcd.setcursor(x, y) 로 글자를 쓸 자리(칸 x, 줄 y — 0부터 셈)를 고릅니다.
          - 글자가 전혀 안 보이면 LCD 뒤 파란 나사(명암 조절)를 돌려 보세요.
      - n: 2
        kind: 심화 예제
        title: LCD 스톱워치 + 버튼 횟수 세기
        file: esp32/kit/ch2/2-05-lcd-i2c-2.py
        virtual: full
        points:
          - 첫 줄에 지난 시간(분:초), 둘째 줄에 BOOT 버튼을 누른 횟수가 나와요.
          - 화면을 지우지 않고 바뀐 줄만 덮어써서 깜빡이지 않아요.
          - show(1, ...) 의 글자를 바꿔 다른 정보를 보여 줘 보세요.
    support: A
    virtual: full
  - id: d-2-06
    number: "2.06"
    chapter: 2
    name: 4자리 7세그먼트 디스플레이
    name_en: 4-Digit 7-Segment Display
    description: TM1637 칩으로 구동되는 4자리 7세그먼트 디스플레이.
    interface: Serial I2C-like
    pins: 4 pins (GND, VCC, DIO, CLK)
    gpio: DIO=GPIO 21, CLK=GPIO 22
    part: dis-010-7segment
    libraries:
      - name: tm1637
        file: tm1637.py
        site: true
    wiring:
      - GND → GND
      - VCC → 5V
      - DIO → GPIO 21
      - CLK → GPIO 22
    circuit: d-2-06.webp
    steps:
      - n: 1
        kind: 기본 동작 테스트
        title: 숫자·시계·글자 모양 보기
        file: esp32/kit/ch2/2-06-7segment-1.py
        virtual: real-only
        points:
          - number , numbers , show , temperature 로 여러 가지 모양을 보여 줘요.
          - 마지막에 밝기를 0 에서 7 까지 올려 봐요.
          - tm.number(1234) 의 숫자를 바꿔 보세요.
      - n: 2
        kind: 심화 예제
        title: 60초 카운트다운 타이머
        file: esp32/kit/ch2/2-06-7segment-2.py
        virtual: real-only
        points:
          - 60초에서 0초까지 줄어들고 가운데 점(:)이 깜빡여요. 0이 되면 0000 이 깜빡여요.
          - BOOT 버튼을 누르면 처음부터 다시 시작해요.
          - TOTAL 숫자를 바꿔 시간을 조절해 보세요.
    support: B2
    virtual: real-only
    virtual_reason: TM1637 7세그먼트 표시 장치(2선 통신)의 흉내가 가상 보드에 아직 없어서
  - id: d-2-07
    number: "2.07"
    chapter: 2
    name: 0.96 OLED 디스플레이 (SSD1306)
    name_en: 0.96 OLED Display (SSD1306)
    description: SSD1306 드라이버의 0.96인치 128x64 단색 OLED 디스플레이 (I2C 주소 0x3C).
    interface: Serial I2C
    pins: 4 pins (GND, VCC, SDA, SCL)
    gpio: SDA=GPIO 21, SCL=GPIO 22
    part: dis-011-oled-096-ssd1306
    libraries:
      - name: ssd1306
        file: ssd1306.py
        site: false
        url: https://brixel.gorillacell.kr/07_thonny/03_esp32/downloads/libs/Library%206.03%20ssd1306.py
        note: 가상 보드에서는 OLED 부품이 대신해요
    wiring:
      - GND → GND
      - VCC → 5V
      - SDA → GPIO 21
      - SCL → GPIO 22
    circuit: d-2-07.webp
    steps:
      - n: 1
