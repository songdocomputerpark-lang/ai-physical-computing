  - id: d-3-17
    number: "3.17"
    chapter: 3
    name: 수위 센서 (플로트 스위치)
    name_en: 3.57. 수위 센서 (플로트 스위치)
    description: 물에 뜨는 부력체가 위아래로 움직이며 수위를 켜짐/꺼짐으로 알려 주는 센서예요. 프로브(막대)가 딸려 있어요.
