        file: esp32/kit/ch8/8-09-tfcard-2.py
        virtual: real-only
        points:
          - 1초마다 한 줄씩 log.csv 에 적고 flush() 로 바로 카드에 저장해요.
          - BOOT 버튼을 누르면 파일을 닫고 카드 연결을 안전하게 끊어요.
          - free_mem 자리에 센서 값을 넣으면 나만의 측정 기록 장치가 돼요.
