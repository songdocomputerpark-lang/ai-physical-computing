      - n: 2
        kind: 심화 예제
        title: 천천히 빨라졌다 느려지기
        file: esp32/kit/ch6/6-02-dc-motor-2.py
        virtual: real-only
        points:
          - 급하게 출발하지 않고 속도를 조금씩 올리는 것을 «소프트 스타트» 라고 해요.
          - 너무 낮은 속도에서는 모터가 안 돌 수 있어요(정상).
          - range() 의 간격 200 을 바꿔 가속 모습을 바꿔 보세요.
    support: B2
    virtual: real-only
    virtual_reason: 듀얼 모터 드라이버(PCA9685 I2C 칩)의 흉내가 가상 보드에 아직 없어서
