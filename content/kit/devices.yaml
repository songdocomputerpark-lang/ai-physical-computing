  - id: d-3-20
    number: "3.20"
    chapter: 3
    name: CO2 센서 (ZE19D)
    name_en: 3.61. CO2 센서 (ZE19D)
    description: 공기 중 이산화탄소(CO2) 농도를 ppm 으로 알려 주는 센서예요. 교실 환기가 필요한지 판단할 때 써요.
    interface: UART
    pins: 4 pins (G, V, RX, TX)
    gpio: "모듈 TX=GPIO 25 (보드 RX), 모듈 RX=GPIO 26 (보드 TX) (+ LCD: SDA=GPIO 21, SCL=GPIO 22)"
    part: d-003-co2-sensor-z219d
    libraries:
      - name: i2c_lcd
        file: i2c_lcd.py
        site: true
    wiring:
      - GND → GND
      - VCC → 5V
      - TX (모듈) → GPIO 25
      - RX (모듈) → GPIO 26
      - LCD SDA → GPIO 21
      - LCD SCL → GPIO 22
      - LCD VCC → 5V
      - LCD GND → GND
    circuit: d-3-20.webp
    steps:
      - n: 1
        kind: 기본 동작 테스트
        title: CO2 농도 읽기
        file: esp32/kit/ch3/3-20-ze19d-1.py
        virtual: real-only
        points:
          - 센서에 9바이트 명령을 보내면 9바이트로 대답해요. 대답의 3·4번째 바이트가 농도예요.
          - CO2(ppm) = 위쪽 바이트 × 256 + 아래쪽 바이트 로 계산해요.
          - 입김을 불면 값이 확 올라가고, 환기하면 천천히 내려가요.
      - n: 2
        kind: 심화 예제
        title: 환기 판단기 (1000ppm)
        file: esp32/kit/ch3/3-20-ze19d-2.py
        virtual: real-only
        points:
          - 1000ppm 이상이면 LCD 에 OPEN WINDOW 가 나오고 보드 LED 가 켜져요.
          - 처음 1000 을 넘는 순간만 alerts 횟수로 세요.
          - LIMIT 숫자를 바꿔 우리 교실에 맞는 기준을 정해 보세요.
    support: B2
    virtual: real-only
    virtual_reason: CO2 센서가 UART로 보내는 값(9바이트 명령·응답)의 흉내가 가상 보드에 아직 없어서
  - id: d-3-21
    number: "3.21"
    chapter: 3
    name: 지문 센서 (AS608)
    name_en: Fingerprint Sensor (AS608)
