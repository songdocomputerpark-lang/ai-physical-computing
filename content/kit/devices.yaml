  - id: d-6-09
    number: "6.09"
    chapter: 6
    name: 16채널 서보 드라이버 (PCA9685)
    name_en: 4.14. 16채널 서보 드라이버 (PCA9685)
    description: I2C 선 2개만으로 서보모터를 최대 16개까지 움직이는 드라이버예요. 로봇 팔·보행 로봇에 쓰여요.
    interface: I2C
    pins: 4 pins (GND, VCC, SDA, SCL)
    gpio: SDA=GPIO 21, SCL=GPIO 22 (I2C 주소 0x40)
    part: m-020-16ch-servo-motor-driver-i2c-pca9685
    libraries:
      - name: pca9685
        file: pca9685.py
        site: false
        url: https://brixel.gorillacell.kr/07_thonny/03_esp32/downloads/libs/Library%206.23%20pca9685.py
    wiring:
      - GND → GND
      - VCC → 3V3
      - SDA → GPIO 21
      - SCL → GPIO 22
      - V+ → 서보용 전원(건전지 5~6V) + / −
      - 채널 0~3 → 서보 연결(신호선이 위쪽)
    circuit: d-6-09.webp
    steps:
      - n: 1
        kind: 기본 동작 테스트
        title: 서보 한 개 스윕(0~180도)
        file: esp32/kit/ch6/6-09-pca9685-1.py
        virtual: real-only
        points:
          - PCA9685 라이브러리의 freq(50) 으로 서보용 50Hz 를 만들어요.
          - 각도 → 펄스 폭(500~2500µs) → 12비트 값(0~4095) 순서로 바꿔서 duty() 로 보내요.
          - 서보 전원은 드라이버의 V+ 단자에 따로 연결해야 힘이 나요.
      - n: 2
        kind: 심화 예제
        title: 서보 여러 개 순차 동작과 물결
        file: esp32/kit/ch6/6-09-pca9685-2.py
        virtual: real-only
        points:
          - 채널 번호만 바꾸면 한 드라이버로 서보를 여러 개 움직여요.
          - 차례로 90도 → 차례로 0도 → 한 칸씩 늦은 사인(sin) 파형으로 물결 모양을 만들어요.
          - 끝날 때 모두 90도로 돌린 뒤 신호를 끊어( release ) 서보를 쉬게 해요.
    support: B2
    virtual: real-only
    virtual_reason: 16채널 서보 드라이버(PCA9685 I2C 칩)의 흉내가 가상 보드에 아직 없어서
  - id: d-6-10
    number: "6.10"
    chapter: 6
    name: L293DD 모터 드라이버
    name_en: 6.10. L293DD 모터 드라이버
    description: L293DD 칩으로 DC 모터 2개(A·B)의 방향과 속도를 따로 조절하는 모터 드라이버. 커넥터는 모터 A·B 마다 2개씩(같은 모터를 어느 쪽에 꽂아도 된다)이고, 아래 2핀(GND·VM)으로 모터 전원을 따로 넣는다.
    interface: Digital + PWM
    pins: 8 pins (GND, VCC, AIN1, PWMA, AIN2, BIN1, PWMB, BIN2) + 모터 커넥터 A·B + 모터 전원
    gpio: AIN1=16, PWMA=17, AIN2=18, BIN1=19, PWMB=13, BIN2=14
    part: m-019-l293dd-motor-driver
    libraries: []
    wiring:
      - GND → GND
      - VCC → 5V
      - AIN1 → GPIO 16
      - PWMA → GPIO 17
      - AIN2 → GPIO 18
      - BIN1 → GPIO 19
      - PWMB → GPIO 13
      - BIN2 → GPIO 14
      - Motor A / Motor B → DC 모터 (각 채널 커넥터 2개 중 하나)
      - Motor Power (GND·VM) → 모터용 배터리
    circuit: d-6-10.webp
    steps:
      - n: 1
        kind: 기본 동작 테스트
        title: 모터 A·B 차례로 돌리기
        file: esp32/kit/ch6/6-10-l293dd-1.py
        virtual: partial
        points:
          - AIN1 · AIN2 중 어느 쪽이 1이냐로 방향이, PWMA 의 듀티로 속도가 정해져요(B 도 같아요).
          - 모터 전원(VM)에 배터리를 꽂아야 모터가 힘 있게 돌아요. 보드 USB 전원만으로는 약할 수 있어요.
          - 멈추기를 누르면 finally 에서 두 모터를 모두 멈춰요.
      - n: 2
        kind: 심화 예제
        title: 두 바퀴 자동차 움직임 + 일시 정지
        file: esp32/kit/ch6/6-10-l293dd-2.py
        virtual: partial
        points:
          - 두 모터를 같은 방향으로 돌리면 직진, 반대로 돌리면 제자리 회전이에요.
          - ramp() 가 속도를 10씩 올렸다 내려 출발·정지가 부드러워요.
          - BOOT 버튼으로 언제든 일시 정지하고 다시 시작할 수 있어요.
    support: B1
    virtual: partial
    virtual_reason: 가상 보드에는 모터 두 개 그림이 없어서 여섯 신호선을 표시등으로만 보여 주기 때문에(모터가 도는 모습은 나오지 않아요)
