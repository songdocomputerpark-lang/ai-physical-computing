# 부품 사전 데이터 — "부품 사전"(/start/parts/)과 보드 준비 쪽 키트 표의 사진 칸, 차시의 부품 사진 줄이 읽는 한 파일이에요.
# 읽고 검사하는 곳: src/components/parts/parts-schema.ts(칸 규칙)·parts-data.ts(빌드 때 읽기), 검사 tests/unit/parts/.
#
# 새 부품 사진 = 사진 파일 하나 + 아래 목록에 한 줄이에요(코드는 고치지 않아요).
#  1. 사진을 public/images/parts/third-party/kit-vendor/<id>.webp 로 넣어요. 다시 인코딩해서 넣어요 — 긴 변 800px 이하, WebP(품질 80 안팎),
#     EXIF·XMP·ICC 같은 메타데이터 없이. 예(Pillow):
#       python -c "from PIL import Image; im=Image.open('원본.png'); im.thumbnail((800,800)); c=Image.new(im.mode,im.size); c.paste(im); c.save('d-050-새-부품.webp','WEBP',quality=80,method=6)"
#     원본에 sRGB가 아닌 색 프로필(ICC)이 있으면 sRGB로 바꾼 다음 저장해요. 새 이미지에 붙여 넣으면 메타데이터가 따라오지 않아요.
#  2. 저장소 검사가 사진마다 눈 확인 기록을 요구해요: 사진을 열어 얼굴·이름·화면 속 경로·기기 주소가 없는지 보고,
#     scripts/image-allowlist.yaml에 path·sha256·reviewed를 적어요(MAINTENANCE.md 3절).
#  3. 아래 목록의 알맞은 분류 아래에 한 줄을 더해요. 목록 차례가 쪽에 보이는 차례예요.
# 사진 권리: 고릴라셀(브릭셀)이 제공한 사진을 운영자가 허락받아 써요(DECISIONS O17·C136). sources.yaml의 "키트 업체의 제품 사진" 항목이
# public/images/parts/third-party/kit-vendor/** 를 덮어요. 스톡 사진·워터마크가 보이는 사진은 쓰지 않아요(DECISIONS C11).
#
# 칸(한 줄 = 사진 한 장)
#   id          (필수) 영문 소문자·숫자·하이픈. 사진 파일 이름과 같게 짓는 것을 권해요. 겹치면 안 돼요.
#   file        사진 파일 이름. 적지 않으면 <id>.webp 예요.
#   name        (필수) 고1이 아는 한국어 이름. 사진의 alt는 "<이름> 사진"으로 저절로 만들어져요.
#   name_en     (필수) 영어 이름(기판이나 파일 이름의 영문).
#   category    (필수) analog-sensor · digital-sensor · display · motor · i2c · comm · output · board · etc 중 하나(parts-schema.ts의 PART_CATEGORIES).
#   connection  (필수) 보드와 어떻게 이어요? 예: 아날로그 입력(ADC), 디지털 입력, I2C, UART, PWM.
#   site_part   가상 보드 부품 id(src/lab/modules/board/parts/ 폴더 이름). 하나 또는 [여러 개]. 있으면 카드에 "가상 보드에서 해 보기"가 생겨요.
#               같은 부품 id를 가리키는 사진이 여럿이면 차시의 사진 줄은 kit_name이 있는(교과서 키트) 사진을 먼저 보여 줘요(parts-schema.ts pickPartsForSiteParts).
#   kit_name    보드 준비 쪽 키트 표(src/components/start/board/kit-parts.ts)의 kitName과 글자까지 같게. 키트 표의 사진 칸이 이 사진을 써요.
#   note        모양이 달라질 수 있거나 헷갈리기 쉬운 부품에 한 줄 안내. 판이 다른 부품에는 "키트에 따라 모양이 다를 수 있어요."를 적어요.
#
# YAML 주의: 글 속에 쉼표·콜론·따옴표가 들면 값을 큰따옴표로 감싸요(한 줄 묶음 {…} 안에서는 쉼표가 칸 나눔이에요).
