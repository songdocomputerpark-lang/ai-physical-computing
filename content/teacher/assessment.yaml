# 과목 교육과정의 평가 방법(교육청 게시물 요약 — INVENTORY §9.2 "평가 방향")
methods:
  - 지필 평가를 줄이고, 배우는 과정에서 평가해요(과정 중심 평가).
  - 프로젝트를 하는 과정의 비중을 30% 이상으로 해요.
  - 생성형 인공지능의 도움을 받은 부분을 표시하고, 함께 만든 과정의 자료를 같이 내게 해요.

# 성취기준을 적용할 때의 고려 사항(교육청 게시물의 문서 보기에서 사이트가 옮긴 문구 — PLAN §2.2·§8.5 P5-13, src/lab/ble/names.ts)
considerations:
  - quote: 영상처리 함수 사용법 교육이 주가 되지 않도록
    use: 보충 차시 V1~V5(영상 처리 기초)는 성취기준을 억지로 붙이지 않았어요. 함수 이름을 외우기보다 결과가 왜 그렇게 나오는지를 묻는 "왜 이런 결과가 나올까" 상자를 차시마다 두었어요.
  - quote: 영상인식에 따른 개인정보 및 윤리적인 문제가 발생하는 주제는 피하도록
    use: 얼굴 차시는 얼굴의 점으로 방향, 입, 눈의 움직임만 판단하고 누구인지 알아보는 활동은 넣지 않았어요. IV단원 프로젝트 안내에 피해야 할 주제를 적었어요.
  - quote: 다른 학생의 네트워크에 연결하지 않도록 지도한다
    use: 블루투스 보드 이름은 자리 번호로 붙이고, 공개 중계 서버에는 표시 장치만 이어요(보충 C1, 4-1-4).

# 성취기준마다 평가할 때 볼 것(look)과 모을 자료(evidence) — 사이트 제안. 차시 교사용 접기의 "평가 포인트"를 바탕으로 썼어요.
standards:
  12인피01-01:
    look: 인공지능 응용 프로그램이 기존 프로그램과 무엇이 다른지 사례로 말하고, 영상 인식 기술(분류, 검출, 랜드마크 감지 등)이 특징을 찾아 판단하는 과정을 제 말로 설명하는지 봐요. 카메라 프로그램의 기본 틀(불러오기, 설정, 반복해서 읽고 보이기, 끝내기)을 코드에서 찾는지도 봐요.
    evidence: 도전 과제 기록(에이전트 구성 요소 표, 영상 인식 기능과 풀 문제 잇기, 두 개발 환경 비교표), 확인 퀴즈
  12인피01-02:
    look: 손 랜드마크 번호로 손가락 끝을 찾고 0과 1 사이의 상대 좌표를 화면의 픽셀 좌표로 바꿔 쓰는지, 두 점의 거리나 위치를 비교하는 조건으로 그리기, 원 크기, 화면 조작 같은 결과를 바꾸는지 봐요.
    evidence: 바꿔보기 결과 설명, 도전 과제 코드(손 인식 조건 표, 거리 유지 판정, 손가락 모양으로 켜고 끄기), 공유 링크나 .py 파일로 낸 코드
  12인피01-03:
    look: 페이스 메시 점 번호로 코끝, 눈, 입을 찾고 좌표 차이(고개 방향)나 비율(입 모양 비율)로 상태를 판단해 바뀔 때만 세는지 봐요. 얼굴 영상을 저장하거나 공유하지 않는 원칙을 지키는지도 봐요.
    evidence: 콘솔에 찍은 값과 기준을 정한 까닭, 필터와 모자이크 도전 과제 결과
  12인피01-04:
    look: 자세 랜드마크의 y 좌표가 아래로 갈수록 커진다는 것을 알고 기준값과 비교해 손 들기나 어깨 기울기를 판단하는지, 기준값을 바꿨을 때의 결과를 설명하는지 봐요.
    evidence: 기준값 바꾸기 실험 기록, 세 단계 안내(if, elif, else) 도전 과제
  12인피02-01:
    look: 피지컬 컴퓨팅 시스템을 입력, 처리, 출력으로 나누고, 핀 구성에서 신호 핀과 전원 핀을 구별하며, 실습실(또는 실제 보드)에서 코드를 실행해 내장 LED를 켜고 끄는지 봐요.
    evidence: 입력, 처리, 출력 나누기 도전 과제, 핀 상태 표 읽기
  12인피02-02:
    look: LCD와 OLED의 글자 자리(커서, 좌표)와 I2C 연결을 이해하고, RGB LED의 PWM 세기와 네오픽셀의 색 값으로 원하는 표시를 만드는지 봐요. 생성형 AI를 쓴 과제는 도움 받은 부분을 표시했는지 봐요.
    evidence: 도전 과제 결과(글자, 그림, 색), 생성형 AI 활용 탐구 기록
  12인피02-03:
    look: 버저의 주파수(음 높이)와 duty(켜진 비율), MP3 모듈에 보내는 명령의 바이트를 설명하고, 터치 같은 입력에 따라 소리를 바꾸는 프로그램을 만드는지 봐요.
    evidence: 음계와 명령 표, 도전 과제(작은 별 연주, 층 안내 방송)
  12인피02-04:
    look: INA, INB 값의 조합과 속도에 따른 duty로 팬의 방향과 세기를, 펄스 폭과 각도의 관계로 서보모터를 설명하고, 입력에 따라 움직임을 바꾸는지 봐요. 회전 날개와 팔이 움직일 공간 같은 안전 수칙을 지키는지도 봐요.
    evidence: 도전 과제(강풍 단계와 터치 선풍기, 숫자로 각도 정하기와 60초 초시계)
  12인피03-01:
    look: 영상 인식 결과를 짧은 약속(글자나 숫자와 줄바꿈)으로 바꿔 보드에 보내고, 상태가 바뀔 때만 보내도록 설계하는지 봐요.
    evidence: 보내는 약속 표, 짝 실습의 두 콘솔 기록
  12인피03-02:
    look: 시리얼(UART), 블루투스, 와이파이(MQTT) 통신이 어떻게 연결되고 무엇이 다른지 말하고, 짝 예제로 출력 장치를 움직이는지 봐요. 공개 중계 서버에 개인정보를 보내지 않는지도 봐요.
    evidence: 통신 방식 비교표, 짝 실습 결과, 대시보드 위젯 설정
  12인피03-03:
    look: 글자를 바이트로 바꿔 보내고, 여러 값을 쉼표로 나눠 보낸 것을 받는 쪽에서 나누어 숫자로 바꾸며(파싱), 모양이 틀린 글은 걸러 내는지 봐요.
    evidence: 문자열과 bytes 변환기 실험 기록, 좌표를 나누어 읽는 코드
  12인피04-01:
    look: 얼굴 점 좌표로 마우스를 움직이고 눈 깜빡임으로 클릭한 신호를 블루투스로 보내, LCD, 서보모터, 빛, 소리로 되돌려 주는 사례를 설명하는지 봐요. 얼굴을 찾기만 하고 누구인지 알아보지는 않는다는 점을 말하는지도 봐요.
    evidence: 보내는 글의 약속(머리말과 칸 수) 설계, 피드백 시험 기록
  12인피04-02:
    look: 주변을 관찰해 누가, 언제, 무엇 때문에 불편한지를 문제 정의 문장으로 쓰고, 개인정보와 윤리 문제가 생기는 주제를 스스로 거르는지 봐요.
    evidence: 관찰 기록, 문제 정의 문장, 주제 점검(IV단원 프로젝트 안내 1단계)
  12인피04-03:
    look: 역할을 나누고 바꿔 맡으며, 통신 약속과 계획을 세워 작은 부분부터 시험하고 고치는지 봐요. 누가 무엇을 했는지와 생성형 AI 도움이 기록에 드러나는지 봐요.
    evidence: 역할표와 계획표, 통신 약속, 시험 기록표, 코드(프로젝트 안내 2, 3단계)
  12인피04-04:
    look: 만든 지능화 사물이 쓰는 사람과 주변 사람에게 미칠 영향을 점검표로 살피고, "아니오"가 나온 점을 실제로 고치거나 주의 문구를 만드는지 봐요.
    evidence: 점검표, 고친 점과 주의 문구(프로젝트 안내 4단계)

# 성취기준을 비워 둔 차시의 까닭(PLAN §2.2 대응표 근거 칸). labels(차시 번호) 또는 kinds(차시 종류)로 고르고, 먼저 맞는 줄을 써요.
# 맞는 줄이 없으면 페이지가 "대응표(PLAN §2.2)에서 비워 둔 차시예요"라고만 적어요.
unmapped:
  - labels: [V1, V2, V3, V4, V5]
    reason: 영상 처리 기초를 다지는 보충 차시예요. 교육과정 고려 사항("영상처리 함수 사용법 교육이 주가 되지 않도록")에 따라 성취기준을 억지로 붙이지 않았어요.
  - labels: [1-4-3]
    reason: 음성 인식은 과목의 성취기준과 내용 요소에 없어서 선택 차시로 두었어요.
  - labels: [P1]
    reason: 3-1-4(손과 동작으로 컴퓨터 제어하기)를 위한 사전 학습이에요. 3-1-4가 [12인피01-02]와 이어져요.
  - kinds: [review]
    reason: 대단원 전체를 돌아보는 문항 모음이라 한 성취기준에 붙이지 않았어요. 문항마다 다시 볼 차시가 적혀 있어요.
