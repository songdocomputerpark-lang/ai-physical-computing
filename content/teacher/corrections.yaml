    problem: >-
      수업 교안 계단 9(접혀 있는 손가락 감지하기) — 손가락을 세는 부분이 손마다 도는 반복문 밖에 있어서, 손을 여럿 찾게 바꾸면 마지막으로 찾은 손만 세어요(지금은 `max_num_hands=1`이라 문제없어요).
    site: >-
      보충 C3의 예제는 손마다 따로 세어 더해요(C3 핵심 개념의 참고 상자).
