# 파이썬 오류 사전 — 데이터 파일 (PLAN §8.2 P2-06, SPEC §6.1 "파이썬 예외 → 트레이스백 + 한국어 설명", CODE_MAPPING §3.3 사례)
#
# 이 파일 하나가 두 곳에 쓰여요.
#   1. 실습실 콘솔 위의 "오류 풀이" 카드(src/lab/modules/errors/) — 코드가 오류로 끝나면 트레이스백을 읽어 여기서 맞는 항목을 골라 보여 줘요.
#   2. 오류 사전 페이지 /help/errors/ (src/pages/help/errors/index.astro) — 아래 항목을 묶음(groups) 순서대로 모두 보여 줘요.
# 새 오류 풀이 = 아래 entries에 항목 하나를 더하면 끝이에요(코드 수정 없음). 저장한 뒤 npm run build(또는 npm test)를 하면 형식 검사가 돌아요.
#
# ── 항목(entries) 필드 ──
#   id        (필수) 영문 소문자·숫자·하이픈. 사전 페이지 주소 뒤 #위치가 돼요(예: /help/errors/#name-error). 겹치면 안 돼요.
#   group     (필수) 아래 groups의 id 가운데 하나.
#   title     (필수) 카드·사전의 제목. 학생이 읽는 한국어 한 줄.
#   types     예외 종류 이름 목록. 트레이스백 마지막 줄의 "NameError:"처럼 앞에 나오는 이름과 같아야 해요(cv2.error는 error 또는 cv2.error).
#             사이트가 만든 이름도 쓸 수 있어요: StopRequested([정지]로 멈춤), ForcedRestart(정지 2단계, 파이썬 다시 시작),
#             PackageLoadError(패키지 못 받음), RuntimeNotReady, RuntimeBusy, JavaScriptError(워커 쪽 오류).
#   patterns  오류 메시지(마지막 줄의 ": " 뒤와 그 아래 이어진 줄)에 맞출 정규식 목록. 하나라도 맞으면 돼요.
#             (?<name>…)처럼 이름 붙은 묶음은 아래 글의 {name} 자리에 들어가요. 조사는 {name:은/는}·{name:이/가}·{name:을/를}·{name:과/와}·{name:으로/로}로 붙여요.
#   traceback_patterns  트레이스백 전체(파일 이름·줄 포함)에 맞출 정규식(선택). 어느 파일에서 난 오류인지로 구별할 때 써요.
#   priority  같은 오류에 여러 항목이 맞을 때 먼저 고를 순서(숫자가 클수록 먼저, 기본 0). 종류만 맞는 항목보다 패턴까지 맞는 항목이 늘 먼저예요.
#   meaning   (필수) 무슨 뜻인지 한 문장.
#   why       왜 나는지(문장 목록).
#   fix       (필수) 고치는 법(목록). 학생이 바로 해 볼 수 있는 순서로.
#   mistakes  자주 하는 실수(목록).
#   example   사전 페이지에 보여 줄 짧은 보기: code(코드), error(그때 나는 마지막 줄), line(코드에서 오류가 나는 줄, 적지 않으면 마지막 줄).
#             사전 페이지의 "{line}번째 줄" 글에 이 줄 번호가 들어가요.
#   cases     교과서·교안 코드에서 실제로 이 오류가 나는 경우(문장 목록). 사전 페이지에만 보여요.
#   fallback  true인 항목은 아무것도 맞지 않을 때 쓰는 마지막 풀이예요(하나만).
# 글에 쓸 수 있는 자리: {line}(내 코드 줄 번호), {type}(오류 종류), {message}(오류 메시지), 패턴의 이름 붙은 묶음.
# 글은 고1이 처음 읽어도 알 수 있게, "~해요"로 끝나는 문장으로 써요. 영어 오류 메시지의 뜻을 먼저 말하고, 고치는 법은 순서대로 적어요.

groups:
  - id: syntax
    title: 코드 모양(문법) 오류
    description: 파이썬이 코드를 읽지도 못할 때 나는 오류예요. 실행이 시작되기 전에 나고, 줄 번호 근처의 모양을 고치면 돼요.
  - id: names
    title: 이름·값을 못 찾는 오류
    description: 변수·함수·목록·사전에서 없는 것을 찾을 때 나는 오류예요.
  - id: types
    title: 자료형·계산 오류
    description: 글자와 숫자를 섞어 계산하거나, None(값 없음)을 값처럼 쓰거나, 0으로 나눌 때 나는 오류예요.
  - id: vision
    title: 영상 처리(OpenCV) 오류
    description: cv2 함수가 내는 오류예요. 대부분 "이미지가 비어 있다"거나 "색 채널 수가 다르다"는 뜻이에요.
  - id: modules
    title: 모듈·파일 오류
    description: import할 모듈이나 열 파일이 없을 때 나는 오류예요.
  - id: board
    title: ESP32 보드(가상 보드·실물 보드) 오류
    description: machine·time 같은 보드용 파이썬(MicroPython)과 부품(LCD·서보·네오픽셀 등)에서 나는 오류예요. 가상 보드와 실물 ESP32에서 같은 문구로 나요.
  - id: lab
    title: 실습실 안내(정지·제한 모드·준비)
    description: 오류가 아니라 실습실이 멈추거나 준비되지 않았을 때의 안내예요.

entries:
  # ── 코드 모양(문법) ──
  - id: syntax-assign-compare
    group: syntax
    title: "같은지 비교할 때는 = 하나가 아니라 == 두 개예요"
    types: [SyntaxError]
    patterns:
      - "Maybe you meant '==' or ':=' instead of '='"
    priority: 2
    meaning: "if나 while 뒤에서 값을 비교하려고 =를 하나만 썼어요. 파이썬은 = 하나를 '값을 넣어라(대입)'로 읽어요."
    why:
      - "'같다'를 묻는 기호는 ==(등호 두 개)예요. = 하나는 x = 1처럼 값을 넣는 명령이라서 if 뒤에 올 수 없어요."
    fix:
      - "{line}번째 줄의 =를 ==로 바꿔요. 예: if x = 1: → if x == 1:"
      - "반대로 값을 넣으려던 줄이면 if를 지우고 x = 1처럼 한 줄로 써요."
    mistakes:
      - "= =처럼 두 기호 사이를 띄우면 다른 오류(invalid syntax)가 나요. ==는 붙여 써요."
      - "'같지 않다'는 !=예요. =!나 <>는 안 돼요."
    example:
      code: |
        x = 1
        if x = 1:
            print('one')
      error: "SyntaxError: invalid syntax. Maybe you meant '==' or ':=' instead of '='?"
      line: 2
    cases:
      - "교과서 1-2-2 원고(p37)에는 조판 과정에서 == 사이가 벌어진 = =가 있어요. 그대로 치면 문법 오류가 나니 ==로 붙여 써요."

  - id: syntax-unclosed
    group: syntax
    title: 괄호나 따옴표를 닫지 않았어요
    types: [SyntaxError]
    patterns:
      - "'(?<open>[\\(\\[\\{])' was never closed"
      - "unterminated string literal"
      - "unterminated triple-quoted string"
      - "unexpected EOF while parsing"
      - "was never closed"
    priority: 2
    meaning: "여는 괄호나 따옴표는 있는데 짝이 되는 닫는 기호가 없어요."
    why:
      - "파이썬은 (와 ), [와 ], '와 '처럼 짝을 맞춰 읽어요. 하나가 빠지면 어디까지가 한 덩어리인지 몰라서 코드를 읽지 못해요."
      - "오류가 표시된 줄은 '여기서 열었는데 끝까지 닫히지 않았다'는 자리예요. 실제로 빠진 곳은 그 줄의 끝이나 다음 줄일 때가 많아요."
    fix:
      - "{line}번째 줄에서 여는 기호와 닫는 기호 수를 세어 봐요. 괄호는 (와 )가 같은 개수여야 해요."
      - "글자(문자열)는 따옴표로 시작해서 같은 종류의 따옴표로 끝나요. 'abc'나 \"abc\"처럼 짝을 맞춰요."
      - "print(cv2.waitKey(1) & 0xFF == ord('q'))처럼 괄호가 겹칠 때는 안쪽부터 하나씩 닫아요."
    mistakes:
      - "print('안녕)처럼 따옴표 하나를 빼먹는 것"
      - "cv2.imshow('창', frame처럼 마지막 )를 빼먹는 것"
      - "한글 자판 상태에서 따옴표를 치면 다른 기호(‘ ’ “ ”)가 들어가요. 영어 자판의 ' 또는 \"만 돼요."
    example:
      code: |
        print('hello'
        x = 1
      error: "SyntaxError: '(' was never closed"
      line: 1

  - id: syntax-missing-colon
    group: syntax
    title: "줄 끝에 :(콜론)이 빠졌어요"
    types: [SyntaxError]
    patterns:
      - "expected ':'"
    priority: 2
    meaning: "if, for, while, def, else처럼 아래에 묶음(블록)이 이어지는 줄은 끝에 :(콜론)을 써야 해요."
    why:
      - "콜론은 '여기서부터 들여쓴 줄들이 이 명령에 속한다'는 표시예요. 없으면 파이썬이 다음 줄을 어떻게 읽을지 몰라요."
    fix:
      - "{line}번째 줄 끝에 :을 붙여요. 예: while True → while True:"
      - "else, elif, try, except, finally, def, class 줄도 모두 :로 끝나요."
    mistakes:
      - ";(세미콜론)이나 .(점)을 쓰는 것. 파이썬은 :(콜론)이에요."
      - "if x == 1 처럼 조건 뒤에 :을 빼먹는 것"
    example:
      code: |
        if True
            print('a')
      error: "SyntaxError: expected ':'"
      line: 1

  - id: syntax-print
    group: syntax
    title: print 뒤에는 괄호가 필요해요
    types: [SyntaxError]
    patterns:
      - "Missing parentheses in call to 'print'"
    priority: 2
    meaning: "print 'hello'처럼 괄호 없이 썼어요. 지금 파이썬(3)에서 print는 함수라서 print('hello')처럼 괄호로 감싸요."
    why:
      - "옛 파이썬(2)은 괄호 없이도 됐지만, 파이썬 3부터는 함수 호출 규칙대로 괄호를 써요. 오래된 예제나 책을 보고 칠 때 자주 나요."
    fix:
      - "{line}번째 줄을 print(...)로 고쳐요. 예: print 'hello' → print('hello')"
      - "여러 값을 찍을 때는 쉼표로 이어요. print('x =', x)"
    mistakes:
      - "print \"결과\", x처럼 파이썬 2 방식 그대로 쓰는 것"
    example:
      code: |
        print 'hello'
      error: "SyntaxError: Missing parentheses in call to 'print'. Did you mean print(...)?"

  - id: syntax-invalid-character
    group: syntax
    title: 파이썬이 모르는 글자가 들어갔어요(한글 따옴표·전각 기호)
    types: [SyntaxError]
    patterns:
      - "invalid character '(?<char>.+?)' \\(U\\+(?<code>[0-9A-F]+)\\)"
      - "invalid non-printable character U\\+(?<code>[0-9A-F]+)"
    priority: 2
    meaning: "코드에 파이썬이 기호로 쓰지 않는 글자가 있어요. 문서 편집기에서 복사한 예쁜 따옴표(‘ ’ “ ”)나 전각 기호일 때가 많아요."
    why:
      - "파이썬 기호(따옴표·괄호·쉼표·마이너스)는 모두 영어 자판의 반각 글자예요. 워드·한글·메신저에서 복사하면 모양이 비슷한 다른 글자로 바뀌어 있을 수 있어요."
    fix:
      - "{line}번째 줄에서 표시된 글자를 지우고 영어 자판으로 다시 쳐요. 따옴표는 ' 또는 \", 쉼표는 ,, 마이너스는 -예요."
      - "글자 안에 한글을 쓰는 것은 괜찮아요. print('안녕')의 안녕은 문제가 없어요. 문제는 기호 자리에 들어간 글자예요."
    mistakes:
      - "웹 문서나 PDF에서 코드를 복사해 붙이면 따옴표가 “ ”로 바뀌는 것"
      - "한/영 키를 누르지 않은 채 기호를 쳐서 전각 기호(（ ） ，)가 들어가는 것"
    example:
      code: |
        print(“안녕”)
      error: "SyntaxError: invalid character '“' (U+201C)"

  - id: indentation-unexpected
    group: syntax
    title: 들여쓰기가 필요 없는 줄인데 들여 썼어요
    types: [IndentationError]
    patterns:
      - "unexpected indent"
    priority: 2
    meaning: "{line}번째 줄이 앞줄보다 안쪽으로 들어가 있는데, 그 앞에 if·for·def처럼 묶음을 여는 줄이 없어요."
    why:
      - "파이썬은 들여쓰기(줄 앞의 빈칸)로 어느 명령이 어느 묶음에 속하는지 정해요. 묶음이 시작되지 않았는데 들여 쓰면 어디에 속하는지 몰라 오류가 나요."
      - "복사해 붙인 코드 앞에 빈칸이 남았거나, 줄 앞을 실수로 Space 키로 밀었을 때 자주 나요."
    fix:
      - "{line}번째 줄 앞의 빈칸을 지워 위 줄과 같은 위치에서 시작하게 해요."
      - "그 줄이 정말 안쪽 묶음이라면 바로 위에 if …:나 for …: 같은 줄이 있는지 확인해요."
    mistakes:
      - "첫 줄(import cv2) 앞에 빈칸이 들어간 것"
      - "예제를 붙일 때 한 줄만 다른 위치에서 시작하는 것"
    example:
      code: |
        x = 1
            y = 2
      error: "IndentationError: unexpected indent"

  - id: indentation-expected
    group: syntax
    title: "묶음(블록) 안의 줄을 들여 쓰지 않았어요"
    types: [IndentationError]
    patterns:
      - "expected an indented block after '(?<stmt>[^']+)' statement on line (?<blockLine>\\d+)"
      - "expected an indented block"
    priority: 2
    meaning: "if·for·while·def 줄 다음에는 안쪽으로 들여 쓴 줄이 와야 하는데, 같은 위치에서 시작하는 줄이 왔어요."
    why:
      - ":(콜론)으로 끝나는 줄은 '다음 줄부터 이 명령에 속하는 묶음'을 예고해요. 묶음이 비어 있으면 파이썬이 읽지 못해요."
    fix:
      - "{line}번째 줄을 Space 4칸(또는 Tab 한 번)만큼 안쪽으로 밀어요. 이 실습실 편집칸에서는 Tab 키가 4칸을 넣어 줘요."
      - "묶음 안에 아직 넣을 코드가 없으면 pass를 한 줄 넣어 두어요."
    mistakes:
      - "while True: 다음 줄을 같은 위치에서 시작하는 것"
      - "함수 def 아래에 아무것도 쓰지 않고 다음 코드로 넘어가는 것"
    example:
      code: |
        if x > 1:
        print('big')
      error: "IndentationError: expected an indented block after 'if' statement on line 1"

  - id: indentation-error
    group: syntax
    title: 들여쓰기가 서로 맞지 않아요
    types: [IndentationError, TabError]
    meaning: "줄마다 들여쓴 깊이가 들쭉날쭉해서 어느 묶음에 속하는지 알 수 없어요. Tab과 Space가 섞였을 수도 있어요."
    why:
      - "같은 묶음에 속하는 줄들은 앞의 빈칸 수가 정확히 같아야 해요. 눈에는 비슷해 보여도 Tab 하나와 Space 4칸은 다른 글자예요."
    fix:
      - "{line}번째 줄과 그 위 줄들의 앞부분을 지우고, 같은 묶음은 같은 칸 수(4칸씩)로 다시 들여 써요."
      - "이 편집칸의 Tab 키는 늘 Space 4칸을 넣어요. 다른 프로그램에서 복사한 코드는 Tab 글자가 섞여 있을 수 있으니 줄 앞을 다시 쳐요."
    mistakes:
      - "if 안쪽은 4칸, 그 안의 for 안쪽은 8칸처럼 단계마다 4칸씩 늘려야 하는데 3칸·5칸이 섞이는 것"
    example:
      code: |
        if True:
            a = 1
          b = 2
      error: "IndentationError: unindent does not match any outer indentation level"

  - id: syntax-error
    group: syntax
    title: 코드 모양이 파이썬 규칙과 달라요
    types: [SyntaxError]
    meaning: "{line}번째 줄 근처의 코드 모양이 파이썬 문법에 맞지 않아 실행을 시작하지 못했어요."
    why:
      - "문법 오류는 코드를 읽는 단계에서 나요. 그래서 그 위의 print도 실행되지 않고, 표시된 줄이나 바로 앞줄에 원인이 있어요."
    fix:
      - "{line}번째 줄의 괄호·따옴표·쉼표·콜론(:)이 빠지지 않았는지 봐요. 표시된 ^ 기호가 파이썬이 막힌 자리예요."
      - "그 줄이 멀쩡해 보이면 바로 앞줄의 끝(닫는 괄호, 콜론)을 봐요."
      - "예제와 한 글자씩 비교해요. 특히 기호는 영어 자판으로 쳤는지 확인해요."
    mistakes:
      - "if x == 1처럼 콜론이 빠진 것"
      - "= =처럼 기호 사이를 띄운 것"
      - "cv2.imshow('창' frame)처럼 인자 사이 쉼표가 빠진 것"
    example:
      code: |
        x = 1
        if x = = 1:
            print('one')
      error: "SyntaxError: invalid syntax"
      line: 2
    cases:
      - "교과서 1-2-2 원고(p37)의 = =는 조판 오타예요. ==로 붙여 써요."
      - "교안(opmp)과 교과서 코드에는 줄 끝에 \\ 로 줄을 이어 쓴 곳이 있어요. 줄 끝 \\ 뒤에 빈칸이 들어가면 문법 오류가 나요."
      - "자료 파일 가운데 줄 앞에 원고의 줄 번호(1, 2, 3 …)가 글자로 들어간 것이 있어요(2-2 팬 모터 라이브러리 예제, p169). 그대로 실행하면 첫 줄부터 문법 오류가 나요 — 사이트판은 번호를 뗐어요."

  # ── 이름·값 ──
  - id: name-error
    group: names
    title: 정해 준 적이 없는 이름을 썼어요
    types: [NameError]
    patterns:
      - "name '(?<name>[^']+)' is not defined"
    priority: 1
    meaning: "파이썬이 '{name}'이라는 이름의 변수나 함수를 찾지 못했어요. 그 이름에 값을 넣어 준 줄이 없거나, 아직 실행되지 않았어요."
    why:
      - "변수는 x = 10처럼 값을 넣은 다음부터 쓸 수 있어요. 철자가 한 글자라도 다르면(예: Frame과 frame) 다른 이름이에요."
      - "if 안에서만 값을 넣은 변수는 조건이 거짓이었을 때 만들어지지 않아요. 그 뒤에서 쓰면 이 오류가 나요."
      - "import를 빼먹으면 모듈 이름(cv2, np, time)도 이 오류가 나요."
    fix:
      - "{line}번째 줄보다 앞에서 {name} 이름에 값을 넣은 줄이 있는지 찾아요. 없으면 그 줄 앞에 {name} = 값 줄을 넣어요."
      - "철자와 대문자·소문자를 정해 준 곳과 똑같이 맞춰요."
      - "if 안에서만 값을 넣는 변수라면 반복문(while) 앞에서 {name} = 0처럼 처음 값을 정해 두어요."
      - "모듈 이름이면 코드 맨 위에 import를 써요. 예: import cv2, import numpy as np"
    mistakes:
      - "frame을 fram이나 Frame으로 잘못 치는 것"
      - "글자를 따옴표 없이 쓰는 것: print(안녕) → print('안녕')"
      - "np.zeros를 쓰면서 import numpy as np를 빼먹는 것"
    example:
      code: |
        print(undefined_name)
      error: "NameError: name 'undefined_name' is not defined"
    cases:
      - "교과서 1-4-1 심화 실습(p88): left_wrist_y는 사람(자세)이 잡힌 장면에서만 값이 정해지는데 if 밖에서 비교해요. 첫 장면에 사람이 없으면 이 오류가 나요. 반복문 앞에 left_wrist_y = 1.0을 넣어 두면 돼요."
      - "교과서 3-1-2 통신 예제(p190~193)와 얼굴 검출 예제에도 조건 안에서만 값을 정하는 변수를 밖에서 쓰는 곳이 있어요. 같은 방법으로 처음 값을 정해요."

  - id: unbound-local
    group: names
    title: 함수 안에서 바깥 변수를 바꾸려 했어요
    types: [UnboundLocalError]
    patterns:
      - "cannot access local variable '(?<name>[^']+)'"
      - "local variable '(?<name>[^']+)' referenced before assignment"
    priority: 1
    meaning: "함수 안에서 {name} 값을 읽기도 하고 바꾸기도 해서, 파이썬이 그 이름을 함수 안의 새 변수로 보았어요. 그런데 값을 넣기 전에 읽어서 오류가 났어요."
    why:
      - "함수 안에서 count += 1처럼 값을 바꾸면 파이썬은 count를 그 함수만의 변수로 새로 만들어요. 바깥의 count와는 다른 것이라 처음 값이 없어요."
    fix:
      - "함수 첫 줄에 global {name}을 써서 바깥 변수를 쓰겠다고 알려요."
      - "또는 함수가 새 값을 return하고, 바깥에서 {name} = 함수()로 받아요."
    mistakes:
      - "반복문 안 함수에서 점수·횟수 변수를 += 1로 올리면서 global을 빼먹는 것"
    example:
      code: |
        count = 0
        def bump():
            count += 1
        bump()
      error: "UnboundLocalError: cannot access local variable 'count' where it is not associated with a value"
      line: 3
    cases:
      - "교과서 1-3-2 심화(하품 감지)·1-4-3 심화(음성 인식)와 자료의 블루투스 시험 코드는 함수 안에서 바깥 변수를 바꾸므로 global 줄이 있어요. 지우면 이 오류가 나요."

  - id: index-error
    group: names
    title: 목록에 없는 번호(인덱스)를 꺼내려 했어요
    types: [IndexError]
    patterns:
      - "index (?<index>-?\\d+) is out of bounds for axis (?<axis>\\d+) with size (?<size>\\d+)"
      - "list index out of range"
      - "string index out of range"
      - "tuple index out of range"
      - "index out of range"
    meaning: "목록(리스트·배열·글자)의 칸 수보다 큰 번호를 썼어요. 파이썬 번호는 0부터 시작해서, 칸이 3개면 0·1·2까지만 있어요."
    why:
      - "칸이 n개인 목록의 마지막 번호는 n-1이에요. items[3]은 4번째 칸이라 칸이 3개면 없어요."
      - "손·얼굴·자세 점(랜드마크) 목록은 정해진 개수만 있어요. 손 21개(0~20), 얼굴 468개(0~467, refine_landmarks=True면 478개), 자세 33개(0~32)예요."
      - "목록이 비어 있을 때 [0]을 꺼내도 이 오류가 나요. 예: 손이 안 잡힌 장면에서 multi_hand_landmarks[0]"
    fix:
      - "{line}번째 줄에서 쓴 번호가 목록 길이(len(목록))보다 작은지 확인해요. 마지막 칸은 목록[-1]로도 꺼낼 수 있어요."
      - "장면마다 개수가 달라지는 목록(검출 결과)은 꺼내기 전에 if len(목록) > 0: 또는 if 결과:로 확인해요."
      - "얼굴 점 468·473번(눈동자)은 FaceMesh(refine_landmarks=True)일 때만 있어요. 옵션을 켜거나 다른 번호를 써요."
    mistakes:
      - "칸이 3개인 목록에서 items[3]을 꺼내는 것(마지막은 items[2])"
      - "카메라에 손이 없을 때 landmark[8]을 바로 읽는 것"
    example:
      code: |
        items = [1, 2, 3]
        print(items[3])
      error: "IndexError: list index out of range"
    cases:
      - "교과서 4-1-1 심화(p219, 눈·코 특징점): 468·473번 점은 refine_landmarks=True일 때만 있어요. 그 옵션 없이 쓰면 이 오류가 나요."
      - "손 인식 예제 전반: 손이 잡히지 않은 장면에서 multi_hand_landmarks[0]을 읽으면 이 오류(또는 None 오류)가 나요. if results.multi_hand_landmarks: 안에서만 읽어요."

  - id: key-error
    group: names
    title: 사전(딕셔너리)에 없는 이름(키)을 찾았어요
    types: [KeyError]
    patterns:
      - "^(?<key>.+)$"
    meaning: "사전(딕셔너리)에 {key} 이름의 칸이 없어요. 사전은 이름(키)으로 값을 찾는데, 그 이름을 넣어 준 적이 없어요."
    why:
      - "d['b']는 '이름이 b인 값을 꺼내라'는 뜻이에요. 넣지 않은 이름을 꺼내면 오류가 나요. 글자 하나(대소문자·띄어쓰기)만 달라도 다른 이름이에요."
    fix:
      - "{line}번째 줄의 이름이 사전을 만들 때 넣은 이름과 똑같은지 확인해요(print(d.keys())로 이름 목록을 볼 수 있어요)."
      - "없을 수도 있는 이름이면 d.get('b', 기본값)을 써요. 없을 때 기본값을 돌려줘요."
    mistakes:
      - "notes['도(높은)']처럼 괄호·띄어쓰기가 든 이름을 한 글자 다르게 치는 것"
      - "JSON이나 결과 사전의 이름을 추측해서 쓰는 것"
    example:
      code: |
        d = {'a': 1}
        print(d['b'])
      error: "KeyError: 'b'"
    cases:
      - "교과서 2-2 부저 예제(p158)는 음이름 사전을 써요. '도'와 '도(높은)'처럼 이름을 정확히 맞춰야 해요."

  - id: value-error-int
    group: names
    title: 숫자로 바꿀 수 없는 글자를 int()에 넣었어요
    types: [ValueError]
    patterns:
      - "invalid literal for int\\(\\) with base 10: '(?<text>[^']*)'"
      - "could not convert string to float: '(?<text>[^']*)'"
    priority: 1
    meaning: "'{text}'는 숫자 모양이 아니라서 int()나 float()로 바꿀 수 없어요."
    why:
      - "int('12')는 12가 되지만 int('열둘')이나 int('')는 숫자가 아니라 오류가 나요. input()으로 받은 글자에 빈칸이나 다른 글자가 섞여도 그래요."
    fix:
      - "입력한 글자가 숫자인지 확인해요. int(text.strip())처럼 앞뒤 빈칸을 지우고 바꿔요."
      - "소수가 들어올 수 있으면 float()을 써요. 숫자가 아닐 수도 있으면 text.isdigit()로 먼저 확인하거나 try/except ValueError로 감싸요."
    mistakes:
      - "input()에 아무것도 넣지 않고 Enter를 눌러 빈 글자가 들어오는 것"
      - "'3.5'를 int()로 바꾸는 것(float()이어야 해요)"
    example:
      code: |
        n = int('abc')
      error: "ValueError: invalid literal for int() with base 10: 'abc'"

  - id: value-error-unpack
    group: names
    title: 나누어 받을 변수 수와 값의 개수가 달라요
    types: [ValueError]
    patterns:
      - "too many values to unpack \\(expected (?<expected>\\d+), got (?<got>\\d+)\\)"
      - "not enough values to unpack \\(expected (?<expected>\\d+), got (?<got>\\d+)\\)"
      - "too many values to unpack"
      - "not enough values to unpack"
    priority: 1
    meaning: "a, b = 값처럼 여러 변수에 한 번에 나눠 넣으려 했는데, 변수는 {expected}개인데 값은 {got}개였어요."
    why:
      - "ok, frame = cap.read()처럼 왼쪽 변수 수와 오른쪽 값 수가 같아야 해요. 함수가 돌려주는 값의 개수를 잘못 알았을 때 나요."
      - "OpenCV 함수는 판마다 돌려주는 개수가 달라요. cv2.findContours는 지금 판에서 2개(윤곽선, 계층)를 돌려줘요."
    fix:
      - "{line}번째 줄의 함수가 값을 몇 개 돌려주는지 확인해 변수 수를 맞춰요. 필요 없는 값은 _로 받아요: cnts, _ = cv2.findContours(...)"
      - "값이 하나뿐이면 변수도 하나로 받아요."
    mistakes:
      - "h, w = img.shape처럼 색 이미지(3채널)의 shape를 두 개로 받는 것(색 이미지는 h, w, c 세 개예요. h, w = img.shape[:2]로 앞 두 개만 받아요)"
      - "옛 OpenCV 예제처럼 _, cnts, _ = cv2.findContours(...) 세 개로 받는 것"
    example:
      code: |
        a, b = [1, 2, 3]
      error: "ValueError: too many values to unpack (expected 2, got 3)"

  - id: value-error
    group: names
    title: 값의 종류는 맞는데 내용이 맞지 않아요
    types: [ValueError]
    meaning: "함수에 넘긴 값의 종류(자료형)는 맞지만 값 자체가 허용 범위나 모양에 맞지 않아요."
    why:
      - "예: 크기가 다른 두 배열을 더하기, 범위 밖의 숫자, 비어 있는 목록의 최댓값 구하기. 메시지가 어떤 값이 문제인지 알려 줘요: {message}"
    fix:
      - "{line}번째 줄에 넘긴 값을 print로 찍어 보고, 함수가 허용하는 범위·모양과 비교해요."
      - "두 이미지(배열)를 더하거나 합칠 때는 크기(shape)와 채널 수가 같아야 해요. cv2.resize로 크기를 맞춰요."
    mistakes:
      - "ESP32의 PWM duty에 0~1023을 벗어난 값을 넣는 것(가상 보드도 실물처럼 오류를 내요)"
      - "크기가 다른 두 영상을 numpy로 더하는 것(operands could not be broadcast together)"
    example:
      code: |
        import numpy as np
        a = np.zeros((3, 3))
        b = np.zeros((4, 4))
        print(a + b)
      error: "ValueError: operands could not be broadcast together with shapes (3,3) (4,4)"
    cases:
      - "2단원 PWM 예제에서 duty(값)의 범위(0~1023)를 넘기면 실물 보드가 ValueError를 내요. 가상 보드도 같게 동작해요."

  # ── 자료형·계산 ──
  - id: type-error-str-int
    group: types
    title: 글자와 숫자를 바로 더했어요
    types: [TypeError]
    patterns:
      - "can only concatenate str \\(not \"(?<other>[^\"]+)\"\\) to str"
      - "unsupported operand type\\(s\\) for (?<op>[^:]+): 'str' and '(?<right>[^']+)'"
      - "unsupported operand type\\(s\\) for (?<op>[^:]+): '(?<left>[^']+)' and 'str'"
      - "must be str, not (?<other>\\w+)"
    priority: 2
    meaning: "글자(str)와 숫자(int·float)는 +로 바로 이을 수 없어요. 둘을 같은 종류로 맞춰야 해요."
    why:
      - "'나이: ' + 17은 글자와 숫자를 잇는 것이라 파이썬이 어떻게 계산할지 몰라요. 숫자를 글자로 바꾸거나(str(17)), print에 쉼표로 넘겨야 해요."
    fix:
      - "숫자를 글자로 바꿔 이어요: '나이: ' + str(age)"
      - "print에는 쉼표로 여러 값을 넘길 수 있어요: print('나이:', age)"
      - "f-문자열이 가장 간단해요: print(f'나이: {{age}}')"
    mistakes:
      - "input()으로 받은 값은 글자예요. 숫자로 계산하려면 int(input(...))으로 바꿔요."
      - "'점수' + score처럼 화면에 표시할 글을 만들 때 str()을 빼먹는 것"
    example:
      code: |
        age = 17
        print('나이: ' + age)
      error: "TypeError: can only concatenate str (not \"int\") to str"

  - id: type-error-none
    group: types
    title: "값이 없음(None)을 값처럼 썼어요"
    types: [TypeError]
    patterns:
      - "'NoneType' object is not (?<what>subscriptable|iterable|callable)"
      - "'NoneType' object (?<what>[^']+)"
      - "between instances of 'NoneType' and"
      - "'NoneType' and '(?<right>[^']+)'"
      - "'(?<left>[^']+)' and 'NoneType'"
    priority: 2
    meaning: "어떤 변수에 None(값 없음)이 들어 있는데 그것을 숫자·목록·함수처럼 썼어요."
    why:
      - "None은 '결과가 없다'는 뜻의 특별한 값이에요. 함수가 실패했거나 return을 빼먹었을 때 나와요."
      - "영상 코드에서는 cap.read()가 프레임을 못 읽었을 때(ok가 False), cv2.imread('경로')가 파일을 못 찾았을 때 None이 돼요."
      - "결과 목록도 마찬가지예요. 손·얼굴이 안 잡힌 장면에서 results.multi_hand_landmarks는 None이라 for로 돌릴 수 없어요."
    fix:
      - "{line}번째 줄에서 쓴 변수를 바로 앞에서 print로 찍어 None인지 확인해요."
      - "None이 될 수 있는 값은 쓰기 전에 확인해요: if frame is None: continue / if results.multi_hand_landmarks:"
      - "직접 만든 함수라면 끝에 return 값을 빼먹지 않았는지 봐요."
    mistakes:
      - "ok, frame = cap.read() 뒤에 ok를 확인하지 않고 frame을 쓰는 것"
      - "cv2.imread('mask.png')의 결과를 확인하지 않는 것(파일이 없으면 None)"
      - "for hand in results.multi_hand_landmarks:를 if로 감싸지 않는 것"
    example:
      code: |
        frame = None
        print(frame[0])
      error: "TypeError: 'NoneType' object is not subscriptable"

  - id: type-error-args
    group: types
    title: 함수에 넘긴 값의 개수나 이름이 달라요
    types: [TypeError]
    patterns:
      - "(?<func>[\\w.]+)\\(\\) missing (?<count>\\d+) required positional arguments?: (?<names>.+)"
      - "(?<func>[\\w.]+)\\(\\) takes (?<takes>.+?) but (?<given>\\d+) (?:was|were) given"
      - "(?<func>[\\w.]+)\\(\\) got an unexpected keyword argument '(?<kw>[^']+)'"
      - "(?<func>[\\w.]+)\\(\\) takes no arguments"
    priority: 2
    meaning: "{func}() 함수를 부를 때 넘긴 값(인자)의 개수나 이름이 함수가 받는 것과 달라요."
    why:
      - "함수는 정해진 개수의 값을 정해진 순서로 받아요. 빼먹거나 더 넘기거나, 이름(키워드)을 잘못 쓰면 이 오류가 나요."
      - "라이브러리 판이 바뀌면 함수가 받는 인자도 바뀌어요. 자료의 예제와 지금 판이 다를 때도 나요."
    fix:
      - "{line}번째 줄에서 {func}에 넘긴 값의 개수를 함수 정의(def) 또는 문서와 맞춰요."
      - "이름 붙은 값(예: speed=100)은 그 함수가 그 이름을 받는지 확인해요."
    mistakes:
      - "def add(a, b)를 만들고 add(1)처럼 하나만 넘기는 것"
      - "rotate('cw', speed=100)처럼 그 판의 라이브러리에는 없는 이름 인자를 쓰는 것"
    example:
      code: |
        def add(a, b):
            return a + b
        add(1)
      error: "TypeError: add() missing 1 required positional argument: 'b'"
    cases:
      - "교과서 2-2 팬 모터 예제(p170)는 rotate(방향, speed=…)를 쓰는데, 자료 폴더의 옛 라이브러리(디지털판)는 speed 인자를 받지 않아 이 오류가 나요. 사이트가 원고 스크린숏판(PWM판)을 제공해요."
      - "보드용 라이브러리를 PC 파이썬에서 그대로 부를 때(bytes와 글자를 + 로 잇는 곳 등)도 이 오류가 나요."

  - id: type-error
    group: types
    title: 값의 종류(자료형)가 맞지 않는 계산이나 호출이에요
    types: [TypeError]
    meaning: "서로 다른 종류의 값을 섞어 계산했거나, 함수가 받지 않는 종류의 값을 넘겼어요."
    why:
      - "파이썬은 값마다 종류(글자 str, 정수 int, 소수 float, 목록 list, 배열 ndarray …)가 있고, 종류에 맞는 계산만 해요. 메시지가 어떤 종류가 문제인지 알려 줘요: {message}"
    fix:
      - "{line}번째 줄에 쓴 변수들을 print(type(변수))로 찍어 종류를 확인해요."
      - "필요한 종류로 바꿔요: int(값), float(값), str(값), list(값)."
      - "OpenCV의 좌표·두께는 정수여야 해요. int(x)처럼 바꿔 넘겨요."
    mistakes:
      - "'3' * 2처럼 글자를 숫자처럼 계산하는 것('33'이 나오거나 오류가 나요)"
      - "len(5)처럼 목록이 아닌 것에 len을 쓰는 것"
      - "x()처럼 함수가 아닌 변수 뒤에 괄호를 붙이는 것('int' object is not callable)"
    example:
      code: |
        print(len(5))
      error: "TypeError: object of type 'int' has no len()"
    cases:
      - "교과서 2-1 레이저 예제(p146)는 함수를 인자 2개로 만들어 놓고 3개로 불러서 첫 반복에서 이 오류가 나요(원본 결함). 사이트판은 원고 p147대로 고쳐 두었어요."

  - id: attribute-error-none
    group: types
    title: "값이 없음(None)에서 속성을 읽었어요 — 프레임이나 이미지가 비어 있을 때 자주 나요"
    types: [AttributeError]
    patterns:
      - "'NoneType' object has no attribute '(?<attr>[^']+)'"
    priority: 3
    meaning: "어떤 변수가 None(값 없음)인데 .{attr}를 읽으려 했어요. 영상 코드에서는 이미지가 비어 있다는 뜻일 때가 많아요."
    why:
      - "cap.read()가 실패하면 frame이 None이고, cv2.imread('경로')가 파일을 못 찾으면 결과가 None이에요. 그 None에 .shape나 .copy()를 붙이면 이 오류가 나요."
      - "손·얼굴 검출 결과도 아무것도 안 잡히면 None이라 .landmark를 읽을 수 없어요."
    fix:
      - "{line}번째 줄 앞에서 그 변수가 None인지 확인하고 건너뛰어요: if frame is None: continue"
      - "cv2.imread를 썼다면 파일 이름·경로를 확인해요(이 실습실의 가상 폴더에 파일이 있어야 해요)."
      - "cap.read()가 계속 실패하면 화면의 입력 소스(웹캠·샘플 입력)가 열려 있는지 보고 다시 [실행]해요."
    mistakes:
      - "ok, frame = cap.read() 다음에 if not ok: break를 빼먹는 것"
      - "results.multi_hand_landmarks가 None인데 [0].landmark를 읽는 것"
    example:
      code: |
        import cv2
        img = cv2.imread('mask.png')
        h, w = img.shape[:2]
      error: "AttributeError: 'NoneType' object has no attribute 'shape'"
    cases:
      - "교과서 1-3-2 심화(mask.png로 그림 합성하기): 그림 파일이 없으면 imread 결과가 None이라 이 오류가 나요. 실습실은 예제에 필요한 그림을 가상 폴더에 미리 넣어 줘요."

  - id: attribute-error-module
    group: types
    title: 모듈에 그런 이름의 함수가 없어요(오타일 때가 많아요)
    types: [AttributeError]
    patterns:
      - "module '(?<module>[^']+)' has no attribute '(?<attr>[^']+)'"
    priority: 2
    meaning: "{module} 모듈에 {attr} 함수가 없어요. 이름을 잘못 쳤거나, 그 판의 모듈에는 없는 함수예요."
    why:
      - "cv2.destoyAllWindows처럼 한 글자만 빠져도 다른 이름이에요. 파이썬은 비슷한 이름을 알아서 고쳐 주지 않아요."
      - "라이브러리 판에 따라 없는 함수도 있어요. 예: pyautogui에는 enter() 함수가 없고 press('enter')를 써요."
    fix:
      - "{line}번째 줄의 {attr} 철자를 문서나 예제의 정확한 이름과 비교해요. 대문자·소문자도 같아야 해요."
      - "이름을 모르면 print(dir({module}))로 그 모듈이 가진 이름 목록을 볼 수 있어요."
    mistakes:
      - "cv2.destoyAllWindows() → cv2.destroyAllWindows()"
      - "pyautogui.enter() → pyautogui.press('enter')"
      - "cv2.COLOR_BGR2GREY → cv2.COLOR_BGR2GRAY(미국식 철자)"
    example:
      code: |
        import cv2
        cv2.destoyAllWindows()
      error: "AttributeError: module 'cv2' has no attribute 'destoyAllWindows'"
    cases:
      - "교안(opmp) 15번 자세 랜드마크 예제의 마지막 줄 cv2.destoyAllWindows()는 오타예요. ESC로 끝낼 때만 이 오류가 나요. destroyAllWindows로 고쳐요."
      - "PyAutoGUI 수업 슬라이드의 웹 검색 자동화 예제에 있는 pyautogui.enter()는 없는 함수예요. pyautogui.press('enter')로 고쳐요."

  - id: attribute-error
    group: types
    title: 그 값에는 그런 이름의 속성이나 함수가 없어요
    types: [AttributeError]
    patterns:
      - "'(?<kind>[^']+)' object has no attribute '(?<attr>[^']+)'"
      - "^(?<detail>.+)$"
    meaning: "이 값의 종류에는 .{attr} 기능이 없어요. 다른 언어의 이름을 썼거나, 변수에 생각과 다른 종류의 값이 들어 있어요."
    why:
      - "파이썬 목록에 더할 때는 .append(), 글자를 이을 때는 +를 써요. 자바스크립트의 .push()나 .add()는 없어요."
      - "변수에 든 값의 종류가 예상과 다를 수도 있어요. 예: 튜플 (1, 2)에는 .x가 없고 [0]으로 꺼내요."
    fix:
      - "{line}번째 줄의 변수를 print(type(변수))로 찍어 어떤 종류인지 보고, 그 종류가 가진 이름을 써요."
      - "목록: .append(값), .remove(값), len(목록) / 글자: .upper(), .split(), .strip()"
    mistakes:
      - "items.add(1) → items.append(1)"
      - "name.push('d') → name + 'd' 또는 목록이라면 .append"
      - "i2c_lcd 자료판의 setcursor를 move_to로 부르는 것(사이트 배포판은 두 이름 모두 돼요)"
    example:
      code: |
        items = []
        items.add(1)
      error: "AttributeError: 'list' object has no attribute 'add'"
    cases:
      - "교과서 2-1 디스플레이 예제(p128): 자료 폴더의 i2c_lcd.py에는 setcursor만 있고 move_to가 없어 원본 그대로면 이 오류가 나요. 사이트 배포판 i2c_lcd.py는 move_to도 돼요."

  - id: zero-division
    group: types
    title: 0으로 나눴어요
    types: [ZeroDivisionError]
    meaning: "어떤 수를 0으로 나누려 했어요. 수학에서도 0으로는 나눌 수 없어서 파이썬이 멈춰요."
    why:
      - "나누는 수가 변수라면 그 변수가 0이 된 순간 오류가 나요. 개수·시간·픽셀 수를 세는 변수가 아직 0일 때(첫 장면, 아무것도 검출되지 않은 장면)가 많아요."
      - "% (나머지)와 // (몫)도 0으로 나누면 같은 오류예요."
    fix:
      - "{line}번째 줄에서 나누는 수가 0인지 먼저 확인해요: if total > 0: 평균 = 합 / total"
      - "0일 때 대신 쓸 값을 정해요(0이나 None)."
    mistakes:
      - "평균을 낼 때 개수가 0인 첫 번째 반복에서 나누는 것"
      - "fps = 1 / 걸린시간에서 걸린시간이 0.0으로 잡히는 것(시간 차이를 재기 전에 계산)"
    example:
      code: |
        total = 0
        print(10 / total)
      error: "ZeroDivisionError: division by zero"

  - id: recursion-error
    group: types
    title: 함수가 자기 자신을 끝없이 불렀어요
    types: [RecursionError]
    meaning: "함수가 자기 자신을 계속 부르다가 파이썬이 정한 깊이(약 1000번)를 넘었어요."
    why:
      - "자기 자신을 부르는 함수(재귀)는 멈추는 조건이 있어야 해요. 조건이 없거나 조건에 절대 닿지 않으면 끝없이 이어져요."
    fix:
      - "함수 첫머리에 멈추는 조건(if n == 0: return …)이 있는지, 그리고 부를 때마다 그 조건에 가까워지는지(n - 1 등) 확인해요."
      - "반복이 목적이면 재귀 대신 for나 while 반복문을 써요."
    mistakes:
      - "함수 이름을 변수 이름과 같게 지어 자기 자신을 부르게 되는 것"
    example:
      code: |
        def f(n):
            return f(n + 1)
        f(0)
      error: "RecursionError: maximum recursion depth exceeded"
      line: 2

  - id: assertion-error
    group: types
    title: "assert로 확인한 조건이 거짓이었어요"
    types: [AssertionError]
    patterns:
      - "^(?<note>.+)$"
    meaning: "assert 조건, 메시지 줄의 조건이 거짓이라 코드가 스스로 멈췄어요. 메시지: {note}"
    why:
      - "assert는 '이건 꼭 참이어야 해'라고 코드 안에 적어 둔 확인이에요. 라이브러리 안의 assert가 실패하면 넘긴 값이 그 함수의 전제와 맞지 않는다는 뜻이에요."
    fix:
      - "{line}번째 줄의 조건이 왜 거짓인지 그 앞에서 값을 print로 찍어 봐요."
      - "라이브러리 안에서 났다면 내 코드에서 넘긴 값(이미지 크기·채널·숫자 범위)을 확인해요."
    example:
      code: |
        assert 1 == 2, '값이 달라요'
      error: "AssertionError: 값이 달라요"

  - id: stop-iteration
    group: types
    title: 더 꺼낼 것이 없는데 next()를 불렀어요
    types: [StopIteration, RuntimeError]
    patterns:
      - "StopIteration"
    priority: 1
    meaning: "반복자(iterator)에서 next()로 값을 꺼내는데 남은 값이 없어요. 파이썬은 이것을 StopIteration으로 알려요."
    why:
      - "for 반복문은 이 신호를 받아 알아서 멈추지만, 직접 next()를 부르면 신호가 오류로 올라와요."
    fix:
      - "next(it, 기본값)처럼 두 번째 값을 주면 남은 것이 없을 때 기본값을 돌려줘요."
      - "값을 하나씩 꺼낼 필요가 없으면 for 값 in 목록: 반복문을 써요."
    example:
      code: |
        it = iter([])
        next(it)
      error: "RuntimeError: coroutine raised StopIteration"

  # ── 영상 처리(OpenCV) ──
  - id: cv2-empty-image
    group: vision
    title: "OpenCV에 빈 이미지(None)가 들어갔어요 — 카메라 프레임이나 파일을 읽지 못했어요"
    types: [error, cv2.error]
    patterns:
      - "!_src\\.empty\\(\\) in function '(?<func>[^']+)'"
      - "!ssize\\.empty\\(\\) in function '(?<func>[^']+)'"
      - "!src\\.empty\\(\\) in function '(?<func>[^']+)'"
      - "\\.empty\\(\\) in function '(?<func>[^']+)'"
      - "Assertion failed\\) .*empty\\(\\)"
    priority: 3
    meaning: "cv2.{func}에 넘긴 이미지가 비어 있어요(None). 앞 단계에서 이미지를 만들지 못한 거예요."
    why:
      - "OpenCV의 '(-215:Assertion failed) !_src.empty()'는 '입력 이미지가 비어 있지 않아야 한다'는 확인이 실패했다는 뜻이에요."
      - "가장 흔한 원인 두 가지: ① ok, frame = cap.read()가 실패해 frame이 None인데 그대로 cvtColor에 넘김 ② cv2.imread('파일')이 파일을 못 찾아 None을 돌려줌."
      - "이 실습실에서 cap.read()는 입력 소스(웹캠·샘플 입력)를 열지 못했을 때만 (False, None)을 돌려줘요."
    fix:
      - "cap.read() 뒤에 꼭 확인해요: ok, frame = cap.read() / if not ok: break (또는 continue)"
      - "cv2.imread를 썼다면 파일 이름이 맞는지, 이 실습실의 가상 폴더에 그 파일이 있는지 확인해요. 결과가 None인지 print로 봐요."
      - "화면의 입력 칸에서 입력 소스가 열려 있는지(웹캠이 허용됐는지, 아니면 샘플 입력을 골랐는지) 보고 다시 [실행]해요."
    mistakes:
      - "ret 값을 확인하지 않고 바로 gray = cv2.cvtColor(frame, …)를 쓰는 것"
      - "다른 컴퓨터의 경로(C:/…)로 imread를 부르는 것"
    example:
      code: |
        import cv2
        cap = cv2.VideoCapture(0)
        ret, frame = cap.read()
        gray = cv2.cvtColor(frame, cv2.COLOR_BGR2GRAY)
      error: "cv2.error: OpenCV(4.11.0) …/color.cpp:199: error: (-215:Assertion failed) !_src.empty() in function 'cvtColor'"
    cases:
      - "교과서 1-2-1 기본 실습(p28)은 카메라를 열지 못하면 exit()로 끝내요. 확인 없이 frame을 바로 쓰는 예제(1-3-1 기본 실습 등)는 첫 장을 못 읽으면 이 오류가 나요."
      - "1-3-2 심화(그림 합성): mask.png가 없으면 imread 결과 None이 다음 함수로 들어가 이 오류가 나요."

  - id: cv2-channels
    group: vision
    title: "색 채널 수가 맞지 않아요 — 회색 이미지와 색 이미지를 섞었어요"
    types: [error, cv2.error]
    patterns:
      - "Bad number of channels"
      - "Invalid number of channels in input image"
      - "'scn' is (?<scn>\\d+)"
      - "Sizes of input arguments do not match"
      - "support only CV_8UC1 images"
      - "same size and the same number of channels"
      - "same size and type"
    priority: 3
    meaning: "함수가 기대하는 색 채널 수(회색 1개, 색 3개)와 넘긴 이미지의 채널 수가 달라요. 또는 두 이미지의 크기·채널이 서로 달라요."
    why:
      - "색 이미지(BGR)는 픽셀마다 파랑·초록·빨강 3개 값(채널 3), 회색 이미지는 밝기 1개(채널 1)예요. img.shape가 (높이, 너비, 3)이면 색, (높이, 너비)이면 회색이에요."
      - "cv2.cvtColor(gray, cv2.COLOR_BGR2GRAY)처럼 이미 회색인 이미지를 다시 회색으로 바꾸려 하면 'Invalid number of channels … scn is 1'이 나요."
      - "cv2.add·bitwise_and·addWeighted는 두 이미지의 크기와 채널이 같아야 해요. 색 이미지와 회색 마스크를 바로 합치면 'Sizes of input arguments do not match'가 나요."
      - "cv2.findContours는 회색(1채널) 이미지만 받아요('support only CV_8UC1 images')."
    fix:
      - "{line}번째 줄 앞에서 print(img.shape)로 채널 수를 확인해요."
      - "회색이 필요한 함수(findContours, Canny 뒤처리 등)에는 gray = cv2.cvtColor(img, cv2.COLOR_BGR2GRAY)로 바꿔 넘겨요."
      - "회색 마스크를 색 이미지와 합칠 때는 채널을 맞춰요: cv2.cvtColor(mask, cv2.COLOR_GRAY2BGR) 또는 cv2.bitwise_and(img, img, mask=mask)"
      - "크기가 다르면 cv2.resize(b, (a.shape[1], a.shape[0]))로 맞춰요."
    mistakes:
      - "이미 회색으로 바꾼 변수에 다시 COLOR_BGR2GRAY를 쓰는 것"
      - "threshold 결과(회색)와 원본(색)을 cv2.add로 바로 더하는 것"
    example:
      code: |
        import cv2
        import numpy as np
        gray = np.zeros((10, 10), np.uint8)
        g2 = cv2.cvtColor(gray, cv2.COLOR_BGR2GRAY)
      error: "cv2.error: … (-15:Bad number of channels) … Invalid number of channels in input image: 'VScn::contains(scn)' where 'scn' is 1"
    cases:
      - "1-2-4·1-3 예제에서 회색으로 바꾼 뒤 다시 색 변환을 하거나, 마스크(회색)와 프레임(색)을 합칠 때 나요."

  - id: cv2-bad-argument
    group: vision
    title: "OpenCV 함수에 넘긴 값의 종류가 달라요 — 좌표·두께는 정수여야 해요"
    types: [error, cv2.error]
    patterns:
      - "\\(-5:Bad argument\\) in function '(?<func>[^']+)'"
      - "Overload resolution failed"
      - "Can't parse '(?<arg>[^']+)'"
      - "Argument '(?<arg>[^']+)' is required to be an integer"
    priority: 2
    meaning: "cv2.{func}에 넘긴 값 가운데 종류가 맞지 않는 것이 있어요. 좌표·크기·두께는 정수(int)여야 하고, 색은 (파랑, 초록, 빨강) 세 숫자예요."
    why:
      - "손·얼굴 점의 좌표(x, y)는 0~1 사이의 소수라서 이미지 크기를 곱하면 3.7처럼 소수가 돼요. cv2.circle·rectangle·putText는 픽셀 위치를 정수로만 받아요."
      - "'Overload resolution failed'는 '이 값 조합으로 부를 수 있는 함수 모양이 없다'는 뜻이에요. 아래에 어떤 인자가 문제인지 적혀 있어요."
    fix:
      - "좌표·크기를 정수로 바꿔 넘겨요: cv2.circle(img, (int(x), int(y)), 5, (0, 255, 0), -1)"
      - "두께(thickness), 반지름, 글자 크기 자리에 소수가 들어가지 않았는지 봐요."
      - "색은 (0, 0, 255)처럼 숫자 3개 튜플이고, cv2.rectangle의 두 점은 (x1, y1), (x2, y2) 순서예요."
    mistakes:
      - "landmark.x * w를 int()로 감싸지 않고 좌표로 쓰는 것"
      - "cv2.rectangle(img, (0, 0), (5, 5), (0, 0, 255), 2.5)처럼 두께에 소수를 넣는 것"
    example:
      code: |
        import cv2
        import numpy as np
        img = np.zeros((10, 10, 3), np.uint8)
        x = 3.7
        cv2.circle(img, (x, 4), 2, (255, 0, 0), -1)
      error: "cv2.error: OpenCV(4.11.0) :-1: error: (-5:Bad argument) in function 'circle' > Overload resolution failed: > - Can't parse 'center'. Sequence item with index 0 has a wrong type"
    cases:
      - "1-2-2 손가락 위치 그리기(p36)·1-3 얼굴 점 찍기·4-1-1 눈코 특징점처럼 랜드마크 좌표를 픽셀로 바꿔 그리는 예제는 int()를 빼먹으면 이 오류가 나요."

  - id: cv2-kernel-odd
    group: vision
    title: 흐리게 하는 크기(커널)는 홀수여야 해요
    types: [error, cv2.error]
    patterns:
      - "ksize\\.width > 0 && ksize\\.width % 2 == 1"
      - "ksize\\.height > 0 && ksize\\.height % 2 == 1"
      - "createGaussianKernels"
    priority: 3
    meaning: "cv2.GaussianBlur의 크기(ksize)에 짝수나 0이 들어갔어요. 3, 5, 7…처럼 양의 홀수만 돼요."
    why:
      - "흐리게 하기는 한 픽셀을 가운데 두고 주변을 평균 내요. 가운데가 있으려면 가로·세로 칸 수가 홀수여야 해요."
    fix:
      - "blur_size를 1, 3, 5, 7…처럼 홀수로 바꿔요. 슬라이더로 조절한다면 # @slider 1 31 2처럼 간격을 2로 두면 홀수만 나와요."
      - "계산으로 만든 값이면 k = k // 2 * 2 + 1로 홀수로 맞춰요."
    mistakes:
      - "(4, 4)나 (0, 0)을 ksize로 넘기는 것"
    example:
      code: |
        import cv2
        import numpy as np
        img = np.zeros((10, 10, 3), np.uint8)
        b = cv2.GaussianBlur(img, (4, 4), 0)
      error: "cv2.error: … (-215:Assertion failed) ksize.width > 0 && ksize.width % 2 == 1 && … in function 'createGaussianKernels'"

  - id: cv2-error
    group: vision
    title: OpenCV가 오류를 냈어요
    types: [error, cv2.error]
    meaning: "cv2 함수가 처리할 수 없는 값을 받았어요. 메시지의 'error: (' 뒤와 'in function' 뒤를 읽으면 어떤 확인이 어느 함수에서 실패했는지 알 수 있어요."
    why:
      - "OpenCV 오류 메시지는 길지만 구조가 같아요. 예: (-215:Assertion failed) 확인식 in function '함수'. 확인식에 empty가 있으면 빈 이미지, channels가 있으면 채널 수, size가 있으면 크기 문제예요."
      - "이 사이트가 만든 창·카메라 함수(cv2.imshow·VideoCapture)의 오류는 한국어로 적혀 있어요: {message}"
    fix:
      - "{line}번째 줄의 함수에 넘긴 이미지가 None이 아닌지, shape(크기·채널)가 함수가 원하는 모양인지 print로 확인해요."
      - "메시지의 함수 이름(in function '…')으로 OpenCV 문서를 찾아 인자 순서와 종류를 맞춰요."
    mistakes:
      - "cv2.imshow('창', None)처럼 이미지 대신 None이나 목록을 넘기는 것"
      - "이미지 모양이 (높이, 너비) 또는 (높이, 너비, 3·4)가 아닌 배열을 보여 주려는 것"
    example:
      code: |
        import cv2
        cv2.imshow('창', None)
      error: "cv2.error: cv2.imshow('창', …): 두 번째 인자는 numpy 배열(이미지)이어야 해요. 받은 것: NoneType"

  - id: camera-frame-missing
    group: vision
    title: 카메라가 프레임을 주지 않았어요
    types: [AttributeError]
    patterns:
      - "'JsNull' object has no attribute"
    traceback_patterns:
      - "apc_cv2\\.py"
    priority: 5
    meaning: "cap.read()가 화면에서 프레임을 받지 못했어요. 입력 소스(웹캠·샘플 입력)가 닫혀 있거나 아직 열리지 않았어요."
    why:
      - "이 실습실에서 카메라 영상은 브라우저 화면이 만들어 파이썬에 넘겨요. 입력 소스가 닫힌 채 cap.read()를 부르면 빈 답이 와서 이 오류가 나요."
    fix:
      - "화면의 입력 칸에서 입력 소스를 고르고([입력 켜기]) 다시 [실행]해요. 웹캠을 허용하지 않았다면 샘플 입력을 골라도 실습은 똑같이 돼요."
      - "코드에서는 cap.isOpened()가 참인지 확인한 뒤 읽고, ok가 거짓이면 break로 끝내요."
    example:
      code: |
        import cv2
        cap = cv2.VideoCapture(0)
        ok, frame = cap.read()
      error: "AttributeError: 'JsNull' object has no attribute 'width'"

  # ── 모듈·파일 ──
  - id: module-not-found-site
    group: modules
    title: "이 모듈은 PC 프로그램용이에요 — 사이트에서는 흉내 모듈이 대신해요"
    types: [ModuleNotFoundError]
    patterns:
      - "No module named '(?<module>pyautogui|mediapipe|speech_recognition|pyaudio|serial|bluetooth|bluetooth_lib|bleak|machine|neopixel|dht|ESP32BLE|esp32_ble_util)'"
    priority: 3
    meaning: "{module} 모듈은 PC나 보드에 설치하는 프로그램이라 브라우저 파이썬에는 원래 없어요. 이 사이트는 실습실마다 그 모듈을 흉내 내는 사이트 모듈을 붙여요."
    why:
      - "pyautogui(마우스·키보드 조작), mediapipe(손·얼굴 인식), speech_recognition(음성 인식), serial·bluetooth(보드 통신), machine(보드 핀)은 브라우저 안에서는 그대로 돌 수 없어요. 그래서 실습실 화면이 대신 일하고 파이썬에는 같은 이름의 흉내 모듈을 줘요."
      - "지금 연 실습실 페이지에 그 흉내 모듈이 붙어 있지 않으면(또는 아직 준비 중이면) 이 오류가 나요."
    fix:
      - "이 모듈을 쓰는 예제는 그 모듈이 붙은 실습실에서 열어요: 손·얼굴·자세(mediapipe)와 가상 데스크톱(pyautogui)은 영상처리 실습실, 보드(machine·serial·bluetooth)는 ESP32·통신 실습실."
      - "그 실습실에서도 같은 오류가 나면 아직 준비 중인 모듈이에요. 실습실 안내나 문제 해결 페이지를 확인해요."
      - "진짜 PC에서 돌리려면 [.py 내려받기]로 코드를 받아 pip install {module}로 설치한 뒤 실행해요."
    example:
      code: |
        import pyautogui
      error: "ModuleNotFoundError: No module named 'pyautogui'"
    cases:
      - "3-1-4 심화(p205, 손가락으로 마우스 커서 조종)·PyAutoGUI 슬라이드 예제는 pyautogui를, 1단원 손·얼굴 예제는 mediapipe를 써요. 사이트의 흉내 모듈이 있는 실습실에서 열어요."

  - id: module-not-found
    group: modules
    title: 그런 이름의 모듈이 없어요(오타이거나 설치되지 않았어요)
    types: [ModuleNotFoundError]
    patterns:
      - "No module named '(?<module>[^']+)'"
    priority: 1
    meaning: "import {module}에서 {module:이/가} 무엇인지 파이썬이 몰라요. 이름을 잘못 쳤거나, 이 파이썬에 없는 모듈이에요."
    why:
      - "모듈 이름은 정확해야 해요. OpenCV는 cv2, numpy는 numpy(보통 import numpy as np)예요."
      - "브라우저 파이썬(Pyodide)에는 numpy·opencv-python·Pillow 같은 자주 쓰는 패키지가 있고, import 문을 보고 자동으로 받아요. 목록에 없는 패키지는 받을 수 없어요."
      - "내가 만든 파일(예: servo_library.py)을 import하려면 그 파일이 같은 폴더에 있어야 해요. 보드용 라이브러리는 실습실이 미리 넣어 주는 것만 돼요."
    fix:
      - "{line}번째 줄의 모듈 이름 철자를 확인해요. 예: import cv3 → import cv2"
      - "패키지가 필요한 코드면 그 패키지가 브라우저 파이썬에 있는지 실습실 안내를 봐요. 없으면 [.py 내려받기]로 받아 PC 파이썬에서 pip install로 설치해 돌려요."
      - "자료의 라이브러리 파일(ssd1306, servo_library 등)은 ESP32 실습실의 사이트 배포판을 써요."
    mistakes:
      - "import opencv → import cv2"
      - "import Numpy → import numpy (대문자·소문자 구별)"
      - "pip install 이름과 import 이름이 다른 패키지(opencv-python → cv2, Pillow → PIL)"
    example:
      code: |
        import cv3
      error: "ModuleNotFoundError: No module named 'cv3'"
    cases:
      - "교과서 2-1 심화(p137)의 ssd1306, 2-2 서보 예제(p175)의 servo_library는 자료 폴더에 파일이 없어요. 원본 그대로면 이 오류가 나고, 사이트는 원고대로 복원한 라이브러리를 ESP32 실습실에 넣어 줘요."

  - id: import-error
    group: modules
    title: 모듈은 있는데 그 안에서 가져올 이름이 없어요
    types: [ImportError]
    patterns:
      - "cannot import name '(?<name>[^']+)' from '(?<module>[^']+)'"
    priority: 1
    meaning: "{module} 모듈은 찾았지만 그 안에 {name} 이름이 없어요. 잘못 쳤거나 그 판에는 없는 이름이에요."
    why:
      - "from 모듈 import 이름은 모듈 안의 특정 이름만 가져와요. 함수·클래스 이름이 판에 따라 바뀌었거나 오타일 때 나요."
    fix:
      - "{line}번째 줄의 {name} 철자를 문서·예제와 비교해요."
      - "import {module} 뒤에 print(dir({module}))로 가져올 수 있는 이름 목록을 봐요."
    example:
      code: |
        from cv2 import imread2
      error: "ImportError: cannot import name 'imread2' from 'cv2' (…/cv2/__init__.py)"

  - id: file-not-found
    group: modules
    title: 그런 파일이 없어요
    types: [FileNotFoundError]
    patterns:
      - "No such file or directory: '(?<path>[^']+)'"
      - "No such file or directory"
    priority: 1
    meaning: "'{path}' 파일을 찾지 못했어요. 브라우저 파이썬에는 내 컴퓨터의 파일이 없고, 실습실이 넣어 준 가상 폴더의 파일만 있어요."
    why:
      - "이 실습실의 파이썬은 브라우저 안의 작은 가상 폴더에서 돌아요. 내 PC의 바탕화면이나 C:/ 경로는 보이지 않아요."
      - "[Errno 44]는 브라우저 파이썬이 쓰는 '파일 없음' 번호예요(PC의 파이썬은 [Errno 2]로 나와요). 뜻은 같아요."
    fix:
      - "파일 이름과 확장자(mask.png처럼)를 정확히 쓰고, 예제가 쓰는 파일은 실습실이 가상 폴더에 미리 넣어 주는 것을 그대로 써요."
      - "내 그림 파일을 쓰려면 실습실 입력 칸의 '내 그림 파일'로 넣어요(브라우저 안에서만 쓰이고 밖으로 나가지 않아요)."
      - "결과 파일을 저장하는 코드(cv2.imwrite, 스크린숏 저장)는 가상 폴더에 저장돼요. [내려받기] 기능이 있는 실습실에서 받아요."
    mistakes:
      - "open('C:/Users/…/사진.jpg')처럼 PC 경로를 쓰는 것"
      - "파일 이름의 대문자·소문자·확장자가 다른 것(Mask.PNG ≠ mask.png)"
    example:
      code: |
        with open('mask.png', 'rb') as f:
            data = f.read()
      error: "FileNotFoundError: [Errno 44] No such file or directory: 'mask.png'"
      line: 1
    cases:
      - "1-3-2 심화의 mask.png, PyAutoGUI 예제의 스크린숏 저장, 1-4-2 심화(p99)의 Windows 글꼴 경로(C:/Windows/Fonts/malgun.ttf)는 모두 가상 폴더에서 다뤄요. 글꼴은 사이트 글꼴로 연결돼요."

  - id: os-error-font
    group: modules
    title: 글꼴 파일을 열 수 없어요
    types: [OSError]
    patterns:
      - "cannot open resource"
    priority: 2
    meaning: "PIL의 ImageFont.truetype이 글꼴 파일을 찾지 못했어요. 브라우저 파이썬에는 Windows 글꼴 폴더가 없어요."
    why:
      - "C:/Windows/Fonts/malgun.ttf 같은 경로는 PC에만 있어요. 이 실습실은 Windows 글꼴 경로를 사이트가 함께 둔 한글 글꼴로 바꿔 연결해 줘요(연결되지 않은 경로만 이 오류가 나요)."
    fix:
      - "글꼴 경로를 예제와 같게 써요(C:/Windows/Fonts/malgun.ttf처럼 잘 알려진 Windows 글꼴 경로는 사이트 글꼴로 연결돼요)."
      - "한글이 필요 없으면 ImageFont.load_default()를 써요."
    example:
      code: |
        from PIL import ImageFont
        font = ImageFont.truetype('없는글꼴.ttf', 30)
      error: "OSError: cannot open resource"
    cases:
      - "교과서 1-4-2 심화(p99, 한글 글자 그리기)의 malgun.ttf 경로는 사이트가 한글 글꼴로 연결해요. 다른 경로를 쓰면 이 오류가 나요."

  # ── ESP32 보드(가상 보드, P3-01) — 문구는 MicroPython v1.29.0 ESP32 포트와 같다(ports/esp32/machine_pin.c·machine_timer.c, extmod/modtime.c) ──
  - id: board-invalid-pin
    group: board
    title: ESP32에 없는 핀 번호예요
    types: [ValueError]
    patterns:
      - "(?:^|: )invalid pin$"
    priority: 3
    meaning: "Pin()에 넣은 번호의 핀이 ESP32에 없어요. invalid pin은 '올바르지 않은 핀'이라는 뜻이에요."
    why:
      - "ESP32에서 쓸 수 있는 GPIO 번호는 0~23, 25~27, 32~39예요. 24번, 28~31번, 40번 넘는 번호는 없어요."
      - "Pin('D2')처럼 글자나 Pin(2.0)처럼 소수로 적어도 이 오류가 나요. 번호는 정수로 적어요."
    fix:
      - "{line}번째 줄의 핀 번호를 보드에 적힌 GPIO 번호와 비교해요. 보드의 'D2'는 Pin(2)예요."
      - "예제의 배선 그림에 적힌 핀 번호와 코드의 번호가 같은지 확인해요."
    mistakes:
      - "Pin(24, Pin.OUT)처럼 없는 번호를 쓰는 것"
      - "Pin('2')처럼 번호를 따옴표로 감싸는 것"
    example:
      code: |
        from machine import Pin
        led = Pin(24, Pin.OUT)
      error: "ValueError: invalid pin"
      line: 2

  - id: board-input-only-pin
    group: board
    title: 34~39번 핀은 입력만 돼요
    types: [ValueError]
    patterns:
      - "(?:^|: )pin can only be input$"
    priority: 3
    meaning: "34~39번 핀을 출력(Pin.OUT)으로 정하려고 했어요. 이 핀들은 값을 읽기만 하고 내보낼 수 없어요."
    why:
      - "ESP32의 34~39번 핀은 입력 전용으로 만들어져서 LED·버저처럼 전기를 보내야 하는 부품을 움직일 수 없어요. 보드 안의 풀업·풀다운 저항도 없어요."
    fix:
      - "LED 같은 출력 부품은 0~33번 가운데 비어 있는 핀(예: 2, 4, 5, 18, 19, 21, 22, 23, 25, 26, 27, 32, 33)에 이어요."
      - "34~39번 핀은 버튼·센서 값을 읽는 Pin(34, Pin.IN)이나 아날로그 값을 읽는 데 써요."
    example:
      code: |
        from machine import Pin
        led = Pin(34, Pin.OUT)
      error: "ValueError: pin can only be input"
      line: 2

  - id: board-timer-id
    group: board
    title: 그 번호의 하드웨어 타이머가 없어요
    types: [ValueError]
    patterns:
      - "Timer\\((?<id>-?\\d+)\\) doesn't exist"
    priority: 3
    meaning: "Timer({id})를 만들려고 했지만 ESP32의 하드웨어 타이머는 0~3번, 네 개뿐이에요."
    why:
      - "ESP32 보드에는 하드웨어 타이머가 4개 있어요. 번호는 0부터 세므로 4 이상은 없어요."
    fix:
      - "{line}번째 줄의 번호를 0~3 가운데 하나로 바꿔요. 이미 쓰는 번호와 겹치지 않게 해요."
      - "번호를 적지 않은 Timer()나 Timer(-1)은 가상 타이머라 개수 걱정 없이 쓸 수 있어요."
    example:
      code: |
        from machine import Timer
        t = Timer(4)
      error: "ValueError: Timer(4) doesn't exist, there are only 4 hardware timers"
      line: 2

  - id: board-timer-period
    group: board
    title: 타이머 간격이 0이에요
    types: [ValueError]
    patterns:
      - "Timer period is too short for this timer"
    priority: 3
    meaning: "timer.init()의 period(밀리초)가 0이거나 freq(1초에 몇 번)가 너무 커서 타이머가 울릴 간격이 없어요."
    fix:
      - "{line}번째 줄의 period를 1 이상으로 적어요. 예: timer.init(period=500, mode=Timer.PERIODIC, callback=blink)"
      - "freq로 적었다면 0보다 크고 너무 크지 않은 값(예: freq=2)으로 바꿔요."
    example:
      code: |
        from machine import Timer
        Timer(0).init(period=0, callback=print)
      error: "ValueError: Timer period is too short for this timer"
      line: 2

  - id: board-ticks-overflow
    group: board
    title: ticks_add에 더한 값이 너무 커요
    types: [OverflowError]
    patterns:
      - "ticks interval overflow"
    priority: 3
    meaning: "time.ticks_add(시각, 차이)의 차이가 너무 커서(약 ±6.2일 넘게) ticks 값으로 나타낼 수 없어요."
    why:
      - "ticks_ms() 값은 약 12.4일마다 0으로 돌아가요. 그래서 한 번에 더하거나 뺄 수 있는 차이는 그 절반보다 작아야 해요."
    fix:
      - "{line}번째 줄에서 더하는 값을 줄여요. 긴 시간을 재려면 time.time()(초)을 써요."
    example:
      code: |
        import time
        later = time.ticks_add(time.ticks_ms(), 2**29)
      error: "OverflowError: ticks interval overflow"
      line: 2

  - id: board-not-emulated
    group: board
    title: 가상 보드에 아직 없는 기능이에요
    types: [ImportError, ModuleNotFoundError]
    patterns:
      - "가상 보드에 아직 없어요"
      - "가상 보드의 블루투스는 아직"
    priority: 4
    meaning: "실물 ESP32에는 있지만 이 사이트의 가상 보드가 아직 흉내 내지 않는 기능을 썼어요."
    why:
      - "가상 보드는 교과서 차시에 나오는 부품부터 차례로 흉내를 더하고 있어요. PWM(밝기·소리·서보), ADC(아날로그 값), I2C 화면, UART, 블루투스는 이어서 더해져요."
    fix:
      - "오류 메시지에 적힌 이름을 확인하고, 지금은 그 줄을 빼고 나머지를 먼저 실습해요."
      - "실물 ESP32 보드가 있으면 같은 코드를 실물 보드에서 확인할 수 있어요."
    example:
      code: |
        from machine import Pin, PWM
      error: "ImportError: machine.PWM은(는) 가상 보드에 아직 없어요(실물 ESP32에는 있어요). 가상 보드에 부품을 더하는 다음 단계에서 들어와요."

  # ── ESP32 보드 — Phase 3 병렬 제작 자리(2026-09-17 준비, src/lab/README.md 5.1·7.9) ──
  # 구역들은 이 파일을 직접 고치지 않고 보고서의 "공유 파일 변경 요청"에 항목을 적어 보내요(모양은 README 7.9의 6번).
  # 통합할 때 아래 구역 표시 바로 밑에 순서대로 넣어요. 모두 group: board(실물 MicroPython과 가상 보드가 같은 문구를 내므로 한 묶음).
  # 실제 보드 연결·굽기처럼 파이썬 트레이스백이 아닌 안내(포트 선택 창·드라이버·케이블)가 묶음 하나로 필요하면 첫 항목과 함께 새 묶음을 요청해요
  # (묶음은 항목이 하나 이상이어야 사전 검사를 통과해요 — tests/unit/errors/catalog.test.ts).
  # ▼ 구역 A(P3-03 PWM·ADC 부품 — duty·freq 범위, ADC 감쇠·핀, 서보·팬) 항목 자리
  # ▼ 구역 B(P3-04 I2C 표시 장치 — I2C 장치 없음 ENODEV, LCD·OLED, RTC) 항목 자리
  # ▼ 구역 C(P3-05 네오픽셀·UART·MP3 — 네오픽셀 색 값·개수, UART 번호·핀, MP3 프레임) 항목 자리
  # ▼ 구역 E(P3-07·P3-08 실제 보드 — 보드에서 온 트레이스백: 메모리 부족·파일 없음 등) 항목 자리
  # ▼ 구역 F(P3-09·P3-10 펌웨어 굽기·보드 준비) 항목 자리

  # ── 실습실 안내 ──
  - id: keyboard-interrupt
    group: lab
    title: "[정지] 버튼으로 멈췄어요 — 오류가 아니에요"
    types: [KeyboardInterrupt, StopRequested]
    meaning: "코드가 기다리는 곳(time.sleep, input, 카메라 읽기, cv2.waitKey)에서 [정지] 신호를 받아 멈췄어요. PC에서 Ctrl+C를 누른 것과 같아요."
    why:
      - "파이썬은 멈추라는 신호를 KeyboardInterrupt라는 이름으로 알려요. 코드를 고칠 필요는 없어요."
      - "코드가 직접 raise KeyboardInterrupt를 했거나 except 없이 Ctrl+C 처리를 흉내 냈을 때도 같은 이름이 보여요."
    fix:
      - "다시 시작하려면 [실행]을 눌러요. 카메라와 출력 창은 그대로 남아 있어요."
      - "정지 뒤에 정리할 일(cap.release() 등)이 있으면 try/finally로 감싸요."
    example:
      code: |
        import time
        while True:
            print('돌고 있어요')
            time.sleep(0.5)
      error: "[정지]를 눌러 멈췄어요(KeyboardInterrupt)."

  - id: forced-restart
    group: lab
    title: "1초 안에 멈추지 않아서 파이썬을 다시 시작했어요"
    types: [ForcedRestart]
    meaning: "[정지]를 눌렀지만 코드가 기다리는 곳 없이 계산만 계속해서, 실습실이 파이썬을 통째로 끝내고 다시 띄웠어요."
    why:
      - "[정지] 신호는 코드가 기다리는 곳(time.sleep, cv2.waitKey, cap.read, input)에서만 전달돼요. while True: pass처럼 쉬지 않고 계산만 하는 반복문은 신호를 받을 틈이 없어요."
      - "그래서 실습실은 1초를 기다린 뒤 파이썬을 강제로 끝내요. 그동안 만든 변수와 창은 사라지고, 패키지를 다시 준비해요(보통 몇 초)."
    fix:
      - "반복문 안에 쉬는 곳을 넣어요: time.sleep(0.01) 또는 cv2.waitKey(1). 카메라 반복문은 cap.read()가 그 역할을 해요."
      - "반복 횟수를 정하거나(for i in range(…)) 끝나는 조건을 넣어 무한 반복이 되지 않게 해요."
      - "다시 준비되면(상태 표시가 '준비됐어요') [실행]을 다시 눌러요."
    mistakes:
      - "while True: 안에서 계산만 하고 sleep·waitKey를 빼는 것"
      - "매우 큰 범위의 for 반복(수억 번)을 도는 것"
    example:
      code: |
        while True:
            pass
      error: "1초 안에 멈추지 않아서 파이썬을 다시 시작했어요. 잠깐 뒤에 다시 실행할 수 있어요."

  - id: limited-mode
    group: lab
    title: "이 브라우저는 기다리는 코드를 실행할 수 없어요(제한 모드)"
    types: [RuntimeError]
    patterns:
      - "JSPI"
    priority: 3
    meaning: "input(), 카메라 읽기, cv2.waitKey(0)처럼 답을 기다리는 함수를 썼는데, 이 브라우저에는 파이썬이 기다릴 수 있게 하는 기능(JSPI)이 없어요."
    why:
      - "브라우저 안 파이썬이 화면의 답을 기다리려면 JSPI라는 기능이 필요해요. 컴퓨터용 Chrome·Edge 최신판에는 있고, 휴대폰·태블릿·Safari·옛 브라우저에는 없어요."
      - "제한 모드에서는 한 번 실행되고 끝나는 코드는 돌지만, 기다리는 코드는 이 오류로 알려요."
    fix:
      - "컴퓨터의 Chrome이나 Edge 최신판에서 이 페이지를 열어요."
      - "지금 브라우저에서 계속하려면 input()·카메라·waitKey(0)를 쓰지 않는 코드로 바꿔요(샘플 입력 한 장은 실행 전에 넣어 둘 수 있어요)."
    example:
      code: |
        name = input('이름: ')
      error: "RuntimeError: 이 브라우저에는 JSPI(파이썬 기다리기 기능)가 없어서 입력이나 카메라를 기다리는 코드는 실행할 수 없어요."

  - id: js-exception
    group: lab
    title: 화면이 파이썬의 부탁을 처리하지 못했어요
    types: [JsException]
    patterns:
      - "Error: (?<reason>[^\\n]+)$"
      - "^(?<reason>.+)$"
    meaning: "파이썬이 화면에 무언가를 부탁했는데(카메라·창·모듈 요청) 화면 쪽에서 실패했어요. 이유: {reason}"
    why:
      - "이 실습실에서 카메라·창·마우스 같은 일은 브라우저 화면이 대신해요. 그 실습실 페이지에 그 일을 맡는 모듈이 없거나, 처리 중 오류가 나면 파이썬에 이 예외로 전해져요."
    fix:
      - "메시지의 이유를 읽어요. 처리기가 없다는 내용이면 그 기능이 있는 실습실 페이지에서 열어요."
      - "계속 나면 페이지를 새로고침하고 다시 [실행]해요. 그래도 같으면 문제 알리기에 이 메시지를 붙여 주세요."
    example:
      code: |
        import apc_runtime
        apc_runtime.request('nobody.home', {})
      error: "pyodide.ffi.JsException: PythonError: pyodide.ffi.JsException: Error: 화면이 \"nobody.home\" 요청을 처리하지 못해요."

  - id: package-load-error
    group: lab
    title: 필요한 파이썬 패키지를 받지 못했어요
    types: [PackageLoadError]
    meaning: "코드에 import한 패키지(numpy, opencv-python 등)를 인터넷에서 받지 못해 실행을 시작하지 못했어요."
    why:
      - "브라우저 파이썬은 패키지를 처음 쓸 때 배포 서버(cdn.jsdelivr.net)에서 받아요. 인터넷이 끊겼거나 학교 네트워크가 그 주소를 막으면 받을 수 없어요."
    fix:
      - "인터넷 연결을 확인하고 다시 [실행]해요."
      - "계속 안 되면 시작하기의 점검 페이지에서 네트워크 항목을 확인하고, 학교라면 전산 담당 선생님께 cdn.jsdelivr.net 접속 허용을 부탁해요."
    example:
      code: |
        import cv2
      error: "PackageLoadError: 필요한 파이썬 패키지를 받지 못했어요"

  - id: runtime-not-ready
    group: lab
    title: 파이썬이 아직 준비되지 않았거나 다른 코드가 실행 중이에요
    types: [RuntimeNotReady, RuntimeBusy]
    meaning: "파이썬 엔진이 아직 준비 중이거나, 앞의 코드가 끝나지 않아 새 실행을 시작하지 못했어요."
    fix:
      - "상태 표시가 '준비됐어요'로 바뀐 뒤 [실행]을 눌러요."
      - "앞의 코드가 돌고 있으면 [정지]로 끝내고 다시 [실행]해요."
    example:
      code: |
        print('안녕')
      error: "RuntimeNotReady: 파이썬이 아직 준비되지 않았어요."

  - id: eof-error
    group: lab
    title: 입력이 취소되었어요
    types: [EOFError]
    meaning: "input()이 글자를 기다리는 동안 입력줄이 닫혔어요."
    fix:
      - "다시 [실행]하고 입력줄에 글자를 쓴 뒤 Enter(또는 [입력])를 눌러요."
    example:
      code: |
        name = input('이름: ')
      error: "EOFError: 입력이 취소되었어요."

  - id: failsafe
    group: lab
    title: "가상 마우스가 화면 모서리에 닿아 안전장치가 작동했어요"
    types: [FailSafeException]
    patterns:
      - "fail-safe"
    priority: 2
    meaning: "pyautogui는 마우스가 화면 모서리(0, 0)에 닿으면 코드를 멈춰요. 프로그램이 마우스를 마구 움직일 때 사람이 멈출 수 있게 둔 안전장치예요."
    why:
      - "손 위치로 커서를 움직이는 코드에서 손이 화면 밖으로 나가면 좌표가 0이나 화면 끝이 되어 모서리에 닿기 쉬워요."
    fix:
      - "좌표가 화면 안에 머물게 제한해요: x = max(1, min(x, 너비 - 2))"
      - "안전장치를 끄려면 pyautogui.FAILSAFE = False를 쓸 수 있지만, 진짜 PC에서는 코드를 멈추기 어려워지므로 권하지 않아요."
    example:
      code: |
        import pyautogui
        pyautogui.moveTo(0, 0)
      error: "pyautogui.FailSafeException: PyAutoGUI fail-safe triggered from mouse moving to a corner of the screen. …"
    cases:
      - "3-1-4 심화(p205, 손가락으로 마우스 커서 조종)에서 손이 화면 가장자리로 가면 나요. 가상 데스크톱도 PC와 같게 동작해요."

  - id: unknown
    group: lab
    title: 실행이 오류로 끝났어요
    fallback: true
    meaning: "{type} 오류가 났어요. 사전에 아직 없는 오류라 마지막 줄의 메시지를 그대로 읽어 볼게요: {message}"
    why:
      - "트레이스백은 아래에서 위로 읽어요. 마지막 줄이 오류 종류와 메시지, 그 위의 File \"main.py\", line 숫자가 내 코드의 어느 줄에서 났는지예요."
    fix:
      - "{line}번째 줄과 그 줄이 쓰는 변수를 print로 찍어 값이 생각과 같은지 봐요."
      - "오류 종류 이름과 메시지를 검색해 봐요. 이 사전에 더하면 좋겠다고 생각되면 문제 알리기로 알려 주세요."
    example:
      code: |
        def 계산():
            raise RuntimeError('아직 안 만들었어요')


        계산()
      error: "RuntimeError: 아직 안 만들었어요"
    cases:
      - "사전의 어떤 항목과도 맞지 않는 오류는 이 풀이가 붙어요. 실습실 카드에 이 제목이 보이면 오류 메시지를 알려 주세요."
