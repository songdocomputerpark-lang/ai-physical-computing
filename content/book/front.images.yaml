# 교과서 앞 부속(표지·차례)의 그림 목록 — 허용 목록 + 눈 확인 기록(판 1.4.0, 운영자 결정 O17, DECISIONS C135)
#
# 여기에 적은 그림만 원고 이미지 추출 도구가 원본(출판본 교과서 PDF, 원본 약칭 BOOK)에서 꺼내요: npm run images:extract -- front
# 결과는 public/images/book/ 바로 아래 WebP(메타데이터 없음) — 홈과 /book/ 첫 화면이 cover.webp·toc-1.webp·toc-2.webp 이름으로 읽어요.
# 쪽 좌표 고르기: npm run images:show -- BOOK 4 (BOOK의 쪽 좌표는 재단선 안쪽 595.28×779.53pt의 왼쪽 위가 (0, 0)이에요)
# file·width·height·bytes·sha256·checks는 도구가 적어요(손으로 고치지 않아요). 적는 법은 MAINTENANCE.md 3절.
#
# 표지 1쪽, 차례 4·5쪽은 쪽 전체를 그림으로 그려요(글자와 그림이 섞인 쪽이라 region으로). 사진 출처가 스톡인 쪽(10·11·15·… 쪽)은 쓰지 않아요(결정 C11).

