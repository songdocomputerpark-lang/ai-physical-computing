# 차시 3-1-3 "인공지능과 블루투스 통신"의 원고 그림 목록 — 허용 목록 + 눈 확인 기록(PLAN §8.5 P5-01, PD-18·PD-32)
#
# 여기에 적은 그림만 원고 이미지 추출 도구가 원본에서 꺼내요: npm run images:extract -- 3-1-3
# 결과는 public/images/lessons/3-1-3/ 아래 WebP(메타데이터 없음). 쪽 좌표·그림 번호 고르기: npm run images:show -- U3 196
# 적는 법·칸 설명은 MAINTENANCE.md 3절. file·width·height·bytes·sha256·checks는 도구가 적어요(손으로 고치지 않아요).
# reviewed는 그림을 한 장씩 열어 얼굴·이름·화면 속 경로·파일명·기기 주소·학교명이 없는지 본 사람이 적어요.
#
# 197·198쪽은 블루투스 기기 주소(MAC)가 보이는 제외 쪽이라 꺼내지 않아요(scripts/image-exclusions.yaml) — "주소 확인" 결과 화면은
# 사이트가 "광고 이름 확인"으로 바꿔 글과 그림(사이트가 그린 SVG)으로 보여요(PLAN §7.3). 200쪽(결과 화면)은 얼굴이 나온 쪽이라
# 이 차시에서 쓰지 않아요. 196쪽 배선 그림(키트 업체 제품 그림)은 차시 본문이 쓰지 않아 목록에서 뺐어요(2026-09-25 Phase 5 검토 안전 3 — 쓰지 않는 그림이
# 배포되고 있었어요). 배선은 가상 보드의 배선도가 보여 줘요.

