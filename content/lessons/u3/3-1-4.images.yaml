    alt: "손 동작으로 컴퓨터를 제어하는 프로그램 구조도. 입력은 웹캠을 통한 실시간 비디오 스트림이다. 프레임 캡처는 실시간 영상에서 프레임 단위 이미지 추출이다. 손 특징점 추출은 MediaPipe로 손을 인식하고 21개 손가락 특징점 좌표 추출이다. 동작 판별은 엄지와 검지 위치 비교(스크린숏 동작 여부 판별)이다. 커서 위치 매핑은 검지 끝 좌표를 실제 모니터 해상도에 맞춰 변환이다. 출력은 마우스 커서를 손가락 위치에 맞춰 이동, 스크린숏 촬영 및 화면에 알림 표시이다. 프레임 캡처부터 커서 위치 매핑까지 다섯 칸은 처리 단계로 묶여 있다."
