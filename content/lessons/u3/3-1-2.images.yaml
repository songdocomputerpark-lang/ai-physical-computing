# 차시 3-1-2 "인공지능 모델과 시리얼 통신"의 원고 그림 목록 — 허용 목록 + 눈 확인 기록(PLAN §8.5 P5-01, PD-18·PD-32)
#
# 여기에 적은 그림만 원고 이미지 추출 도구가 원본에서 꺼내요: npm run images:extract -- 3-1-2
# 결과는 public/images/lessons/3-1-2/ 아래 WebP(메타데이터 없음). 쪽 좌표·그림 번호 고르기: npm run images:show -- U3 190
# 적는 법·칸 설명은 MAINTENANCE.md 3절. file·width·height·bytes·sha256·checks는 도구가 적어요(손으로 고치지 않아요).
# reviewed는 그림을 한 장씩 열어 얼굴·이름·화면 속 경로·파일명·기기 주소·학교명이 없는지 본 사람이 적어요.
#
# 194쪽(심화 실습 결과 화면)은 얼굴이 나온 쪽이라 이 차시에서 쓰지 않아요(구역 프롬프트 — 운영자 답 O9로 공개는 허락됐지만,
# 결과 화면은 사이트가 글로 보여 주고 재생 입력으로 직접 확인할 수 있어서 쓰지 않는 쪽을 골랐어요).
# 190쪽 배선 그림에는 키트 업체 상표가 보여요 — 실제 키트 연결 안내에 써요. 189쪽 변환기 사진은 판 1.4.0(O17)에서 키트 업체가 제공한 부품 사진(부품 사전의
# c-007-usb-to-uart-converter, public/images/parts/third-party/kit-vendor/)으로 바꾸어 이 목록에서 뺐어요.
# 2026-09-25 Phase 5 검토 반영(안전 1): 업체 카탈로그 사진·제품 그림으로 보이는 그림(원본에 저자 촬영 흔적 XMP가 없고, 누끼·카탈로그형 촬영)은
# 운영자가 웹에 다시 허락할 수 있는 권리인지 알 수 없어 제3자(third_party: kit-vendor → third-party/kit-vendor/)로 나눴어요.
# sources.yaml "키트 업체의 제품 사진·그림" 항목이 덮고, 사이트 CC BY-NC-SA 4.0에서 빠지며 /credits/ 제3자 목록에 보여요.
# 운영자가 "저자가 찍거나 만든 것"이라고 알려 주면 third_party를 빼고 운영자 자료로 되돌려요(운영자 할 일 24번).

