# 차시 2-2-2 "MP3 플레이어 제어하기"의 원고 그림 목록 — 허용 목록 + 눈 확인 기록(PLAN §8.5 P5-01, PD-18·PD-32)
#
# 여기에 적은 그림만 원고 이미지 추출 도구가 원본에서 꺼내요: npm run images:extract -- 2-2-2
# 결과는 public/images/lessons/2-2-2/ 아래 WebP(메타데이터 없음). 쪽 좌표 고르기: npm run images:show -- U2B 163
