# 161쪽 "MP3 플레이어와 스피커" 사진은 교과서 키트와 다른 붉은 모듈이라(INVENTORY §4.1) 쓰지 않고, 모듈 안의 구조는 사이트가 그린
# mp3-module.svg로 보여 줘요. 162쪽 연결 그림은 가상 보드의 배선도가, 163·165쪽 콘솔 화면은 본문의 콘솔 글이 대신해요.
# 165쪽 결과 사진 두 장 가운데 손가락으로 2번 패드를 누른 사진만 써요(다른 한 장은 같은 장치를 누르기 전에 찍은 사진).

