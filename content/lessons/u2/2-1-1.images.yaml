# 차시 2-1-1 "피지컬 컴퓨팅 및 개발 환경의 이해"의 원고 그림 목록 — 허용 목록 + 눈 확인 기록(PLAN §8.5 P5-01, PD-18·PD-32)
#
# 여기에 적은 그림만 원고 이미지 추출 도구가 원본에서 꺼내요: npm run images:extract -- 2-1-1
# 결과는 public/images/lessons/2-1-1/ 아래 WebP(메타데이터 없음). 쪽 좌표 고르기: npm run images:show -- U2A 118
# 적는 법·칸 설명은 MAINTENANCE.md 3절. file·width·height·bytes·sha256·checks는 도구가 적어요(손으로 고치지 않아요).
#
# 118쪽 "ESP32 구성"은 교과서 키트의 실제 보드 사진에 원고가 이름표를 단 그림이에요(실제 키트 연결 안내용 — INVENTORY §5.2 업체 제품 사진, O3·O4).
# 가상 보드와 같은 모양의 브랜드 중립 그림은 사이트가 따로 그렸어요(esp32-board-parts.svg — sources.yaml "사이트가 직접 그린 그림").
# 117쪽 입력·처리·출력 그림, 119쪽 부품 핀 구성 카드, 120~122쪽 설치 화면은 쓰지 않아요(사이트 SVG로 대신하거나 설치 제로 원칙으로 뺐어요).
# 2026-09-25 Phase 5 검토 반영(안전 1): 업체 카탈로그 사진·제품 그림으로 보이는 그림(원본에 저자 촬영 흔적 XMP가 없고, 누끼·카탈로그형 촬영)은
# 운영자가 웹에 다시 허락할 수 있는 권리인지 알 수 없어 제3자(third_party: kit-vendor → third-party/kit-vendor/)로 나눴어요.
# sources.yaml "키트 업체의 제품 사진·그림" 항목이 덮고, 사이트 CC BY-NC-SA 4.0에서 빠지며 /credits/ 제3자 목록에 보여요.
# 운영자가 "저자가 찍거나 만든 것"이라고 알려 주면 third_party를 빼고 운영자 자료로 되돌려요(운영자 할 일 24번).

