# 차시 2-1-5 "네오픽셀 제어하기"의 원고 그림 목록 — 허용 목록 + 눈 확인 기록(PLAN §8.5 P5-01, PD-18·PD-32)
#
# 여기에 적은 그림만 원고 이미지 추출 도구가 원본에서 꺼내요: npm run images:extract -- 2-1-5
# 결과는 public/images/lessons/2-1-5/ 아래 WebP(메타데이터 없음). 쪽 좌표 고르기: npm run images:show -- U2A 152
# 적는 법·칸 설명은 MAINTENANCE.md 3절. file·width·height·bytes·sha256·checks는 도구가 적어요(손으로 고치지 않아요).
#
# 148쪽 "네오픽셀의 구조" 그림은 사이트가 ring-index.svg로 다시 그렸어요(번호와 데이터 선을 함께 보이려고).
# 149쪽 연결 그림은 쓰지 않고, 가상 보드의 배선도가 같은 핀(DIN 23번)을 보여 줘요.
# 151쪽 무지개 결과 사진 다섯 장은 가상 보드에서 같은 모습을 볼 수 있어 쓰지 않아요.
# 152쪽 무드등 결과 사진 네 장 가운데 두 장(1번 패드 빨강, 3번 패드 파랑)만 써요.

