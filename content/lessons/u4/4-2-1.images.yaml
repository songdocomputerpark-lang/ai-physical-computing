  - name: program-structure
    use: 교과서 쪽 4-2-1 "3 수신 데이터로 하드웨어 제어하기 프로그램 구조" — 입력부터 출력까지 여섯 칸 구조 그림(출판본 260쪽)
    alt: "프로그램 구조 그림. 위에서 아래로 이어지는 여섯 칸이다. 입력(영상 처리) 웹캠으로 얼굴을 인식하고, MediaPipe로 얼굴 중심 좌표 (x, y)와 눈 깜빡임을 기반으로 더블 클릭, 우 클릭 신호 감지, 송신 데이터 문자열 생성 인식된 x, y 좌표와 클릭 신호를 “DATA, X, Y, 더블 클릭, 우 클릭” 형식의 문자열로 변환, 처리 구간의 블루투스 연결 및 설정 영상 처리 측에서 대상 장치의 MAC 주소를 기반으로 BLE 연결을 초기화, 데이터 송신 수행 구성된 문자열을 일정한 주기로 블루투스를 통해 ESP32로 전송, 데이터 수신 및 파싱 ESP32가 문자열을 수신하고, 쉼표(,)를 기준으로 분리해 각 값을 변수에 저장, 출력 수신된 좌표와 클릭 신호를 LCD에 표시하거나, 서보모터 등 외부 장치를 제어"
