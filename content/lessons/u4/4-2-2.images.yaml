  - name: hardware-parts
    use: 교과서 쪽 4-2-2 "4 하드웨어 구성 요소 및 연결" — ESP32 확장 보드에 LCD·서보모터·버저·레이저·RGB LED를 이은 연결 그림과 설명 글(출판본 277쪽) — 키트 업체(고릴라셀) 제품 사진이라 third-party/kit-vendor
    alt: "ESP32 확장 보드에 문자 LCD, 서보모터, 버저, 레이저, RGB LED를 이은 연결 그림. 글자 설명은 LCD는 I2C 21, 22번 핀, 서보모터는 25, 26번 핀, 버저·레이저·RGB LED는 5, 18, 27, 32, 33번 핀이다. 버저 더블 클릭 또는 우 클릭 신호가 감지될 때 짧은 음을 울려 클릭 이벤트를 청각적으로 알린다. 레이저 BLE 데이터를 수신하는 동안 켜져 있어 시스템이 동작 중임을 외부에 시각적으로 표시한다. RGB LED 더블 클릭이 감지되면 초록색(G), 우 클릭이 감지되면 파란색(B) LED가 켜져 클릭 상태를 시각적으로 알려 준다"
