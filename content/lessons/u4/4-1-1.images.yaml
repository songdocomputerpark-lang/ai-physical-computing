    alt: "얼굴의 움직임으로 마우스를 제어하는 프로그램 화면 예. 화면 위 설명 글은 다음과 같다. Left Eye, Right Eye 각 눈의 상태를 숫자로 표시 1=열림(OPEN) 0=닫힘(CLOSED). CLOSED, OPEN 현재 눈 상태를 텍스트와 색상으로 표시. Cooldown 클릭 동작이 지속적으로 발생하지 않도록 일정 시간 동작을 제한하는 쿨다운 시간(프레임 수). Left Eye Duration, Both Eyes Duration 눈 감김이 몇 프레임 동안 유지되고 있는지 보여줌. 이 값이 특정 기준 이상이면 클릭으로 인식. Double Click, Right Click 클릭 조건이 충족되었을 때 해당 클릭이 발생했음을 텍스트로 표시. 노란 점 + 노란 텍스트 얼굴의 주요 특징점을 표시하며, 각각의 위치를 기준으로 마우스 커서 이동과 클릭 여부를 계산. 화면 속 글은 Left Eye 1, Right Eye 0, CLOESD, OPEN, Cooldown 30, Left Eye Duration 0/10, Both Eyes Duration 0/10, Left Eye 0.5s Double Click, Both Eyes 0.5s Right Click, L_EYE, R_EYE, NOSE이다"
