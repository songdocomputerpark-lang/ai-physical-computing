# 차시 1-1-1 "인공지능 응용 프로그램과 에이전트"의 원고 그림 목록 — 허용 목록 + 눈 확인 기록(PLAN §8.5 P5-01, PD-18·PD-32)
#
# 여기에 적은 그림만 원고 이미지 추출 도구가 원본에서 꺼내요: npm run images:extract -- 1-1-1
# 결과는 public/images/lessons/1-1-1/ 아래 WebP(메타데이터 없음). 쪽 좌표·그림 번호 고르기: npm run images:show -- U1 9
# 적는 법·칸 설명은 MAINTENANCE.md 3절. file·width·height·bytes·sha256·checks는 도구가 적어요(손으로 고치지 않아요).
# reviewed는 그림을 한 장씩 열어 얼굴·이름·화면 속 경로·파일명·기기 주소·학교명이 없는지 본 사람이 적어요.
#
# 기준 차시(P5-02, 2026-09-25)가 쓰는 원고 그림은 009쪽 표 속 출판 편집 삽화 3장뿐이에요(third_party: publisher — 운영자 할 일 13번 기본값).
# 도구가 생기기 전에 손으로 꺼낸 옛 판(public/images/lessons/u1/1-1-1-*.webp)과 그 기록(scripts/image-allowlist.yaml)은 이 판으로 바꾸며 지웠어요.
# 원고 010쪽 쇼핑 로봇 그림(Visual Generation Inc. 스톡)은 결정 C11(docs/DECISIONS.md)로 쓰지 않고, 사이트가 그린 S08
# (public/images/lessons/1-1-1/rule-vs-learning.svg)로 대신해요. 011쪽 자율주행 자동차 그림(도구가 본 이름표 'Печать', 제작자 표기 없음 —
# 스톡 추정, 미해결 166)은 절대 원칙 5 "애매하면 직접 만든다"로 쓰지 않고 S07(agent-cycle.svg)로 대신해요 — P5-01 샘플이던 agent-car.webp는 지웠어요.
# 원고 008쪽 중단원 여는 그림은 INVENTORY §5.2가 "스톡 추정(표기 없음)"으로 적은 그림이라 쓰지 않아요.
# 사이트가 그린 SVG(ai-in-daily-life·rule-vs-learning·agent-cycle)는 이 목록에 적지 않아요(sources.yaml "사이트가 직접 그린 그림").

