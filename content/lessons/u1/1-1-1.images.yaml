# 차시 1-1-1 "인공지능 응용 프로그램과 에이전트"의 원고 그림 목록 — 허용 목록 + 눈 확인 기록(PLAN §8.5 P5-01, PD-18·PD-32)
#
# 여기에 적은 그림만 원고 이미지 추출 도구가 원본에서 꺼내요: npm run images:extract -- 1-1-1
# 결과는 public/images/lessons/1-1-1/ 아래 WebP(메타데이터 없음). 쪽 좌표·그림 번호 고르기: npm run images:show -- U1 10
# 적는 법·칸 설명은 MAINTENANCE.md 3절. file·width·height·bytes·sha256·checks는 도구가 적어요(손으로 고치지 않아요).
# reviewed는 그림을 한 장씩 열어 얼굴·이름·화면 속 경로·파일명·기기 주소·학교명이 없는지 본 사람이 적어요.
#
# 원고 009쪽 표 속 삽화 3장은 도구가 생기기 전에 손으로 꺼낸 판(public/images/lessons/u1/1-1-1-*.webp, 기록은 scripts/image-allowlist.yaml)을
# 1-1-1.md가 아직 써요. 아래 recognition·learning·reasoning은 같은 삽화를 도구로 다시 꺼낸 판이에요 — 1-1-1.md를 이 경로로 바꾸면
# 옛 판 3장과 그 기록(scripts/image-allowlist.yaml), sources.yaml "출판 편집 삽화·컷" 항목의 옛 경로 3줄을 함께 지워요.
# 원고 010쪽 쇼핑 로봇 그림(Visual Generation Inc. 스톡)은 결정 C11(docs/DECISIONS.md)로 쓰지 않아요 — 사이트가 그린 그림(S08)으로 대신해요.
# 원고 008쪽 중단원 여는 그림은 INVENTORY §5.2가 "스톡 추정(표기 없음)"으로 적은 그림이라 샘플에서 뺐어요(절대 원칙 5 "애매하면 직접 만든다", C11의 근거와 같음).

