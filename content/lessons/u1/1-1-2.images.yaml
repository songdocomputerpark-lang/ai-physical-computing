# 차시 1-1-2 "인공지능 영상 인식 기술의 원리"의 원고 그림 목록 — 허용 목록 + 눈 확인 기록(PLAN §8.5 P5-01, PD-18·PD-32)
#
# 여기에 적은 그림만 원고 이미지 추출 도구가 원본에서 꺼내요: npm run images:extract -- 1-1-2
# 결과는 public/images/lessons/1-1-2/ 아래 WebP(메타데이터 없음). 쪽 좌표·그림 번호 고르기: npm run images:show -- U1 14
# 적는 법·칸 설명은 MAINTENANCE.md 3절. file·width·height·bytes·sha256·checks는 도구가 적어요(손으로 고치지 않아요).
# reviewed는 그림을 한 장씩 열어 얼굴·이름·화면 속 경로·파일명·기기 주소·학교명이 없는지 본 사람이 적어요.
#
# 원고 013·015·016쪽은 얼굴이 있어 제외 쪽이에요(scripts/image-exclusions.yaml, INVENTORY §6). 016쪽의 손 그림·손 사진만
# region으로 잘라 privacy_override를 적어 꺼냈고, 도구의 엄격 얼굴 검사(하나라도 나오면 멈춤)를 통과했어요.
# 015쪽의 강아지·고양이 사진(객체 감지)·백로 사진(이미지 분류), 016쪽의 엄지 든 손 사진(동작 인식)·자세 랜드마크 그림도 같은
# 방법으로 해 봤지만(2026-09-25), 엄격 얼굴 검사가 동물 얼굴·주먹 마디·머리 점 무늬를 얼굴로 보고 멈춰 꺼내지 않았어요 — 그 그림은
# 사이트가 그린 그림(INVENTORY §5.3 S13·S14·S15)으로 대신해요. 제외 쪽의 엄격 검사는 끄는 방법이 없어요.
# 018쪽 석고상 사진(BASHTA 스톡)은 결정 C11(docs/DECISIONS.md)로 쓰지 않아요 — 사이트가 그린 그림(S12)으로 대신해요.
# 018쪽 얼룩말·자전거 사진도 쓰지 않아요(2026-09-25 구역 A, 미해결 166) — 권리 표기가 없지만 흔한 스톡 사진 모양이고 같은 활동의
# 석고상이 스톡이라, 절대 원칙 5(애매하면 직접 만든다)와 1-1-1이 011쪽 그림을 S07로 바꾼 선례대로 사이트가 그린 S12
# (public/images/lessons/1-1-2/feature-techniques.svg)로 바꿨어요. P5-01 샘플로 꺼냈던 두 파일과 항목은 Phase 5 통합에서 지웠어요(git 기록에는 남음).
