# 원고 013·015·016쪽은 얼굴이 있어 제외 쪽이에요(scripts/image-exclusions.yaml, INVENTORY §6). 016쪽의 손 그림·손 사진만
# region으로 잘라 privacy_override를 적어 꺼냈고, 도구의 엄격 얼굴 검사(하나라도 나오면 멈춤)를 통과했어요.
