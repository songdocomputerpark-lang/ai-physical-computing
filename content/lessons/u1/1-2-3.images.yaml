# 차시 1-2-3 "손끝 사이의 거리, 컴퓨터가 알아채다"의 원고 그림 목록 — 허용 목록 + 눈 확인 기록(PLAN §8.5 P5-01, PD-18·PD-32)
#
# 여기에 적은 그림만 원고 이미지 추출 도구가 원본에서 꺼내요: npm run images:extract -- 1-2-3
# 결과는 public/images/lessons/1-2-3/ 아래 WebP(메타데이터 없음). 쪽 좌표 고르기: npm run images:show -- U1 43
# 적는 법·칸 설명은 MAINTENANCE.md 3절. file·width·height·bytes·sha256·checks는 도구가 적어요(손으로 고치지 않아요).
# reviewed는 그림을 한 장씩 열어 얼굴·이름·화면 속 경로·파일명·기기 주소·학교명이 없는지 본 사람이 적어요.
#
# 이 차시가 쓰는 원고 그림은 실행 결과 화면 두 장이에요(둘 다 손만 보이는 화면).
# - 기본 실습 결과는 043쪽 "해 보기"의 화면을 써요. 047쪽 실행 결과와 같은 화면(Distance: 252)인데, 047쪽은 옆 결과 상자의
#   말꼬리(하늘색 세모)가 손가락을 덮고 있어요.
# - 042쪽 핀치 줌 사진(출판 편집 컷)은 INVENTORY §5.2가 "스톡 추정"으로 적은 그림이라 쓰지 않고, 사이트가 그린 pinch-zoom.svg로 대신해요.
# - 043쪽 유클리드 거리 도식(출판 편집 컷)은 euclidean-distance.svg(INVENTORY S27)로, 051쪽 거리 방식 비교 컷은 distance-kinds.svg(S28)로
#   사이트가 다시 그렸어요 — 원고 예시 숫자 (300, 400)·(600, 800)을 그림 안에 넣어 본문과 맞추려는 것이에요.
# - cv2.circle의 값 풀이 그림(circle-args.svg)도 사이트가 그렸어요. 사이트가 그린 SVG는 이 목록에 적지 않아요(sources.yaml "사이트가 직접 그린 그림").

