# ── 실습실에서 돌릴 때(P2-08에서 브라우저로 확인, 2026-09-16) ──
# 필요한 입력: '재생 입력(합성 손 좌표)' — 카메라가 없어도 돼요. 웹캠으로 하려면 public/models/hand_landmarker.task가 있어야 해요.
# 출력 창 'Hand' · q 키로 끝내요(출력 창을 한 번 눌러 초점을 준 뒤).
# 주의: 손 인식 모델 파일 hand_landmarker.task를 써요(실습실에 들어 있어요). 색 순서를 RGB로 바꾸고 mp.Image로 감싸 detect_for_video()에 넣어요.
# 주의: 새 손 인식 모델은 손 개수 기본값이 1이라, 교과서 코드(옛 Hands()는 2개까지)와 같게 num_hands=2를 적었어요.

