# 필요한 입력: '재생 입력' + 재생 동작 '검지로 그리기'. 커서는 가상 데스크톱(1920×1080) 안에서만 움직여요.
# 출력 창 'Mouse Control' · q로 끝내요. 카메라 전체를 화면 전체에 1:1로 대응시켜 가장자리에 닿기 어렵고 떨림 보정이 없어요(원본 체감 그대로).
# 주의: 커서가 가상 모니터 모서리(0, 0)에 닿으면 원본처럼 FailSafeException으로 멈춰요(PAUSE 0.1초·FAILSAFE 기본값 흉내).
