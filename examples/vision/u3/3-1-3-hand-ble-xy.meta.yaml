  - 4단원 통합 실습실의 [짝 예제 바꾸기]에서 "(3단원) 3-1-3" 짝을 불러오고 [함께 실행]을 눌러요.
  - 카메라가 없으면 입력을 "재생 입력(합성 좌표)"으로 바꿔요. 합성 손의 검지 끝 좌표가 "x,y"로 나가요.
  - 보드 칸 콘솔의 "Received finger_x: …"와 RGB LED를 봐요. 보드는 한 번에 2초씩 켜고 끄느라 그사이에 온 좌표는 마지막 것만 읽어요.
