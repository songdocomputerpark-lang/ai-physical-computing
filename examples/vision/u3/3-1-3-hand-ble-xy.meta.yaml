title: "3-1-3 기본: 손끝 좌표를 블루투스로 보드에 보내기"
description: 컴퓨터 쪽 코드예요. 검지 끝 좌표를 "x,y"로 만들어 매 프레임 보드에 보내요. 짝은 보드 쪽 3-1-3 예제예요 — 컴퓨터 칸과 보드 칸이 한 화면에 있는 "4단원 통합 실습실"에서 [짝 예제 바꾸기]의 "(3단원) 3-1-3"을 고르면 이어져요. 영상처리 실습실에서만 돌리면 이을 보드가 없어 좌표를 보내지 않아요. 원본의 기기 주소는 개인정보라 XX:XX:XX:XX:XX:XX로 가렸어요 — 브라우저는 주소로 연결하지 않으니 값이 없어도 돼요.
