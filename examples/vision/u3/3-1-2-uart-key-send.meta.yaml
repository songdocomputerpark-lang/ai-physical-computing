title: "3-1-2 기본: 컴퓨터에서 키보드로 a·b를 시리얼로 보내기"
description: 컴퓨터 쪽 코드예요. 입력한 글자 a·b를 시리얼(pyserial)로 보드에 보내고 q로 끝내요. 짝은 보드 쪽 3-1-2 예제고, 아래 [보내기] 패널에서 가상 보드를 먼저 열어야 이어져요. 보드 화면을 열지 않고 [실행]하면 4번 줄에서 SerialException으로 멈춰요(실물에서 USB-UART 변환기를 꽂지 않은 것과 같아요). 코드에 적은 포트 이름(COM10)은 브라우저에서 쓰지 않고, 패널에서 고른 통로가 상대예요.
