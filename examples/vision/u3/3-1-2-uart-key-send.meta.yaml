practice:
  - 아래 [보내기] 패널에서 보드 예제로 "3-1-2 기본"을 고르고 [한 화면에 가상 보드 열기]를 눌러요(다른 탭에서 보려면 [ESP32 실습실 새 탭에서 열기]).
  - 보드 화면이 뜨면 보드 쪽 [실행]을 먼저 눌러요. 보드가 꺼져 있을 때 온 글자는 실물처럼 사라져요.
  - 이 화면에서 [실행]을 누르고 입력줄에 a를 적으면 가상 보드의 레이저(GPIO18)가 켜져요. b는 끄기, q는 끝내기예요.
  - 보드 쪽 원본 파일은 a를 받은 다음 줄에서 NameError로 멈춰요(원본의 결함이에요 — 보드 예제 설명을 읽어 봐요).
