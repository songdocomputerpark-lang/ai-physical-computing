title: "3-1-2 심화: 얼굴이 보이면 a, 사라지면 b를 시리얼로 보내기"
description: 컴퓨터 쪽 코드예요. 카메라에서 얼굴을 찾아 상태가 바뀔 때만 a·b를 보드에 보내요(원고 187쪽의 "값이 바뀔 때만" 규칙을 지키는 예제예요). 아래 [보내기] 패널에서 가상 보드를 먼저 열어야 이어지고, 열지 않고 [실행]하면 6번 줄에서 SerialException으로 멈춰요. 카메라가 없으면 입력 소스를 "재생 입력"으로 골라도 똑같이 실습할 수 있어요. 맨 끝 줄 ser.close()는 원본의 오타라서 q로 끝낼 때 NameError가 나요(uart.close()가 맞아요).
