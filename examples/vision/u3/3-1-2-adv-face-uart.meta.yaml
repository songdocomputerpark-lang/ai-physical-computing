practice:
  - 아래 [보내기] 패널에서 보드 예제로 "3-1-2 기본"을 고르고 [한 화면에 가상 보드 열기]를 누른 뒤, 보드 쪽 [실행]을 먼저 눌러요.
  - 카메라가 없으면 입력 소스를 "재생 입력"으로 골라요(사람을 찍은 자료가 아니라 계산으로 만든 얼굴이에요).
  - 이 화면에서 [실행]을 누르면 얼굴이 보일 때 a, 사라질 때 b가 한 번씩 나가요. 콘솔의 Sent: 줄과 가상 보드의 레이저를 함께 봐요.
  - 매 프레임 보내지 않고 "상태가 바뀔 때만" 보내는 것이 원고 187쪽 규칙이에요. detected != face_present 줄을 지우면 어떻게 되는지 이야기해 봐요.
