# ── 실습실에서 돌릴 때(2026-09-17 이관, 브라우저로 확인 — tests/e2e/lab-textbook-u3-u4.spec.ts) ──
# 필요한 입력: '재생 입력' + 재생 동작 '고개 돌리기'. 커서는 가상 데스크톱(1920×1080) 안에서만 움직여요.
# 출력 창 'Nose Mouse Control' · r로 기준점 다시 잡기, q로 끝내요. 기준점은 처음 30장(실습실은 초당 15장 안팎이라 약 2초) 동안 잡아요.
# 주의: 원본은 pyautogui.FAILSAFE = False라 진짜 PC에서 돌리면 커서를 멈추기 어려워요 — 내려받아 돌릴 때는 OpenCV 창을 누른 뒤 q를 눌러요.
