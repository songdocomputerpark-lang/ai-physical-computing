title: "4-1-4 심화: 코 좌표를 0.5초마다 DATA,x,y로 보내기"
description: 컴퓨터 쪽 코드예요. 얼굴 그물에서 코 좌표(카메라 화면의 점 위치)를 찾아 0.5초마다 "DATA,x,y"로 보드에 보내요. 짝은 보드 쪽 4-1-4 기본 예제예요 — "4단원 통합 실습실"에서 둘을 함께 돌리면 보드 LCD에 좌표가 나와요. 영상처리 실습실에서만 돌리면 이을 보드가 없어 좌표를 보내지 않아요. 기기 주소는 개인정보라 가렸어요.
