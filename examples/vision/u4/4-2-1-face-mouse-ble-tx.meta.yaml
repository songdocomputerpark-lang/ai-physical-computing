title: "4-2-1 기본: 얼굴 마우스 좌표와 클릭을 블루투스로 보내기(최종판)"
description: 컴퓨터 쪽 코드예요. 코로 마우스를 움직이고 눈을 오래 감으면 더블클릭·오른쪽 클릭을 하면서, 좌표와 클릭 표시를 "DATA,mx,my,d,r"로 보드에 보내요. 4단원에서 가장 무거운 예제예요(카메라 + 얼굴 그물 + 가상 데스크톱 + 블루투스). 기기 주소는 개인정보라 가렸어요. 지금은 PC 쪽 bluetooth 흉내가 없어서 ModuleNotFoundError로 멈춰요(P4-02·P4-09).
