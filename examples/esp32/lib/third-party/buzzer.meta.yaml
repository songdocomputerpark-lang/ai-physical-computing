title: "보드 라이브러리: buzzer.py(버저 음 이름과 연주)"
description: "음 이름(C4 = 262 등)과 멜로디 목록(jingle, twinkle), BUZZER 클래스의 play()·tone()을 담은 버저 라이브러리예요. 교과서 156~157쪽처럼 from buzzer import *로 불러 BUZZER(15)로 버저를 정하고 play(jingle, 100)으로 연주해요. 원본에서 게임 음악 선율 목록(mario)만 뺀 사이트판이에요. 가상 보드는 /board/lib/에, 실물 보드는 [보드에 저장]·[실제 보드] 실행 때 사이트가 함께 올려요."
