title: "보드 라이브러리: ESP32BLE.py(블루투스 주변기기)"
description: ESP32를 블루투스 주변기기로 만드는 라이브러리예요. init(이름)으로 광고를 시작하고 read()로 받은 글자를, send()로 보낼 글자를 다뤄요. 3·4단원과 교안의 모든 BLE 예제가 이 파일을 import해요. 가상 보드는 /board/lib/에, 실물 보드는 [보드에 저장]이 함께 올려요.
