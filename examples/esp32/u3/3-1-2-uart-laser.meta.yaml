title: "3-1-2 기본: UART로 받은 a·b로 레이저 켜고 끄기(원본 파일)"
description: 컴퓨터가 USB-UART 변환기로 보낸 글자 a·b를 UART2로 받아 레이저를 켜고 꺼요. 원본 파일은 import time만 하고 sleep(1)을 불러서 a나 b를 처음 받는 순간 NameError로 멈춰요(실물 보드도 같아요 — 원고 190쪽은 from time import sleep이에요). 핀도 원고 배선 그림과 반대예요(코드 tx=16·rx=17, 그림은 변환기 TX → GPIO16).
