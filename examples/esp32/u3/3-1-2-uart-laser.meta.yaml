title: "3-1-2 기본: UART로 받은 a·b로 레이저 켜고 끄기(원본 파일)"
description: 컴퓨터가 USB-UART 변환기로 보낸 글자 a·b를 UART2로 받아 레이저를 켜고 꺼요. 짝은 영상처리 실습실의 3-1-2 예제예요(그 화면의 [보내기] 패널이 이 화면을 열어 줘요). 원본 파일은 import time만 하고 sleep(1)을 불러서 a나 b를 처음 받는 순간 NameError로 멈춰요(실물 보드도 같아요 — 원고 190쪽은 from time import sleep이에요). 핀도 원고 배선 그림과 반대예요(코드 tx=16·rx=17, 그림은 변환기 TX → GPIO16). 사이트는 원본 코드를 고치지 않고 배선 쪽을 코드에 맞춰 그려서, 원본 그대로 글자가 오가게 했어요.
