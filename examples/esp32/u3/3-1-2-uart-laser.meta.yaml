  # 반대로 적어서 그대로 두면 보드가 한 글자도 받지 못해요. 원본 코드를 고치지 않기로 한 규칙(PD-10)을 지키려고 배선을 코드에 맞췄어요.
  # 원고 그림대로 tx=17·rx=16을 쓰는 사이트판 예제는 따로 만들어요(PLAN §8.4 설계 메모 ⑤, INVENTORY §4.4).
  - part: uart
    pins:
      rx: 16
      tx: 17
  - part: laser
    pin: 18
