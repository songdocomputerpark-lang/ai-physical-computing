practice:
  - "[실행]을 누르면 보드가 UART2를 열고 글자가 오기를 기다려요(아무 일도 일어나지 않는 것이 정상이에요)."
  - 부품 조작 칸의 시리얼 창에서 속도를 115200으로 맞추고 a를 보내면 18번 줄에서 NameError로 멈춰요 — 원본 파일의 결함이에요.
  - from time import sleep으로 고친 뒤 a를 보내면 레이저가 켜지고, b를 보내면 꺼져요. 실물 레이저는 눈에 비추지 않아요.
