  - 보드 그림의 "RGB 매트릭스(NeoPixel)"이(가) 코드대로 켜지고 꺼지고 움직이는지 봐요. 콘솔에 나오는 글자를 봐요.
  - 가상 보드의 네오픽셀 그림은 16개 링이라 17번째 불빛부터는 그림에 나오지 않아서(코드는 그대로 돌아요) 일부만 보여요.
