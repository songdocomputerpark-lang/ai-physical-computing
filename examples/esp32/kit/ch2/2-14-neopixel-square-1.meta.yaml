title: "2.14 네오픽셀 사각 배열 — 1단계: 불빛 하나씩 켜기와 전체 색"
description: LED 를 한 개씩 차례로 켠 뒤 전체를 초록, 파랑, 하양으로 바꿔요. 밝기는 20 으로 낮췄어요. 높이면 전류가 많이 흘러요.
