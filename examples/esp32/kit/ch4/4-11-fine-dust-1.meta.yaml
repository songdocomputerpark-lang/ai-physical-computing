title: "4.11 미세먼지 센서 — 1단계: 미세먼지 센서 값 읽기"
description: 센서 안의 LED 를 아주 짧게(0.28ms) 켜고 그 순간의 빛 세기를 읽는 방식이에요. 20번 읽은 평균을 써서 값이 덜 흔들려요.
difficulty: 1
tags:
  - 아날로그 센서
  - 미세먼지
  - 아날로그 입력
  - ADC
  - 키트 도감
  - 문자 LCD
kit:
  device: d-4-11
  step: 1
source: brixel
source_url: https://brixel.gorillacell.kr/07_thonny/03_esp32/#d-4-11
virtual: full
virtual_ok: true
parts:
  - part: sensor-analog
    pin: 32
    label: 미세먼지 센서
  - part: output-digital
    id: dust-led
    pin: 33
    label: 미세먼지 센서 LED
  - part: lcd-i2c
    id: lcd
    pins:
      sda: 21
      scl: 22
    label: 문자 LCD(16×2)
practice:
  - "[실행]을 눌러요."
  - 보드 그림 아래 ‹미세먼지 센서› 조작 칸의 슬라이더를 움직이거나 숫자 칸에 값(0~4095)을 적어 센서 값을 바꿔 보세요. 보드 그림의 "미세먼지 센서 LED"이(가) 코드대로 켜지고 꺼지고 움직이는지 봐요. 콘솔 글자와 문자 LCD 글자가 어떻게 바뀌는지 봐요.
  - 다 봤으면 [정지]를 눌러요.
