title: "4.10 소리 센서(마이크) — 1단계: 소리 크기 읽기"
description: "소리는 값이 위아래로 흔들리는 거라서, 짧은 시간 동안 가장 큰 값과 가장 작은 값의 차이를 소리 크기로 봐요. 조용할 때와 박수칠 때 막대( # )가 얼마나 달라지는지 출력 창과 LCD 에서 보세요."
