practice:
  - "[실행]을 눌러요."
  - 보드 그림 아래 ‹사운드 센서› 조작 칸의 슬라이더를 움직이거나 숫자 칸에 값(0~4095)을 적어 센서 값을 바꿔 보세요. 콘솔 글자와 문자 LCD 글자가 어떻게 바뀌는지 봐요.
  - 다 봤으면 [정지]를 눌러요.
