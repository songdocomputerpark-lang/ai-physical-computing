title: "5.02 무게 센서 (HX711) — 1단계: 무게 읽기 (I2C)"
description: 이 무게 센서는 안에 작은 컴퓨터가 있어서 무게를 g 로 계산해 I2C 로 보내 줘요. 주소는 0x63 이에요. i2c.readfrom(0x63, 3) 으로 3바이트를 받아 상위 x 256 + 하위 로 무게를 만들어요.
