practice:
  - "[실행]을 누르면 서보 팔이 약 89°로 가고, 콘솔 아래 입력줄에 \"서보 제어 (1: 180도, 2: 0도):\"가 나와요."
  - "입력줄에 1을 적고 Enter를 누르면 180°, 2를 적으면 0°로 돌아요. 다른 글자는 \"잘못된 입력입니다\"가 나와요."
  - "이 코드는 끝나는 명령이 없어서 다 해 봤으면 [정지]를 눌러요."
