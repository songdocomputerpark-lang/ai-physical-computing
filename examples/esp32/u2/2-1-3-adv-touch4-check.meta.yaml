practice:
  - "[실행]을 누르면 콘솔에 \"ADC: 0 → No touch\"가 0.2초마다 나와요."
  - "보드 그림 아래 \"4채널 터치 센서 조작\"의 [패드 1]~[패드 4]를 누르고 있어요(Tab으로 옮겨 Space를 누르고 있거나, 그림 속 패드를 눌러도 돼요). 값이 약 688·1535·2381·3263으로 바뀌어요."
  - "패드 3을 눌렀는데 Button 2라고 나오는지 봐요. get_button의 범위가 겹치기 때문이에요. 고친 코드는 \"(사이트판)\" 예제에서 볼 수 있어요. 다 봤으면 [정지]를 눌러요."
