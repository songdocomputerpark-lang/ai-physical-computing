title: "2-1-3 심화 동작 테스트: 4채널 터치 센서 값 읽기(원본 파일)"
description: 터치 패드를 누르면 아날로그 값(0~4095)과 버튼 번호를 0.2초마다 콘솔에 보여 줘요. 원본의 판정 구간이 서로 겹쳐서 패드 3·4는 Button 2·3으로 잘못 나와요(교사용 참고). 원고 152쪽 구간(500~800·1000~1700·2000~2500·3000~3500)으로 고친 파일은 같은 이름의 "(사이트판)" 예제예요.
