title: "2-1-5 출력 테스트: 네오픽셀 16개 차례로 켜고 끄기(사이트판)"
description: 원고 149쪽 코드와 원본 파일은 첫 반복문에 np.write()가 없어 불이 차례로 켜지지 않아요. 11번째 줄에 np.write()를 더해, 빨간 LED가 0번부터 0.1초마다 한 칸씩 켜지고 15번부터 하나씩 꺼지게 고친 파일이에요. 원본 파일보다 1줄 길어요.
