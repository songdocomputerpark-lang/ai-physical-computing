# 예제 설명(사이드카). 원본 코드 파일은 줄 번호를 지키려고 고치지 않고, 제목·설명은 여기에 적어요(src/lab/README.md 3절).
# 사이트판(PLAN PD-10): 원본 파일은 그대로 두고 고친 줄에 "# [사이트판]"을 붙인 파일이에요. 사람이 직접 고쳐요.
title: "2-1-3 심화: 4채널 터치 버튼으로 OLED 글자와 RGB LED 색 바꾸기(사이트판)"
description: 원본 파일의 판정 구간을 원고 152쪽 구간(500~800·1000~1700·2000~2500·3000~3500)으로 고친 파일이에요. 패드 1~4를 누르면 OLED에 Button 1~4가 보이고 RGB LED가 빨강·초록·파랑·흰색으로 켜져요. 고친 줄(29·31·33·35번째 줄)에는 [사이트판]이라고 적었고, 줄 번호는 원본과 같아요. RGB LED의 12·5번 핀은 부팅에 쓰는 스트래핑 핀이라 실물에서는 주의해요(교사용 참고).
