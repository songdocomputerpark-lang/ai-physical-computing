practice:
  - "[실행]을 누르면 OLED에 ADC 값과 No touch가 0.3초마다 새로 보여요."
  - "\"4채널 터치 센서 조작\"의 [패드 1]~[패드 4]를 하나씩 누르고 있어요. OLED에 Button 1~4가 보이고 RGB LED가 빨강·초록·파랑·흰색으로 켜지는지 봐요."
  - "패드에서 손을 떼면 No touch가 되고 RGB LED가 꺼져요. 원본 파일과 29~35번째 줄의 구간을 비교해 봐요. 다 봤으면 [정지]를 눌러요."
