title: "2-2-1 출력 테스트: 버저 1초마다 울리기"
description: 버저 핀(15번)을 1초마다 켜고 꺼서 소리를 냈다 멈춰요. 가상 보드는 핀을 켜기만 하면 1000Hz 고정음을 내요(실물 수동 버저는 딸깍 소리만 날 수 있어요 — 교사용 참고). 15번은 스트래핑 핀이라 실물에서는 주의해요.
