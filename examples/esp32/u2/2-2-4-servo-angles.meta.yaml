title: 2-2-4 서보모터 0°·90°·180°로 돌리기
description: 서보모터(25번)를 0도, 90도, 180도로 차례로 돌려요. 라이브러리 servo_library.py는 원고 174쪽 화면대로 복원한 파일이고, 돌릴 때마다 0.5초 기다려 실제 간격은 1.5초예요. 90도는 duty 77(int로 버림)이라 약 89°로 보여요(교사용 참고).
lesson: 2-2-4
page: 175
source_id: f078
tags:
  - 서보모터
  - 라이브러리
  - PWM
packages: []
parts:
  - part: servo
    pin: 25
smoke:
  outcome: ok
  seconds: 12
practice:
  - "[실행]을 눌러요."
  - "서보 그림의 팔이 0° → 약 89° → 180°로 1.5초마다 옮겨 가고, 아래 글에 각도와 펄스 폭(0.78·1.50·2.25ms)이 나오는지 봐요."
  - "각도는 교과서 servo_library 기준(duty 40 = 0°, 115 = 180°)으로 그려요. 코드가 끝나면 팔이 180°에 남아요."
