title: "2-1-4 기본: 레이저와 RGB LED 번갈아 켜기(원본 파일)"
description: 교과서 원본 파일 그대로라 결과가 생각과 다르게 나올 수 있어요 — 내 실수가 아니에요. 레이저를 켤 때 빨강, 끌 때 파랑 LED를 켜려는 코드예요. 원본 파일은 값 2개를 받는 set_color에 값 3개를 넘겨 첫 반복에서 TypeError로 멈춰요(실물 보드도 같아요 — 원고 146쪽은 g = Pin(32) 줄이 있고 값 3개를 받아요). 원고처럼 고친 파일은 같은 이름의 "(사이트판)" 예제예요.
