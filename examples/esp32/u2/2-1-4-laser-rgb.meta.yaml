practice:
  - "[실행]을 누르면 레이저가 켜진 뒤 18번 줄에서 TypeError로 멈춰요. 오류 풀이 카드를 읽어 봐요."
  - "set_color(r_on, b_on)은 값을 2개 받는데 set_color(1, 0, 0)처럼 3개를 넘겨서예요. 원고 146쪽 코드처럼 g = Pin(32, Pin.OUT)과 g.value(g_on)을 더해 고쳐요."
  - "고친 뒤 [실행]하면 레이저가 켜질 때 빨강, 꺼질 때 파랑이 1초마다 번갈아 켜져요(고친 코드는 \"(사이트판)\" 예제). 실물 레이저는 눈에 비추지 않아요."
