practice:
  - "[실행]을 누르면 콘솔에 \"ADC: 0 → No touch\"가 0.2초마다 나와요."
  - "보드 그림 아래 \"4채널 터치 센서 조작\"의 [패드 1]~[패드 4]를 차례로 누르고 있어요(Tab으로 옮겨 Space를 누르고 있어도 돼요). 값이 약 688·1535·2381·3263으로 바뀌고 Button 1~4가 나와요."
  - "원본 파일과 11~17번째 줄의 구간을 비교해 봐요. 구간이 서로 겹치지 않아야 패드를 하나씩 바르게 알아봐요. 다 봤으면 [정지]를 눌러요."
