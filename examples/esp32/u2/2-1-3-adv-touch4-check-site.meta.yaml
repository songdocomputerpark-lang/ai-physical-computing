# 예제 설명(사이드카). 원본 코드 파일은 줄 번호를 지키려고 고치지 않고, 제목·설명은 여기에 적어요(src/lab/README.md 3절).
# 사이트판(PLAN PD-10): 원본 파일은 그대로 두고 고친 줄에 "# [사이트판]"을 붙인 파일이에요. 사람이 직접 고쳐요.
title: "2-1-3 심화 동작 테스트: 4채널 터치 센서 값 읽기(사이트판)"
description: 원본 파일의 겹치는 판정 구간을 원고 152쪽 구간(500~800·1000~1700·2000~2500·3000~3500)으로 고친 파일이에요. 패드 1~4를 누르면 Button 1~4가 바르게 나와요. 고친 줄(11·13·15·17번째 줄)에는 [사이트판]이라고 적었고, 줄 번호는 원본과 같아요.
