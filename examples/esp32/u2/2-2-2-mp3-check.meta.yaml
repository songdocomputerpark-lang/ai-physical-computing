practice:
  - "[실행]을 눌러요. 소리를 들으려면 보드 그림 위 단추가 [소리 켜짐]인지 확인해요."
  - 'MP3 모듈 그림에 "1번 곡 재생 중"이 나오고 짧은 멜로디(약 3.6초)가 나와요. 멜로디가 끝나면 그림이 "멈춤"으로 바뀌고, 5초가 되면 23번 줄의 정지 명령을 보낸 뒤 코드가 끝나요.'
  - "21번 줄 send_cmd의 마지막 값(곡 번호 1)을 2나 3으로 바꿔 [실행]하면 다른 곡이 나와요."
