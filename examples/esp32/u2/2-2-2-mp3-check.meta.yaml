title: "2-2-2 출력 테스트: MP3 모듈로 첫 곡 재생하기"
description: "UART로 MP3 모듈에 명령 바이트를 보내 1번 곡을 틀고, 5초 뒤 정지 명령을 보내요. 가상 MP3 모듈의 곡은 사이트가 만든 짧은 소리예요."
