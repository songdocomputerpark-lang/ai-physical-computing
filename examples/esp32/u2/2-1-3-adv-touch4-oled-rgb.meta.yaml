title: "2-1-3 심화: 4채널 터치 버튼으로 OLED 글자와 RGB LED 색 바꾸기(원본 파일)"
description: 교과서 원본 파일 그대로라 결과가 생각과 다르게 나올 수 있어요 — 내 실수가 아니에요. 아날로그 터치 값을 읽어 누른 버튼을 OLED에 보이고 RGB LED 색을 바꿔요. 원본의 판정 구간은 원고 139쪽 측정값과 맞지 않아 패드 3(약 2381)만 Button 2로 알아보고 패드 1·2·4는 No touch로 나와요(교사용 참고). 원고 152쪽 구간으로 고친 파일은 같은 이름의 "(사이트판)" 예제예요. RGB LED의 12·5번 핀은 부팅에 쓰는 스트래핑 핀이라 실물에서는 주의해요.
lesson: 2-1-3
