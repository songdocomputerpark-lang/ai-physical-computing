practice:
  - "[실행]을 누르면 OLED에 ADC 값과 누른 버튼이 0.3초마다 새로 보여요."
  - "\"4채널 터치 센서 조작\"의 [패드 1]~[패드 4]를 누르고 있어요. 원본의 판정 구간에서는 패드 3(약 2381)만 Button 2로 알아봐 RGB LED가 초록으로 켜지고, 다른 패드는 No touch예요."
  - "get_button의 범위를 원고 152쪽처럼 500~800·1000~1700·2000~2500·3000~3500으로 고치면 네 패드가 빨강·초록·파랑·흰색으로 모두 켜져요(고친 코드는 \"(사이트판)\" 예제). 다 봤으면 [정지]를 눌러요."
