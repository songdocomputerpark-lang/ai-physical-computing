# 사이트판(PLAN PD-10): 원본 파일은 그대로 두고 고친 줄에 "# [사이트판]"을 붙인 파일이에요. 사람이 직접 고쳐요.
title: "2-1-4 기본: 레이저와 RGB LED 번갈아 켜기(사이트판)"
description: 원고 146쪽 코드처럼 초록 핀 줄(5번째 줄)과 값 3개를 받는 set_color(12·14번째 줄)를 더해 고친 파일이에요. 레이저가 켜질 때 빨강, 꺼질 때 파랑 LED가 1초마다 번갈아 켜져요. 원본 파일보다 2줄 길고, 8번째 줄부터는 원고 146쪽과 줄 번호가 같아요. 실물 레이저는 눈에 비추지 않아요.
