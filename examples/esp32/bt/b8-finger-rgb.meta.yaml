title: "블루투스 교안: 손가락 위치로 RGB LED 켜기(원본 파일)"
description: 보드 쪽 코드예요. a면 빨강, c면 초록을 1초씩 깜빡여요. 원본 파일은 빨강 LED 핀(GPIO12)이 ESP32BLE.py가 쓰는 상태 LED와 같아서 연결이 끊긴 동안 저절로 깜빡여요 — 사이트판은 27·32·33번으로 옮겨요(교안 83쪽 화면도 고치는 중이에요). b를 처리하는 분기도 없어 파랑은 쓰이지 않아요. 가상 보드의 블루투스는 아직 없어서 ModuleNotFoundError로 멈춰요(P4-03).
