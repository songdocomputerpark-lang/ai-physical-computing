# 예제 설명(사이드카). 원본 코드 파일은 줄 번호를 지키려고 고치지 않고, 제목·설명은 여기에 적어요(src/lab/README.md 3절).
# 사이트판(PLAN PD-10·PD-23): 원본 파일은 그대로 두고 고친 줄에 "# [사이트판]"을 붙인 파일이에요. 사람이 직접 고쳐요.
title: "블루투스 교안: 손가락 위치로 RGB LED 켜기(사이트판 — 핀 겹침 고침)"
description: 원본 파일은 빨강 LED가 GPIO12에 있어서 ESP32BLE.py가 연결 상태를 보여 주는 LED와 같은 핀을 써요. 그래서 연결 전에는 빨강이 저절로 깜빡이고, 연결되면 저절로 켜져요. 이 파일은 RGB를 27·32·33번으로 옮겨(블루투스 교안 83쪽 화면과 같은 묶음) 겹침을 없앤 파일이에요. 고친 줄은 12·13·14번째 줄 세 개뿐이고 줄 번호는 원본과 같아요.
