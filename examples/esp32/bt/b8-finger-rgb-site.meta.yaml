  - "[a]를 누르면 빨강이, [c]를 누르면 초록이 1초 켜졌다 꺼져요. 이번에는 아무것도 안 보낼 때 빨강이 저절로 깜빡이지 않아요."
  - 원본 파일(같은 이름의 사이트판이 아닌 예제)을 불러와 12·13·14번째 줄을 견줘 봐요. 다 봤으면 [정지]를 눌러요.
