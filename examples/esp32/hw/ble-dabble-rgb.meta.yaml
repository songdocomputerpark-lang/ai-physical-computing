title: "보드 확인: 스마트폰 앱이 보낸 프레임으로 RGB LED 켜기"
description: 스마트폰 앱이 블루투스로 보내는 이진 프레임(FF 02 01 01 …)을 받아 그 안에 1·2·3이 있으면 RGB LED 색을 바꿔요. 사이트는 이 프레임을 만들어 보내는 "가상 스마트폰 앱 패널"을 P4-03에서 붙여요. 지금은 이 파일이 부르는 esp32_ble_util이 아직 없어서 ModuleNotFoundError로 멈춰요.
