description: 원본 파일은 1·8번째 줄이 자료에 없는 이름 ESP32BLE_LIB을 불러서 실물 보드에서도 ImportError로 멈춰요. 이 파일은 그 두 줄을 ESP32BLE로 고치고, 주석 처리돼 있던 레이저 끄기 세 줄(99·100·101번째 줄)의 주석도 풀었어요. 줄 번호는 원본과 같고, 실물 레이저는 눈에 비추지 않아요.
