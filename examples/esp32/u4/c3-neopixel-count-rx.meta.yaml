# 사이트가 만든 예제라 설명·실습 방법·안내 상자는 .py 머리말에 있어요(src/lab/README.md 2절).
# title은 ESP32 예제 사이드카에 반드시 있어야 해요(tests/unit/lab/esp32-examples.test.ts) — .py 머리말 첫 줄과 같게 맞춰요.
# 배선(parts)도 머리말 `# @part`에 있지만, 차시 md가 없는 동안 갤러리 부품 태그가 붙도록 여기에도 적어요(같은 값이에요).
# 보충 차시 C3 md가 정식으로 들어오면(Phase 5) 차시 frontmatter가 먼저고, 여기 값은 그 다음이에요.
title: "보충 C3 보드 쪽: 받은 숫자만큼 네오픽셀 켜기"
lesson: c3
unit: 3
difficulty: 2
virtual_ok: true
comm:
  - uart
tags:
  - 네오픽셀
  - 통신
  - 시나리오 F
parts:
  - part: uart
    pins:
      rx: 17
      tx: 16
  - part: neopixel
    pin: 23
practice:
  - "[실행]을 눌러요. 링이 모두 꺼진 채로 글자가 오기를 기다려요(아직 아무 일도 없는 것이 정상이에요)."
  - 보드 아래 "USB-UART 변환기 조작" 칸의 [보낼 글자]에 3을 적고 [보내기]를 눌러 봐요. LED 3개가 켜지면 선이 잘 이어진 거예요.
  - 영상처리 실습실에서 짝 예제(c3-finger-count-send)를 실행하고 손가락을 펴 봐요. 편 손가락 수만큼 켜지면 성공이에요.
