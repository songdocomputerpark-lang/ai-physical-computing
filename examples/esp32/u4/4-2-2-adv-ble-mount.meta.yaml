title: "4-2-2 심화: 거치대에 맞춘 서보 각도 범위(원본 파일)"
description: 앞 예제와 같지만 거치대에 맞춰 서보가 도는 범위를 좁혔어요. 원본 파일 1번 줄이 자료에 없는 이름 ESP32BLE_LIB을 import해서 실물 보드에서도 ImportError로 멈춰요 — 1·8번째 줄을 ESP32BLE로 고친 파일은 같은 이름의 "(사이트판)" 예제예요(PLAN §6.5). 가상 보드도 옛 이름을 받아 주지 않아요.
