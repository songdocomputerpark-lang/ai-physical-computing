title: "4-2-2 탐구: 타이머로 LED를 저절로 끄기(원본 파일)"
description: 보드 쪽 코드예요. LED를 켠 시각을 적어 두었다가 2초가 지나면 저절로 꺼요(앞 예제들의 "LED가 잠깐만 켜진다" 문제를 푸는 방법이에요). 원본 파일은 1번 줄 이름이 ESP32BLE_LIB이고 레이저를 끄는 코드가 아예 없어요 — 사이트판에서 둘 다 고쳐요(PLAN PD-23). 빨강 LED 핀(GPIO12)이 ESP32BLE.py의 상태 LED와 겹치는 것도 사이트판에서 고쳐요.
