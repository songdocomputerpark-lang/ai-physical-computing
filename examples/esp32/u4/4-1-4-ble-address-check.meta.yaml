title: "4-1-4 기본: 보드의 블루투스 주소 확인하기"
description: 보드 쪽 코드예요. 블루투스를 켜고 보드 주소를 콘솔에 찍어요. 브라우저는 주소로 연결하지 않고 [BLE 연결] 선택 창에서 광고 이름으로 고르니, 사이트 차시는 "광고 이름 확인하기"로 바꿔 설명해요(PLAN §7.3). 가상 보드의 블루투스는 아직 없어서 ModuleNotFoundError로 멈춰요(P4-03).
