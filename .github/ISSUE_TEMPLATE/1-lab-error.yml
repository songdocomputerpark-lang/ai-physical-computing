# 실습실·사이트 오류 알리기 양식 — GitHub 이슈 양식 문법("Syntax for issue forms"·"Syntax for GitHub's form schema", docs.github.com 2026-09-26 확인)
# - 이름(name)은 기여·문의 페이지 목록(src/pages/contribute/_issue-templates.ts)과 같게 둔다(브라우저 테스트 tests/e2e/pages.spec.ts가 대조).
# - 파일 이름 앞 숫자는 GitHub "양식 고르기" 화면의 차례다(GitHub 문서: 양식은 파일 이름의 글자·숫자 순서로 보인다).
# - labels의 bug는 저장소에 이미 있는 이름표다(없는 이름표는 붙지 않는다 — 2026-09-26 gh label list로 확인).
# - 첫 칸(markdown)에는 "누구나 볼 수 있어요"와 개인정보 주의를 둔다(테스트가 확인). markdown 칸의 글은 이슈 본문에 들어가지 않는다.
name: 실습실·사이트 오류 알리기
description: 실습실이 열리지 않거나, [실행]·보드 연결·버튼이 생각대로 움직이지 않을 때 알려 주세요.
title: "[오류] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        알려 주셔서 고마워요. **이 글은 누구나 볼 수 있어요.** 이름·연락처·얼굴 사진 같은 개인정보는 적지 마세요.
        화면 캡처를 올릴 때는 컴퓨터 사용자 이름, 파일 경로, 다른 사람의 얼굴, 보드의 기기 주소가 보이지 않게 가려 주세요.
        먼저 [문제 해결](https://songdocomputerpark-lang.github.io/ai-physical-computing/help/)과 [파이썬 오류 사전](https://songdocomputerpark-lang.github.io/ai-physical-computing/help/errors/)에 같은 문제가 있는지 확인해 보세요.
        차시의 글·퀴즈가 틀렸다면 "차시 내용 오류 알리기" 양식이 더 알맞아요.
  - type: input
    id: page
    attributes:
      label: 문제가 생긴 페이지 주소
      description: 브라우저 주소창의 주소를 복사해 붙여 주세요.
      placeholder: "https://songdocomputerpark-lang.github.io/ai-physical-computing/labs/..."
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: 어디에서 생겼나요?
      options:
        - 영상처리 실습실
        - ESP32 실습실 — 가상 보드
        - ESP32 실습실 — 실제 보드
        - 통신 실습실·대시보드
        - 4단원 통합 실습실
        - 차시 페이지 안에서 연 실습실
        - 예제 갤러리
        - 보드 준비·펌웨어 굽기
        - 그 밖의 페이지
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: 어떤 일이 생겼나요?
      description: 무엇을 눌렀을 때 어떻게 되었는지 차례대로 적어 주세요. 고른 예제 이름도 함께 적어 주세요.
      placeholder: "예: 예제 목록에서 \"첫 실습: 웹캠 영상에서 테두리(에지) 찾기\"를 고르고 [실행]을 눌렀더니 출력 창이 까맣게만 보여요."
    validations:
      required: true
  - type: textarea
    id: error-text
    attributes:
      label: 오류 메시지(있으면)
      description: 콘솔의 마지막 줄(예 — NameError로 시작하는 줄)이나 오류 풀이 카드의 제목을 그대로 붙여 주세요. 컴퓨터 사용자 이름이 든 경로가 보이면 지워 주세요.
      render: text
    validations:
      required: false
  - type: textarea
    id: code
    attributes:
      label: 실행한 코드(예제를 고쳤다면)
      description: 고친 코드를 붙여 주세요. 와이파이 이름·비밀번호, 이름, 기기 주소(XX:XX:XX:XX:XX:XX처럼 가리기)는 지운 뒤 붙여 주세요.
      render: python
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: 원래 어떻게 되어야 했나요?
      placeholder: "예: 카메라 영상 옆에 흰 테두리 영상이 보여야 해요."
    validations:
      required: false
  - type: dropdown
    id: device
    attributes:
      label: 쓰는 기기
      options:
        - Windows 컴퓨터
        - Mac
        - 크롬북
        - Linux 컴퓨터
        - Android 휴대폰·태블릿
        - iPhone·iPad
        - 기타
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: 쓰는 브라우저
      options:
        - Chrome
        - Edge
        - 웨일
        - Firefox
        - Safari
        - 기타
    validations:
      required: true
  - type: textarea
    id: check-report
    attributes:
      label: 점검 결과(있으면)
      description: |
        [학교 네트워크와 브라우저 점검](https://songdocomputerpark-lang.github.io/ai-physical-computing/start/check/) 페이지에서 [결과 복사]를 누르고 여기에 붙여 주세요. 브라우저 종류, 운영체제, 창 크기, 사이트 판, 점검 결과만 들어 있어요.
        실제 보드 문제라면 [실물 점검 도우미](https://songdocomputerpark-lang.github.io/ai-physical-computing/labs/esp32/check/)의 [결과 복사] 글도 좋아요. 붙이기 전에 한 번 읽어 보고 개인정보가 보이면 지워 주세요.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: privacy-check
    attributes:
      label: 올리기 전에 확인해 주세요
      options:
        - label: 이 글과 첨부한 캡처에 개인정보(이름·연락처·얼굴·컴퓨터 사용자 이름·기기 주소)가 없어요.
          required: true
