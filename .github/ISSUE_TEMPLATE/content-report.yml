# 내용 오류·개인정보·저작권 제보 양식 — GitHub 이슈 양식 문법(docs.github.com "Syntax for issue forms", 2026-09-16 확인)
# 이름(name)은 기여·문의 페이지 목록(src/pages/contribute/_issue-templates.ts)과 같게 둔다.
# 이 저장소에는 비공개로 제보를 받는 창구가 없어서, 개인정보는 "위치만" 적게 한다(PLAN §9.3 7번 제보 처리).
# 받으면 확인하는 대로 해당 파일을 지우는 커밋을 올리고 sources.yaml로 위치를 찾아 바꾼다.
name: 내용 오류·개인정보·저작권 제보
description: 글·그림·코드가 틀렸거나, 개인정보나 저작권 문제가 보일 때 알려 주세요.
title: "[제보] "
body:
  - type: markdown
    attributes:
      value: |
        **이 글은 누구나 볼 수 있어요.**
        개인정보(얼굴이 보이는 사진, 이름, 연락처, 기기 주소, 컴퓨터 안 파일 경로)를 발견했다면 **그 내용을 옮겨 적거나 캡처해 올리지 말고, 어디에 있는지만** 적어 주세요. 확인하는 대로 사이트에서 지울게요.
        제보하는 분의 연락처도 적지 마세요. 답은 이 이슈의 댓글로 드려요.
  - type: dropdown
    id: kind
    attributes:
      label: 어떤 문제인가요?
      options:
        - 글·그림·코드 내용이 틀려요
        - 개인정보가 보여요
        - 저작권 문제가 있어 보여요
        - 기타
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: 페이지 주소
      description: 브라우저 주소창의 주소를 복사해 붙여 주세요.
      placeholder: "https://songdocomputerpark-lang.github.io/ai-physical-computing/..."
    validations:
      required: true
  - type: textarea
    id: location
    attributes:
      label: 페이지의 어디에 있나요?
      placeholder: "예: '따라하기' 칸의 세 번째 그림, 예제 코드 7번째 줄"
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: 무엇이 문제인가요?
      description: 내용 오류라면 어떻게 고치면 좋을지도 적어 주세요. 개인정보라면 개인정보 자체는 적지 말고 "얼굴이 보여요"처럼 종류만 적어 주세요.
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: 근거 자료(있으면)
      description: 공식 문서 주소처럼 확인할 수 있는 근거를 적어 주세요.
    validations:
      required: false
  - type: checkboxes
    id: privacy-check
    attributes:
      label: 올리기 전에 확인해 주세요
      options:
        - label: 개인정보 자체(이름·연락처·사진)를 이 글에 옮겨 적거나 첨부하지 않았어요.
          required: true
