# 이슈 양식 고르기 화면 설정(docs.github.com "Configuring issue templates for your repository", 2026-09-16 확인 · 2026-09-26 다시 확인)
# blank_issues_enabled: false — 읽기 권한 사용자는 빈 이슈 대신 양식만 보게 한다(개인정보 안내가 든 양식을 거치게).
#   쓰기 권한 이상(관리자)은 여전히 빈 이슈를 쓸 수 있다. 설정은 기본 브랜치(main)에 올라간 뒤에 적용된다.
# contact_links의 주소는 공개 사이트 주소로 적는다(tests/e2e/pages.spec.ts가 사이트 주소로 시작하는지, 이번 빌드에서 200인지 확인).
# 양식 파일 목록은 src/pages/contribute/_issue-templates.ts와 같게 둔다(파일 이름 앞 숫자 = 고르기 화면의 차례).
blank_issues_enabled: false
contact_links:
  - name: 문제 해결(자주 묻는 질문)
    url: https://songdocomputerpark-lang.github.io/ai-physical-computing/help/
    about: 카메라, 브라우저, 보드 연결처럼 자주 막히는 문제의 해결 방법을 먼저 확인해 보세요.
  - name: 파이썬 오류 사전
    url: https://songdocomputerpark-lang.github.io/ai-physical-computing/help/errors/
    about: 실습실 콘솔에 나온 오류 메시지(마지막 줄)의 뜻과 고치는 법을 찾아보세요.
  - name: 기여·문의 안내
    url: https://songdocomputerpark-lang.github.io/ai-physical-computing/contribute/
    about: 알림 양식을 고르는 방법과 개인정보를 안전하게 제보하는 방법을 안내해요.
