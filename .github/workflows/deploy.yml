# 사이트 배포 워크플로(PLAN §8.1 P1-03)
# main 브랜치에 push하면 사이트를 빌드해 GitHub Pages에 올린다.
# 주소: https://songdocomputerpark-lang.github.io/ai-physical-computing/
#
# 액션 버전은 2026-09-15에 각 공식 저장소의 최신 릴리스와 action.yml로 확인했다.
#   actions/checkout v7.0.1, actions/configure-pages v6.0.0, withastro/action v6.1.3, actions/deploy-pages v5.0.1
#   actions/setup-node v7.0.0(저장소 검사 작업, 2026-09-16 확인)
# 주 버전 태그(@v7 등)로 적어서 같은 주 버전의 수정판은 자동으로 받는다.
# 주 버전을 올릴 때는 각 저장소의 릴리스 노트와 action.yml을 먼저 확인한다.
name: 사이트 배포

on:
  push:
    branches: [main]
    # 진행 기록(PROGRESS.md)과 작업 잠금(.agent/)만 바뀐 push는 사이트 내용이 같아서 배포하지 않는다.
    paths-ignore:
      - '.agent/**'
      - 'PROGRESS.md'
  # 저장소 Actions 탭의 [Run workflow] 버튼으로 직접 실행할 수 있다.
  workflow_dispatch:

# 기본 권한은 저장소 읽기만 준다. 더 필요한 권한은 아래 작업(job)마다 따로 적는다.
# 권한을 하나라도 적으면 적지 않은 권한은 모두 none이 된다.
permissions:
  contents: read

# 배포는 한 번에 하나씩 한다. 진행 중인 배포는 끊지 않고, 기다리는 실행은 가장 최근 것만 남긴다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  repo-check:
    name: 저장소 안전 검사
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 커밋 전 훅과 같은 검사(scripts/check-repo.mjs, PLAN §8.0 PD-32)를 한 번 더 돌린다:
    # 원본 자료 형식·5MB 넘는 파일·원본 파일 이름·개인정보 형태·눈 확인 기록 없는 이미지·docs/SPEC.md.
    # 배포 작업이 이 작업을 기다리므로 검사에 실패하면 사이트에 올라가지 않는다.
    # 빌드 작업과 나란히 돌려서 배포까지 걸리는 시간은 늘지 않는다(시나리오 E).
    permissions:
      contents: read # 저장소 내려받기
    steps:
      - name: 저장소 내려받기
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Node.js 준비
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: 검사 도구 설치(package-lock.json 그대로, 설치 스크립트 실행 안 함)
        # 검사에는 yaml 패키지만 필요하다. npm ci는 package.json과 package-lock.json이 어긋나면 실패하므로
        # 두 파일이 맞는지도 함께 확인된다(withastro/action은 npm install을 써서 이것을 잡지 못한다).
        run: npm ci --ignore-scripts

      - name: 저장소 검사
        run: npm run check:repo

  build:
    name: 빌드
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 빌드 작업은 npm 패키지의 설치 스크립트를 실행하므로 쓰기 권한을 주지 않는다.
    permissions:
      contents: read # 저장소 내려받기
      pages: read # configure-pages가 Pages 설정을 읽는다
    env:
      # Astro는 CI에서도 익명 사용 통계를 보낸다(설치된 @astrojs/telemetry의 record()는 익명 ID만 CI.이름으로 바꿔 전송).
      # 새 실행 환경에서는 이 환경 변수로만 끌 수 있다. 익명 통계를 쓰지 않는 사이트 방침(PLAN §3.1)에 맞춘다.
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - name: 저장소 내려받기
        uses: actions/checkout@v7
        with:
          # 이 워크플로는 git push를 하지 않으므로 인증 정보를 작업 폴더에 남기지 않는다.
          persist-credentials: false

      - name: Pages 설정 확인
        id: pages
        # Pages가 켜져 있는지 확인한다. 꺼져 있으면 여기서 멈추고 오류를 보여 준다.
        # enablement는 쓰지 않는다. Pages는 이미 켜 두었고(2026-09-15, PD-12),
        # 이 옵션은 GITHUB_TOKEN이 아닌 별도 토큰이 있어야 동작한다(action.yml 설명).
        uses: actions/configure-pages@v6

      - name: 설치·빌드·결과 올리기
        # package-lock.json을 보고 npm을 골라 설치 → npm run build → dist/를 Pages용 결과물로 올린다.
        # npm run build는 앞뒤로 출처 검사(prebuild·postbuild, scripts/check-sources.mjs)를 돌려서
        # sources.yaml에 없는 파일이나 번들 의존성이 있으면 여기서 실패한다.
        uses: withastro/action@v6
        with:
          # Node.js 24 LTS(PLAN §3.1). 액션 기본값도 24지만, 기본값이 바뀌어도 그대로 쓰려고 적는다.
          node-version: '24'
          # package-manager는 적지 않는다. 비워 두면 package-lock.json으로 npm을 고르고 그 파일을 의존성 캐시 기준으로 쓴다.
          # 직접 적으면 캐시 기준 파일이 정해지지 않는다(v6.1.3 action.yml의 Check lockfiles 단계).

  deploy:
    name: 배포
    # 저장소 검사와 빌드가 모두 성공해야 배포한다.
    needs: [repo-check, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # deploy-pages가 요구하는 최소 권한(actions/deploy-pages README)
    permissions:
      pages: write # Pages 배포 만들기
      id-token: write # 이 배포가 허용된 브랜치에서 왔는지 확인하는 토큰(OIDC) 발급
    environment:
      # GitHub가 만든 배포 환경. main 브랜치만 배포할 수 있게 설정되어 있다(2026-09-15 확인).
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages에 올리기
        id: deployment
        uses: actions/deploy-pages@v5
