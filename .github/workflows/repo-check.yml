# 저장소 안전 검사 워크플로 (2026-09-18 검토 반영)
#
# 왜 따로 있나: 배포(deploy.yml)와 테스트(e2e.yml)는 `paths-ignore`로 PROGRESS.md·.agent/**만 바뀐 push를 건너뛴다.
# 그런데 PROGRESS.md는 이 프로젝트에서 가장 자주 커밋되는 파일이고, 자유 서술 한국어 기록이라 절대 경로·학교 이름·이메일이
# 섞일 위험이 가장 높은 파일이다. 그 push에서는 CI의 `check:repo`가 한 번도 돌지 않아, 커밋 전 훅이 유일한 관문이 된다
# (훅은 GitHub 웹 편집기 커밋·`core.hooksPath`를 아직 켜지 않은 새 클론·다른 컴퓨터 세션에서는 돌지 않는다).
# 노출되는 곳은 사이트가 아니라 공개 저장소 자체이므로(배포가 안 돌아도 push 즉시 공개) 이 워크플로는 **어떤 경로가 바뀌어도**
# 돈다. 검사 내용은 커밋 전 훅(.githooks/pre-commit)·deploy.yml의 저장소 검사 작업과 같은 scripts/check-repo.mjs다.
#
# 액션 버전은 2026-09-16에 확인한 릴리스의 커밋 SHA로 고정한다(까닭은 deploy.yml 머리말).
#   actions/checkout v7.0.1, actions/setup-node v7.0.0
name: 저장소 검사

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-check:
    name: 저장소 안전 검사(경로에 상관없이)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 저장소 내려받기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node.js 준비
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: 의존성 설치(package-lock.json 그대로)
        run: npm ci

      - name: 저장소 검사
        run: npm run check:repo
