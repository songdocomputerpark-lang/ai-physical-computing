# 테스트 워크플로(PLAN §8.1 P1-09, PD-35)
# push와 풀 리퀘스트(PR)마다 단위 테스트·타입 검사, 브라우저 테스트(Playwright)·링크 검사를 돌린다.
# 사이트 배포(deploy.yml)와 따로 돌기 때문에 여기서 실패해도 배포는 막히지 않는다.
# 실패하면 Actions 탭에 빨간 X가 남고, 브라우저 테스트 보고서를 결과물(artifact)로 올린다. 실패는 PROGRESS.md에 적는다.
#
# 액션 버전은 2026-09-16에 각 공식 저장소의 최신 릴리스(releases/latest)로 확인했다.
#   actions/checkout v7.0.1, actions/setup-node v7.0.0, actions/cache v6.1.0, actions/upload-artifact v7.0.1
# 액션은 그 릴리스의 커밋 SHA로 고정한다(이유와 올리는 법은 deploy.yml 머리말).
# 풀 리퀘스트(포크 포함)도 저장소 검사(check:repo)를 거친다 — 병합 전에 원본 형식·개인정보 모양을 잡기 위해서다.
name: 테스트

on:
  push:
    branches: [main]
    # 진행 기록(PROGRESS.md)과 작업 잠금(.agent/)만 바뀐 push는 코드가 같아서 돌리지 않는다(deploy.yml과 같음).
    paths-ignore:
      - '.agent/**'
      - 'PROGRESS.md'
  pull_request:
  # 저장소 Actions 탭의 [Run workflow] 버튼으로 직접 실행할 수 있다.
  workflow_dispatch:

# 저장소 읽기만 한다(결과물 올리기는 이 권한으로 된다).
permissions:
  contents: read

# 같은 브랜치에 새 push가 오면 앞의 테스트 실행은 멈추고 새 코드만 시험한다.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # Astro 익명 사용 통계를 보내지 않는다(PLAN §3.1, deploy.yml과 같음).
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  unit:
    name: 단위 테스트·타입 검사
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 저장소 내려받기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node.js 준비
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: 의존성 설치(package-lock.json 그대로)
        run: npm ci

      - name: 저장소 검사(풀 리퀘스트도 병합 전에 검사)
        run: npm run check:repo

      - name: 단위 테스트(Vitest)
        run: npm test

      - name: 타입 검사(astro check)
        run: npm run check

  e2e:
    name: 브라우저 테스트·링크 검사
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 저장소 내려받기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node.js 준비
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: 의존성 설치(package-lock.json 그대로)
        run: npm ci

      - name: Playwright 버전 읽기
        id: playwright
        # 브라우저는 @playwright/test 버전마다 정해진 판이 있어서, 설치 캐시 이름에 이 버전을 넣는다(PD-35).
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

      # 되살리기(restore)와 저장(save)을 나눠, 브라우저를 처음 설치한 실행에서 테스트가 실패해도 캐시는 저장되게 한다
      # (actions/cache 한 단계로 쓰면 작업이 실패했을 때 저장 단계를 건너뛴다 — 2026-09-16 첫 실행에서 확인).
      - name: 브라우저 설치 캐시 되살리기
        id: browser-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: 브라우저(Chromium)와 시스템 패키지 설치
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: 브라우저 설치 캐시 저장(처음 설치했을 때만)
        if: steps.browser-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.browser-cache.outputs.cache-primary-key }}

      - name: 시스템 패키지만 설치(브라우저는 캐시에서 되살림)
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: 브라우저 테스트(빌드 → 미리 보기 → 데스크톱·모바일 화면)
        # playwright.config.ts의 webServer가 npm run build(출처 검사·검색 색인 포함) 뒤 astro preview를 띄운다.
        # CI에서는 Playwright 전용 Chromium을 쓰고, 실패한 테스트는 한 번 더 시도한다.
        run: npm run test:e2e

      - name: 링크 검사(방금 빌드한 dist/)
        # 브라우저 테스트가 실패해도 링크 검사 결과는 따로 본다.
        if: ${{ !cancelled() }}
        run: npm run check:links

      - name: 실패 보고서 올리기
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
