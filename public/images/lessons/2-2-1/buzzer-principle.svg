<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="title desc">
<title id="title">버저가 소리를 내는 원리</title>
<desc id="desc">세 칸 그림. ① ESP32 핀의 전기 신호가 1과 0, 곧 켜졌다 꺼졌다를 빠르게 되풀이한다. ② 버저 안의 코일에 생기는 전자기장이 얇은 진동판을 밀었다 놓았다 해서 진동판이 떨린다. ③ 진동판의 떨림이 공기를 흔들어 음파가 되고 귀에 소리로 들린다. 아래에 1초에 떨리는 횟수(주파수)가 많을수록 높은 소리가 난다고 적혀 있다. 사이트가 직접 그린 그림.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#4a5361"/></marker></defs>
<rect width="640" height="300" fill="#ffffff"/>
<g font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif">
<text x="320" y="26" font-size="18" font-weight="700" fill="#17191c" text-anchor="middle">버저가 소리를 내는 차례</text>
<rect x="12" y="44" width="184" height="190" rx="12" fill="#f4f6f9" stroke="#7b8594" stroke-width="1"/>
<text x="104" y="70" font-size="17" font-weight="700" fill="#17191c" text-anchor="middle">① 전기 신호</text>
<rect x="228" y="44" width="184" height="190" rx="12" fill="#f4f6f9" stroke="#7b8594" stroke-width="1"/>
<text x="320" y="70" font-size="17" font-weight="700" fill="#17191c" text-anchor="middle">② 진동판의 떨림</text>
<rect x="444" y="44" width="184" height="190" rx="12" fill="#f4f6f9" stroke="#7b8594" stroke-width="1"/>
<text x="536" y="70" font-size="17" font-weight="700" fill="#17191c" text-anchor="middle">③ 공기의 떨림(음파)</text>
<polyline points="42.0,150.0 42.0,104.0 59.2,104.0 59.2,150.0 76.5,150.0 76.5,150.0 76.5,104.0 93.8,104.0 93.8,150.0 111.0,150.0 111.0,150.0 111.0,104.0 128.2,104.0 128.2,150.0 145.5,150.0 145.5,150.0 145.5,104.0 162.8,104.0 162.8,150.0 180.0,150.0" fill="none" stroke="#1f5bd6" stroke-width="3" stroke-linejoin="round"/>
<text x="26" y="110" font-size="15" fill="#4a5361" font-family="'Consolas', 'D2Coding', 'Menlo', monospace">1</text>
<text x="26" y="156" font-size="15" fill="#4a5361" font-family="'Consolas', 'D2Coding', 'Menlo', monospace">0</text>
<text x="104" y="192" font-size="16" fill="#17191c" text-anchor="middle">켜졌다 꺼졌다를</text>
<text x="104" y="216" font-size="16" fill="#17191c" text-anchor="middle">빠르게 되풀이해요</text>
<text x="320" y="94" font-size="15" font-weight="700" fill="#c25e00" text-anchor="middle">진동판</text>
<path d="M262 110 Q320 96 378 110" fill="none" stroke="#c25e00" stroke-width="4"/>
<path d="M262 110 Q320 122 378 110" fill="none" stroke="#c25e00" stroke-width="2" stroke-dasharray="5 4"/>
<rect x="258" y="122" width="124" height="44" rx="6" fill="#3a4250" stroke="#2b3440" stroke-width="1"/>
<rect x="290" y="130" width="60" height="28" rx="4" fill="#6b7682" stroke="#2b3440" stroke-width="1"/>
<text x="320" y="150" font-size="15" fill="#ffffff" text-anchor="middle">코일</text>
<text x="320" y="192" font-size="16" fill="#17191c" text-anchor="middle">전자기장이 진동판을</text>
<text x="320" y="216" font-size="16" fill="#17191c" text-anchor="middle">밀었다 놓았다 해요</text>
<path d="M474.5 115.5 A12 12 0 0 1 474.5 132.5" fill="none" stroke="#c25e00" stroke-width="2.5" stroke-linecap="round"/>
<path d="M483.7 106.3 A25 25 0 0 1 483.7 141.7" fill="none" stroke="#c25e00" stroke-width="2.5" stroke-linecap="round"/>
<path d="M492.9 97.1 A38 38 0 0 1 492.9 150.9" fill="none" stroke="#c25e00" stroke-width="2.5" stroke-linecap="round"/>
<path d="M502.1 87.9 A51 51 0 0 1 502.1 160.1" fill="none" stroke="#c25e00" stroke-width="2.5" stroke-linecap="round"/>
<path d="M576 100 C600 82 620 116 600 136 C592 146 586 152 578 146" fill="#f6d5c3" stroke="#8a5a44" stroke-width="2"/>
<text x="536" y="192" font-size="16" fill="#17191c" text-anchor="middle">떨림이 공기를 흔들어</text>
<text x="536" y="216" font-size="16" fill="#17191c" text-anchor="middle">귀에 소리로 들려요</text>
<line x1="198" y1="132" x2="224" y2="132" stroke="#4a5361" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="414" y1="132" x2="440" y2="132" stroke="#4a5361" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="320" y="276" font-size="16" fill="#4a5361" text-anchor="middle">1초에 떨리는 횟수(주파수)가 많을수록 높은 소리가 나요.</text>
</g>
</svg>
