<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" role="img" aria-labelledby="title desc">
<title id="title">도레미파솔라시도와 주파수</title>
<desc id="desc">막대그래프. 도 262Hz, 레 294Hz, 미 330Hz, 파 349Hz, 솔 392Hz, 라 440Hz, 시 494Hz, 높은 도 523Hz로 오른쪽 음일수록 막대가 높다. 아래 괄호로 도와 높은 도를 이어 523은 262의 약 2배이고, 2배로 떨면 한 옥타브 높은 같은 음이 된다고 적혀 있다. 사이트가 직접 그린 그림.</desc>
