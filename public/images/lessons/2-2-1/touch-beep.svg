<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" width="640" height="290" role="img" aria-labelledby="title desc">
<title id="title">터치 센서로 버저를 울리는 때</title>
<desc id="desc">시간 그래프. 위 줄 터치 센서 값은 0.5초부터 2초까지, 3초부터 약 3.3초까지 1(누름)이다. 아래 줄 버저는 누르기 시작한 0.5초와 3초에만 0.5초 동안 켜진다. 빨간 동그라미는 지금 값이 1이고 바로 전 값이 0인 순간을 표시한다. 누르고 있어도 한 번만 울리고 손을 뗄 때는 울리지 않는다. 사이트가 직접 그린 그림.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#4a5361"/></marker></defs>
<rect width="640" height="290" fill="#ffffff"/>
<g font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif">
<text x="320" y="26" font-size="18" font-weight="700" fill="#17191c" text-anchor="middle">누른 순간(0 → 1)에만 0.5초 울려요</text>
<line x1="150" y1="52" x2="150" y2="214" stroke="#d6dde6" stroke-width="1"/>
<text x="150" y="232" font-size="15" fill="#4a5361" text-anchor="middle">0초</text>
<line x1="265" y1="52" x2="265" y2="214" stroke="#d6dde6" stroke-width="1"/>
<text x="265" y="232" font-size="15" fill="#4a5361" text-anchor="middle">1초</text>
<line x1="380" y1="52" x2="380" y2="214" stroke="#d6dde6" stroke-width="1"/>
<text x="380" y="232" font-size="15" fill="#4a5361" text-anchor="middle">2초</text>
<line x1="495" y1="52" x2="495" y2="214" stroke="#d6dde6" stroke-width="1"/>
<text x="495" y="232" font-size="15" fill="#4a5361" text-anchor="middle">3초</text>
<line x1="610" y1="52" x2="610" y2="214" stroke="#d6dde6" stroke-width="1"/>
<text x="610" y="232" font-size="15" fill="#4a5361" text-anchor="middle">4초</text>
<text x="12" y="92" font-size="16" font-weight="700" fill="#17191c">터치 센서</text>
<text x="12" y="114" font-size="14" fill="#4a5361" font-family="'Consolas', 'D2Coding', 'Menlo', monospace">touch.value()</text>
<text x="12" y="168" font-size="16" font-weight="700" fill="#17191c">버저</text>
<text x="12" y="190" font-size="15" fill="#4a5361">(소리)</text>
<polyline points="150.0,112 207.5,112 207.5,72 380.0,72 380.0,112 495.0,112 495.0,72 535.2,72 535.2,112 610.0,112" fill="none" stroke="#1f5bd6" stroke-width="3"/>
<text x="293.8" y="64" font-size="15" fill="#1f5bd6" text-anchor="middle">누르고 있어요(1)</text>
<circle cx="207.5" cy="72" r="7" fill="none" stroke="#d92b2b" stroke-width="2.5"/>
<circle cx="495.0" cy="72" r="7" fill="none" stroke="#d92b2b" stroke-width="2.5"/>
<rect x="207.5" y="150" width="57.5" height="40" rx="4" fill="#c25e00" stroke="#c25e00" stroke-width="1"/>
<text x="236.2" y="176" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">0.5초</text>
<rect x="495" y="150" width="57.5" height="40" rx="4" fill="#c25e00" stroke="#c25e00" stroke-width="1"/>
<text x="523.8" y="176" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">0.5초</text>
<line x1="150" y1="190" x2="610" y2="190" stroke="#7b8594" stroke-width="1"/>
<text x="328.2" y="256" font-size="15" fill="#17191c" text-anchor="middle">누르고 있어도 한 번만 울리고, 손을 뗄 때는 울리지 않아요.</text>
<text x="328.2" y="278" font-size="15" fill="#d92b2b" text-anchor="middle">빨간 동그라미: 지금 값 1, 바로 전 값 0인 순간</text>
</g>
</svg>
