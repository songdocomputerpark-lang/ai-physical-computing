<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 256" width="360" height="256" role="img" aria-labelledby="title desc">
<title id="title">OLED에 그리는 세 단계: 지우기, 그리기, 보내기</title>
<desc id="desc">세 칸으로 나눈 그림. 위 줄은 보드 메모리(버퍼), 아래 줄은 실제 OLED 화면이다. ① oled.fill(0)은 버퍼를 검게 지운다. ② oled.text()와 oled.pixel()은 버퍼에 글자 Hi와 동그라미를 그리지만 OLED 화면은 아직 그대로다. ③ oled.show()를 부르면 버퍼의 그림이 OLED 화면으로 한꺼번에 보내져 Hi와 동그라미가 보인다. 휴대폰처럼 좁은 화면에서 읽기 쉽게 같은 내용을 다시 배치한 그림이다(그림 설명이 말하는 자리는 그대로 둠). 사이트가 직접 그린 그림.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f5bd6"/></marker></defs>
<rect width="360" height="256" fill="#ffffff"/>
<rect x="10" y="70" width="104" height="56" rx="6" fill="#1c232d"/>
<rect x="16" y="76" width="92" height="44" fill="#0b0f14"/>
<rect x="10" y="166" width="104" height="56" rx="6" fill="#1c232d"/>
<rect x="16" y="172" width="92" height="44" fill="#0b0f14"/>
<rect x="128" y="70" width="104" height="56" rx="6" fill="#1c232d"/>
<rect x="134" y="76" width="92" height="44" fill="#0b0f14"/>
<rect x="128" y="166" width="104" height="56" rx="6" fill="#1c232d"/>
<rect x="134" y="172" width="92" height="44" fill="#0b0f14"/>
<circle cx="202" cy="98" r="10" fill="none" stroke="#ffffff" stroke-width="2.5"/>
<rect x="246" y="70" width="104" height="56" rx="6" fill="#1c232d"/>
<rect x="252" y="76" width="92" height="44" fill="#0b0f14"/>
<rect x="246" y="166" width="104" height="56" rx="6" fill="#1c232d"/>
<rect x="252" y="172" width="92" height="44" fill="#0b0f14"/>
<circle cx="320" cy="98" r="10" fill="none" stroke="#ffffff" stroke-width="2.5"/>
<circle cx="320" cy="194" r="10" fill="none" stroke="#ffffff" stroke-width="2.5"/>
<line x1="298" y1="128" x2="298" y2="160" stroke="#1f5bd6" stroke-width="3" marker-end="url(#arrow)"/>
<g font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif">
<text x="62" y="20" font-family="'Consolas', 'D2Coding', 'Menlo', monospace" font-size="13" fill="#17191c" text-anchor="middle">① oled.fill(0)</text>
<text x="180" y="20" font-family="'Consolas', 'D2Coding', 'Menlo', monospace" font-size="13" fill="#17191c" text-anchor="middle">② oled.text()</text>
<text x="180" y="38" font-family="'Consolas', 'D2Coding', 'Menlo', monospace" font-size="13" fill="#17191c" text-anchor="middle">oled.pixel()</text>
<text x="298" y="20" font-family="'Consolas', 'D2Coding', 'Menlo', monospace" font-size="13" fill="#17191c" text-anchor="middle">③ oled.show()</text>
<text x="10" y="62" font-size="13" fill="#4a5361"><tspan font-weight="700" fill="#17191c">보드 메모리</tspan> (버퍼)</text>
<text x="10" y="158" font-size="13" font-weight="700" fill="#17191c">OLED 화면</text>
<text x="306" y="150" font-size="13" font-weight="700" fill="#1a4cb4">보내기</text>
<text x="62" y="199" font-size="13" fill="#cfd6e0" text-anchor="middle">아직 그대로</text>
<text x="142" y="106" font-family="'Consolas', 'D2Coding', 'Menlo', monospace" font-size="20" font-weight="700" fill="#ffffff">Hi</text>
<text x="180" y="199" font-size="13" fill="#cfd6e0" text-anchor="middle">아직 그대로</text>
<text x="260" y="106" font-family="'Consolas', 'D2Coding', 'Menlo', monospace" font-size="20" font-weight="700" fill="#ffffff">Hi</text>
<text x="260" y="202" font-family="'Consolas', 'D2Coding', 'Menlo', monospace" font-size="20" font-weight="700" fill="#ffffff">Hi</text>
<text x="62" y="244" font-size="13" fill="#17191c" text-anchor="middle">검게 지워요</text>
<text x="180" y="244" font-size="13" fill="#17191c" text-anchor="middle">버퍼에 그려요</text>
<text x="298" y="244" font-size="13" fill="#17191c" text-anchor="middle">화면으로 보내요</text>
</g>
</svg>
