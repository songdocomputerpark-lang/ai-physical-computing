<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 352" width="360" height="352" role="img" aria-labelledby="title desc">
<title id="title">OLED(128×64)의 픽셀 좌표</title>
<desc id="desc">가로 128점, 세로 64점인 OLED 화면. 원점 (0, 0)은 왼쪽 위이고, x는 오른쪽으로 0부터 127까지, y는 아래로 0부터 63까지 커진다. 오른쪽 아래 끝 점은 (127, 63)이다. 화면에는 y=0 자리에 Hello, ESP32!, y=16 자리에 OLED Display!가 쓰여 있고, 아래에는 글자 H 하나를 크게 확대해 가로 8점, 세로 8점 칸에 그려진 것을 보여 준다. 휴대폰처럼 좁은 화면에서 읽기 쉽게 화면 그림을 줄이고 글자는 제 크기로 다시 적은 그림이다. 사이트가 직접 그린 그림.</desc>
