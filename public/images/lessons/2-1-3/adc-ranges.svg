<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 394" width="640" height="394" role="img" aria-labelledby="title desc">
<title id="title">4채널 터치 센서의 ADC 값과 버튼 판정 구간</title>
<desc id="desc">0부터 4095까지의 수직선 위에 안 누름 0, 패드 1 688, 패드 2 1535, 패드 3 2381, 패드 4 3263이 점으로 찍혀 있다. 아래 초록 줄은 겹치지 않는 판정 구간(500~800, 1000~1700, 2000~2500, 3000~3500)으로 네 값이 버튼 1~4에 하나씩 들어간다. 그 아래 빨간 줄은 원본 파일의 구간(500~1200, 1000~2500, 2000~4000, 3000~4200)으로 서로 겹쳐서, 패드 3의 2381이 버튼 2와 버튼 3 구간에 모두 들어가 먼저 확인한 버튼 2로, 패드 4의 3263이 버튼 3으로 잘못 판정된다. 사이트가 직접 그린 그림.</desc>
<rect width="640" height="394" fill="#ffffff"/>
<g font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif">
<text x="320" y="22" font-size="17" font-weight="700" fill="#17191c" text-anchor="middle">4채널 터치 센서: 패드마다 다른 ADC 값(0~4095)이 나와요</text>
<line x1="154.7" y1="104" x2="154.7" y2="336" stroke="#7b8594" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="266.4" y1="104" x2="266.4" y2="336" stroke="#7b8594" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="378.0" y1="104" x2="378.0" y2="336" stroke="#7b8594" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="494.3" y1="104" x2="494.3" y2="336" stroke="#7b8594" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="64" y1="104" x2="604" y2="104" stroke="#17191c" stroke-width="2.5"/>
<line x1="64.0" y1="98" x2="64.0" y2="110" stroke="#17191c" stroke-width="2"/>
<text x="64.0" y="130" font-size="16" fill="#4a5361" text-anchor="middle">0</text>
<line x1="195.9" y1="98" x2="195.9" y2="110" stroke="#17191c" stroke-width="2"/>
<text x="195.9" y="130" font-size="16" fill="#4a5361" text-anchor="middle">1000</text>
<line x1="327.7" y1="98" x2="327.7" y2="110" stroke="#17191c" stroke-width="2"/>
<text x="327.7" y="130" font-size="16" fill="#4a5361" text-anchor="middle">2000</text>
<line x1="459.6" y1="98" x2="459.6" y2="110" stroke="#17191c" stroke-width="2"/>
<text x="459.6" y="130" font-size="16" fill="#4a5361" text-anchor="middle">3000</text>
<line x1="604.0" y1="98" x2="604.0" y2="110" stroke="#17191c" stroke-width="2"/>
<text x="604.0" y="130" font-size="16" fill="#4a5361" text-anchor="middle">4095</text>
<circle cx="64.0" cy="104" r="7" fill="#f6d36b" stroke="#b7800f" stroke-width="2"/>
<text x="64.0" y="64" font-size="16" font-weight="700" fill="#17191c" text-anchor="middle">안 누름</text>
<text x="64.0" y="86" font-size="16" fill="#17191c" text-anchor="middle">0</text>
<circle cx="154.7" cy="104" r="7" fill="#f6d36b" stroke="#b7800f" stroke-width="2"/>
<text x="154.7" y="64" font-size="16" font-weight="700" fill="#17191c" text-anchor="middle">패드 1</text>
<text x="154.7" y="86" font-size="16" fill="#17191c" text-anchor="middle">688</text>
<circle cx="266.4" cy="104" r="7" fill="#f6d36b" stroke="#b7800f" stroke-width="2"/>
<text x="266.4" y="64" font-size="16" font-weight="700" fill="#17191c" text-anchor="middle">패드 2</text>
<text x="266.4" y="86" font-size="16" fill="#17191c" text-anchor="middle">1535</text>
<circle cx="378.0" cy="104" r="7" fill="#f6d36b" stroke="#b7800f" stroke-width="2"/>
<text x="378.0" y="64" font-size="16" font-weight="700" fill="#17191c" text-anchor="middle">패드 3</text>
<text x="378.0" y="86" font-size="16" fill="#17191c" text-anchor="middle">2381</text>
<circle cx="494.3" cy="104" r="7" fill="#f6d36b" stroke="#b7800f" stroke-width="2"/>
<text x="494.3" y="64" font-size="16" font-weight="700" fill="#17191c" text-anchor="middle">패드 4</text>
<text x="494.3" y="86" font-size="16" fill="#17191c" text-anchor="middle">3263</text>
<text x="8" y="160" font-size="16" font-weight="700" fill="#15653a">겹치지 않는 구간(교과서 152쪽, 사이트판)</text>
<rect x="129.9" y="170" width="39.6" height="22" rx="4" fill="#e8f6ee" stroke="#3b9360" stroke-width="2"/>
<text x="149.7" y="214" font-size="16" fill="#15653a" text-anchor="middle" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">버튼 1</text>
<rect x="195.9" y="170" width="92.3" height="22" rx="4" fill="#e8f6ee" stroke="#3b9360" stroke-width="2"/>
<text x="242.0" y="214" font-size="16" fill="#15653a" text-anchor="middle" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">버튼 2</text>
<rect x="327.7" y="170" width="65.9" height="22" rx="4" fill="#e8f6ee" stroke="#3b9360" stroke-width="2"/>
<text x="360.7" y="214" font-size="16" fill="#15653a" text-anchor="middle" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">버튼 3</text>
<rect x="459.6" y="170" width="65.9" height="22" rx="4" fill="#e8f6ee" stroke="#3b9360" stroke-width="2"/>
<text x="492.6" y="214" font-size="16" fill="#15653a" text-anchor="middle" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">버튼 4</text>
<text x="8" y="236" font-size="16" font-weight="700" fill="#a3232a">서로 겹치는 구간(원본 파일)</text>
<rect x="129.9" y="246" width="92.3" height="16" rx="3" fill="#fdecec" stroke="#d24b4b" stroke-width="1.5"/>
<text x="123.9" y="260" font-size="16" fill="#a3232a" text-anchor="end" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">버튼 1</text>
<rect x="195.9" y="268" width="197.8" height="16" rx="3" fill="#fdecec" stroke="#d24b4b" stroke-width="1.5"/>
<text x="189.9" y="282" font-size="16" fill="#a3232a" text-anchor="end" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">버튼 2</text>
<rect x="327.7" y="290" width="263.7" height="16" rx="3" fill="#fdecec" stroke="#d24b4b" stroke-width="1.5"/>
<text x="321.7" y="304" font-size="16" fill="#a3232a" text-anchor="end" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">버튼 3</text>
<rect x="459.6" y="312" width="144.4" height="16" rx="3" fill="#fdecec" stroke="#d24b4b" stroke-width="1.5"/>
<text x="453.6" y="326" font-size="16" fill="#a3232a" text-anchor="end" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">버튼 4</text>
<text x="8" y="356" font-size="16" fill="#17191c">구간이 겹치면 먼저 확인한 버튼이 돼요. 그래서 원본 파일은 패드 3(2381)을</text>
<text x="8" y="380" font-size="16" fill="#17191c">버튼 2로, 패드 4(3263)를 버튼 3으로 잘못 알아봐요.</text>
</g>
</svg>
