<line x1="146.2" y1="136" x2="146.2" y2="348" stroke="#7b8594" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="210.2" y1="136" x2="210.2" y2="348" stroke="#7b8594" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="277" y1="136" x2="277" y2="348" stroke="#7b8594" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="30" y1="84" x2="30" y2="136" stroke="#b8c1cc" stroke-width="1.5"/>
<line x1="146.2" y1="84" x2="146.2" y2="136" stroke="#b8c1cc" stroke-width="1.5"/>
<line x1="277" y1="84" x2="277" y2="136" stroke="#b8c1cc" stroke-width="1.5"/>
<line x1="30" y1="136" x2="340" y2="136" stroke="#17191c" stroke-width="2.5"/>
