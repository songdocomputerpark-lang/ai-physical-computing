<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 424" width="360" height="424" role="img" aria-labelledby="title desc">
<title id="title">4채널 터치 센서의 ADC 값과 버튼 판정 구간</title>
<desc id="desc">0부터 4095까지의 수직선 위에 안 누름 0, 패드 1 688, 패드 2 1535, 패드 3 2381, 패드 4 3263이 점으로 찍혀 있다(이름표는 두 줄로 엇갈려 적었다). 아래 초록 줄은 겹치지 않는 판정 구간(500~800, 1000~1700, 2000~2500, 3000~3500)으로 네 값이 버튼 1~4에 하나씩 들어간다. 그 아래 빨간 줄은 원본 파일의 구간(500~1200, 1000~2500, 2000~4000, 3000~4200)으로 서로 겹쳐서, 패드 3의 2381이 버튼 2와 버튼 3 구간에 모두 들어가 먼저 확인한 버튼 2로, 패드 4의 3263이 버튼 3으로 잘못 판정된다. 휴대폰처럼 좁은 화면에서 읽기 쉽게 같은 내용을 다시 배치한 그림이다. 사이트가 직접 그린 그림.</desc>
