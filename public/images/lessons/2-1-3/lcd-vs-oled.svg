<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 316" width="640" height="316" role="img" aria-labelledby="title desc">
<title id="title">LCD와 OLED가 빛을 내는 방법과 보여 줄 수 있는 것</title>
<desc id="desc">왼쪽 LCD: 뒤의 백라이트가 빛을 비추고 앞의 액정이 그 빛을 막거나 통과시킨다. 화면은 글자 칸 단위(16칸 × 2줄)라 HELLO 같은 글자를 보여 준다. 오른쪽 OLED: 픽셀 하나하나가 스스로 빛을 내고 백라이트가 없다. 화면을 점 단위(128 × 64)로 다뤄 글자 Hi와 원, 선, 네모 같은 도형도 그린다. 사이트가 직접 그린 그림.</desc>
