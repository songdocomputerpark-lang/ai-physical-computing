<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 272" width="640" height="272" role="img" aria-labelledby="title desc">
<title id="title">점을 켜고 꺼서 그림을 그리는 작은 화면</title>
<desc id="desc">왼쪽은 작은 화면에 심박수 78 bpm과 오르내리는 그래프를 보여 주는 스마트 밴드이다. 그래프 한 부분을 점선 네모로 표시해 오른쪽에 크게 확대했더니, 네모난 점(픽셀) 가운데 켜진 흰 점들이 이어져 그래프 선이 된 것이 보인다. 사이트가 직접 그린 그림.</desc>
