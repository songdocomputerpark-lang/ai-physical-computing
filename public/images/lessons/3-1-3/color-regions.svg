<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 394" width="640" height="394" role="img" aria-labelledby="title desc">
<title id="title">손끝 좌표에 따라 켜는 색: 카메라 화면 640×480을 x &lt; 100이면 빨강, 그 밖에 y &lt; 100이면 초록, 나머지는 파랑으로 나눈 지도</title>
<desc id="desc">왼쪽은 가로 640, 세로 480인 카메라 화면을 줄여 그린 지도다. 왼쪽 끝 x가 100보다 작은 세로 띠는 빨강, 그 오른쪽에서 y가 100보다 작은 위쪽 띠는 초록, 나머지 넓은 곳은 파랑이다. 점 네 개: ① (50, 200)은 빨강, ② (220, 50)은 초록, ③ (355, 152)는 파랑, ④ (60, 40)은 x와 y가 모두 100보다 작지만 x를 먼저 보므로 빨강이다. 오른쪽은 보드 코드가 조건을 보는 차례(if x &lt; 100, elif y &lt; 100, else)다. 아래: (0, 0)은 왼쪽 위이고 y는 아래로 갈수록 커지며, 기준값 100은 화면 크기에 맞게 바꾼다. 사이트가 직접 그린 그림(INVENTORY S88).</desc>
<rect width="640" height="394" fill="#ffffff"/>
<g font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif">

<!-- 영역 -->
<rect x="52" y="46" width="60" height="288" fill="#fdecec" stroke="#d24b4b" stroke-width="2"/>
<rect x="112" y="46" width="324" height="60" fill="#e8f6ee" stroke="#3b9360" stroke-width="2"/>
<rect x="112" y="106" width="324" height="228" fill="#eaf1fe" stroke="#5b87e0" stroke-width="2"/>

<!-- 축 눈금 -->
<g font-size="16" fill="#4a5361">
<text x="52" y="36" text-anchor="middle">0</text>
<text x="112" y="36" text-anchor="middle">100</text>
<text x="436" y="36" text-anchor="middle">640</text>
<text x="44" y="52" text-anchor="end">0</text>
<text x="44" y="112" text-anchor="end">100</text>
<text x="44" y="340" text-anchor="end">480</text>
<text x="300" y="20" font-weight="700">x →</text>
<text x="8" y="220" font-weight="700">y</text>
<text x="10" y="242" font-weight="700">↓</text>
</g>

<!-- 영역 이름 -->
<g font-size="17" font-weight="700" text-anchor="middle">
<text x="82" y="222" fill="#a3232a">빨</text>
<text x="82" y="244" fill="#a3232a">강</text>
<text x="340" y="82" fill="#15653a">초록</text>
<text x="300" y="236" fill="#1a4cb4">파랑</text>
</g>
<g font-size="16" text-anchor="middle">
<text x="82" y="276" fill="#a3232a">x&lt;100</text>
<text x="300" y="262" fill="#1a4cb4">x ≥ 100, y ≥ 100</text>
</g>

<!-- 점 -->
<g font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">
<circle cx="82" cy="166" r="13" fill="#a3232a"/>
<text x="82" y="172">1</text>
<circle cx="184" cy="76" r="13" fill="#15653a"/>
<text x="184" y="82">2</text>
<circle cx="265" cy="137" r="13" fill="#1a4cb4"/>
<text x="265" y="143">3</text>
<circle cx="88" cy="70" r="13" fill="#a3232a"/>
<text x="88" y="76">4</text>
</g>

<!-- 오른쪽: 조건 차례와 예 -->
<rect x="452" y="46" width="180" height="288" rx="10" fill="#f4f6f9" stroke="#d6dde6" stroke-width="1.5"/>
<text x="466" y="74" font-size="16" font-weight="700" fill="#17191c">보드가 보는 차례</text>
<g font-size="16" fill="#17191c">
<text x="466" y="102">if x &lt; 100</text>
<text x="486" y="124" fill="#a3232a" font-weight="700">→ 빨강</text>
<text x="466" y="150">elif y &lt; 100</text>
<text x="486" y="172" fill="#15653a" font-weight="700">→ 초록</text>
<text x="466" y="198">else</text>
<text x="486" y="220" fill="#1a4cb4" font-weight="700">→ 파랑</text>
</g>
<line x1="466" y1="236" x2="618" y2="236" stroke="#d6dde6" stroke-width="1.5"/>
<g font-size="16" fill="#17191c">
<text x="466" y="260">1 (50, 200) 빨강</text>
<text x="466" y="282">2 (220, 50) 초록</text>
<text x="466" y="304">3 (355, 152) 파랑</text>
<text x="466" y="326">4 (60, 40) 빨강</text>
</g>

<text x="8" y="364" font-size="16" fill="#17191c">(0, 0)은 왼쪽 위예요. y는 아래로 갈수록 커져요. 4번 점은 두 조건이 다 맞지만</text>
<text x="8" y="386" font-size="16" fill="#17191c">x를 먼저 보므로 빨강이에요. 기준값 100은 화면 크기에 맞게 바꿔요.</text>
</g>
</svg>
