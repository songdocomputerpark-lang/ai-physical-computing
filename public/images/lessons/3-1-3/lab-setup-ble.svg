<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 404" width="640" height="404" role="img" aria-labelledby="title desc">
<title id="title">3-1-3 짝 실습 순서: 4단원 통합 실습실에서 3-1-3 짝을 불러와 재생 입력으로 함께 실행하기</title>
<desc id="desc">왼쪽은 네 단계다. ① 4단원 통합 실습실을 연다. ② [짝 예제 바꾸기]를 펼쳐 "(3단원) 3-1-3 — 손끝 좌표로 RGB LED"의 [이 짝 불러오기]를 누른다. ③ 카메라 입력에서 재생 입력(합성 좌표)을 고른다(웹캠이 있으면 웹캠도 된다). ④ [함께 실행]을 누르면 보드 코드, 블루투스 연결, 컴퓨터 코드 차례로 돈다. 오른쪽은 화면의 대략적인 자리다. 위에 [함께 실행]과 카메라 입력, 그 아래 짝 예제 바꾸기, 아래에 컴퓨터 칸과 보드 칸이 나란히 있고 두 칸 사이를 가상 블루투스 전파가 잇는다. 사이트가 직접 그린 그림.</desc>
<rect width="640" height="404" fill="#ffffff"/>
<g font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif">

<g font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">
<circle cx="28" cy="36" r="15" fill="#1f5bd6"/>
<text x="28" y="42">1</text>
<circle cx="28" cy="126" r="15" fill="#1f5bd6"/>
<text x="28" y="132">2</text>
<circle cx="28" cy="232" r="15" fill="#1f5bd6"/>
<text x="28" y="238">3</text>
<circle cx="28" cy="318" r="15" fill="#1f5bd6"/>
<text x="28" y="324">4</text>
</g>
<g font-size="16" fill="#17191c" font-weight="700">
<text x="54" y="42">4단원 통합 실습실을 열어요</text>
<text x="54" y="132">[짝 예제 바꾸기]를 펼쳐서</text>
<text x="54" y="238">카메라 입력에서</text>
<text x="54" y="324">그다음</text>
</g>
<g font-size="16" font-weight="700" text-anchor="middle">
<rect x="54" y="54" width="190" height="34" rx="8" fill="#ffffff" stroke="#1f5bd6" stroke-width="2"/>
<text x="149" y="77" fill="#1a4cb4">4단원 통합 실습실</text>
<rect x="54" y="144" width="150" height="34" rx="8" fill="#ffffff" stroke="#1f5bd6" stroke-width="2"/>
<text x="129" y="167" fill="#1a4cb4">이 짝 불러오기</text>
<rect x="54" y="250" width="206" height="34" rx="8" fill="#ffffff" stroke="#4a5361" stroke-width="2"/>
<text x="157" y="273" fill="#17191c">재생 입력(합성 좌표)</text>
<rect x="54" y="336" width="112" height="34" rx="8" fill="#1f5bd6"/>
<text x="110" y="359" fill="#ffffff">함께 실행</text>
</g>
<g font-size="16" fill="#4a5361">
<text x="54" y="202">(3단원) 3-1-3 — 손끝 좌표로 RGB LED</text>
<text x="270" y="273">웹캠도 돼요</text>
<text x="54" y="392">보드 → 블루투스 연결 → 컴퓨터 차례로 돌아요</text>
</g>

<!-- 오른쪽: 화면 자리 -->
<rect x="398" y="12" width="234" height="360" rx="10" fill="#ffffff" stroke="#7b8594" stroke-width="1.5"/>
<rect x="408" y="22" width="214" height="40" rx="6" fill="#f4f6f9"/>
<rect x="414" y="29" width="84" height="26" rx="6" fill="#1f5bd6"/>
<text x="456" y="48" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">함께 실행</text>
<text x="504" y="48" font-size="16" fill="#4a5361">카메라 입력 ▾</text>
<rect x="408" y="70" width="214" height="34" rx="6" fill="#eaf1fe" stroke="#5b87e0" stroke-width="1.5"/>
<text x="418" y="93" font-size="16" font-weight="700" fill="#1a4cb4">▸ 짝 예제 바꾸기</text>

<rect x="408" y="114" width="98" height="248" rx="6" fill="#f4f6f9" stroke="#d6dde6" stroke-width="1.5"/>
<text x="457" y="140" text-anchor="middle" font-size="16" font-weight="700" fill="#4a5361">컴퓨터 칸</text>
<rect x="418" y="154" width="78" height="58" rx="4" fill="#20242b"/>
<circle cx="450" cy="176" r="3" fill="#8fd3ff"/>
<path d="M440 206 L446 190 L450 176 M446 190 L458 196" fill="none" stroke="#9aa3ad" stroke-width="2"/>
<text x="457" y="238" text-anchor="middle" font-size="16" fill="#4a5361">Sent: …</text>

<rect x="524" y="114" width="98" height="248" rx="6" fill="#e8f6ee" stroke="#3b9360" stroke-width="2"/>
<text x="573" y="140" text-anchor="middle" font-size="16" font-weight="700" fill="#15653a">보드 칸</text>
<rect x="540" y="154" width="66" height="44" rx="3" fill="#ffffff" stroke="#4a5361" stroke-width="1.5"/>
<g stroke-width="1.5">
<circle cx="552" cy="222" r="8" fill="#fdecec" stroke="#d24b4b"/>
<circle cx="573" cy="222" r="8" fill="#e8f6ee" stroke="#3b9360"/>
<circle cx="594" cy="222" r="8" fill="#1f5bd6" stroke="#1a4cb4"/>
</g>
<text x="573" y="258" text-anchor="middle" font-size="16" fill="#15653a">Received…</text>

<g fill="none" stroke="#1f5bd6" stroke-width="2.5" stroke-linecap="round">
<path d="M508 280 Q514 292 508 304"/>
<path d="M515 274 Q524 292 515 310"/>
</g>

<g font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">
<circle cx="400" cy="87" r="12" fill="#1f5bd6"/>
<text x="400" y="93">2</text>
<circle cx="620" cy="42" r="12" fill="#1f5bd6"/>
<text x="620" y="48">3</text>
<circle cx="410" cy="30" r="12" fill="#1f5bd6"/>
<text x="410" y="36">4</text>
</g>
</g>
</svg>
