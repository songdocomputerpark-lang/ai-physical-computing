<text x="241" y="142" font-size="18" font-weight="700" text-anchor="middle" fill="#17191c">80</text>
<text x="241" y="180" font-size="16" text-anchor="middle" fill="#4a5361">지금 값</text>
<text x="241" y="204" font-size="16" text-anchor="middle" fill="#4a5361">하나를 크게</text>
<rect x="324" y="14" width="150" height="206" rx="10" fill="#f4f6f9" stroke="#d6dde6" stroke-width="1.5"/>
<text x="399" y="40" font-size="16" font-weight="700" text-anchor="middle" fill="#17191c">스위치</text>
<rect x="336" y="52" width="126" height="96" rx="4" fill="#ffffff" stroke="#7b8594" stroke-width="1.2"/>
<rect x="373" y="76" width="52" height="28" rx="14" fill="#1f5bd6" stroke="#1a4cb4" stroke-width="1.5"/><circle cx="411" cy="90" r="10" fill="#ffffff"/>
<text x="399" y="132" font-size="16" font-weight="700" text-anchor="middle" fill="#1a4cb4">켜짐</text>
<text x="399" y="180" font-size="16" text-anchor="middle" fill="#4a5361">누르면 보드에</text>
<text x="399" y="204" font-size="16" text-anchor="middle" fill="#4a5361">on, off 보내기</text>
<rect x="482" y="14" width="150" height="206" rx="10" fill="#f4f6f9" stroke="#d6dde6" stroke-width="1.5"/>
<text x="557" y="40" font-size="16" font-weight="700" text-anchor="middle" fill="#17191c">텍스트 로그</text>
