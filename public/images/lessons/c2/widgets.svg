<text x="83" y="180" font-size="16" text-anchor="middle" fill="#4a5361">시간에 따른</text>
<text x="83" y="204" font-size="16" text-anchor="middle" fill="#4a5361">값의 변화</text>
<rect x="166" y="14" width="150" height="206" rx="10" fill="#f4f6f9" stroke="#d6dde6" stroke-width="1.5"/>
<text x="241" y="40" font-size="16" font-weight="700" text-anchor="middle" fill="#17191c">게이지</text>
