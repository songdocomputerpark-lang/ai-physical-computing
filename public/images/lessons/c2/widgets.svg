<text x="504" y="78" font-size="16" fill="#17191c" font-family="ui-monospace, 'Cascadia Mono', Consolas, 'D2Coding', 'Malgun Gothic', monospace">tx → 75</text>
<text x="504" y="102" font-size="16" fill="#17191c" font-family="ui-monospace, 'Cascadia Mono', Consolas, 'D2Coding', 'Malgun Gothic', monospace">tx → 80</text>
<text x="504" y="126" font-size="16" fill="#15653a" font-family="ui-monospace, 'Cascadia Mono', Consolas, 'D2Coding', 'Malgun Gothic', monospace">rx ← on</text>
<text x="557" y="180" font-size="16" text-anchor="middle" fill="#4a5361">오고 간 글을</text>
<text x="557" y="204" font-size="16" text-anchor="middle" fill="#4a5361">그대로 쌓기</text>
<text x="16" y="252" font-size="16" fill="#17191c">그래프, 게이지: 받을 토픽 esp32-01/tx</text>
<text x="16" y="278" font-size="16" fill="#17191c">스위치: 보낼 토픽 esp32-01/rx</text>
<text x="16" y="304" font-size="16" fill="#17191c">텍스트 로그: 모든 토픽(#)</text>
</g>
</svg>
