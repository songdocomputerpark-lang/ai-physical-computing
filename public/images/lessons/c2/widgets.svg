<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-labelledby="title desc">
<title id="title">대시보드 위젯 네 가지: 실시간 그래프, 게이지, 스위치, 텍스트 로그</title>
<desc id="desc">카드 네 장이 나란히 있다. 실시간 그래프 카드는 오르내리는 꺾은선으로 시간에 따른 값의 변화를 보인다. 게이지 카드는 반달 눈금에 바늘과 80을 크게 보인다. 스위치 카드는 켜짐 상태의 스위치로, 누르면 보드에 on, off를 보낸다. 텍스트 로그 카드는 tx → 75, tx → 80, rx ← on처럼 오고 간 글을 그대로 쌓는다. 아래에 그래프와 게이지는 받을 토픽 esp32-01/tx, 스위치는 보낼 토픽 esp32-01/rx, 텍스트 로그는 모든 토픽(#)을 쓴다고 적혀 있다. 사이트가 직접 그린 그림.</desc>
<defs>

</defs>
<rect width="640" height="320" fill="#ffffff"/>
