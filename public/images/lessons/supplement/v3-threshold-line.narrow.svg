<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 226" width="360" height="226" role="img" aria-labelledby="title desc">
<title id="title">임계값으로 나누기: 픽셀 밝기 12개를 0~255 눈금 위에 놓고 기준 128보다 큰 것은 흰색(255), 나머지는 검은색(0)으로 바꾼 결과</title>
<desc id="desc">위 줄에 밝기 20부터 250까지 픽셀 12칸이 있고 칸 위에 밝기 숫자가 적혀 있다. 가운데 0부터 255까지 눈금 위에 각 픽셀의 값이 점으로 놓여 있고, 파란 점선이 기준 128을 표시한다. 아래 줄에는 기준보다 큰 픽셀은 255(흰색), 나머지는 0(검은색)으로 바뀐 결과 12칸이 있고 칸 아래에 숫자가 적혀 있다. 휴대폰처럼 좁은 화면에서 읽기 쉽게 칸을 좁히고 숫자를 칸 밖에 적어 다시 그린 그림이다. 사이트가 직접 그린 그림.</desc>
