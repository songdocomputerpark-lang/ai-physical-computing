<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 206" width="360" height="206" role="img" aria-labelledby="title desc">
<title id="title">3×3 평균 필터(블러)가 6×6 입력 격자 위를 한 칸씩 옮겨 다니며 4×4 결과 격자를 채우는 애니메이션. 결과 칸의 값은 겹친 아홉 칸의 평균이다</title>
<desc id="desc">왼쪽 6×6 입력 격자에 밝기 숫자가 적혀 있고(어두운 바탕 40, 왼쪽 위 한 칸만 60, 가운데 밝은 세로 막대 200, 오른쪽 아래 잡티 한 칸 240), 파란 3×3 창이 격자 위를 한 칸씩 옮겨 다닌다. 오른쪽 4×4 결과 격자에는 창이 지나간 자리마다 아홉 칸의 평균값이 하나씩 채워진다. 움직임 줄이기 설정에서는 마지막 장면만 보인다. 휴대폰처럼 좁은 화면에서 읽기 쉽게 칸을 줄여 다시 그린 그림이다. 사이트가 직접 그린 그림.</desc>
