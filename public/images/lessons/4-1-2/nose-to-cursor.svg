<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" role="img" aria-labelledby="title desc">
<title id="title">코가 기준점에서 움직인 거리(-30~+30픽셀)를 화면의 가로 좌표(0~1920)로 옮기는 비례식</title>
<desc id="desc">위쪽 눈금은 코가 기준점에서 가로로 움직인 거리로 -30, -15, 0, +15, +30픽셀이 적혀 있고, 0 자리에 파란 십자(기준점), +15 자리에 초록 코 점이 있다. 아래쪽 눈금은 화면의 가로 좌표로 0, 480, 960, 1440, 1920이 적혀 있고, 1440 자리에 커서가 있다. 위아래 눈금을 점선이 이어 -30은 0(왼쪽 끝), 0은 960(가운데), +15는 1440, +30은 1920(오른쪽 끝)에 대응한다. 아래 상자에는 식 "화면 x = 움직인 거리 ÷ 60 × 1920 + 960"과, 30픽셀보다 더 움직여도 커서는 화면 끝(0 또는 1919)에 머문다는 설명이 있다. 사이트가 직접 그린 그림.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 Z" fill="#4a5361"/>
</marker>
</defs>
<rect width="640" height="380" fill="#ffffff"/>
<g font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif">
<text x="320" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#17191c">코가 움직인 만큼 커서를 옮겨요(가로 방향)</text>

<!-- 위: 코의 움직임 -->
<text x="60" y="68" font-size="17" font-weight="700" fill="#17191c">웹캠: 코가 기준점에서 움직인 거리(픽셀)</text>
<line x1="60" y1="100" x2="580" y2="100" stroke="#4a5361" stroke-width="2.5"/>
<g stroke="#4a5361" stroke-width="2">
<line x1="60" y1="92" x2="60" y2="108"/>
<line x1="190" y1="92" x2="190" y2="108"/>
<line x1="320" y1="92" x2="320" y2="108"/>
<line x1="450" y1="92" x2="450" y2="108"/>
<line x1="580" y1="92" x2="580" y2="108"/>
</g>
<g stroke="#1f5bd6" stroke-width="3.5">
<line x1="320" y1="84" x2="320" y2="116"/>
<line x1="304" y1="100" x2="336" y2="100"/>
</g>
<circle cx="450" cy="100" r="8" fill="#3b9360" stroke="#ffffff" stroke-width="2"/>
<g font-size="16" fill="#17191c" text-anchor="middle">
<text x="60" y="132">-30</text>
<text x="190" y="132">-15</text>
<text x="320" y="132">0</text>
<text x="450" y="132" font-weight="700" fill="#15653a">+15</text>
<text x="580" y="132">+30</text>
</g>

<!-- 대응 점선 -->
<g stroke="#7b8594" stroke-width="1.8" stroke-dasharray="6 5" fill="none">
<line x1="60" y1="140" x2="60" y2="206"/>
<line x1="320" y1="140" x2="320" y2="206"/>
<line x1="580" y1="140" x2="580" y2="206"/>
</g>
<line x1="450" y1="140" x2="450" y2="206" stroke="#1f5bd6" stroke-width="2.2" stroke-dasharray="6 5"/>

<!-- 아래: 화면 -->
<rect x="60" y="210" width="520" height="30" fill="#f4f6f9" stroke="#4a5361" stroke-width="2"/>
<g stroke="#4a5361" stroke-width="2">
<line x1="190" y1="210" x2="190" y2="240"/>
<line x1="320" y1="210" x2="320" y2="240"/>
<line x1="450" y1="210" x2="450" y2="240"/>
</g>
<path d="M450 216 L450 238 L455 233 L460 243 L464 241 L459 231 L466 231 Z" fill="#17191c" stroke="#ffffff" stroke-width="1"/>
<g font-size="16" fill="#17191c" text-anchor="middle">
<text x="60" y="264">0</text>
<text x="190" y="264">480</text>
<text x="320" y="264">960</text>
<text x="450" y="264" font-weight="700" fill="#1a4cb4">1440</text>
<text x="580" y="264">1920</text>
</g>
<text x="60" y="288" font-size="17" font-weight="700" fill="#17191c">화면: 커서의 가로 좌표(픽셀)</text>

<!-- 식 -->
<rect x="20" y="302" width="600" height="64" rx="12" fill="#eaf1fe" stroke="#5b87e0" stroke-width="1.5"/>
<text x="320" y="330" text-anchor="middle" font-size="18" font-weight="700" fill="#1a4cb4">화면 x = 움직인 거리 ÷ 60 × 1920 + 960</text>
<text x="320" y="355" text-anchor="middle" font-size="16" fill="#17191c">30픽셀보다 더 움직여도 커서는 화면 끝(0 또는 1919)에 머물러요</text>
</g>
</svg>
