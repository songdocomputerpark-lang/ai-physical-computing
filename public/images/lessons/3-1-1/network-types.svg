<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" role="img" aria-labelledby="title desc">
<title id="title">통신 방식 세 가지의 연결 모양: 시리얼(선으로 1:1), 블루투스(전파로 가까이, 골라서 1:1), 와이파이·MQTT(인터넷의 중계 서버를 거쳐 여럿이)</title>
<desc id="desc">세 칸이 나란히 있다. 왼쪽 시리얼(UART) 칸은 컴퓨터에서 USB 선이 변환기로 가고, 변환기에서 TX·RX 두 선이 ESP32 보드로 간다. 선으로 두 기기를 직접 잇는 1:1 연결이고 예는 3-1-2의 레이저다. 가운데 블루투스(BLE) 칸은 ESP32 보드가 전파로 이름을 알리고 위의 컴퓨터가 골라서 연결한다. 가까운 거리의 1:1 연결이고 예는 3-1-3의 RGB LED다. 오른쪽 와이파이·MQTT 칸은 보드, 스마트폰, 컴퓨터가 모두 인터넷의 중계 서버와 주고받는다. 멀리 있는 여러 기기가 함께 쓰는 연결이고 예는 보충 차시 C1이다. 사이트가 직접 그린 그림.</desc>
