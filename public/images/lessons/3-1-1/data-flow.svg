<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" width="640" height="430" role="img" aria-labelledby="title desc">
<title id="title">인공지능의 결과가 보드까지 가는 다섯 단계: 영상 처리 → 데이터 변환 → 전송 → 수신 → 제어</title>
<desc id="desc">위에서 아래로 다섯 단계가 이어진다. 컴퓨터(파이썬)에서 ① 영상 처리로 보낼 결과를 글자 'c'로 준비하고, ② 데이터 변환으로 글자를 바이트 99로 바꾼다(인코딩). ③ 전송 단계에서 바이트 99가 선(시리얼)이나 전파(블루투스)로 건너간다. 보드(ESP32)에서 ④ 수신으로 바이트를 다시 글자 'c'로 되돌리고(디코딩), ⑤ 제어로 조건문 if data == 'c'를 써서 LED를 켠다. 사이트가 직접 그린 그림(INVENTORY S80, 원고 185쪽 흐름도를 다시 그림).</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 Z" fill="#4a5361"/>
</marker>
</defs>
<rect width="640" height="430" fill="#ffffff"/>
<g font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif">

<g fill="none" stroke-width="3" stroke-linecap="round">
<path d="M98 20 H90 V176 H98" stroke="#1f5bd6"/>
<path d="M98 270 H90 V408 H98" stroke="#15653a"/>
</g>
<g text-anchor="middle" font-size="17" font-weight="700">
<text x="46" y="94" fill="#1a4cb4">컴퓨터</text>
<text x="46" y="116" fill="#1a4cb4" font-size="16" font-weight="400">파이썬</text>
<text x="46" y="226" fill="#4a5361">통로</text>
<text x="46" y="334" fill="#15653a">보드</text>
<text x="46" y="356" fill="#15653a" font-size="16" font-weight="400">ESP32</text>
</g>

<g stroke="#4a5361" stroke-width="2.5">
<line x1="180" y1="84" x2="180" y2="102" marker-end="url(#arrow)"/>
<line x1="180" y1="158" x2="180" y2="176" marker-end="url(#arrow)"/>
<line x1="180" y1="232" x2="180" y2="250" marker-end="url(#arrow)"/>
<line x1="180" y1="306" x2="180" y2="324" marker-end="url(#arrow)"/>
</g>

<g text-anchor="middle" font-size="17" font-weight="700">
<rect x="110" y="24" width="140" height="56" rx="28" fill="#ffffff" stroke="#1f5bd6" stroke-width="2"/>
<text x="180" y="58" fill="#1a4cb4">① 영상 처리</text>
<rect x="110" y="98" width="140" height="56" rx="28" fill="#ffffff" stroke="#1f5bd6" stroke-width="2"/>
<text x="180" y="132" fill="#1a4cb4">② 데이터 변환</text>
<rect x="110" y="172" width="140" height="56" rx="28" fill="#ffffff" stroke="#4a5361" stroke-width="2"/>
<text x="180" y="206" fill="#17191c">③ 전송</text>
<rect x="110" y="246" width="140" height="56" rx="28" fill="#ffffff" stroke="#15653a" stroke-width="2"/>
<text x="180" y="280" fill="#15653a">④ 수신</text>
<rect x="110" y="320" width="140" height="56" rx="28" fill="#15653a"/>
<text x="180" y="354" fill="#ffffff">⑤ 제어</text>
</g>

<g font-size="16">
<rect x="264" y="20" width="364" height="64" rx="12" fill="#f4f6f9" stroke="#d6dde6"/>
<text x="280" y="46" fill="#17191c">보낼 결과를 글자로 준비해요.</text>
<text x="280" y="70" fill="#1a4cb4" font-weight="700">결과 = 'c'</text>
<rect x="264" y="94" width="364" height="64" rx="12" fill="#f4f6f9" stroke="#d6dde6"/>
<text x="280" y="120" fill="#17191c">글자를 바이트로 바꿔요(인코딩).</text>
<text x="280" y="144" fill="#1a4cb4" font-weight="700">'c'.encode() → b'c' = 바이트 99</text>
<rect x="264" y="168" width="364" height="64" rx="12" fill="#f4f6f9" stroke="#d6dde6"/>
<text x="280" y="194" fill="#17191c">선(시리얼)이나 전파(블루투스)로 보내요.</text>
<text x="280" y="218" fill="#1a4cb4" font-weight="700">바이트 99가 건너가요</text>
<rect x="264" y="242" width="364" height="64" rx="12" fill="#f4f6f9" stroke="#d6dde6"/>
<text x="280" y="268" fill="#17191c">바이트를 글자로 되돌려요(디코딩).</text>
<text x="280" y="292" fill="#15653a" font-weight="700">b'c'.decode() → 'c'</text>
<rect x="264" y="316" width="364" height="64" rx="12" fill="#f4f6f9" stroke="#d6dde6"/>
<text x="280" y="342" fill="#17191c">조건문으로 할 일을 정해 장치를 움직여요.</text>
<text x="280" y="366" fill="#15653a" font-weight="700">if data == 'c': LED 켜기</text>
</g>
<text x="280" y="414" font-size="16" fill="#4a5361">시리얼이든 블루투스든 이 다섯 단계는 같아요.</text>
</g>
</svg>
