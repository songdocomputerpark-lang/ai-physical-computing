<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" role="img" aria-labelledby="title desc">
<title id="title">받은 바이트 되돌리기: 줄바꿈에서 자르고, 쉼표로 나누고, 정수로 바꾼다</title>
<desc id="desc">맨 위 줄에 도착한 바이트를 글자로 본 모습 1, 2, 0, 쉼표, 2, 5, 0, 줄바꿈, 1, 2, 4, 쉼표, 2, 7, 8, 줄바꿈이 차례로 놓여 있고, 줄바꿈 뒤마다 자르는 점선이 있다. ① 줄바꿈에서 자르면 '120,250'과 '124,278' 두 줄이 된다. ② 첫 줄을 쉼표로 나누면 글자 조각 '120'과 '250'이 된다. ③ int()로 바꾸면 정수 x = 120, y = 250이 된다. 맨 아래에 나눈 조각은 아직 글자라서 int()로 바꿔야 크기를 비교할 수 있다고 적혀 있다. 사이트가 직접 그린 그림(INVENTORY S81, 원고 186~187쪽).</desc>
<rect width="640" height="340" fill="#ffffff"/>
<g font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif">
<text x="20" y="32" font-size="19" font-weight="700" fill="#17191c">도착한 바이트(글자로 본 모습)</text>

<g stroke="#7b8594" stroke-width="1.5">
<rect x="28" y="48" width="34" height="44" fill="#ffffff"/><rect x="64" y="48" width="34" height="44" fill="#ffffff"/><rect x="100" y="48" width="34" height="44" fill="#ffffff"/>
<rect x="136" y="48" width="34" height="44" fill="#eaf1fe"/>
<rect x="172" y="48" width="34" height="44" fill="#ffffff"/><rect x="208" y="48" width="34" height="44" fill="#ffffff"/><rect x="244" y="48" width="34" height="44" fill="#ffffff"/>
<rect x="280" y="48" width="34" height="44" fill="#fff4d8" stroke="#b7800f"/>
<rect x="324" y="48" width="34" height="44" fill="#ffffff"/><rect x="360" y="48" width="34" height="44" fill="#ffffff"/><rect x="396" y="48" width="34" height="44" fill="#ffffff"/>
<rect x="432" y="48" width="34" height="44" fill="#eaf1fe"/>
<rect x="468" y="48" width="34" height="44" fill="#ffffff"/><rect x="504" y="48" width="34" height="44" fill="#ffffff"/><rect x="540" y="48" width="34" height="44" fill="#ffffff"/>
<rect x="576" y="48" width="34" height="44" fill="#fff4d8" stroke="#b7800f"/>
</g>
<g font-size="20" text-anchor="middle" fill="#17191c" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">
<text x="45" y="77">1</text><text x="81" y="77">2</text><text x="117" y="77">0</text><text x="153" y="77" font-weight="700" fill="#1a4cb4">,</text>
<text x="189" y="77">2</text><text x="225" y="77">5</text><text x="261" y="77">0</text><text x="297" y="76" font-size="17" font-weight="700" fill="#7a4a00">\n</text>
<text x="341" y="77">1</text><text x="377" y="77">2</text><text x="413" y="77">4</text><text x="449" y="77" font-weight="700" fill="#1a4cb4">,</text>
<text x="485" y="77">2</text><text x="521" y="77">7</text><text x="557" y="77">8</text><text x="593" y="76" font-size="17" font-weight="700" fill="#7a4a00">\n</text>
</g>
<g stroke="#7a4a00" stroke-width="2" stroke-dasharray="5 4">
<line x1="319" y1="40" x2="319" y2="100"/>
<line x1="615" y1="40" x2="615" y2="100"/>
</g>

<g font-size="17" font-weight="700" fill="#17191c">
<text x="28" y="140">① 줄바꿈에서 자르기</text>
<text x="28" y="204">② 쉼표로 나누기</text>
<text x="28" y="268">③ 정수로 바꾸기</text>
</g>
<g font-size="16" fill="#4a5361" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">
<text x="28" y="162">readline(), strip()</text>
<text x="28" y="226">split(',')</text>
<text x="28" y="290">int()</text>
</g>
<g font-size="18" font-weight="700" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">
<rect x="250" y="124" width="140" height="36" rx="18" fill="#ffffff" stroke="#7b8594" stroke-width="1.5"/>
<text x="320" y="148" fill="#17191c">'120,250'</text>
<rect x="404" y="124" width="140" height="36" rx="18" fill="#ffffff" stroke="#d6dde6" stroke-width="1.5"/>
<text x="474" y="148" fill="#4a5361">'124,278'</text>
<rect x="250" y="188" width="190" height="36" rx="18" fill="#ffffff" stroke="#1f5bd6" stroke-width="1.5"/>
<text x="345" y="212" fill="#1a4cb4">['120', '250']</text>
<rect x="250" y="252" width="100" height="36" rx="18" fill="#1f5bd6"/>
<text x="300" y="276" fill="#ffffff">120</text>
<rect x="362" y="252" width="100" height="36" rx="18" fill="#1f5bd6"/>
<text x="412" y="276" fill="#ffffff">250</text>
</g>
<text x="476" y="276" font-size="17" fill="#17191c">→ x, y</text>
<text x="556" y="148" font-size="16" fill="#4a5361">다음 줄</text>

<text x="20" y="326" font-size="16" fill="#17191c">나눈 조각은 아직 글자라서 int()로 바꿔야 x &lt; 100처럼 크기를 비교할 수 있어요.</text>
</g>
</svg>
