<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" role="img" aria-labelledby="title desc">
<title id="title">인공지능이 알아낸 결과를 보드에 전하기: 컴퓨터(보고 판단하기) → 약속한 모양의 바이트 → ESP32 보드(장치 움직이기)</title>
<desc id="desc">왼쪽 컴퓨터 칸에서는 카메라로 손을 보고 인공지능이 결과를 글자 a로 정한다. 가운데에서는 글자 a가 바이트 하나(01100001, 10진수 97)가 되어 선이나 전파로 건너간다. 오른쪽 ESP32 보드 칸에서는 받은 a를 보고 LED를 켠다. 아래 이름표는 왼쪽이 I단원, 오른쪽이 II단원에서 배운 것이고, 가운데가 III단원에서 배우는 부분이라는 뜻이다. 사이트가 직접 그린 그림(INVENTORY S03).</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 Z" fill="#4a5361"/>
</marker>
</defs>
<rect width="640" height="280" fill="#ffffff"/>
<g font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif">

<rect x="12" y="16" width="196" height="190" rx="14" fill="#f4f6f9" stroke="#7b8594" stroke-width="1.5"/>
<text x="110" y="46" text-anchor="middle" font-size="20" font-weight="700" fill="#17191c">컴퓨터</text>
<rect x="34" y="64" width="58" height="42" rx="8" fill="#ffffff" stroke="#4a5361" stroke-width="2"/>
<rect x="46" y="58" width="18" height="8" rx="2" fill="#4a5361"/>
<circle cx="63" cy="85" r="12" fill="#eaf1fe" stroke="#4a5361" stroke-width="2"/>
<circle cx="63" cy="85" r="5" fill="#4a5361"/>
<text x="104" y="80" font-size="16" fill="#4a5361">카메라로</text>
<text x="104" y="100" font-size="16" fill="#4a5361">손을 보고</text>
<text x="110" y="134" text-anchor="middle" font-size="16" fill="#4a5361">인공지능이 판단</text>
<rect x="38" y="148" width="144" height="38" rx="19" fill="#1f5bd6"/>
<text x="110" y="173" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">결과: 글자 'a'</text>

<text x="320" y="44" text-anchor="middle" font-size="16" font-weight="700" fill="#1a4cb4">무엇을, 어떤 모양으로</text>
<text x="320" y="64" text-anchor="middle" font-size="16" font-weight="700" fill="#1a4cb4">보낼까?</text>
<line x1="214" y1="94" x2="426" y2="94" stroke="#4a5361" stroke-width="2.5" marker-end="url(#arrow)"/>
<g font-size="16" font-weight="700" text-anchor="middle" fill="#17191c">
<rect x="232" y="108" width="22" height="30" fill="#ffffff" stroke="#7b8594"/><text x="243" y="129">0</text>
<rect x="254" y="108" width="22" height="30" fill="#eaf1fe" stroke="#7b8594"/><text x="265" y="129">1</text>
<rect x="276" y="108" width="22" height="30" fill="#eaf1fe" stroke="#7b8594"/><text x="287" y="129">1</text>
<rect x="298" y="108" width="22" height="30" fill="#ffffff" stroke="#7b8594"/><text x="309" y="129">0</text>
<rect x="320" y="108" width="22" height="30" fill="#ffffff" stroke="#7b8594"/><text x="331" y="129">0</text>
<rect x="342" y="108" width="22" height="30" fill="#ffffff" stroke="#7b8594"/><text x="353" y="129">0</text>
<rect x="364" y="108" width="22" height="30" fill="#ffffff" stroke="#7b8594"/><text x="375" y="129">0</text>
<rect x="386" y="108" width="22" height="30" fill="#eaf1fe" stroke="#7b8594"/><text x="397" y="129">1</text>
</g>
<text x="320" y="162" text-anchor="middle" font-size="16" fill="#4a5361">'a' = 97 = 바이트 1개</text>
<text x="320" y="186" text-anchor="middle" font-size="16" fill="#4a5361">선이나 전파로 건너가요</text>

<rect x="432" y="16" width="196" height="190" rx="14" fill="#f4f6f9" stroke="#7b8594" stroke-width="1.5"/>
<text x="530" y="46" text-anchor="middle" font-size="20" font-weight="700" fill="#17191c">ESP32 보드</text>
<rect x="452" y="64" width="92" height="54" rx="6" fill="#eaf1fe" stroke="#1a4cb4" stroke-width="2"/>
<rect x="476" y="76" width="34" height="30" rx="3" fill="#ffffff" stroke="#1a4cb4" stroke-width="1.5"/>
<g stroke="#1a4cb4" stroke-width="2">
<line x1="460" y1="118" x2="460" y2="126"/><line x1="472" y1="118" x2="472" y2="126"/><line x1="484" y1="118" x2="484" y2="126"/>
<line x1="496" y1="118" x2="496" y2="126"/><line x1="508" y1="118" x2="508" y2="126"/><line x1="520" y1="118" x2="520" y2="126"/><line x1="532" y1="118" x2="532" y2="126"/>
</g>
<circle cx="588" cy="90" r="13" fill="#fff4d8" stroke="#b7800f" stroke-width="2.5"/>
<g stroke="#b7800f" stroke-width="2.5" stroke-linecap="round">
<line x1="588" y1="64" x2="588" y2="70"/><line x1="607" y1="72" x2="603" y2="76"/><line x1="569" y1="72" x2="573" y2="76"/>
<line x1="614" y1="90" x2="608" y2="90"/><line x1="562" y1="90" x2="568" y2="90"/>
</g>
<text x="588" y="126" text-anchor="middle" font-size="16" fill="#4a5361">LED</text>
<text x="530" y="158" text-anchor="middle" font-size="16" fill="#4a5361">받은 'a'를 보고</text>
<text x="530" y="182" text-anchor="middle" font-size="16" fill="#4a5361">LED를 켜요</text>

<g text-anchor="middle" font-size="16">
<rect x="20" y="226" width="180" height="36" rx="18" fill="#ffffff" stroke="#7b8594" stroke-width="1.5"/>
<text x="110" y="250" fill="#4a5361">I단원: 보고 판단하기</text>
<rect x="222" y="226" width="196" height="36" rx="18" fill="#eaf1fe" stroke="#1f5bd6" stroke-width="2"/>
<text x="320" y="250" font-weight="700" fill="#1a4cb4">III단원: 약속하고 보내기</text>
<rect x="440" y="226" width="180" height="36" rx="18" fill="#ffffff" stroke="#7b8594" stroke-width="1.5"/>
<text x="530" y="250" fill="#4a5361">II단원: 장치 움직이기</text>
</g>
</g>
</svg>
