<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 504" width="360" height="504" role="img" aria-labelledby="title desc">
<title id="title">사람이 보는 사진과 컴퓨터가 받는 사진: 사람은 한눈에 손이라고 알아보지만 컴퓨터는 숫자 표만 받는다</title>
<desc id="desc">맨 위 칸은 사람이 보는 사진으로, 편 손이 그려져 있고 "손이에요!"라고 적혀 있다. 가운데 칸은 컴퓨터가 받는 사진으로, 같은 사진의 한 부분이 5칸 곱하기 5칸의 밝기 숫자 표로 보인다. 맨 아래 칸에는 물음표와 함께 "숫자에서 특징을 찾아야 손이라고 알아봐요"라고 적혀 있다. 휴대폰처럼 좁은 화면에서 읽기 쉽게 같은 내용을 다시 배치한 그림이다(그림 설명이 말하는 자리는 그대로 둠). 사이트가 직접 그린 그림.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#4a5361"/></marker></defs>
<rect width="360" height="504" fill="#ffffff"/>
<rect x="10" y="10" width="150" height="150" rx="14" fill="#f4f6f9" stroke="#7b8594" stroke-width="1.5"/>
<svg x="20" y="20" width="130" height="130" viewBox="20 50 150 174">
<g fill="#e3e8ef" stroke="#4a5361" stroke-width="2.5" stroke-linejoin="round">
<rect x="64" y="128" width="17" height="62" rx="8.5" transform="rotate(-40 72.5 190)"/>
<rect x="70" y="66" width="17" height="78" rx="8.5" transform="rotate(-6 78 144)"/>
<rect x="92" y="56" width="17" height="88" rx="8.5"/>
<rect x="114" y="62" width="17" height="82" rx="8.5" transform="rotate(6 122 144)"/>
<rect x="134" y="84" width="15" height="64" rx="7.5" transform="rotate(14 141 148)"/>
<rect x="64" y="124" width="86" height="96" rx="24"/>
</g>
</svg>
<line x1="85" y1="162" x2="85" y2="182" stroke="#4a5361" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="6" y="188" width="158" height="158" rx="8" fill="#f4f6f9" stroke="#7b8594" stroke-width="1.5"/>
<rect x="15" y="197" width="140" height="140" fill="#ffffff" stroke="#7b8594"/>
<g stroke="#d6dde6" stroke-width="1"><line x1="43" y1="197" x2="43" y2="337"/><line x1="15" y1="225" x2="155" y2="225"/><line x1="71" y1="197" x2="71" y2="337"/><line x1="15" y1="253" x2="155" y2="253"/><line x1="99" y1="197" x2="99" y2="337"/><line x1="15" y1="281" x2="155" y2="281"/><line x1="127" y1="197" x2="127" y2="337"/><line x1="15" y1="309" x2="155" y2="309"/></g>
<line x1="85" y1="348" x2="85" y2="368" stroke="#4a5361" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="10" y="374" width="340" height="120" rx="14" fill="#eaf1fe" stroke="#5b87e0" stroke-width="1.5"/>
<circle cx="62" cy="434" r="30" fill="#1f5bd6"/>
<g font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif">
<text x="176" y="76" font-size="16" font-weight="700" fill="#17191c">사람이 보는 사진</text>
<text x="176" y="104" font-size="16" font-weight="700" fill="#1f5bd6">손이에요!</text>
<text x="176" y="258" font-size="16" font-weight="700" fill="#17191c">컴퓨터가 받는 사진</text>
<text x="176" y="286" font-size="16" font-weight="700" fill="#17191c">밝기 숫자뿐이에요</text>
<g font-size="14" font-family="Consolas, 'Courier New', monospace" fill="#17191c" text-anchor="middle"><text x="29" y="216">38</text><text x="57" y="216">41</text><text x="85" y="216">200</text><text x="113" y="216">43</text><text x="141" y="216">39</text><text x="29" y="244">40</text><text x="57" y="244">196</text><text x="85" y="244">210</text><text x="113" y="244">205</text><text x="141" y="244">44</text><text x="29" y="272">37</text><text x="57" y="272">201</text><text x="85" y="272">214</text><text x="113" y="272">208</text><text x="141" y="272">42</text><text x="29" y="300">36</text><text x="57" y="300">190</text><text x="85" y="300">212</text><text x="113" y="300">199</text><text x="141" y="300">40</text><text x="29" y="328">35</text><text x="57" y="328">39</text><text x="85" y="328">41</text><text x="113" y="328">38</text><text x="141" y="328">37</text></g>
<text x="62" y="446" font-size="34" font-weight="700" fill="#ffffff" text-anchor="middle">?</text>
<text x="108" y="404" font-size="17" font-weight="700" fill="#17191c">알아보려면</text>
<text x="108" y="432" font-size="15" fill="#17191c">숫자에서 특징을 찾아야</text>
<text x="108" y="454" font-size="15" fill="#17191c">알아봐요</text>
<text x="108" y="482" font-size="15" font-weight="700" fill="#1f5bd6">이 차시에서 배워요</text>
</g>
</svg>
