<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 538" width="360" height="538" role="img" aria-labelledby="title desc">
<title id="title">특징 추출 기법 세 가지: 밝기 차이로 경계선, 패턴 반복으로 무늬와 질감, 선과 모서리로 윤곽과 형태를 찾는다</title>
<desc id="desc">세 칸의 그림. 첫째 칸 "밝기 차이 분석"에는 어두운 바탕 위 흰 꽃병이 있고, 밝기가 확 바뀌는 꽃병 가장자리를 따라 주황 점선이 그어져 있다(쓰임: 얼굴의 눈, 코, 입 경계). 둘째 칸 "패턴 분석"에는 검은 줄무늬가 되풀이되는 천이 있고, 되풀이되는 줄무늬 세 개를 주황 괄호로 묶었다(쓰임: 지문의 곡선 무늬). 셋째 칸 "모서리와 선 탐지"에는 선으로 그린 자전거가 있고, 선이 만나는 모서리 다섯 곳에 주황 점이 찍혀 있다(쓰임: 도로 차선 찾기). 휴대폰처럼 좁은 화면에서 읽기 쉽게 세 칸을 위아래로 다시 배치한 그림이다. 사이트가 직접 그린 그림(원고 018쪽 활동 사진을 대신함).</desc>
<rect width="360" height="538" fill="#ffffff"/>

