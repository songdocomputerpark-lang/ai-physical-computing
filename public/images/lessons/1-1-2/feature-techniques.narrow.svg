<g font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif">
<text x="24" y="40" font-size="17" font-weight="700" fill="#17191c">밝기 차이 분석</text>
<text x="338" y="40" font-size="15" fill="#4a5361" text-anchor="end">→ 경계선</text>
<text x="156" y="76" font-size="14" fill="#17191c">밝기가 확 바뀌는 곳을</text>
<text x="156" y="96" font-size="14" fill="#17191c">경계선으로 찾아요</text>
<text x="156" y="128" font-size="14" fill="#4a5361">쓰임: 얼굴의 눈, 코,</text>
<text x="156" y="148" font-size="14" fill="#4a5361">입 경계</text>

<text x="24" y="216" font-size="17" font-weight="700" fill="#17191c">패턴 분석</text>
<text x="338" y="216" font-size="15" fill="#4a5361" text-anchor="end">→ 무늬, 질감</text>
<text x="156" y="252" font-size="14" fill="#17191c">같은 무늬가 되풀이되는</text>
<text x="156" y="272" font-size="14" fill="#17191c">규칙을 찾아요</text>
<text x="156" y="304" font-size="14" fill="#4a5361">쓰임: 지문의 곡선 무늬</text>

<text x="24" y="392" font-size="17" font-weight="700" fill="#17191c">모서리와 선 탐지</text>
<text x="338" y="392" font-size="15" fill="#4a5361" text-anchor="end">→ 윤곽, 형태</text>
<text x="156" y="428" font-size="14" fill="#17191c">선과 모서리를 이어</text>
<text x="156" y="448" font-size="14" fill="#17191c">모양(형태)을 알아내요</text>
<text x="156" y="480" font-size="14" fill="#4a5361">쓰임: 자율주행 자동차의</text>
<text x="156" y="500" font-size="14" fill="#4a5361">도로 차선 찾기</text>
</g>
</svg>
