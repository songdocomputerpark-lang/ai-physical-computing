<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" role="img" aria-labelledby="title desc">
<title id="title">녹음한 목소리로 알려 주는 장치</title>
<desc id="desc">세 칸 그림. 지하철 열차에서 "이번 역은 …" 안내 방송으로 도착할 역을 알리고, 엘리베이터는 층 표시 3과 함께 "3층입니다"라고 몇 층인지 알리고, 벽의 비상 방송 스피커는 "대피하세요!"라고 대피하라고 알린다. 사이트가 직접 그린 그림.</desc>
