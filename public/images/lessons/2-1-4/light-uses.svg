<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 248" width="640" height="248" role="img" aria-labelledby="title desc">
<title id="title">생활 속 LED와 레이저</title>
<desc id="desc">세 칸 그림. 신호등은 빨강, 노랑, 초록 LED로 차례를 알리고, 자동차 계기판은 여러 색 경고등을 켜서 알리며, 레이저 가공 장치는 곧고 센 빨간 레이저 빛으로 판을 자른다. 사이트가 직접 그린 그림.</desc>
<rect width="640" height="248" fill="#ffffff"/>
<g font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif">
<rect x="8" y="8" width="204" height="232" rx="14" fill="#f4f6f9" stroke="#7b8594"/>
<text x="110" y="196" font-size="18" font-weight="700" fill="#17191c" text-anchor="middle">신호등</text>
<text x="110" y="222" font-size="16" fill="#4a5361" text-anchor="middle">색으로 차례를 알려요</text>
<rect x="218" y="8" width="204" height="232" rx="14" fill="#f4f6f9" stroke="#7b8594"/>
<text x="320" y="196" font-size="18" font-weight="700" fill="#17191c" text-anchor="middle">계기판</text>
<text x="320" y="222" font-size="16" fill="#4a5361" text-anchor="middle">경고등으로 알려요</text>
<rect x="428" y="8" width="204" height="232" rx="14" fill="#f4f6f9" stroke="#7b8594"/>
<text x="530" y="196" font-size="18" font-weight="700" fill="#17191c" text-anchor="middle">레이저 가공</text>
<text x="530" y="222" font-size="16" fill="#4a5361" text-anchor="middle">곧고 센 빛으로 잘라요</text>
<rect x="78" y="24" width="64" height="150" rx="14" fill="#2b2f36"/>
<circle cx="110" cy="54" r="17" fill="#d92b2b"/>
<text x="152" y="59" font-size="16" fill="#17191c" text-anchor="start">빨강</text>
<circle cx="110" cy="99" r="17" fill="#f2b705"/>
<text x="152" y="104" font-size="16" fill="#17191c" text-anchor="start">노랑</text>
<circle cx="110" cy="144" r="17" fill="#2fa84f"/>
<text x="152" y="149" font-size="16" fill="#17191c" text-anchor="start">초록</text>
<path d="M250 150 A70 70 0 0 1 390 150 Z" fill="#22384d"/>
<path d="M320 150 L352 112" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
<circle cx="320" cy="150" r="8" fill="#ffffff"/>
<circle cx="262" cy="40" r="13" fill="#d92b2b"/><circle cx="302" cy="40" r="13" fill="#f2b705"/><circle cx="342" cy="40" r="13" fill="#2fa84f"/><circle cx="382" cy="40" r="13" fill="#1f5bd6"/>
<text x="320" y="68" font-size="16" fill="#4a5361" text-anchor="middle">여러 색 경고등</text>
<rect x="496" y="24" width="68" height="44" rx="6" fill="#4a5361"/>
<path d="M516 68 L544 68 L536 84 L524 84 Z" fill="#2b2f36"/>
<line x1="530" y1="84" x2="530" y2="138" stroke="#d92b2b" stroke-width="4"/>
<rect x="448" y="138" width="164" height="16" fill="#c9ced6" stroke="#7b8594"/>
<path d="M530 138 L530 154" stroke="#ffffff" stroke-width="3"/>
<circle cx="530" cy="138" r="6" fill="#f6d36b"/>
</g>
</svg>
