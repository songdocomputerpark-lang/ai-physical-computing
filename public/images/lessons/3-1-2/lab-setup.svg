<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="title desc">
<title id="title">3-1-2 실습 순서: 한 화면에 컴퓨터 쪽(영상처리 실습실)과 보드 쪽(ESP32 실습실)을 함께 열고 보드부터 실행하기</title>
<desc id="desc">왼쪽은 네 단계다. ① 컴퓨터 쪽 기본 실습 예제에서 [이 자리에서 실습실 열기]를 누른다. ② 아래 [보내기] 패널에서 보드에서 열 예제가 3-1-2 기본(사이트판)인지 보고 [한 화면에 가상 보드 열기]를 누른다. ③ 보드 쪽에서 먼저 [실행]을 누르면 보드가 글자를 기다린다. ④ 컴퓨터 쪽 [실행]을 누르고 입력줄에 a를 적어 Enter를 누르면 레이저가 켜진다. 오른쪽은 실습실 화면의 대략적인 자리다. 위의 조작 줄에 [실행], 왼쪽에 코드, 오른쪽에 입력·출력과 그 아래 보드 쪽(ESP32 실습실), 아래에 [보내기] 패널과 콘솔·입력줄이 있다. 사이트가 직접 그린 그림.</desc>
<rect width="640" height="400" fill="#ffffff"/>
<g font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif">

<!-- 왼쪽: 네 단계 -->
<g font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">
<circle cx="28" cy="36" r="15" fill="#1f5bd6"/>
<text x="28" y="42">1</text>
<circle cx="28" cy="130" r="15" fill="#1f5bd6"/>
<text x="28" y="136">2</text>
<circle cx="28" cy="236" r="15" fill="#1f5bd6"/>
<text x="28" y="242">3</text>
<circle cx="28" cy="318" r="15" fill="#1f5bd6"/>
<text x="28" y="324">4</text>
</g>
<g font-size="16" fill="#17191c">
<text x="54" y="42" font-weight="700">컴퓨터 쪽 기본 실습 예제에서</text>
<text x="54" y="136" font-weight="700">아래 [보내기] 패널에서</text>
<text x="54" y="242" font-weight="700">보드 쪽에서 먼저</text>
<text x="54" y="324" font-weight="700">컴퓨터 쪽 [실행]을 누르고</text>
</g>
<g font-size="16" font-weight="700" text-anchor="middle">
<rect x="54" y="54" width="214" height="34" rx="8" fill="#ffffff" stroke="#1f5bd6" stroke-width="2"/>
<text x="161" y="77" fill="#1a4cb4">이 자리에서 실습실 열기</text>
<rect x="54" y="148" width="224" height="34" rx="8" fill="#ffffff" stroke="#1f5bd6" stroke-width="2"/>
<text x="166" y="171" fill="#1a4cb4">한 화면에 가상 보드 열기</text>
<rect x="54" y="254" width="70" height="34" rx="8" fill="#1f5bd6"/>
<text x="89" y="277" fill="#ffffff">실행</text>
<rect x="54" y="336" width="44" height="34" rx="6" fill="#ffffff" stroke="#4a5361" stroke-width="2"/>
<text x="76" y="359" fill="#17191c">a</text>
</g>
<g font-size="16" fill="#4a5361">
<text x="54" y="206">보드에서 열 예제: 3-1-2 기본(사이트판)</text>
<text x="136" y="277">보드가 글자를 기다려요</text>
<text x="110" y="359">입력줄에 적고 Enter</text>
<text x="54" y="392" fill="#a3232a" font-weight="700">→ 보드의 레이저가 켜져요</text>
</g>

<!-- 오른쪽: 화면 자리 -->
<rect x="384" y="12" width="248" height="380" rx="10" fill="#ffffff" stroke="#7b8594" stroke-width="1.5"/>
<rect x="394" y="22" width="228" height="34" rx="6" fill="#f4f6f9"/>
<rect x="400" y="27" width="58" height="24" rx="6" fill="#1f5bd6"/>
<text x="429" y="45" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">실행</text>
<text x="468" y="45" font-size="16" fill="#4a5361">조작 줄</text>

<rect x="394" y="64" width="98" height="150" rx="6" fill="#f4f6f9" stroke="#d6dde6" stroke-width="1.5"/>
<text x="443" y="92" text-anchor="middle" font-size="16" font-weight="700" fill="#4a5361">코드</text>
<g stroke="#b3bcc8" stroke-width="3" stroke-linecap="round">
<line x1="406" y1="110" x2="476" y2="110"/>
<line x1="414" y1="124" x2="470" y2="124"/>
<line x1="414" y1="138" x2="480" y2="138"/>
<line x1="406" y1="152" x2="460" y2="152"/>
<line x1="414" y1="166" x2="474" y2="166"/>
</g>

<rect x="500" y="64" width="122" height="50" rx="6" fill="#f4f6f9" stroke="#d6dde6" stroke-width="1.5"/>
<text x="561" y="94" text-anchor="middle" font-size="16" font-weight="700" fill="#4a5361">입력·출력</text>

<rect x="500" y="120" width="122" height="94" rx="6" fill="#e8f6ee" stroke="#3b9360" stroke-width="2"/>
<text x="561" y="142" text-anchor="middle" font-size="16" font-weight="700" fill="#15653a">보드 쪽</text>
<rect x="514" y="158" width="44" height="34" rx="3" fill="#ffffff" stroke="#4a5361" stroke-width="1.5"/>
<rect x="566" y="168" width="22" height="14" rx="2" fill="#4a5361"/>
<line x1="588" y1="175" x2="610" y2="175" stroke="#d24b4b" stroke-width="3.5" stroke-linecap="round"/>
<text x="561" y="208" text-anchor="middle" font-size="16" fill="#15653a">ESP32 실습실</text>

<rect x="394" y="222" width="228" height="56" rx="6" fill="#eaf1fe" stroke="#5b87e0" stroke-width="2"/>
<text x="508" y="256" text-anchor="middle" font-size="16" font-weight="700" fill="#1a4cb4">[보내기] 패널</text>

<rect x="394" y="286" width="228" height="96" rx="6" fill="#f4f6f9" stroke="#d6dde6" stroke-width="1.5"/>
<text x="408" y="310" font-size="16" font-weight="700" fill="#4a5361">콘솔</text>
<text x="408" y="334" font-size="16" fill="#4a5361">입력 (a, b, q):</text>
<rect x="408" y="344" width="200" height="28" rx="4" fill="#ffffff" stroke="#4a5361" stroke-width="1.5"/>
<text x="418" y="364" font-size="16" fill="#17191c">a</text>

<!-- 단계 번호를 화면 자리에도 -->
<g font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">
<circle cx="386" cy="250" r="12" fill="#1f5bd6"/>
<text x="386" y="256">2</text>
<circle cx="618" cy="130" r="12" fill="#1f5bd6"/>
<text x="618" y="136">3</text>
<circle cx="396" cy="30" r="12" fill="#1f5bd6"/>
<text x="396" y="36">4</text>
<circle cx="604" cy="358" r="12" fill="#1f5bd6"/>
<text x="604" y="364">4</text>
</g>
</g>
</svg>
