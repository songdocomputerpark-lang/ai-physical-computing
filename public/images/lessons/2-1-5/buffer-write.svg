<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-labelledby="title desc">
<title id="title">np[번호] = 색과 np.write()의 차이</title>
<desc id="desc">두 줄 그림. 위: np[0] = (255, 0, 0)과 np[1] = (0, 255, 0)을 실행하면 ESP32 안의 색 목록 16칸 가운데 0번 칸이 빨강, 1번 칸이 초록으로 적히지만 오른쪽의 네오픽셀 링은 모두 꺼진 그대로다. 아래: np.write()를 실행하면 목록 전체가 한 번에 링으로 보내져 0번 LED가 빨강, 1번 LED가 초록으로 켜진다. 사이트가 직접 그린 그림.</desc>
