<circle cx="168.0" cy="298.0" r="4.8" fill="#2b3440"/>
<text x="168.0" y="341.6" font-size="16" fill="#17191c" text-anchor="middle">8</text>
<rect x="127.1" y="283.5" width="16" height="16" rx="2" fill="#e9edf1" stroke="#6b7682"/>
<circle cx="135.1" cy="291.5" r="4.8" fill="#2b3440"/>
<text x="120.5" y="332.2" font-size="16" fill="#17191c" text-anchor="middle">9</text>
