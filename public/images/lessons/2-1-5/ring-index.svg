<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 372" width="640" height="372" role="img" aria-labelledby="title desc">
<title id="title">네오픽셀 링의 LED 번호와 데이터 선</title>
<desc id="desc">왼쪽: LED 16개가 둥글게 붙은 링. 12시 자리가 0번이고 시계 방향으로 1번, 2번 … 15번이며, 오른쪽 아래 5번 자리(6번째) LED가 빨갛게 강조되어 있고 가운데에 "6번째 LED는 np[5]"라고 적혀 있다. 오른쪽: ESP32에서 나온 데이터 선(DIN)이 0번, 1번 … 15번 LED로 이어진 그림과 함께 ① 보드가 색 16개를 차례로 이어서 보내면 ② 0번 LED는 첫 번째 색을 갖고 나머지를 1번으로 넘기고 ③ 나머지 LED도 차례로 자기 색을 가져간다는 설명. 그래서 np[번호]로 LED마다 색을 정한다. 사이트가 직접 그린 그림.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#4a5361"/></marker></defs>
<rect width="640" height="372" fill="#ffffff"/>
