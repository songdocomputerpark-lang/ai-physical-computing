<text x="320" y="26" font-size="17" font-weight="700" fill="#17191c" text-anchor="middle">네오픽셀 링의 번호: 0번부터 시계 방향으로 15번까지</text>
<circle cx="168" cy="212" r="100" fill="#1f2933"/>
<circle cx="168" cy="212" r="72" fill="#f4efe3" stroke="#0b1117"/>
<rect x="160.0" y="118.0" width="16" height="16" rx="2" fill="#e9edf1" stroke="#6b7682"/>
<circle cx="168.0" cy="126.0" r="4.8" fill="#2b3440"/>
<text x="168.0" y="93.6" font-size="16" fill="#17191c" text-anchor="middle">0</text>
<rect x="192.9" y="124.5" width="16" height="16" rx="2" fill="#e9edf1" stroke="#6b7682"/>
