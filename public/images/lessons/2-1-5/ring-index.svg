<circle cx="247.5" cy="179.1" r="4.8" fill="#2b3440"/>
<text x="282.6" y="170.1" font-size="16" fill="#17191c" text-anchor="middle">3</text>
<rect x="246.0" y="204.0" width="16" height="16" rx="2" fill="#e9edf1" stroke="#6b7682"/>
<circle cx="254.0" cy="212.0" r="4.8" fill="#2b3440"/>
<text x="292.0" y="217.6" font-size="16" fill="#17191c" text-anchor="middle">4</text>
<circle cx="247.5" cy="244.9" r="12.8" fill="#ff2a2a" opacity="0.35"/>
<rect x="239.5" y="236.9" width="16" height="16" rx="2" fill="#e9edf1" stroke="#6b7682"/>
<circle cx="247.5" cy="244.9" r="4.8" fill="#ff2a2a"/>
<text x="282.6" y="265.1" font-size="16" fill="#17191c" text-anchor="middle">5</text>
<rect x="220.8" y="264.8" width="16" height="16" rx="2" fill="#e9edf1" stroke="#6b7682"/>
<circle cx="228.8" cy="272.8" r="4.8" fill="#2b3440"/>
