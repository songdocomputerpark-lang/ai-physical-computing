<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 248" width="640" height="248" role="img" aria-labelledby="title desc">
<title id="title">생활 속 네오픽셀</title>
<desc id="desc">세 칸 그림. 무드등은 둥근 LED 링이 여러 색으로 빛나고 옆의 터치 버튼 네 개로 색을 바꾼다. 스마트 스피커는 윗면의 빛 링 일부가 파랗게 돌며 듣는 중이라는 상태를 알린다. LED 띠 장식은 물결 모양 띠에 붙은 LED마다 빨강, 주황, 노랑, 초록, 파랑, 남색, 보라처럼 색을 따로 낸다. 사이트가 직접 그린 그림.</desc>
