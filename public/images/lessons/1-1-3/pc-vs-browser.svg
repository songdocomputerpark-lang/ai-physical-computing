<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 372" width="640" height="372" role="img" aria-labelledby="title desc">
<title id="title">진짜 PC에서 개발 환경을 준비하는 순서와 이 사이트 실습실에서 준비하는 순서 비교</title>
<desc id="desc">왼쪽 "진짜 PC에서(교과서 방식)" 칸: ① 토니 내려받아 설치하기 → ② 패키지 관리에서 opencv-python, mediapipe 설치하기 → ③ 코드 쓰고 실행 단추 누르기 → 카메라 창이 떠요. 오른쪽 "이 사이트 실습실에서" 칸: ① 실습실 열기(설치 없음) → ② 파이썬과 OpenCV를 실습실이 알아서 받아요(처음 한 번) → ③ 코드 쓰고 [실행] 누르기 → 출력 창에 떠요. 아래에 "같은 파이썬 코드가 두 곳에서 돌아요"라고 적혀 있다. 사이트가 직접 그린 그림(INVENTORY S18).</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 Z" fill="#4a5361"/>
</marker>
</defs>
<rect width="640" height="372" fill="#ffffff"/>
<g font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="middle">

<rect x="12" y="8" width="300" height="300" rx="14" fill="#f4f6f9" stroke="#7b8594" stroke-width="1.5"/>
<text x="162" y="38" font-size="19" font-weight="700" fill="#17191c">진짜 PC에서(교과서 방식)</text>
<g font-size="17" fill="#17191c">
<rect x="32" y="54" width="260" height="50" rx="10" fill="#ffffff" stroke="#7b8594"/>
<text x="162" y="85">① 토니 내려받아 설치하기</text>
<line x1="162" y1="104" x2="162" y2="120" stroke="#4a5361" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="32" y="124" width="260" height="62" rx="10" fill="#ffffff" stroke="#7b8594"/>
<text x="162" y="150">② 패키지 관리에서</text>
<text x="162" y="174">라이브러리 설치하기</text>
<line x1="162" y1="186" x2="162" y2="202" stroke="#4a5361" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="32" y="206" width="260" height="50" rx="10" fill="#ffffff" stroke="#7b8594"/>
<text x="162" y="237">③ 코드 쓰고 ▶ 실행</text>
</g>
<text x="162" y="288" font-size="17" font-weight="700" fill="#4a5361">→ 카메라 창이 떠요</text>

<rect x="328" y="8" width="300" height="300" rx="14" fill="#eaf1fe" stroke="#5b87e0" stroke-width="1.5"/>
<text x="478" y="38" font-size="19" font-weight="700" fill="#17191c">이 사이트 실습실에서</text>
<g font-size="17" fill="#17191c">
<rect x="348" y="54" width="260" height="50" rx="10" fill="#ffffff" stroke="#5b87e0"/>
<text x="478" y="85">① 실습실 열기(설치 없음)</text>
<line x1="478" y1="104" x2="478" y2="120" stroke="#4a5361" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="348" y="124" width="260" height="62" rx="10" fill="#ffffff" stroke="#5b87e0"/>
<text x="478" y="150">② 파이썬, OpenCV를</text>
<text x="478" y="174">알아서 받아요(처음 한 번)</text>
<line x1="478" y1="186" x2="478" y2="202" stroke="#4a5361" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="348" y="206" width="260" height="50" rx="10" fill="#ffffff" stroke="#5b87e0"/>
<text x="478" y="237">③ 코드 쓰고 [실행]</text>
</g>
<text x="478" y="288" font-size="17" font-weight="700" fill="#1a4cb4">→ 출력 창에 떠요</text>

<rect x="12" y="320" width="616" height="44" rx="12" fill="#1f5bd6"/>
<text x="320" y="348" font-size="18" font-weight="700" fill="#ffffff">같은 파이썬 코드가 두 곳에서 돌아요</text>
</g>
</svg>
