<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-labelledby="title desc">
<title id="title">손 인식 프로그램에서 OpenCV와 MediaPipe가 나눠 맡는 일</title>
<desc id="desc">왼쪽에서 오른쪽으로 흐르는 네 칸. 웹캠에서 온 영상을 ① OpenCV가 프레임(사진 한 장)으로 읽고(cap.read), ② MediaPipe가 그 사진에서 손 랜드마크를 찾고(hands.process), ③ OpenCV가 찾은 점을 그려 화면에 보여 준다(cv2.imshow). 그다음 다시 ①로 돌아가 다음 프레임을 읽는다. OpenCV 칸은 파란 테두리, MediaPipe 칸은 초록 테두리이고, 칸마다 라이브러리 이름이 적혀 있다. 사이트가 직접 그린 그림(INVENTORY S17).</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 Z" fill="#4a5361"/>
</marker>
</defs>
<rect width="640" height="330" fill="#ffffff"/>
<g font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="middle">

<rect x="12" y="70" width="96" height="120" rx="14" fill="#f4f6f9" stroke="#7b8594" stroke-width="1.5"/>
<rect x="34" y="104" width="52" height="36" rx="8" fill="#4a5361"/>
<circle cx="60" cy="122" r="11" fill="#ffffff"/>
<circle cx="60" cy="122" r="5" fill="#4a5361"/>
<text x="60" y="172" font-size="18" font-weight="700" fill="#17191c">웹캠</text>
<line x1="112" y1="130" x2="130" y2="130" stroke="#4a5361" stroke-width="2.5" marker-end="url(#arrow)"/>

<rect x="136" y="40" width="152" height="180" rx="14" fill="#eaf1fe" stroke="#1f5bd6" stroke-width="2.5"/>
<text x="212" y="72" font-size="18" font-weight="700" fill="#1a4cb4">OpenCV</text>
<text x="212" y="112" font-size="18" font-weight="700" fill="#17191c">① 프레임</text>
<text x="212" y="136" font-size="18" font-weight="700" fill="#17191c">읽기</text>
<text x="212" y="166" font-size="16" fill="#4a5361">사진 한 장씩</text>
<text x="212" y="202" font-size="16" fill="#17191c" font-family="Consolas, 'Courier New', monospace">cap.read()</text>
<line x1="292" y1="130" x2="310" y2="130" stroke="#4a5361" stroke-width="2.5" marker-end="url(#arrow)"/>

<rect x="316" y="40" width="152" height="180" rx="14" fill="#e8f6ee" stroke="#15653a" stroke-width="2.5"/>
<text x="392" y="72" font-size="18" font-weight="700" fill="#15653a">MediaPipe</text>
<text x="392" y="112" font-size="18" font-weight="700" fill="#17191c">② 손 찾기</text>
<text x="392" y="140" font-size="16" fill="#4a5361">관절 21곳의</text>
<text x="392" y="162" font-size="16" fill="#4a5361">위치(랜드마크)</text>
<text x="392" y="202" font-size="16" fill="#17191c" font-family="Consolas, 'Courier New', monospace">hands.process()</text>
<line x1="472" y1="130" x2="490" y2="130" stroke="#4a5361" stroke-width="2.5" marker-end="url(#arrow)"/>

<rect x="496" y="40" width="132" height="180" rx="14" fill="#eaf1fe" stroke="#1f5bd6" stroke-width="2.5"/>
<text x="562" y="72" font-size="18" font-weight="700" fill="#1a4cb4">OpenCV</text>
<text x="562" y="112" font-size="18" font-weight="700" fill="#17191c">③ 그리고</text>
<text x="562" y="136" font-size="18" font-weight="700" fill="#17191c">보여 주기</text>
<text x="562" y="166" font-size="16" fill="#4a5361">점, 선, 창</text>
<text x="562" y="202" font-size="16" fill="#17191c" font-family="Consolas, 'Courier New', monospace">cv2.imshow()</text>

<path d="M562,224 V262 H212 V228" fill="none" stroke="#4a5361" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="387" y="286" font-size="17" fill="#4a5361">다음 프레임도 똑같이 되풀이해요</text>
<text x="320" y="318" font-size="16" fill="#4a5361">파란 칸은 OpenCV, 초록 칸은 MediaPipe가 맡는 일이에요.</text>
</g>
</svg>
