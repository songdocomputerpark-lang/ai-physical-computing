<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 498" width="360" height="498" role="img" aria-labelledby="title desc">
<title id="title">카메라 프로그램의 기본 구조: 일곱 영역</title>
<desc id="desc">위에서 아래로 쌓인 일곱 칸. ① 라이브러리 불러오기(import cv2), ② 상수와 설정(창 이름 WINDOW_NAME), ③ 초기화(웹캠 연결 cap = cv2.VideoCapture(0)), ④ 함수 정의(def show_frame), ⑤ 외부 연동 설정(선택, def setup_external_services), ⑥ 메인 실행(while True로 프레임 읽기, 보여 주기, q 키 확인을 되풀이 — 되풀이 화살표가 있다), ⑦ 종료 처리(cap.release, cv2.destroyAllWindows). 칸마다 윗줄에 영역 이름, 아랫줄에 그 영역의 코드가 있다. 휴대폰처럼 좁은 화면에서 읽기 쉽게 영역 이름과 코드를 두 줄로 다시 배치한 그림이다. 사이트가 직접 그린 그림(INVENTORY S16).</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 Z" fill="#1a4cb4"/>
</marker>
</defs>
<rect width="360" height="498" fill="#ffffff"/>
<rect x="10" y="8" width="340" height="54" rx="10" fill="#f4f6f9" stroke="#7b8594"/>
