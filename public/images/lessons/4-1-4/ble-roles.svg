<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="title desc">
<title id="title">블루투스(BLE) 연결의 두 역할과 순서: 주변기기 ESP32가 광고하고, 중앙기기 컴퓨터가 연결해 글을 쓰면, 보드 코드가 read()로 꺼낸다</title>
<desc id="desc">왼쪽 위에 중앙기기(컴퓨터, 스마트폰), 오른쪽 위에 주변기기(ESP32 보드) 상자가 있고 각각 아래로 세로선이 이어진다. 위에서 아래로 네 단계가 있다. ① 광고: ESP32에서 컴퓨터 쪽으로 점선 화살표 "나는 ESP32-07이에요"(이때 상태 LED가 깜빡인다). ② 연결: 컴퓨터에서 ESP32로 화살표(상태 LED가 계속 켜진다). ③ 쓰기: 컴퓨터에서 ESP32로 화살표와 보내는 글 DATA,320,170. ④ 꺼내기: ESP32 쪽 상자 ble.read()가 DATA,320,170을 돌려준다. 사이트가 직접 그린 그림.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 Z" fill="#1f5bd6"/>
</marker>
<marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 Z" fill="#4a5361"/>
</marker>
</defs>
<rect width="640" height="400" fill="#ffffff"/>
<g font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif">
<text x="320" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#17191c">블루투스(BLE) 연결: 두 역할과 순서</text>

<!-- 역할 상자 -->
<rect x="20" y="50" width="200" height="60" rx="12" fill="#eaf1fe" stroke="#5b87e0" stroke-width="1.5"/>
<text x="120" y="76" text-anchor="middle" font-size="18" font-weight="700" fill="#17191c">중앙기기</text>
<text x="120" y="99" text-anchor="middle" font-size="16" fill="#4a5361">컴퓨터, 스마트폰</text>
<rect x="420" y="50" width="200" height="60" rx="12" fill="#f4f6f9" stroke="#7b8594" stroke-width="1.5"/>
<text x="520" y="76" text-anchor="middle" font-size="18" font-weight="700" fill="#17191c">주변기기</text>
<text x="520" y="99" text-anchor="middle" font-size="16" fill="#4a5361">ESP32 보드</text>

<!-- 세로선 -->
<g stroke="#c3cad5" stroke-width="3">
<line x1="120" y1="112" x2="120" y2="384"/>
<line x1="520" y1="112" x2="520" y2="384"/>
</g>

<!-- ① 광고 -->
<text x="320" y="146" text-anchor="middle" font-size="17" fill="#17191c"><tspan font-weight="700">① 광고</tspan> "나는 ESP32-07이에요"</text>
<line x1="514" y1="160" x2="130" y2="160" stroke="#4a5361" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow-gray)"/>
<text x="320" y="184" text-anchor="middle" font-size="16" fill="#4a5361">이름을 주변에 알려요. 상태 LED는 깜빡여요</text>

<!-- ② 연결 -->
<text x="320" y="218" text-anchor="middle" font-size="17" fill="#17191c"><tspan font-weight="700">② 연결</tspan> 이름을 골라 이어요</text>
<line x1="126" y1="232" x2="510" y2="232" stroke="#1f5bd6" stroke-width="3" marker-end="url(#arrow)"/>
<text x="320" y="256" text-anchor="middle" font-size="16" fill="#4a5361">이어지면 상태 LED가 계속 켜져요</text>

<!-- ③ 쓰기 -->
<text x="320" y="290" text-anchor="middle" font-size="17" fill="#17191c"><tspan font-weight="700">③ 쓰기</tspan> <tspan font-family="'Consolas', 'D2Coding', monospace">DATA,320,170</tspan></text>
<line x1="126" y1="304" x2="510" y2="304" stroke="#1f5bd6" stroke-width="3" marker-end="url(#arrow)"/>

<!-- ④ 꺼내기 -->
<rect x="364" y="322" width="256" height="62" rx="10" fill="#e8f6ee" stroke="#3b9360" stroke-width="1.5"/>
<text x="492" y="347" text-anchor="middle" font-size="17" font-weight="700" fill="#15653a">④ 꺼내기 ble.read()</text>
<text x="492" y="372" text-anchor="middle" font-size="16" fill="#17191c" font-family="'Consolas', 'D2Coding', monospace">→ 'DATA,320,170'</text>
</g>
</svg>
