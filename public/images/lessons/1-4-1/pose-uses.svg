<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 318" width="640" height="318" role="img" aria-labelledby="title desc">
<title id="title">포즈 트래킹을 쓰는 프로그램 세 가지: 영상에서 관절을 찾아 동작을 알아봐요</title>
<desc id="desc">피트니스 앱은 운동하는 모습을, 스포츠 분석 프로그램은 경기 영상을, 몸짓 게임은 내 몸짓을 카메라로 받는다. 세 줄 모두 가운데에서 영상 속 사람의 관절 33개를 찾고, 그 위치로 자세 고쳐 주기, 동작 비교하기, 캐릭터 움직이기를 한다. 사이트가 직접 그린 그림.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 Z" fill="#4a5361"/>
</marker>
<symbol id="skeleton" viewBox="0 0 40 44">
<g fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
<path d="M13 16 H27 L25 30 H15 Z"/>
<path d="M13 16 L9 25 L7 33"/>
<path d="M27 16 L31 25 L33 33"/>
<path d="M15 30 L14 42"/>
<path d="M25 30 L26 42"/>
</g>
<circle cx="20" cy="7" r="5" fill="#ffffff"/>
</symbol>
