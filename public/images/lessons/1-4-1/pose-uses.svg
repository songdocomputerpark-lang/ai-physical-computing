<text x="418" y="169" font-size="16" font-weight="700" fill="#ffffff">관절</text>
<text x="418" y="190" font-size="16" font-weight="700" fill="#ffffff">33개</text>
<line x1="452" y1="172" x2="484" y2="172" stroke="#4a5361" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="488" y="146" width="140" height="52" rx="10" fill="#eaf1fe" stroke="#5b87e0"/>
<text x="558" y="179" font-size="17" fill="#17191c">동작 비교하기</text>

