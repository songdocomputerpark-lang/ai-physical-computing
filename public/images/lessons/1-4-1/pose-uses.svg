<text x="395" y="26" font-size="16" font-weight="600" fill="#4a5361">찾는 것</text>
<text x="558" y="26" font-size="16" font-weight="600" fill="#4a5361">하는 일</text>

<rect x="12" y="40" width="616" height="80" rx="14" fill="#f4f6f9" stroke="#d6dde6"/>
<text x="90" y="87" font-size="19" font-weight="700" fill="#17191c">피트니스 앱</text>
