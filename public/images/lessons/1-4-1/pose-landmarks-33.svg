<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 610" width="640" height="610" role="img" aria-labelledby="title desc">
<title id="title">MediaPipe Pose의 자세 랜드마크 33개와 번호(우리를 마주 보는 사람)</title>
<desc id="desc">우리를 마주 보고 선 사람의 몸에 점 33개가 찍혀 있고 점끼리 선으로 이어져 뼈대처럼 보인다. 0~10번은 얼굴(코, 눈, 귀, 입), 11·12번은 어깨, 13·14번은 팔꿈치, 15·16번은 손목, 17~22번은 손가락, 23·24번은 엉덩이, 25·26번은 무릎, 27·28번은 발목, 29~32번은 발이다. 홀수 번호는 그 사람의 왼쪽, 짝수 번호는 오른쪽인데, 사람이 우리를 마주 보고 있어서 사람의 왼쪽(LEFT)은 그림의 오른쪽에 있다. 사이트가 직접 그린 그림(INVENTORY S15).</desc>
