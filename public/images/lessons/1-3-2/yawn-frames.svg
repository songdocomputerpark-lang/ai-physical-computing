<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-labelledby="title desc">
<title id="title">재생 입력으로 하품을 한 번 하는 동안의 입 모양 비율(MAR) 그래프와 하품을 세는 순간</title>
<desc id="desc">가로축은 0초부터 5초까지의 시간, 세로축은 입 모양 비율(MAR, 0.3부터 0.5)이다. 0.4 높이에 빨간 점선으로 기준(MAR_THRESHOLD)이 있다. 그래프는 0.32쯤에 머물다가 약 1.3초부터 올라가 1.6초에 기준을 넘고, 0.49 가까이에 머문 뒤 3초에 다시 기준 아래로 내려와 0.32로 돌아간다. 기준을 넘은 1.6초부터 3초까지(약 1.4초)는 노랗게 칠했고, "기준보다 큰 동안 yawn_frames가 늘어요"라고 적혀 있다. 3초 무렵 기준 아래로 내려오는 자리에 초록 마름모와 "입을 다문 순간 yawn_count + 1"이 있다. 아래 문장: 입을 벌리는 순간이 아니라, 다물어 기준 아래로 내려오는 순간에 센다. 사이트가 직접 그린 그림(값은 실습실 재생 입력과 같은 계산).</desc>
<rect width="640" height="330" fill="#ffffff"/>
<g font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="middle"><text x="320" y="26" font-size="18" font-weight="700" fill="#17191c">재생 입력 '입 벌리기(하품)' 한 번(5초) 동안의 MAR</text><rect x="248.8" y="50" width="151.2" height="190" fill="#fff4d8"/><rect x="76" y="50" width="540" height="190" fill="none" stroke="#7b8594"/><line x1="76" y1="153.6" x2="616" y2="153.6" stroke="#d24b4b" stroke-width="2" stroke-dasharray="7 5"/><text x="84" y="145.6" font-size="16" font-weight="700" fill="#a3232a" text-anchor="start" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">기준 0.4(MAR_THRESHOLD)</text><text x="68" y="245" font-size="16" fill="#4a5361" text-anchor="end">0.3</text><text x="68" y="158.6" font-size="16" fill="#4a5361" text-anchor="end">0.4</text><text x="68" y="72.3" font-size="16" fill="#4a5361" text-anchor="end">0.5</text><path d="M76 218.7 L83.2 218.7 L90.4 218.7 L97.6 218.7 L104.8 222.3 L112 222.3 L119.2 222.2 L126.4 222.2 L133.6 218.6 L140.8 218.6 L148 218.5 L155.2 218.5 L162.4 218.5 L169.6 218.7 L176.8 218.6 L184 218.6 L191.2 218.6 L198.4 218.6 L205.6 218.6 L212.8 213 L220 207.4 L227.2 196.2 L234.4 185 L241.6 168.1 L248.8 151.3 L256 128.9 L263.2 112.1 L270.4 89.6 L277.6 78.5 L284.8 78.4 L292 83.8 L299.2 83.8 L306.4 83.8 L313.6 83.9 L320.8 83.9 L328 78.5 L335.2 78.5 L342.4 78.5 L349.6 78.5 L356.8 78.5 L364 78.5 L371.2 83.9 L378.4 95 L385.6 117 L392.8 133.6 L400 155.8 L407.2 168.1 L414.4 185 L421.6 196.1 L428.8 207.3 L436 212.9 L443.2 218.6 L450.4 218.6 L457.6 218.6 L464.8 218.6 L472 218.6 L479.2 218.6 L486.4 218.6 L493.6 218.6 L500.8 218.6 L508 218.6 L515.2 218.6 L522.4 218.7 L529.6 218.5 L536.8 218.5 L544 218.5 L551.2 218.6 L558.4 218.6 L565.6 222.2 L572.8 222.2 L580 222.3 L587.2 222.3 L594.4 218.7 L601.6 218.7 L608.8 218.7" fill="none" stroke="#17191c" stroke-width="2.5"/><text x="324.4" y="70" font-size="16" font-weight="700" fill="#7a4a00" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">기준보다 큰 동안 yawn_frames가 늘어요</text><text x="324.4" y="114.8" font-size="16" font-weight="700" fill="#7a4a00" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">약 1.4초</text><path d="M400 148 L407.8 155.8 L400 163.6 L392.2 155.8 Z" fill="#3b9360" stroke="#ffffff" stroke-width="2"/><text x="438" y="166.6" font-size="16" font-weight="700" fill="#15653a" text-anchor="start" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">입을 다문 순간</text><text x="438" y="187.6" font-size="16" font-weight="700" fill="#15653a" text-anchor="start" font-family="ui-monospace, 'Cascadia Mono', Consolas, 'D2Coding', 'Malgun Gothic', monospace" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">yawn_count + 1</text><text x="76" y="262" font-size="16" fill="#4a5361">0</text><text x="184" y="262" font-size="16" fill="#4a5361">1</text><text x="292" y="262" font-size="16" fill="#4a5361">2</text><text x="400" y="262" font-size="16" fill="#4a5361">3</text><text x="508" y="262" font-size="16" fill="#4a5361">4</text><text x="616" y="262" font-size="16" fill="#4a5361">5</text><text x="346" y="286" font-size="16" fill="#4a5361">시간(초)</text><text x="20" y="145" font-size="16" fill="#4a5361" transform="rotate(-90 20 145)">MAR</text><text x="320" y="322" font-size="16" fill="#17191c">입을 벌리는 순간이 아니라, 다물어 기준 아래로 내려오는 순간에 세요.</text></g>
</svg>
