<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440" role="img" aria-labelledby="title desc">
<title id="title">입을 다물었을 때와 크게 벌렸을 때의 입 모양 비율(MAR)</title>
<desc id="desc">두 칸이 나란히 있다. 두 칸 모두 입 둘레 점 여섯 개 사이에 세로 거리 두 개(세로 1은 13번과 19번 사이, 세로 2는 14번과 18번 사이 — 파란 막대)와 가로 거리 하나(78번과 308번 사이 — 노란 점선)를 표시했다. 왼쪽(입을 다물었을 때)은 세로 1 = 35, 세로 2 = 15, 가로 = 77이라 (35 + 15) ÷ (2 × 77)로 MAR = 0.32다. 오른쪽(입을 크게 벌렸을 때)은 아래턱과 함께 아랫입술 쪽이 내려가 세로 2가 41로 커져서 (35 + 41) ÷ (2 × 77)로 MAR = 0.49다. 숫자는 실습실 재생 입력의 얼굴을 가로 640 화면에서 잰 픽셀이다. 사이트가 직접 그린 그림.</desc>
