<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" width="640" height="350" role="img" aria-labelledby="title desc">
<title id="title">눈의 EAR과 입의 MAR은 같은 방법으로 계산한다</title>
<desc id="desc">왼쪽 두 칸은 눈 한쪽을 크게 그린 것이다. 뜬 눈은 위아래 눈꺼풀 사이의 세로 거리 두 개(파란 선)가 있어 EAR = 0.49이고, 감은 눈은 세로 거리가 0이 되어 EAR = 0.00이다. 가로 거리는 눈의 두 끝(노란 마름모) 사이다. 오른쪽 두 칸은 입이다. 다문 입은 MAR = 0.32, 벌린 입은 MAR = 0.49다. 아래 문장: 눈을 감으면 세로가 줄어 작아지고, 입을 벌리면 세로가 늘어 커진다. 두 값 모두 (세로 거리 1 + 세로 거리 2) ÷ (2 × 가로 거리)로 계산한다. 숫자는 실습실 재생 입력의 얼굴로 잰 값이다. 사이트가 직접 그린 그림.</desc>
