<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 370" width="640" height="370" role="img" aria-labelledby="title desc">
<title id="title">예제가 쓰는 입 둘레의 점 6개와 번호</title>
<desc id="desc">왼쪽은 입을 조금 벌린 얼굴의 코 아래부터 턱까지를 크게 그린 것으로, 노란 점 여섯 개에 번호가 붙어 있다. 위에서부터 19번은 코 밑(입 위쪽), 13번은 윗입술 가운데, 14번은 아랫입술 가운데, 18번은 아랫입술 밑(입 아래쪽)이고, 78번은 그림 왼쪽의 입 끝, 308번은 그림 오른쪽의 입 끝이다. 오른쪽에 번호와 자리를 표로 적고, 맨 아래에 예제의 MOUTH_LANDMARKS = [13, 14, 19, 18, 78, 308]을 적었다. 사이트가 직접 그린 그림(점 자리는 실습실 재생 입력과 같은 계산).</desc>
