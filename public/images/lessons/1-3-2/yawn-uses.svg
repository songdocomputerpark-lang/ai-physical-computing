<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="title desc">
<title id="title">입이 벌어진 정도를 알아채면 할 수 있는 일 세 가지</title>
<desc id="desc">세 칸이 나란히 있다. 첫째 칸(졸음 알림)은 운전대 앞에서 입을 크게 벌려 하품하는 얼굴과 느낌표가 든 노란 경고 세모로, 하품을 알아채 졸음 운전을 알린다. 둘째 칸(입으로 게임 조작)은 입을 벌린 얼굴에서 화살표가 나와 세로 막대 안의 빨간 동그라미가 파란 띠까지 떠오르는 모습으로, 입을 벌리면 풍선이 떠오른다. 셋째 칸(화면 속 캐릭터)은 입을 벌린 사람 얼굴 옆에서 둥근 캐릭터도 입을 벌린 모습으로, 캐릭터가 내 입 모양을 따라 한다. 사이트가 직접 그린 그림.</desc>
