<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 344" width="640" height="344" role="img" aria-labelledby="title desc">
<title id="title">실습실에서 한 마디를 받는 세 가지 방법과 컴퓨터 밖으로 가는 것</title>
<desc id="desc">세 줄 표 그림. 첫째 줄 글자 입력(기본): 키보드로 적은 문장이 그대로 인식 결과가 되고, 컴퓨터 밖으로 가는 것은 없다. 둘째 줄 내 기기 안 인식: 이 컴퓨터 안에서 브라우저가 알아듣고, 밖으로 가는 것은 없다. 셋째 줄 서버 인식: 교사가 사이트 설정에서 켠 브라우저에서만 고를 수 있고, 브라우저 회사 서버가 알아들으며, 목소리가 컴퓨터 밖 서버로 간다. 사이트가 직접 그린 그림.</desc>
<rect width="640" height="344" fill="#ffffff"/>
<g font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif">
<g font-size="16" font-weight="600" fill="#4a5361" text-anchor="middle">
<text x="92" y="26">받는 방법</text>
<text x="320" y="26">어디서 글자로 바꾸나</text>
<text x="548" y="26">컴퓨터 밖으로 가는 것</text>
</g>

<!-- 1. 글자 입력 -->
<rect x="12" y="40" width="616" height="88" rx="14" fill="#f4f6f9" stroke="#d6dde6"/>
<text x="92" y="78" font-size="18" font-weight="700" fill="#17191c" text-anchor="middle">글자 입력</text>
<text x="92" y="102" font-size="16" fill="#4a5361" text-anchor="middle">(기본)</text>
<g transform="translate(190 64)">
<rect x="0" y="0" width="44" height="30" rx="5" fill="#ffffff" stroke="#4a5361" stroke-width="2"/>
<g fill="#4a5361">
<rect x="6" y="6" width="6" height="5" rx="1"/><rect x="15" y="6" width="6" height="5" rx="1"/><rect x="24" y="6" width="6" height="5" rx="1"/><rect x="33" y="6" width="6" height="5" rx="1"/>
<rect x="6" y="14" width="6" height="5" rx="1"/><rect x="15" y="14" width="6" height="5" rx="1"/><rect x="24" y="14" width="6" height="5" rx="1"/><rect x="33" y="14" width="6" height="5" rx="1"/>
<rect x="12" y="22" width="20" height="4" rx="1"/>
</g>
</g>
<text x="248" y="80" font-size="16" fill="#17191c">키보드로 적은 문장이</text>
<text x="248" y="102" font-size="16" fill="#17191c">그대로 인식 결과가 돼요</text>
<rect x="490" y="64" width="116" height="40" rx="20" fill="#e8f6ee" stroke="#3b9360" stroke-width="1.5"/>
<text x="548" y="90" font-size="17" font-weight="700" fill="#15653a" text-anchor="middle">없음</text>

<!-- 2. 내 기기 안 인식 -->
<rect x="12" y="140" width="616" height="88" rx="14" fill="#f4f6f9" stroke="#d6dde6"/>
<text x="92" y="178" font-size="18" font-weight="700" fill="#17191c" text-anchor="middle">내 기기 안</text>
<text x="92" y="202" font-size="18" font-weight="700" fill="#17191c" text-anchor="middle">인식</text>
<g transform="translate(190 162)">
<rect x="0" y="0" width="44" height="30" rx="4" fill="#ffffff" stroke="#4a5361" stroke-width="2"/>
<path d="M16 38 H28 M22 30 V38" stroke="#4a5361" stroke-width="2.5" stroke-linecap="round"/>
</g>
<text x="248" y="180" font-size="16" fill="#17191c">이 컴퓨터 안에서</text>
<text x="248" y="202" font-size="16" fill="#17191c">브라우저가 알아들어요</text>
<rect x="490" y="164" width="116" height="40" rx="20" fill="#e8f6ee" stroke="#3b9360" stroke-width="1.5"/>
<text x="548" y="190" font-size="17" font-weight="700" fill="#15653a" text-anchor="middle">없음</text>

<!-- 3. 서버 인식 -->
<rect x="12" y="240" width="616" height="92" rx="14" fill="#f4f6f9" stroke="#b7800f" stroke-width="1.5"/>
<text x="92" y="276" font-size="18" font-weight="700" fill="#17191c" text-anchor="middle">서버 인식</text>
<text x="92" y="300" font-size="16" fill="#4a5361" text-anchor="middle">교사가 켠</text>
<text x="92" y="320" font-size="16" fill="#4a5361" text-anchor="middle">브라우저에서만</text>
<path d="M200 296 H234 A11 11 0 0 0 232 274 A15 15 0 0 0 204 270 A12 12 0 0 0 200 296 Z" fill="#ffffff" stroke="#4a5361" stroke-width="2" stroke-linejoin="round"/>
<text x="248" y="280" font-size="16" fill="#17191c">브라우저 회사 서버가</text>
<text x="248" y="302" font-size="16" fill="#17191c">인터넷 너머에서 알아들어요</text>
<rect x="490" y="266" width="116" height="40" rx="20" fill="#fff4d8" stroke="#b7800f" stroke-width="1.5"/>
<text x="548" y="292" font-size="17" font-weight="700" fill="#7a4a00" text-anchor="middle">목소리</text>
</g>
</svg>
