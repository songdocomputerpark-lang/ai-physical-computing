<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 258" width="640" height="258" role="img" aria-labelledby="title desc">
<title id="title">디스플레이 모양의 변화: 평면, 곡면, 폴더블, 롤러블</title>
<desc id="desc">화살표로 이어진 네 가지 화면: 받침 위의 평평한 화면(평면), 가운데가 휘어진 화면(곡면), 가운데 접는 선을 따라 반쯤 접힌 화면(폴더블), 원통에 감겨 있다가 펼쳐지는 화면(롤러블). 아래 상자에 스스로 빛나는 OLED는 백라이트가 없어 얇게 만들 수 있어서 휘고 접고 말 수 있다고 적혀 있다. 사이트가 직접 그린 그림.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#4a5361"/></marker><linearGradient id="scr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3f74e0"/><stop offset="1" stop-color="#1a4cb4"/></linearGradient></defs>
<rect width="640" height="258" fill="#ffffff"/>
<g font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif">
<rect x="30" y="40" width="104" height="68" rx="4" fill="url(#scr)" stroke="#17191c" stroke-width="3"/>
<rect x="74" y="108" width="16" height="16" fill="#4a5361"/><rect x="56" y="124" width="52" height="6" rx="3" fill="#4a5361"/>
<path d="M186 48 Q242 30 298 48 L298 112 Q242 94 186 112 Z" fill="url(#scr)" stroke="#17191c" stroke-width="3"/>
<rect x="234" y="104" width="16" height="20" fill="#4a5361"/><rect x="216" y="124" width="52" height="6" rx="3" fill="#4a5361"/>
<path d="M352 50 L402 66 L402 128 L352 112 Z" fill="url(#scr)" stroke="#17191c" stroke-width="3" stroke-linejoin="round"/>
<path d="M402 66 L452 50 L452 112 L402 128 Z" fill="#2f5fc4" stroke="#17191c" stroke-width="3" stroke-linejoin="round"/>
<line x1="402" y1="66" x2="402" y2="128" stroke="#f6d36b" stroke-width="3"/>
<rect x="520" y="46" width="30" height="80" rx="15" fill="#4a5361" stroke="#17191c" stroke-width="3"/>
<path d="M536 50 L612 50 L612 122 L536 122 Z" fill="url(#scr)" stroke="#17191c" stroke-width="3"/>
<ellipse cx="535" cy="86" rx="10" ry="36" fill="#2b2f36"/>
<text x="82" y="166" font-size="19" font-weight="700" fill="#17191c" text-anchor="middle">평면</text>
<text x="82" y="192" font-size="16" fill="#4a5361" text-anchor="middle">평평한 화면</text>
<line x1="142" y1="86" x2="180" y2="86" stroke="#4a5361" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="242" y="166" font-size="19" font-weight="700" fill="#17191c" text-anchor="middle">곡면</text>
<text x="242" y="192" font-size="16" fill="#4a5361" text-anchor="middle">휘어진 화면</text>
<line x1="302" y1="86" x2="340" y2="86" stroke="#4a5361" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="402" y="166" font-size="19" font-weight="700" fill="#17191c" text-anchor="middle">폴더블</text>
<text x="402" y="192" font-size="16" fill="#4a5361" text-anchor="middle">접히는 화면</text>
<line x1="462" y1="86" x2="500" y2="86" stroke="#4a5361" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="562" y="166" font-size="19" font-weight="700" fill="#17191c" text-anchor="middle">롤러블</text>
<text x="562" y="192" font-size="16" fill="#4a5361" text-anchor="middle">말리는 화면</text>
<rect x="8" y="210" width="624" height="40" rx="10" fill="#fff4d8" stroke="#b7800f"/>
<text x="320" y="236" font-size="16" fill="#17191c" text-anchor="middle">OLED는 백라이트가 없어 얇게 만들 수 있어서 휘고, 접고, 말 수 있어요.</text>
</g>
</svg>
