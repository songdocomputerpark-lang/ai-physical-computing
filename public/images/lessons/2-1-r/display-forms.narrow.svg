<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 482" width="360" height="482" role="img" aria-labelledby="title desc">
<title id="title">디스플레이 모양의 변화: 평면, 곡면, 폴더블, 롤러블</title>
<desc id="desc">위에서 아래로 화살표로 이어진 네 가지 화면: 받침 위의 평평한 화면(평면), 가운데가 휘어진 화면(곡면), 가운데 접는 선을 따라 반쯤 접힌 화면(폴더블), 원통에 감겨 있다가 펼쳐지는 화면(롤러블). 맨 아래 상자에 스스로 빛나는 OLED는 백라이트가 없어 얇게 만들 수 있어서 휘고 접고 말 수 있다고 적혀 있다. 휴대폰처럼 좁은 화면에서 읽기 쉽게 같은 내용을 다시 배치한 그림이다. 사이트가 직접 그린 그림.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#4a5361"/></marker><linearGradient id="scr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3f74e0"/><stop offset="1" stop-color="#1a4cb4"/></linearGradient></defs>
<rect width="360" height="482" fill="#ffffff"/>
