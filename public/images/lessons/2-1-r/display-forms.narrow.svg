<path d="M536 50 L612 50 L612 122 L536 122 Z" fill="url(#scr)" stroke="#17191c" stroke-width="3"/>
<ellipse cx="535" cy="86" rx="10" ry="36" fill="#2b2f36"/>
</svg>
<line x1="131" y1="95" x2="131" y2="114" stroke="#4a5361" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="131" y1="195" x2="131" y2="214" stroke="#4a5361" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="131" y1="295" x2="131" y2="314" stroke="#4a5361" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="8" y="410" width="344" height="64" rx="10" fill="#fff4d8" stroke="#b7800f"/>
<g font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif">
<text x="195" y="50" font-size="19" font-weight="700" fill="#17191c">평면</text>
<text x="195" y="76" font-size="16" fill="#4a5361">평평한 화면</text>
<text x="195" y="150" font-size="19" font-weight="700" fill="#17191c">곡면</text>
<text x="195" y="176" font-size="16" fill="#4a5361">휘어진 화면</text>
<text x="195" y="250" font-size="19" font-weight="700" fill="#17191c">폴더블</text>
<text x="195" y="276" font-size="16" fill="#4a5361">접히는 화면</text>
<text x="195" y="350" font-size="19" font-weight="700" fill="#17191c">롤러블</text>
<text x="195" y="376" font-size="16" fill="#4a5361">말리는 화면</text>
<text x="180" y="436" font-size="16" fill="#17191c" text-anchor="middle">OLED는 백라이트가 없어 얇게 만들 수 있어서</text>
<text x="180" y="460" font-size="16" fill="#17191c" text-anchor="middle">휘고, 접고, 말 수 있어요.</text>
</g>
</svg>
