<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 236" width="640" height="236" role="img" aria-labelledby="title desc">
<title id="title">cv2.flip의 방향 값에 따라 뒤집힌 네 화면</title>
<desc id="desc">원본 화면은 왼쪽 위에 파란 세모가 있고 가운데에 글자 R이 바로 서 있다. 방향 1(좌우 반전)은 세모가 오른쪽 위로 가고 R이 거울 글자가 된다. 방향 0(위아래 반전)은 세모가 왼쪽 아래로 가고 R이 거꾸로 선다. 방향 -1(둘 다 반전)은 세모가 오른쪽 아래로 가고 R이 좌우와 위아래가 모두 뒤집힌다. 사이트가 직접 그린 그림.</desc>
<rect width="640" height="236" fill="#ffffff"/>
<g font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="middle"><rect x="5" y="10" width="150" height="150" rx="12" fill="#f4f6f9" stroke="#7b8594" stroke-width="1.5"/><g transform="translate(80 85) scale(1 1) translate(-80 -85)"><path d="M17 22 H55 L17 60 Z" fill="#1f5bd6"/><text x="80" y="115" font-size="84" font-weight="800" fill="#17191c">R</text></g><text x="80" y="188" font-size="18" font-weight="700" fill="#17191c">원본</text><text x="80" y="214" font-size="16" fill="#4a5361">그대로</text><rect x="165" y="10" width="150" height="150" rx="12" fill="#f4f6f9" stroke="#7b8594" stroke-width="1.5"/><g transform="translate(240 85) scale(-1 1) translate(-240 -85)"><path d="M177 22 H215 L177 60 Z" fill="#1f5bd6"/><text x="240" y="115" font-size="84" font-weight="800" fill="#17191c">R</text></g><text x="240" y="188" font-size="18" font-weight="700" fill="#17191c">방향 1</text><text x="240" y="214" font-size="16" fill="#4a5361">좌우 반전</text><rect x="325" y="10" width="150" height="150" rx="12" fill="#f4f6f9" stroke="#7b8594" stroke-width="1.5"/><g transform="translate(400 85) scale(1 -1) translate(-400 -85)"><path d="M337 22 H375 L337 60 Z" fill="#1f5bd6"/><text x="400" y="115" font-size="84" font-weight="800" fill="#17191c">R</text></g><text x="400" y="188" font-size="18" font-weight="700" fill="#17191c">방향 0</text><text x="400" y="214" font-size="16" fill="#4a5361">위아래 반전</text><rect x="485" y="10" width="150" height="150" rx="12" fill="#f4f6f9" stroke="#7b8594" stroke-width="1.5"/><g transform="translate(560 85) scale(-1 -1) translate(-560 -85)"><path d="M497 22 H535 L497 60 Z" fill="#1f5bd6"/><text x="560" y="115" font-size="84" font-weight="800" fill="#17191c">R</text></g><text x="560" y="188" font-size="18" font-weight="700" fill="#17191c">방향 -1</text><text x="560" y="214" font-size="16" fill="#4a5361">둘 다 반전</text></g>
</svg>
