<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="title desc">
<title id="title">랜드마크 좌표 x 0.52, y 0.60이 화면의 어디인지</title>
<desc id="desc">네모난 화면 안에 편 손이 있고, 검지 끝(8번 점)에 파란 동그라미가 있다. 화면 위쪽 가장자리의 눈금은 왼쪽이 0, 오른쪽이 1이고 검지 끝에서 위로 올린 점선이 0.52를 가리킨다. 왼쪽 가장자리의 눈금은 위가 0, 아래가 1이고 검지 끝에서 왼쪽으로 그은 점선이 0.60을 가리킨다. y는 아래로 갈수록 커진다. 사이트가 직접 그린 그림.</desc>
<rect width="640" height="360" fill="#ffffff"/>
