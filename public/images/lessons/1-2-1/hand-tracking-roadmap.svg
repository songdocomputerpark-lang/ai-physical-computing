<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="title desc">
<title id="title">핸드 트래킹 중단원에서 만들 세 프로그램</title>
<desc id="desc">왼쪽(1-2-1)은 편 손의 손가락 관절 21곳에 빨간 점을 찍고 선으로 이은 모습이다. 가운데(1-2-2)는 검지만 편 손의 검지 끝에서 이어지는 초록 하트 모양 선으로, 허공에서 손끝이 움직인 자리가 선으로 남는다. 오른쪽(1-2-3)은 엄지 끝과 검지 끝을 잇는 초록 선과, 그 거리를 반지름으로 한 노란 원이다. 사이트가 직접 그린 그림.</desc>
