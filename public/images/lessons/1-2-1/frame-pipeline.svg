<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-labelledby="title desc">
<title id="title">손 인식 프로그램이 프레임마다 되풀이하는 여섯 단계</title>
<desc id="desc">위 줄은 왼쪽에서 오른쪽으로 ① 프레임 읽기(video.read), ② 좌우 반전(cv2.flip), ③ 색 순서 바꾸기(cv2.cvtColor)이고, 아래로 내려와 오른쪽에서 왼쪽으로 ④ 손 찾기(hands.process), ⑤ 점과 선 그리기(draw_landmarks), ⑥ 화면에 보여 주기(cv2.imshow)가 이어진다. ⑥에서 키를 확인하고(waitKey) 파란 점선을 따라 다시 ①로 돌아가 다음 프레임을 처리한다. ④와 ⑤는 MediaPipe가 하는 일이라 파란 칸이고, 나머지는 OpenCV가 하는 일이라 흰 칸이다. 사이트가 직접 그린 그림(원고 027쪽 프로그램 구조도를 고리 모양으로 다시 그림).</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#4a5361"/></marker><marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f5bd6"/></marker></defs>
<rect width="640" height="330" fill="#ffffff"/>
<g font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="middle"><rect x="20" y="46" width="180" height="100" rx="12" fill="#ffffff" stroke="#7b8594" stroke-width="1.5" /><text x="110" y="78" font-size="18" font-weight="700" fill="#17191c">① 프레임 읽기</text><text x="110" y="106" font-size="16" font-family="ui-monospace, 'Cascadia Mono', Consolas, 'D2Coding', 'Malgun Gothic', monospace" fill="#17191c">video.read()</text><text x="110" y="133" font-size="16" font-weight="400" fill="#4a5361">OpenCV</text><rect x="230" y="46" width="180" height="100" rx="12" fill="#ffffff" stroke="#7b8594" stroke-width="1.5" /><text x="320" y="78" font-size="18" font-weight="700" fill="#17191c">② 좌우 반전</text><text x="320" y="106" font-size="16" font-family="ui-monospace, 'Cascadia Mono', Consolas, 'D2Coding', 'Malgun Gothic', monospace" fill="#17191c">cv2.flip()</text><text x="320" y="133" font-size="16" font-weight="400" fill="#4a5361">OpenCV</text><rect x="440" y="46" width="180" height="100" rx="12" fill="#ffffff" stroke="#7b8594" stroke-width="1.5" /><text x="530" y="78" font-size="18" font-weight="700" fill="#17191c">③ 색 순서 바꾸기</text><text x="530" y="106" font-size="16" font-family="ui-monospace, 'Cascadia Mono', Consolas, 'D2Coding', 'Malgun Gothic', monospace" fill="#17191c">cv2.cvtColor()</text><text x="530" y="133" font-size="16" font-weight="400" fill="#4a5361">OpenCV</text><rect x="440" y="206" width="180" height="100" rx="12" fill="#eaf1fe" stroke="#5b87e0" stroke-width="2.5" /><text x="530" y="238" font-size="18" font-weight="700" fill="#17191c">④ 손 찾기</text><text x="530" y="266" font-size="16" font-family="ui-monospace, 'Cascadia Mono', Consolas, 'D2Coding', 'Malgun Gothic', monospace" fill="#17191c">hands.process()</text><text x="530" y="293" font-size="16" font-weight="700" fill="#1a4cb4">MediaPipe</text><rect x="230" y="206" width="180" height="100" rx="12" fill="#eaf1fe" stroke="#5b87e0" stroke-width="2.5" /><text x="320" y="238" font-size="18" font-weight="700" fill="#17191c">⑤ 점과 선 그리기</text><text x="320" y="266" font-size="16" font-family="ui-monospace, 'Cascadia Mono', Consolas, 'D2Coding', 'Malgun Gothic', monospace" fill="#17191c">draw_landmarks()</text><text x="320" y="293" font-size="16" font-weight="700" fill="#1a4cb4">MediaPipe</text><rect x="20" y="206" width="180" height="100" rx="12" fill="#ffffff" stroke="#7b8594" stroke-width="1.5" /><text x="110" y="238" font-size="18" font-weight="700" fill="#17191c">⑥ 화면에 보여 주기</text><text x="110" y="266" font-size="16" font-family="ui-monospace, 'Cascadia Mono', Consolas, 'D2Coding', 'Malgun Gothic', monospace" fill="#17191c">cv2.imshow()</text><text x="110" y="293" font-size="16" font-weight="400" fill="#4a5361">OpenCV</text><line x1="202" y1="96" x2="226" y2="96" stroke="#4a5361" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="412" y1="96" x2="436" y2="96" stroke="#4a5361" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="530" y1="148" x2="530" y2="202" stroke="#4a5361" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="438" y1="256" x2="414" y2="256" stroke="#4a5361" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="228" y1="256" x2="204" y2="256" stroke="#4a5361" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="110" y1="204" x2="110" y2="150" stroke="#1f5bd6" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrowBlue)"/><text x="124" y="182" font-size="16" font-weight="700" fill="#1a4cb4" text-anchor="start">키를 확인하고(waitKey) 다음 프레임으로 되풀이</text><text x="320" y="324" font-size="16" fill="#4a5361">흰 칸은 OpenCV, 파란 칸은 MediaPipe가 해요</text></g>
</svg>
