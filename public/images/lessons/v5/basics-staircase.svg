<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="title desc">
<title id="title">영상 처리 기초 계단: V1 픽셀 숫자, V2 회색 사진, V3 흑백 나누기, V4 블러와 에지, V5 덩어리 찾기</title>
<desc id="desc">왼쪽 아래에서 오른쪽 위로 올라가는 다섯 칸의 계단. V1 픽셀 숫자(gray[y, x]), V2 회색 사진(cvtColor), V3 흑백 나누기(threshold), V4 블러와 에지(GaussianBlur), V5 덩어리 찾기(findContours) 차례이고, 가장 높은 V5 칸이 파랗게 칠해져 "이 차시"라고 적혀 있다. 아래에 V5에서 앞의 네 계단이 한 코드로 이어진다고 적혀 있다. 사이트가 직접 그린 그림.</desc>
<rect width="640" height="300" fill="#ffffff"/>
<g font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="middle">
<rect x="12" y="170" width="120" height="92" rx="10" fill="#eaf1fe" stroke="#5b87e0" stroke-width="1.5"/>
<text x="72" y="198" font-size="18" font-weight="800" fill="#17191c">V1</text>
<text x="72" y="224" font-size="17" font-weight="700" fill="#17191c">픽셀 숫자</text>
<text x="72" y="248" font-size="16" font-family="Consolas, 'Courier New', monospace" fill="#4a5361">gray[y, x]</text>
<rect x="136" y="140" width="120" height="122" rx="10" fill="#eaf1fe" stroke="#5b87e0" stroke-width="1.5"/>
<text x="196" y="168" font-size="18" font-weight="800" fill="#17191c">V2</text>
<text x="196" y="194" font-size="17" font-weight="700" fill="#17191c">회색 사진</text>
<text x="196" y="218" font-size="16" font-family="Consolas, 'Courier New', monospace" fill="#4a5361">cvtColor</text>
<rect x="260" y="110" width="120" height="152" rx="10" fill="#eaf1fe" stroke="#5b87e0" stroke-width="1.5"/>
<text x="320" y="138" font-size="18" font-weight="800" fill="#17191c">V3</text>
<text x="320" y="164" font-size="17" font-weight="700" fill="#17191c">흑백 나누기</text>
<text x="320" y="188" font-size="16" font-family="Consolas, 'Courier New', monospace" fill="#4a5361">threshold</text>
<rect x="384" y="80" width="120" height="182" rx="10" fill="#eaf1fe" stroke="#5b87e0" stroke-width="1.5"/>
<text x="444" y="108" font-size="18" font-weight="800" fill="#17191c">V4</text>
<text x="444" y="134" font-size="17" font-weight="700" fill="#17191c">블러와 에지</text>
<text x="444" y="158" font-size="16" font-family="Consolas, 'Courier New', monospace" fill="#4a5361">GaussianBlur</text>
<rect x="508" y="50" width="120" height="212" rx="10" fill="#1f5bd6" stroke="#1a4cb4" stroke-width="1.5"/>
<text x="568" y="78" font-size="18" font-weight="800" fill="#ffffff">V5</text>
<text x="568" y="104" font-size="17" font-weight="700" fill="#ffffff">덩어리 찾기</text>
<text x="568" y="128" font-size="16" font-family="Consolas, 'Courier New', monospace" fill="#ffffff">findContours</text>
<text x="568" y="38" font-size="16" font-weight="700" fill="#1f5bd6">이 차시</text>
<line x1="12" y1="266" x2="628" y2="266" stroke="#7b8594" stroke-width="1.5"/>
<text x="320" y="292" font-size="17" font-weight="700" fill="#17191c">V5에서 앞의 네 계단이 한 코드 안에 차례로 이어져요</text>
</g>
</svg>
