<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img" aria-labelledby="title desc">
<title id="title">에지를 찾는 세 단계: 회색으로 바꾸고, 살짝 흐리게 하고, 밝기가 확 바뀌는 곳만 흰 선으로 남긴다</title>
<desc id="desc">위에서 아래로 세 그림. 첫째 "회색으로"에는 어두운 바탕 위에 흰 원과 밝은 회색 네모가 있고, 바탕에 작은 잡티 점이 흩어져 있다(cvtColor). 둘째 "살짝 흐리게"에는 같은 그림이 부드럽게 흐려져 잡티 점이 거의 보이지 않는다(GaussianBlur). 셋째 "테두리 찾기"는 검은 바탕에 원과 네모의 테두리만 흰 선으로 남았다(Canny). 맨 아래에 시작하기의 첫 실습도 이 세 단계라고 적혀 있다. 휴대폰처럼 좁은 화면에서 읽기 쉽게 세 그림을 위아래로 다시 배치한 그림이다. 사이트가 직접 그린 그림.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 Z" fill="#4a5361"/>
</marker>
<linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#3f3f3f"/>
<stop offset="1" stop-color="#7a7a7a"/>
</linearGradient>
<filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
<feGaussianBlur stdDeviation="3"/>
</filter>
<clipPath id="clip2"><rect x="225" y="48" width="190" height="170" rx="8"/></clipPath>
</defs>
<rect width="360" height="470" fill="#ffffff"/>
<svg x="20" y="18" width="130" height="116" viewBox="12 48 190 170">
<rect x="12" y="48" width="190" height="170" rx="8" fill="url(#ground)" stroke="#7b8594" stroke-width="1.5"/>
<circle cx="74" cy="152" r="34" fill="#eeeeee"/><rect x="116" y="82" width="60" height="60" fill="#b9b9b9"/>
<rect x="102" y="94" width="3" height="3" fill="#a0a0a0"/><rect x="121" y="68" width="3" height="3" fill="#a0a0a0"/><rect x="38" y="193" width="3" height="3" fill="#a0a0a0"/><rect x="44" y="149" width="3" height="3" fill="#a0a0a0"/><rect x="169" y="70" width="3" height="3" fill="#a0a0a0"/><rect x="149" y="110" width="3" height="3" fill="#a0a0a0"/><rect x="29" y="78" width="3" height="3" fill="#a0a0a0"/><rect x="131" y="163" width="3" height="3" fill="#a0a0a0"/><rect x="37" y="117" width="3" height="3" fill="#a0a0a0"/><rect x="43" y="197" width="3" height="3" fill="#a0a0a0"/><rect x="128" y="71" width="3" height="3" fill="#a0a0a0"/><rect x="164" y="87" width="3" height="3" fill="#a0a0a0"/><rect x="77" y="205" width="3" height="3" fill="#a0a0a0"/><rect x="35" y="203" width="3" height="3" fill="#a0a0a0"/><rect x="169" y="157" width="3" height="3" fill="#a0a0a0"/><rect x="32" y="112" width="3" height="3" fill="#a0a0a0"/><rect x="31" y="198" width="3" height="3" fill="#a0a0a0"/><rect x="54" y="130" width="3" height="3" fill="#a0a0a0"/><rect x="127" y="92" width="3" height="3" fill="#a0a0a0"/><rect x="158" y="86" width="3" height="3" fill="#a0a0a0"/><rect x="166" y="134" width="3" height="3" fill="#a0a0a0"/><rect x="163" y="102" width="3" height="3" fill="#a0a0a0"/><rect x="46" y="204" width="3" height="3" fill="#a0a0a0"/><rect x="166" y="104" width="3" height="3" fill="#a0a0a0"/><rect x="115" y="80" width="3" height="3" fill="#a0a0a0"/><rect x="160" y="72" width="3" height="3" fill="#a0a0a0"/>
</svg>
<line x1="85" y1="138" x2="85" y2="156" stroke="#4a5361" stroke-width="2.5" marker-end="url(#arrow)"/>
<svg x="20" y="160" width="130" height="116" viewBox="225 48 190 170">
<g clip-path="url(#clip2)">
<rect x="225" y="48" width="190" height="170" fill="url(#ground)"/>
<g filter="url(#soft)"><circle cx="287" cy="152" r="34" fill="#eeeeee"/><rect x="329" y="82" width="60" height="60" fill="#b9b9b9"/><rect x="315" y="94" width="3" height="3" fill="#a0a0a0"/><rect x="334" y="68" width="3" height="3" fill="#a0a0a0"/><rect x="251" y="193" width="3" height="3" fill="#a0a0a0"/><rect x="257" y="149" width="3" height="3" fill="#a0a0a0"/><rect x="382" y="70" width="3" height="3" fill="#a0a0a0"/><rect x="362" y="110" width="3" height="3" fill="#a0a0a0"/><rect x="242" y="78" width="3" height="3" fill="#a0a0a0"/><rect x="344" y="163" width="3" height="3" fill="#a0a0a0"/><rect x="250" y="117" width="3" height="3" fill="#a0a0a0"/><rect x="256" y="197" width="3" height="3" fill="#a0a0a0"/><rect x="341" y="71" width="3" height="3" fill="#a0a0a0"/><rect x="377" y="87" width="3" height="3" fill="#a0a0a0"/><rect x="290" y="205" width="3" height="3" fill="#a0a0a0"/><rect x="248" y="203" width="3" height="3" fill="#a0a0a0"/><rect x="382" y="157" width="3" height="3" fill="#a0a0a0"/><rect x="245" y="112" width="3" height="3" fill="#a0a0a0"/><rect x="244" y="198" width="3" height="3" fill="#a0a0a0"/><rect x="267" y="130" width="3" height="3" fill="#a0a0a0"/><rect x="340" y="92" width="3" height="3" fill="#a0a0a0"/><rect x="371" y="86" width="3" height="3" fill="#a0a0a0"/><rect x="379" y="134" width="3" height="3" fill="#a0a0a0"/><rect x="376" y="102" width="3" height="3" fill="#a0a0a0"/><rect x="259" y="204" width="3" height="3" fill="#a0a0a0"/><rect x="379" y="104" width="3" height="3" fill="#a0a0a0"/><rect x="328" y="80" width="3" height="3" fill="#a0a0a0"/><rect x="373" y="72" width="3" height="3" fill="#a0a0a0"/></g>
</g>
<rect x="225" y="48" width="190" height="170" rx="8" fill="none" stroke="#7b8594" stroke-width="1.5"/>
</svg>
<line x1="85" y1="280" x2="85" y2="298" stroke="#4a5361" stroke-width="2.5" marker-end="url(#arrow)"/>
<svg x="20" y="302" width="130" height="116" viewBox="438 48 190 170">
<rect x="438" y="48" width="190" height="170" rx="8" fill="#000000" stroke="#7b8594" stroke-width="1.5"/>
<circle cx="500" cy="152" r="34" fill="none" stroke="#ffffff" stroke-width="2.5"/>
<rect x="542" y="82" width="60" height="60" fill="none" stroke="#ffffff" stroke-width="2.5"/>
</svg>
<g font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif">
<text x="166" y="50" font-size="16" font-weight="700" fill="#17191c">① 회색으로</text>
<text x="166" y="76" font-size="14" font-family="Consolas, 'Courier New', monospace" fill="#17191c">cvtColor</text>
<text x="166" y="100" font-size="14" fill="#4a5361">색을 빼고 밝기만</text>
<text x="166" y="192" font-size="16" font-weight="700" fill="#17191c">② 살짝 흐리게</text>
<text x="166" y="218" font-size="14" font-family="Consolas, 'Courier New', monospace" fill="#17191c">GaussianBlur</text>
<text x="166" y="242" font-size="14" fill="#4a5361">잡티를 줄여요</text>
<text x="166" y="334" font-size="16" font-weight="700" fill="#17191c">③ 테두리 찾기</text>
<text x="166" y="360" font-size="14" font-family="Consolas, 'Courier New', monospace" fill="#17191c">Canny</text>
<text x="166" y="384" font-size="14" fill="#4a5361">밝기가 확 바뀌는 곳</text>
<text x="180" y="438" font-size="15" font-weight="700" fill="#1f5bd6" text-anchor="middle">시작하기의 첫 실습(웹캠 에지 검출)도</text>
<text x="180" y="458" font-size="15" font-weight="700" fill="#1f5bd6" text-anchor="middle">이 세 단계예요</text>
</g>
</svg>
