<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 312" width="640" height="312" role="img" aria-labelledby="title desc">
<title id="title">터치 센서를 누른 순간만 세는 방법</title>
<desc id="desc">시간 순서대로 0.05초마다 읽은 값을 세 줄로 적은 그림. 지금 값(touch_state) 줄은 0, 0, 1, 1, 1, 1, 0, 0, 0, 1, 1, 0, 0, 0이고, 이전 값(prev_touch) 줄은 한 칸씩 늦게 따라온다. 지금 값이 1이고 이전 값이 0인 두 칸(세 번째와 열 번째)만 파랗게 강조되어 셈(counter)이 1과 2로 하나씩 늘고, 누르고 있는 동안에는 늘지 않는다. 사이트가 직접 그린 그림.</desc>
