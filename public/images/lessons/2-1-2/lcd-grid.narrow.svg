<text x="337" y="50" font-size="13" fill="#4a5361" text-anchor="middle">15</text>
<text x="16" y="222" font-family="'Consolas', 'D2Coding', 'Menlo', monospace" font-size="14" fill="#17191c">lcd.move_to(0, 0)</text>
<text x="16" y="249" font-size="14" fill="#17191c">커서를 첫 줄 첫 칸 (0, 0)으로 옮겨요</text>
<text x="16" y="280" font-family="'Consolas', 'D2Coding', 'Menlo', monospace" font-size="14" fill="#17191c">lcd.putstr(&apos;Hello LCD!&apos;)</text>
