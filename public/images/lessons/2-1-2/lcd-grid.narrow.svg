<text x="217" y="50" font-size="13" fill="#4a5361" text-anchor="middle">9</text>
<text x="217" y="88" font-family="'Consolas', 'D2Coding', 'Menlo', monospace" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">!</text>
<text x="237" y="50" font-size="13" fill="#4a5361" text-anchor="middle">10</text>
<text x="257" y="50" font-size="13" fill="#4a5361" text-anchor="middle">11</text>
<text x="277" y="50" font-size="13" fill="#4a5361" text-anchor="middle">12</text>
<text x="297" y="50" font-size="13" fill="#4a5361" text-anchor="middle">13</text>
