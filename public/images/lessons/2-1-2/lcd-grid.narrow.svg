<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 380" width="360" height="380" role="img" aria-labelledby="title desc">
<title id="title">문자 LCD(16×2)의 칸과 좌표</title>
<desc id="desc">두 줄, 한 줄에 16칸인 문자 LCD. 위쪽에 열 번호 0부터 15, 왼쪽에 행 번호 0과 1이 적혀 있다. 왼쪽 위 칸이 (0, 0), 오른쪽 위가 (15, 0), 왼쪽 아래가 (0, 1), 오른쪽 아래가 (15, 1)이고 네 모서리 칸에 노란 테두리가 있다. 첫 줄에는 Hello LCD!가 한 칸에 한 글자씩 들어 있고, 둘째 줄 넷째 칸(3열 1행)에 커서가 있다. 아래에 lcd.move_to(0, 0), lcd.putstr('Hello LCD!'), lcd.move_to(3, 1)이 각각 무슨 일을 하는지 적혀 있다. 휴대폰처럼 좁은 화면에서 읽기 쉽게 같은 내용을 다시 배치한 그림이다. 사이트가 직접 그린 그림.</desc>
