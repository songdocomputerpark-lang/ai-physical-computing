<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" width="360" height="280" role="img" aria-labelledby="title desc">
<title id="title">생활 속 두 줄 문자 화면</title>
<desc id="desc">두 줄짜리 문자 화면이 달린 장치 세 개. 프린터 화면에는 READY와 PAPER: A4, 온습도계 화면에는 TEMP 24.5C와 HUMI 40%, 자판기 화면에는 COIN 1500과 SELECT ITEM이 두 줄로 떠 있다. 모두 기계가 지금 상태를 글자와 숫자로 알려 주는 화면이다. 휴대폰처럼 좁은 화면에서 읽기 쉽게 같은 내용을 다시 배치한 그림이다. 사이트가 직접 그린 그림.</desc>
<rect width="360" height="280" fill="#ffffff"/>
<rect x="10" y="10" width="340" height="82" rx="14" fill="#f4f6f9" stroke="#7b8594"/>
<rect x="18" y="20" width="164" height="62" rx="8" fill="#22384d"/>
<rect x="24" y="26" width="152" height="50" rx="4" fill="#2f5fc4"/>
<rect x="10" y="100" width="340" height="82" rx="14" fill="#f4f6f9" stroke="#7b8594"/>
<rect x="18" y="110" width="164" height="62" rx="8" fill="#22384d"/>
<rect x="24" y="116" width="152" height="50" rx="4" fill="#2f5fc4"/>
<rect x="10" y="190" width="340" height="82" rx="14" fill="#f4f6f9" stroke="#7b8594"/>
<rect x="18" y="200" width="164" height="62" rx="8" fill="#22384d"/>
<rect x="24" y="206" width="152" height="50" rx="4" fill="#2f5fc4"/>
<g font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif">
<text x="30" y="47" font-family="'Consolas', 'D2Coding', 'Menlo', monospace" font-size="15" fill="#ffffff" xml:space="preserve" style="white-space:pre">READY</text>
<text x="30" y="68" font-family="'Consolas', 'D2Coding', 'Menlo', monospace" font-size="15" fill="#ffffff" xml:space="preserve" style="white-space:pre">PAPER: A4</text>
<text x="194" y="46" font-size="17" font-weight="700" fill="#17191c">프린터</text>
<text x="194" y="70" font-size="14" fill="#4a5361">지금 상태를 알려요</text>
<text x="30" y="137" font-family="'Consolas', 'D2Coding', 'Menlo', monospace" font-size="15" fill="#ffffff" xml:space="preserve" style="white-space:pre">TEMP  24.5C</text>
<text x="30" y="158" font-family="'Consolas', 'D2Coding', 'Menlo', monospace" font-size="15" fill="#ffffff" xml:space="preserve" style="white-space:pre">HUMI  40%</text>
<text x="194" y="136" font-size="17" font-weight="700" fill="#17191c">온습도계</text>
<text x="194" y="160" font-size="14" fill="#4a5361">잰 값을 숫자로 보여요</text>
<text x="30" y="227" font-family="'Consolas', 'D2Coding', 'Menlo', monospace" font-size="15" fill="#ffffff" xml:space="preserve" style="white-space:pre">COIN  1500</text>
<text x="30" y="248" font-family="'Consolas', 'D2Coding', 'Menlo', monospace" font-size="15" fill="#ffffff" xml:space="preserve" style="white-space:pre">SELECT ITEM</text>
<text x="194" y="226" font-size="17" font-weight="700" fill="#17191c">자판기</text>
<text x="194" y="250" font-size="14" fill="#4a5361">넣은 돈을 보여요</text>
</g>
</svg>
