<text x="496" y="48" font-size="16" fill="#4a5361" text-anchor="middle">12</text>
<text x="532" y="48" font-size="16" fill="#4a5361" text-anchor="middle">13</text>
<text x="568" y="48" font-size="16" fill="#4a5361" text-anchor="middle">14</text>
<text x="604" y="48" font-size="16" fill="#4a5361" text-anchor="middle">15</text>
<rect x="38" y="48" width="592" height="110" rx="8" fill="#22384d"/>
<text x="20" y="84" font-size="16" font-weight="700" fill="#4a5361" text-anchor="middle">0</text>
<text x="20" y="134" font-size="16" font-weight="700" fill="#4a5361" text-anchor="middle">1</text>
<text x="22" y="180" font-size="16" font-weight="700" fill="#4a5361" text-anchor="middle">행(y)</text>
<rect x="48" y="56" width="32" height="44" rx="3" fill="#2f5fc4" stroke="#f6d36b" stroke-width="3"/>
<text x="64" y="86" font-family="'Consolas', 'D2Coding', 'Menlo', monospace" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">H</text>
