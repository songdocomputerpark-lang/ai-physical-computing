<text x="316" y="48" font-size="16" fill="#4a5361" text-anchor="middle">7</text>
<text x="352" y="48" font-size="16" fill="#4a5361" text-anchor="middle">8</text>
<text x="388" y="48" font-size="16" fill="#4a5361" text-anchor="middle">9</text>
<text x="424" y="48" font-size="16" fill="#4a5361" text-anchor="middle">10</text>
