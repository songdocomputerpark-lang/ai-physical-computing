<rect x="228" y="56" width="32" height="44" rx="3" fill="#2f5fc4"/>
<rect x="264" y="56" width="32" height="44" rx="3" fill="#2f5fc4"/>
<text x="280" y="86" font-family="'Consolas', 'D2Coding', 'Menlo', monospace" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">L</text>
<rect x="300" y="56" width="32" height="44" rx="3" fill="#2f5fc4"/>
<text x="316" y="86" font-family="'Consolas', 'D2Coding', 'Menlo', monospace" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">C</text>
<rect x="336" y="56" width="32" height="44" rx="3" fill="#2f5fc4"/>
