<rect x="588" y="106" width="32" height="44" rx="3" fill="#2f5fc4" stroke="#f6d36b" stroke-width="3"/>
<rect x="163" y="140" width="18" height="4" fill="#ffffff"/>
<text x="630" y="180" font-size="16" fill="#4a5361" text-anchor="end">노란 테두리: 네 모서리 칸 (0, 0), (15, 0), (0, 1), (15, 1)</text>
<rect x="8" y="192" width="256" height="30" rx="6" fill="#edf1f6"/>
<text x="18" y="214" font-family="'Consolas', 'D2Coding', 'Menlo', monospace" font-size="16" fill="#17191c">lcd.move_to(0, 0)</text>
<text x="276" y="214" font-size="16" fill="#17191c">커서를 첫 줄 첫 칸 (0, 0)으로 옮겨요</text>
<rect x="8" y="226" width="256" height="30" rx="6" fill="#edf1f6"/>
<text x="18" y="248" font-family="'Consolas', 'D2Coding', 'Menlo', monospace" font-size="16" fill="#17191c">lcd.putstr('Hello LCD!')</text>
<text x="276" y="248" font-size="16" fill="#17191c">커서 자리부터 한 칸에 한 글자씩 써요</text>
<rect x="8" y="260" width="256" height="30" rx="6" fill="#edf1f6"/>
<text x="18" y="282" font-family="'Consolas', 'D2Coding', 'Menlo', monospace" font-size="16" fill="#17191c">lcd.move_to(3, 1)</text>
<text x="276" y="282" font-size="16" fill="#17191c">커서를 둘째 줄 넷째 칸 (3, 1)로 옮겨요</text>
