<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 268" width="640" height="268" role="img" aria-labelledby="title desc">
<title id="title">RTC 날짜와 시각 튜플의 여덟 칸</title>
<desc id="desc">rtc.datetime((2025, 6, 21, 6, 11, 0, 0, 0))의 값 여덟 개가 칸에 하나씩 들어 있다. 칸 아래에 t[0]부터 t[7]까지의 번호와 뜻(년, 월, 일, 요일, 시, 분, 초, 초 아래)이 적혀 있다. 시, 분, 초인 t[4], t[5], t[6] 세 칸이 파랗게 강조되어 있고, 이 세 값을 형식 {:02}로 두 자리씩 이어 LCD에 Time: 11:00:00으로 보여 준다. 사이트가 직접 그린 그림.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f5bd6"/></marker></defs>
<rect width="640" height="268" fill="#ffffff"/>
<g font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif">
<text x="320" y="24" font-family="'Consolas', 'D2Coding', 'Menlo', monospace" font-size="16" fill="#17191c" text-anchor="middle">rtc.datetime((2025, 6, 21, 6, 11, 0, 0, 0))</text>
<rect x="8" y="40" width="72" height="58" rx="8" fill="#f4f6f9" stroke="#7b8594" stroke-width="1"/>
<text x="44" y="78" font-size="22" font-weight="700" fill="#17191c" text-anchor="middle">2025</text>
<text x="44" y="122" font-family="'Consolas', 'D2Coding', 'Menlo', monospace" font-size="16" fill="#1a4cb4" text-anchor="middle">t[0]</text>
<text x="44" y="146" font-size="16" fill="#17191c" text-anchor="middle">년</text>
<rect x="86" y="40" width="72" height="58" rx="8" fill="#f4f6f9" stroke="#7b8594" stroke-width="1"/>
<text x="122" y="78" font-size="22" font-weight="700" fill="#17191c" text-anchor="middle">6</text>
<text x="122" y="122" font-family="'Consolas', 'D2Coding', 'Menlo', monospace" font-size="16" fill="#1a4cb4" text-anchor="middle">t[1]</text>
<text x="122" y="146" font-size="16" fill="#17191c" text-anchor="middle">월</text>
<rect x="164" y="40" width="72" height="58" rx="8" fill="#f4f6f9" stroke="#7b8594" stroke-width="1"/>
<text x="200" y="78" font-size="22" font-weight="700" fill="#17191c" text-anchor="middle">21</text>
<text x="200" y="122" font-family="'Consolas', 'D2Coding', 'Menlo', monospace" font-size="16" fill="#1a4cb4" text-anchor="middle">t[2]</text>
<text x="200" y="146" font-size="16" fill="#17191c" text-anchor="middle">일</text>
<rect x="242" y="40" width="72" height="58" rx="8" fill="#f4f6f9" stroke="#7b8594" stroke-width="1"/>
<text x="278" y="78" font-size="22" font-weight="700" fill="#17191c" text-anchor="middle">6</text>
<text x="278" y="122" font-family="'Consolas', 'D2Coding', 'Menlo', monospace" font-size="16" fill="#1a4cb4" text-anchor="middle">t[3]</text>
<text x="278" y="146" font-size="16" fill="#17191c" text-anchor="middle">요일</text>
<rect x="320" y="40" width="72" height="58" rx="8" fill="#eaf1fe" stroke="#1f5bd6" stroke-width="3"/>
<text x="356" y="78" font-size="22" font-weight="700" fill="#17191c" text-anchor="middle">11</text>
<text x="356" y="122" font-family="'Consolas', 'D2Coding', 'Menlo', monospace" font-size="16" fill="#1a4cb4" text-anchor="middle">t[4]</text>
<text x="356" y="146" font-size="16" fill="#17191c" text-anchor="middle">시</text>
<rect x="398" y="40" width="72" height="58" rx="8" fill="#eaf1fe" stroke="#1f5bd6" stroke-width="3"/>
<text x="434" y="78" font-size="22" font-weight="700" fill="#17191c" text-anchor="middle">0</text>
<text x="434" y="122" font-family="'Consolas', 'D2Coding', 'Menlo', monospace" font-size="16" fill="#1a4cb4" text-anchor="middle">t[5]</text>
<text x="434" y="146" font-size="16" fill="#17191c" text-anchor="middle">분</text>
<rect x="476" y="40" width="72" height="58" rx="8" fill="#eaf1fe" stroke="#1f5bd6" stroke-width="3"/>
<text x="512" y="78" font-size="22" font-weight="700" fill="#17191c" text-anchor="middle">0</text>
<text x="512" y="122" font-family="'Consolas', 'D2Coding', 'Menlo', monospace" font-size="16" fill="#1a4cb4" text-anchor="middle">t[6]</text>
<text x="512" y="146" font-size="16" fill="#17191c" text-anchor="middle">초</text>
<rect x="554" y="40" width="72" height="58" rx="8" fill="#f4f6f9" stroke="#7b8594" stroke-width="1"/>
<text x="590" y="78" font-size="22" font-weight="700" fill="#17191c" text-anchor="middle">0</text>
<text x="590" y="122" font-family="'Consolas', 'D2Coding', 'Menlo', monospace" font-size="16" fill="#1a4cb4" text-anchor="middle">t[7]</text>
<text x="590" y="146" font-size="16" fill="#17191c" text-anchor="middle">초 아래</text>
<path d="M320 158 V168 H548 V158" fill="none" stroke="#1f5bd6" stroke-width="2.5"/>
<line x1="434" y1="168" x2="434" y2="188" stroke="#1f5bd6" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="8" y="192" width="386" height="34" rx="6" fill="#edf1f6"/>
<text x="18" y="215" font-family="'Consolas', 'D2Coding', 'Menlo', monospace" font-size="15" fill="#17191c">"{:02}:{:02}:{:02}".format(t[4], t[5], t[6])</text>
<text x="398" y="215" font-size="16" fill="#17191c">→</text>
<rect x="420" y="188" width="208" height="42" rx="6" fill="#22384d"/>
<rect x="426" y="194" width="196" height="30" rx="3" fill="#2f5fc4"/>
<text x="436" y="215" font-family="'Consolas', 'D2Coding', 'Menlo', monospace" font-size="17" fill="#ffffff">Time: 11:00:00</text>
<text x="8" y="256" font-size="16" fill="#4a5361">{:02}는 한 자리 숫자 앞에 0을 채워 두 자리로 만들어요(0 → 00, 5 → 05).</text>
</g>
</svg>
