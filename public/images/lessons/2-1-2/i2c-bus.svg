<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 296" width="640" height="296" role="img" aria-labelledby="title desc">
<title id="title">I2C 통신: 선 두 개에 여러 장치를 잇고 주소로 부르기</title>
<desc id="desc">왼쪽 ESP32 보드의 SDA(21번 핀)와 SCL(22번 핀)에서 가로선 두 개가 오른쪽으로 뻗는다. 위 실선은 데이터를 싣는 SDA, 아래 점선은 박자를 맞추는 SCL이다. 두 선에 문자 LCD(주소 0x20)와 OLED(주소 0x3C)가 함께 이어져 있다. 보드는 주소로 장치를 골라 부른다. GND와 VCC 전원선은 따로 잇는다. 사이트가 직접 그린 그림.</desc>
<rect width="640" height="296" fill="#ffffff"/>
<g font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif">
<text x="320" y="24" font-size="17" font-weight="700" fill="#17191c" text-anchor="middle">선 두 개에 장치 여러 개를 잇고, 주소로 골라 불러요</text>

<!-- ESP32 -->
<rect x="12" y="44" width="160" height="132" rx="12" fill="#22384d"/>
<text x="56" y="72" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">ESP32</text>
<text x="160" y="102" font-size="16" font-weight="700" fill="#ffffff" text-anchor="end">SDA 21</text>
<text x="160" y="152" font-size="16" font-weight="700" fill="#ffffff" text-anchor="end">SCL 22</text>
<circle cx="172" cy="96" r="5" fill="#f6d36b"/>
<circle cx="172" cy="146" r="5" fill="#f6d36b"/>

<!-- 버스 선 -->
<line x1="172" y1="96" x2="628" y2="96" stroke="#1f5bd6" stroke-width="4"/>
<line x1="172" y1="146" x2="628" y2="146" stroke="#7a4a00" stroke-width="4" stroke-dasharray="12 6"/>

<!-- 문자 LCD -->
<line x1="312" y1="96" x2="312" y2="196" stroke="#1f5bd6" stroke-width="3"/>
<line x1="348" y1="146" x2="348" y2="196" stroke="#7a4a00" stroke-width="3"/>
<circle cx="312" cy="96" r="5" fill="#1f5bd6"/>
<circle cx="348" cy="146" r="5" fill="#7a4a00"/>
<rect x="262" y="196" width="170" height="76" rx="10" fill="#f4f6f9" stroke="#7b8594"/>
<text x="347" y="227" font-size="18" font-weight="700" fill="#17191c" text-anchor="middle">문자 LCD</text>
<text x="347" y="254" font-size="16" fill="#17191c" text-anchor="middle">주소 0x20</text>

<!-- OLED -->
<line x1="502" y1="96" x2="502" y2="196" stroke="#1f5bd6" stroke-width="3"/>
<line x1="538" y1="146" x2="538" y2="196" stroke="#7a4a00" stroke-width="3"/>
<circle cx="502" cy="96" r="5" fill="#1f5bd6"/>
<circle cx="538" cy="146" r="5" fill="#7a4a00"/>
<rect x="452" y="196" width="170" height="76" rx="10" fill="#f4f6f9" stroke="#7b8594"/>
<text x="537" y="227" font-size="18" font-weight="700" fill="#17191c" text-anchor="middle">OLED</text>
<text x="537" y="254" font-size="16" fill="#17191c" text-anchor="middle">주소 0x3C</text>

<!-- 범례 -->
<line x1="14" y1="204" x2="50" y2="204" stroke="#1f5bd6" stroke-width="4"/>
<text x="58" y="210" font-size="16" fill="#17191c">SDA: 데이터를 실어요</text>
<line x1="14" y1="236" x2="50" y2="236" stroke="#7a4a00" stroke-width="4" stroke-dasharray="12 6"/>
<text x="58" y="242" font-size="16" fill="#17191c">SCL: 박자를 맞춰요</text>
<text x="14" y="276" font-size="16" fill="#4a5361">GND, VCC는 따로 이어요</text>
</g>
</svg>
