<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="title desc">
<title id="title">서보모터로 만드는 60초 초시계</title>
<desc id="desc">반원 눈금에 0초부터 60초까지 10초마다 적혀 있고 0초는 왼쪽(0°), 30초는 위(90°), 60초는 오른쪽(180°)이다. 주황 팔이 20초 자리(60°)를 가리킨다. 가운데 아래에 각도 = 초 × 3, servo_1.rotate(초 * 3)이 적혀 있다. 사이트가 직접 그린 그림.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#4a5361"/></marker></defs>
<rect width="640" height="300" fill="#ffffff"/>
<g font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif">
<text x="320" y="26" font-size="18" font-weight="700" fill="#17191c" text-anchor="middle">60초 초시계: 1초에 3°씩, 60초면 180°</text>
<path d="M170 230 A150 150 0 0 1 470 230" fill="none" stroke="#7b8594" stroke-width="2"/>
<line x1="176" y1="230" x2="166" y2="230" stroke="#7b8594" stroke-width="2"/>
<text x="152" y="235.2" font-size="15" fill="#4a5361" text-anchor="end">0초</text>
<line x1="195.3" y1="158" x2="186.6" y2="153" stroke="#7b8594" stroke-width="2"/>
<text x="174.5" y="151.2" font-size="15" fill="#4a5361" text-anchor="end">10초</text>
<line x1="248" y1="105.3" x2="243" y2="96.6" stroke="#7b8594" stroke-width="2"/>
<text x="236" y="89.8" font-size="15" fill="#4a5361" text-anchor="middle">20초</text>
<line x1="320" y1="86" x2="320" y2="76" stroke="#7b8594" stroke-width="2"/>
<text x="320" y="67.2" font-size="15" fill="#4a5361" text-anchor="middle">30초</text>
<line x1="392" y1="105.3" x2="397" y2="96.6" stroke="#7b8594" stroke-width="2"/>
<text x="404" y="89.8" font-size="15" fill="#4a5361" text-anchor="middle">40초</text>
<line x1="444.7" y1="158" x2="453.4" y2="153" stroke="#7b8594" stroke-width="2"/>
<text x="465.5" y="151.2" font-size="15" fill="#4a5361" text-anchor="start">50초</text>
<line x1="464" y1="230" x2="474" y2="230" stroke="#7b8594" stroke-width="2"/>
<text x="488" y="235.2" font-size="15" fill="#4a5361" text-anchor="start">60초</text>
<line x1="174" y1="230" x2="170" y2="230" stroke="#7b8594" stroke-width="1.5"/>
<line x1="179" y1="192.2" x2="175.1" y2="191.2" stroke="#7b8594" stroke-width="1.5"/>
<line x1="193.6" y1="157" x2="190.1" y2="155" stroke="#7b8594" stroke-width="1.5"/>
<line x1="216.8" y1="126.8" x2="213.9" y2="123.9" stroke="#7b8594" stroke-width="1.5"/>
<line x1="247" y1="103.6" x2="245" y2="100.1" stroke="#7b8594" stroke-width="1.5"/>
<line x1="282.2" y1="89" x2="281.2" y2="85.1" stroke="#7b8594" stroke-width="1.5"/>
<line x1="320" y1="84" x2="320" y2="80" stroke="#7b8594" stroke-width="1.5"/>
<line x1="357.8" y1="89" x2="358.8" y2="85.1" stroke="#7b8594" stroke-width="1.5"/>
<line x1="393" y1="103.6" x2="395" y2="100.1" stroke="#7b8594" stroke-width="1.5"/>
<line x1="423.2" y1="126.8" x2="426.1" y2="123.9" stroke="#7b8594" stroke-width="1.5"/>
<line x1="446.4" y1="157" x2="449.9" y2="155" stroke="#7b8594" stroke-width="1.5"/>
<line x1="461" y1="192.2" x2="464.9" y2="191.2" stroke="#7b8594" stroke-width="1.5"/>
<line x1="466" y1="230" x2="470" y2="230" stroke="#7b8594" stroke-width="1.5"/>
<line x1="320" y1="230" x2="256.0" y2="119.1" stroke="#c25e00" stroke-width="10" stroke-linecap="round"/>
<circle cx="320" cy="230" r="9.0" fill="#c25e00"/>
<circle cx="320" cy="230" r="3.5" fill="#ffffff"/>
<text x="338" y="216" font-size="15" font-weight="700" fill="#c25e00" text-anchor="start">지금 20초 → 60°</text>
<text x="320" y="262" font-size="17" font-weight="700" fill="#17191c" text-anchor="middle" font-family="'Consolas', 'D2Coding', 'Menlo', monospace">각도 = 초 × 3</text>
<text x="320" y="286" font-size="15" fill="#4a5361" text-anchor="middle" font-family="'Consolas', 'D2Coding', 'Menlo', monospace">servo_1.rotate(초 * 3)</text>
</g>
</svg>
