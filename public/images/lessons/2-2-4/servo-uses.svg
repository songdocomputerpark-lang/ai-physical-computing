<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" role="img" aria-labelledby="title desc">
<title id="title">서보모터의 쓰임</title>
<desc id="desc">세 칸 그림. 로봇 팔의 관절(주황 동그라미)에 든 서보모터가 팔을 정한 각도로 굽히고, 주차장 차단기의 서보모터가 막대를 0°에서 90°로 올리고, RC카의 서보모터가 앞바퀴 방향을 튼다. 주황 동그라미가 서보모터 자리다. 사이트가 직접 그린 그림.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#4a5361"/></marker></defs>
<rect width="640" height="250" fill="#ffffff"/>
<g font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif">
<rect x="8" y="8" width="204" height="234" rx="14" fill="#f4f6f9" stroke="#7b8594" stroke-width="1"/>
