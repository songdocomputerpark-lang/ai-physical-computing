<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="title desc">
<title id="title">서보모터 안의 구조</title>
<desc id="desc">왼쪽에서 오른쪽으로 PWM 신호(목표 각도) → 제어 회로(비교) → 모터(돌기) → 기어(힘 키우기) → 팔(혼, 정한 각도)이 이어지고, 아래의 위치 센서가 팔의 지금 각도를 재서 제어 회로로 되돌려 보낸다. 제어 회로가 목표 각도와 지금 각도를 비교해 같아지면 모터를 멈춘다. 사이트가 직접 그린 그림.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#4a5361"/></marker></defs>
<rect width="640" height="300" fill="#ffffff"/>
<g font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif">
<text x="320" y="26" font-size="18" font-weight="700" fill="#17191c" text-anchor="middle">서보모터 안: 목표 각도에 닿을 때까지 돌고 멈춰요</text>
<rect x="10" y="70" width="108" height="70" rx="10" fill="#eaf1fe" stroke="#1f5bd6" stroke-width="1.5"/>
<text x="64" y="100" font-size="17" font-weight="700" fill="#17191c" text-anchor="middle">PWM 신호</text>
<text x="64" y="124" font-size="15" fill="#4a5361" text-anchor="middle">목표 각도</text>
<rect x="138" y="70" width="108" height="70" rx="10" fill="#f4f6f9" stroke="#7b8594" stroke-width="1.5"/>
<text x="192" y="100" font-size="17" font-weight="700" fill="#17191c" text-anchor="middle">제어 회로</text>
<text x="192" y="124" font-size="15" fill="#4a5361" text-anchor="middle">비교해요</text>
<rect x="266" y="70" width="108" height="70" rx="10" fill="#f4f6f9" stroke="#7b8594" stroke-width="1.5"/>
<text x="320" y="100" font-size="17" font-weight="700" fill="#17191c" text-anchor="middle">모터</text>
<text x="320" y="124" font-size="15" fill="#4a5361" text-anchor="middle">돌아요</text>
<rect x="394" y="70" width="108" height="70" rx="10" fill="#f4f6f9" stroke="#7b8594" stroke-width="1.5"/>
<text x="448" y="100" font-size="17" font-weight="700" fill="#17191c" text-anchor="middle">기어</text>
<text x="448" y="124" font-size="15" fill="#4a5361" text-anchor="middle">힘을 키워요</text>
<rect x="522" y="70" width="108" height="70" rx="10" fill="#f4f6f9" stroke="#7b8594" stroke-width="1.5"/>
<text x="576" y="100" font-size="17" font-weight="700" fill="#17191c" text-anchor="middle">팔(혼)</text>
<text x="576" y="124" font-size="15" fill="#4a5361" text-anchor="middle">정한 각도</text>
<line x1="120" y1="105" x2="136" y2="105" stroke="#4a5361" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="248" y1="105" x2="264" y2="105" stroke="#4a5361" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="376" y1="105" x2="392" y2="105" stroke="#4a5361" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="504" y1="105" x2="520" y2="105" stroke="#4a5361" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="394" y="190" width="236" height="60" rx="10" fill="#fff4d8" stroke="#b7800f" stroke-width="1.5"/>
<text x="512" y="216" font-size="17" font-weight="700" fill="#17191c" text-anchor="middle">위치 센서</text>
<text x="512" y="238" font-size="15" fill="#4a5361" text-anchor="middle">팔의 지금 각도를 재요</text>
<line x1="576" y1="142" x2="576" y2="186" stroke="#b7800f" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M394 220 H192 V144" fill="none" stroke="#b7800f" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="290" y="212" font-size="15" font-weight="700" fill="#7a4a00" text-anchor="middle">지금 각도</text>
<text x="320" y="282" font-size="16" fill="#17191c" text-anchor="middle">제어 회로가 목표 각도와 지금 각도를 비교해, 같아지면 모터를 멈춰요.</text>
</g>
</svg>
