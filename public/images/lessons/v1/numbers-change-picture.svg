<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="title desc">
<title id="title">숫자를 바꾸면 사진이 바뀌어요: 흑백 사진의 한 부분(4×4칸)의 숫자마다 60을 더하면 사진이 밝아진다</title>
<desc id="desc">왼쪽은 흑백 사진의 작은 한 부분을 4칸 곱하기 4칸으로 나눈 모눈이고, 칸마다 밝기 숫자(30부터 220까지)가 적혀 있다. 가운데 화살표 위에 "숫자마다 60을 더해요"라고 적혀 있다. 오른쪽은 모든 숫자에 60을 더한 모눈으로, 숫자가 커진 만큼 칸이 밝아졌고 255를 넘는 칸은 255가 되었다. 아래에 영상 처리는 사진의 숫자를 계산해서 바꾸는 일이라고 적혀 있다. 사이트가 직접 그린 그림.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 Z" fill="#4a5361"/>
</marker>
</defs>
<rect width="640" height="300" fill="#ffffff"/>
<g font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="middle">
<text x="112" y="30" font-size="18" font-weight="700" fill="#17191c">원래 사진의 한 부분</text>
<text x="528" y="30" font-size="18" font-weight="700" fill="#17191c">숫자를 바꾼 사진</text>
<text x="320" y="112" font-size="18" font-weight="700" fill="#1f5bd6">숫자마다 60을 더해요</text>
<line x1="214" y1="132" x2="426" y2="132" stroke="#4a5361" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="320" y="162" font-size="17" fill="#17191c">사진이 밝아져요</text>
<text x="320" y="188" font-size="16" fill="#4a5361">(255를 넘으면 255)</text>
<text x="320" y="272" font-size="18" font-weight="700" fill="#17191c">영상 처리 = 사진의 숫자를 계산해서 바꾸는 일</text>
</g>
