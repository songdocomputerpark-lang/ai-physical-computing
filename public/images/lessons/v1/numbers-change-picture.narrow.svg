<text x="82" y="24" font-size="14" font-weight="700" fill="#17191c">원래 사진의 한 부분</text>
<text x="278" y="24" font-size="14" font-weight="700" fill="#17191c">숫자를 바꾼 사진</text>
<text x="180" y="204" font-size="15" font-weight="700" fill="#1f5bd6">숫자마다 60을 더해요</text>
<text x="180" y="224" font-size="14" fill="#17191c">사진이 밝아져요</text>
<text x="180" y="242" font-size="13" fill="#4a5361">(255를 넘으면 255)</text>
<text x="180" y="272" font-size="14" font-weight="700" fill="#17191c">영상 처리 = 사진의 숫자를 계산해서 바꾸는 일</text>
</g>
