<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 286" width="360" height="286" role="img" aria-labelledby="title desc">
<title id="title">숫자를 바꾸면 사진이 바뀌어요: 흑백 사진의 한 부분(4×4칸)의 숫자마다 60을 더하면 사진이 밝아진다</title>
<desc id="desc">왼쪽은 흑백 사진의 작은 한 부분을 4칸 곱하기 4칸으로 나눈 모눈이고, 칸마다 밝기 숫자(30부터 220까지)가 적혀 있다. 가운데 화살표 아래에 "숫자마다 60을 더해요"라고 적혀 있다. 오른쪽은 모든 숫자에 60을 더한 모눈으로, 숫자가 커진 만큼 칸이 밝아졌고 255를 넘는 칸은 255가 되었다. 맨 아래에 영상 처리는 사진의 숫자를 계산해서 바꾸는 일이라고 적혀 있다. 휴대폰처럼 좁은 화면에서 읽기 쉽게 같은 내용을 다시 배치한 그림이다(그림 설명이 말하는 자리는 그대로 둠). 사이트가 직접 그린 그림.</desc>
