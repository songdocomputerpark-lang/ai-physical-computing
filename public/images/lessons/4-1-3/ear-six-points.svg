<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="title desc">
<title id="title">눈의 특징점 6개로 EAR 구하기: 세로 거리 A(160번과 144번), B(158번과 153번), 가로 거리 C(33번과 133번), EAR = (A + B) ÷ (2 × C)</title>
<desc id="desc">왼쪽에 뜬 눈, 오른쪽에 감은 눈이 그려져 있다. 두 눈 모두 양 끝에 33번과 133번, 위 눈꺼풀에 160번과 158번, 아래 눈꺼풀에 144번과 153번 점이 있다. 160번과 144번을 잇는 세로선이 A, 158번과 153번을 잇는 세로선이 B, 33번과 133번을 잇는 가로선이 C다. 뜬 눈은 A와 B가 길고, 감은 눈은 A와 B가 거의 0이지만 C는 그대로다. 아래에는 식 EAR = (A + B) ÷ (2 × C)와, 뜬 눈 예 (20 + 20) ÷ (2 × 60) ≈ 0.33, 감은 눈 예 (2 + 2) ÷ (2 × 60) ≈ 0.03, 그리고 EAR이 임계값 0.1 이하이면 감은 눈으로 본다는 설명이 있다. 사이트가 직접 그린 그림.</desc>
<rect width="640" height="400" fill="#ffffff"/>
<g font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif">
<text x="320" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#17191c">EAR: 눈의 세로 길이를 가로 길이로 나눈 비율</text>

<!-- 뜬 눈 -->
<text x="170" y="66" text-anchor="middle" font-size="17" font-weight="700" fill="#17191c">뜬 눈</text>
<path d="M60 160 Q170 76 280 160 Q170 244 60 160 Z" fill="#ffffff" stroke="#4a5361" stroke-width="2.5"/>
<circle cx="170" cy="160" r="30" fill="#e9edf2" stroke="#7b8594" stroke-width="1.5"/>
<line x1="60" y1="160" x2="280" y2="160" stroke="#17191c" stroke-width="2" stroke-dasharray="6 4"/>
<g stroke="#1f5bd6" stroke-width="3">
<line x1="130" y1="126" x2="130" y2="194"/>
<line x1="210" y1="126" x2="210" y2="194"/>
</g>
<g fill="#d24b4b" stroke="#ffffff" stroke-width="1.5">
<circle cx="60" cy="160" r="6"/>
<circle cx="280" cy="160" r="6"/>
<circle cx="130" cy="126" r="6"/>
<circle cx="210" cy="126" r="6"/>
<circle cx="130" cy="194" r="6"/>
<circle cx="210" cy="194" r="6"/>
</g>
<g font-size="16" fill="#17191c">
<text x="48" y="190" text-anchor="middle">33</text>
<text x="292" y="190" text-anchor="middle">133</text>
<text x="122" y="112" text-anchor="middle">160</text>
<text x="218" y="112" text-anchor="middle">158</text>
<text x="122" y="220" text-anchor="middle">144</text>
<text x="218" y="220" text-anchor="middle">153</text>
</g>
<g font-size="18" font-weight="700">
<text x="140" y="152" fill="#1a4cb4">A</text>
<text x="186" y="152" fill="#1a4cb4">B</text>
<text x="244" y="152" fill="#17191c">C</text>
</g>

<!-- 감은 눈 -->
<text x="470" y="66" text-anchor="middle" font-size="17" font-weight="700" fill="#17191c">감은 눈</text>
<path d="M360 160 Q470 146 580 160 Q470 174 360 160 Z" fill="#ffffff" stroke="#4a5361" stroke-width="2.5"/>
<line x1="360" y1="160" x2="580" y2="160" stroke="#17191c" stroke-width="2" stroke-dasharray="6 4"/>
<g stroke="#1f5bd6" stroke-width="3">
<line x1="430" y1="154" x2="430" y2="166"/>
<line x1="510" y1="154" x2="510" y2="166"/>
</g>
<g fill="#d24b4b" stroke="#ffffff" stroke-width="1.5">
<circle cx="360" cy="160" r="6"/>
<circle cx="580" cy="160" r="6"/>
<circle cx="430" cy="152" r="5"/>
<circle cx="510" cy="152" r="5"/>
<circle cx="430" cy="168" r="5"/>
<circle cx="510" cy="168" r="5"/>
</g>
<g font-size="16" fill="#17191c">
<text x="348" y="190" text-anchor="middle">33</text>
<text x="592" y="190" text-anchor="middle">133</text>
<text x="430" y="138" text-anchor="middle">160</text>
<text x="510" y="138" text-anchor="middle">158</text>
<text x="430" y="192" text-anchor="middle">144</text>
<text x="510" y="192" text-anchor="middle">153</text>
</g>
<text x="470" y="226" text-anchor="middle" font-size="16" fill="#4a5361">A, B는 거의 0, C는 그대로</text>

<!-- 식과 예 -->
<rect x="20" y="250" width="600" height="136" rx="12" fill="#eaf1fe" stroke="#5b87e0" stroke-width="1.5"/>
<text x="320" y="282" text-anchor="middle" font-size="20" font-weight="700" fill="#1a4cb4">EAR = (A + B) ÷ (2 × C)</text>
<g font-size="17" fill="#17191c">
<text x="40" y="316">예) 뜬 눈: (20 + 20) ÷ (2 × 60) ≈ 0.33</text>
<text x="40" y="344">예) 감은 눈: (2 + 2) ÷ (2 × 60) ≈ 0.03</text>
</g>
<text x="40" y="372" font-size="16" fill="#4a5361">EAR이 임계값 0.1 이하이면 감은 눈(1), 아니면 뜬 눈(0)으로 봐요.</text>
</g>
</svg>
