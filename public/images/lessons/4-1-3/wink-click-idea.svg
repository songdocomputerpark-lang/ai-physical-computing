<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" width="640" height="290" role="img" aria-labelledby="title desc">
<title id="title">눈을 감는 모양에 따라 마우스 단추가 달라진다: 왼쪽 눈만 감으면 더블클릭, 두 눈을 감으면 오른쪽 클릭, 오른쪽 눈만 감으면 아무 일도 없음</title>
<desc id="desc">세 칸이 나란히 있다. 첫 칸은 왼쪽 눈만 감은 두 눈 그림 아래에 화살표와 "더블클릭"이, 둘째 칸은 두 눈을 모두 감은 그림 아래에 "오른쪽 클릭"과 작은 메뉴 그림이, 셋째 칸은 오른쪽 눈만 감은 그림 아래에 "아무 일도 없어요(코드에 없음)"가 적혀 있다. 맨 아래에는 감는 순간에만 한 번, 1초에 한 번까지만 누른다는 설명이 있다. 사이트가 직접 그린 그림.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 Z" fill="#4a5361"/>
</marker>
</defs>
<rect width="640" height="290" fill="#ffffff"/>
<g font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif">
<text x="320" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#17191c">눈을 감는 모양으로 마우스 단추를 눌러요</text>

<g fill="#f4f6f9" stroke="#7b8594" stroke-width="1.5">
<rect x="12" y="52" width="196" height="178" rx="14"/>
<rect x="222" y="52" width="196" height="178" rx="14"/>
<rect x="432" y="52" width="196" height="178" rx="14"/>
</g>

<!-- 1. 왼쪽 눈만 -->
<g transform="translate(38 70)">
<path d="M3 13 Q30 27 57 13" fill="none" stroke="#17191c" stroke-width="3.5" stroke-linecap="round"/>
<g stroke="#4a5361" stroke-width="2" stroke-linecap="round">
<line x1="18" y1="20" x2="15" y2="27"/>
<line x1="30" y1="22" x2="30" y2="29"/>
<line x1="42" y1="20" x2="45" y2="27"/>
</g>
</g>
<g transform="translate(122 70)">
<path d="M3 15 Q30 -3 57 15 Q30 33 3 15 Z" fill="#ffffff" stroke="#4a5361" stroke-width="2.5"/>
<circle cx="30" cy="15" r="7" fill="#4a5361"/>
</g>
<text x="110" y="126" text-anchor="middle" font-size="17" font-weight="700" fill="#17191c">왼쪽 눈만 감기</text>
<line x1="110" y1="136" x2="110" y2="160" stroke="#4a5361" stroke-width="2.5" marker-end="url(#arrow)"/>
<g fill="none" stroke="#1f5bd6" stroke-width="2.5">
<circle cx="72" cy="192" r="9"/>
<circle cx="72" cy="192" r="16"/>
</g>
<text x="96" y="198" font-size="18" font-weight="700" fill="#1a4cb4">더블클릭</text>

<!-- 2. 두 눈 -->
<g transform="translate(248 70)">
<path d="M3 13 Q30 27 57 13" fill="none" stroke="#17191c" stroke-width="3.5" stroke-linecap="round"/>
<g stroke="#4a5361" stroke-width="2" stroke-linecap="round">
<line x1="18" y1="20" x2="15" y2="27"/>
<line x1="30" y1="22" x2="30" y2="29"/>
<line x1="42" y1="20" x2="45" y2="27"/>
</g>
</g>
<g transform="translate(332 70)">
<path d="M3 13 Q30 27 57 13" fill="none" stroke="#17191c" stroke-width="3.5" stroke-linecap="round"/>
<g stroke="#4a5361" stroke-width="2" stroke-linecap="round">
<line x1="18" y1="20" x2="15" y2="27"/>
<line x1="30" y1="22" x2="30" y2="29"/>
<line x1="42" y1="20" x2="45" y2="27"/>
</g>
</g>
<text x="320" y="126" text-anchor="middle" font-size="17" font-weight="700" fill="#17191c">두 눈 감기</text>
<line x1="320" y1="136" x2="320" y2="160" stroke="#4a5361" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="256" y="174" width="36" height="40" rx="3" fill="#ffffff" stroke="#1f5bd6" stroke-width="2"/>
<g stroke="#1f5bd6" stroke-width="2">
<line x1="262" y1="184" x2="286" y2="184"/>
<line x1="262" y1="194" x2="286" y2="194"/>
<line x1="262" y1="204" x2="280" y2="204"/>
</g>
<text x="302" y="198" font-size="18" font-weight="700" fill="#1a4cb4">오른쪽 클릭</text>

<!-- 3. 오른쪽 눈만 -->
<g transform="translate(458 70)">
<path d="M3 15 Q30 -3 57 15 Q30 33 3 15 Z" fill="#ffffff" stroke="#4a5361" stroke-width="2.5"/>
<circle cx="30" cy="15" r="7" fill="#4a5361"/>
</g>
<g transform="translate(542 70)">
<path d="M3 13 Q30 27 57 13" fill="none" stroke="#17191c" stroke-width="3.5" stroke-linecap="round"/>
<g stroke="#4a5361" stroke-width="2" stroke-linecap="round">
<line x1="18" y1="20" x2="15" y2="27"/>
<line x1="30" y1="22" x2="30" y2="29"/>
<line x1="42" y1="20" x2="45" y2="27"/>
</g>
</g>
<text x="530" y="126" text-anchor="middle" font-size="17" font-weight="700" fill="#17191c">오른쪽 눈만 감기</text>
<line x1="530" y1="136" x2="530" y2="160" stroke="#4a5361" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="530" y="192" text-anchor="middle" font-size="17" font-weight="700" fill="#4a5361">아무 일도 없어요</text>
<text x="530" y="216" text-anchor="middle" font-size="16" fill="#4a5361">(코드에 없음)</text>

<text x="320" y="262" text-anchor="middle" font-size="16" fill="#17191c">눈을 감는 순간에 한 번만 눌러요. 누른 뒤 1초 동안은 다시 누르지 않아요.</text>
</g>
</svg>
