<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" role="img" aria-labelledby="title desc">
<title id="title">두 손가락을 오므리면 작게, 벌리면 크게 보이는 사진(핀치 줌)</title>
<desc id="desc">스마트폰 두 대가 있다. 왼쪽 화면에서는 두 손가락 끝(회색 동그라미)이 서로 가까워지는 화살표와 함께 산 사진이 작게 보인다. 오른쪽 화면에서는 두 손가락 끝이 서로 멀어지는 화살표와 함께 같은 산 사진이 크게 보인다. 아래에 오므리면 작게, 벌리면 크게라고 적혀 있다. 사이트가 직접 그린 그림.</desc>
<defs><marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f5bd6"/></marker></defs>
<rect width="640" height="280" fill="#ffffff"/>
