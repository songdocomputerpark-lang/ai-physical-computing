22.2 227.1" fill="none" stroke="#e3e8ef" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/></g><g fill="none" stroke="#4a5361" stroke-width="2" stroke-linecap="round"><line x1="206" y1="298" x2="174.6" y2="276"/><line x1="174.6" y1="276" x2="142.4" y2="261"/><line x1="142.4" y1="261" x2="119.4" y2="250.3"/><line x1="119.4" y1="250.3" x2="99.5" y2="241"/><line x1="206" y1="298" x2="157.3" y2="206.9"/><line x1="157.3" y1="206.9" x2="145.3" y2="168"/><line x1="145.3" y1="168" x2="138.5" y2="145.3"/><line x1="138.5" y1="145.3" x2="133" y2="127.5"/><line x1="157.3" y1="206.9" x2="179.4" y2="196.1"/><line x1="179.4" y1="196.1" x2="178.8" y2="192.3"/><line x1="178.8" y1="192.3" x2="183.5" y2="218.9"/><line x1="183.5" y1="218.9" x2="184.3" y2="224"/><line x1="179.4" y1="196.1" x2="202" y2="197.3"/><line x1="202" y1="197.3" x2="201.8" y2="193.7"/><line x1="201.8" y1="193.7" x2="203.2" y2="219"/><line x1="203.2" y1="219" x2="203.4" y2="223.8"/><line x1="202" y1="197.3" x2="224" y2="205.4"/><line x1="206" y1="298" x2="224" y2="205.4"/><line x1="224" y1="205.4" x2="224.3" y2="202.6"/><line x1="224.3" y1="202.6" x2="222.6" y2="222.7"/><line x1="222.6" y1="222.7" x2="222.2" y2="227.1"/></g><g fill="#d24b4b" stroke="#ffffff" stroke-width="1.5"><circle cx="206" cy="298" r="4"/><circle cx="174.6" cy="276" r="4"/><circle cx="142.4" cy="261" r="4"/><circle cx="119.4" cy="250.3" r="4"/><circle cx="99.5" cy="241" r="4"/><circle cx="157.3" cy="206.9" r="4"/><circle cx="145.3" cy="168" r="4"/><circle cx="138.5" cy="145.3" r="4"/><circle cx="133" cy="127.5" r="4"/><circle cx="179.4" cy="196.1" r="4"/><circle cx="178.8" cy="192.3" r="4"/><circle cx="183.5" cy="218.9" r="4"/><circle cx="184.3" cy="224" r="4"/><circle cx="202" cy="197.3" r="4"/><circle cx="201.8" cy="193.7" r="4"/><circle cx="203.2" cy="219" r="4"/><circle cx="203.4" cy="223.8" r="4"/><circle cx="224" cy="205.4" r="4"/><circle cx="224.3" cy="202.6" r="4"/><circle cx="222.6" cy="222.7" r="4"/><circle cx="222.2"