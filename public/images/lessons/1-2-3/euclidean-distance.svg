<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-labelledby="title desc">
<title id="title">두 손가락 끝 사이의 유클리드 거리</title>
<desc id="desc">왼쪽은 엄지 끝(4번)과 검지 끝(8번)에 빨간 점을 찍고 두 점을 초록 선 d로 이은 손 그림이다. 오른쪽은 엄지 끝 (300, 400)과 검지 끝 (600, 800)을 잇는 초록 선을 빗변으로 하는 직각삼각형으로, 가로 차이는 300, 세로 차이는 400, 빗변 d는 500이다. 아래에 d = √(300² + 400²) = √250000 = 500이라는 계산이 있다. 사이트가 직접 그린 그림(원고 043쪽 도식을 원고의 예시 숫자로 다시 그림).</desc>
<rect width="640" height="330" fill="#ffffff"/>
