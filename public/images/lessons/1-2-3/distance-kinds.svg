<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" role="img" aria-labelledby="title desc">
<title id="title">두 점 사이를 재는 세 가지 방법</title>
<desc id="desc">모눈 위 같은 두 점(빨간 점과 파란 점)을 세 가지로 견준 그림이다. 왼쪽 유클리드 거리는 두 점을 곧게 이은 초록 대각선으로 5칸이다. 가운데 맨해튼 거리는 모눈을 따라 가로 3칸, 세로 4칸을 걸어간 노란 길로 7칸이다. 오른쪽 코사인 유사도는 한 점(원점)에서 뻗은 빨간 화살표와 파란 화살표 사이의 각도 θ로, 두 방향이 얼마나 비슷한지를 잰다. 사이트가 직접 그린 그림(원고 051쪽 비교 그림을 다시 그림).</desc>
<defs><marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#d24b4b"/></marker><marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f5bd6"/></marker></defs>
<rect width="640" height="260" fill="#ffffff"/>
<g font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="middle"><text x="108" y="26" font-size="17" font-weight="700" fill="#17191c">유클리드 거리</text><g stroke="#d6dde6" stroke-width="1.5"><line x1="52" y1="40" x2="52" y2="190"/><line x1="82" y1="40" x2="82" y2="190"/><line x1="112" y1="40" x2="112" y2="190"/><line x1="142" y1="40" x2="142" y2="190"/><line x1="172" y1="40" x2="172" y2="190"/><line x1="52" y1="40" x2="172" y2="40"/><line x1="52" y1="70" x2="172" y2="70"/><line x1="52" y1="100" x2="172" y2="100"/><line x1="52" y1="130" x2="172" y2="130"/><line x1="52" y1="160" x2="172" y2="160"/><line x1="52" y1="190" x2="172" y2="190"/></g><line x1="67" y1="55" x2="157" y2="175" stroke="#3b9360" stroke-width="5" stroke-linecap="round"/><circle cx="67" cy="55" r="7" fill="#d24b4b" stroke="#ffffff" stroke-width="2"/><circle cx="157" cy="175" r="7" fill="#1f5bd6" stroke="#ffffff" stroke-width="2"/><text x="108" y="218" font-size="16" fill="#17191c">곧게 이은 길</text><text x="108" y="240" font-size="16" font-weight="700" fill="#4a5361">= 5칸</text><text x="320" y="26" font-size="17" font-weight="700" fill="#17191c">맨해튼 거리</text><g stroke="#d6dde6" stroke-width="1.5"><line x1="264" y1="40" x2="264" y2="190"/><line x1="294" y1="40" x2="294" y2="190"/><line x1="324" y1="40" x2="324" y2="190"/><line x1="354" y1="40" x2="354" y2="190"/><line x1="384" y1="40" x2="384" y2="190"/><line x1="264" y1="40" x2="384" y2="40"/><line x1="264" y1="70" x2="384" y2="70"/><line x1="264" y1="100" x2="384" y2="100"/><line x1="264" y1="130" x2="384" y2="130"/><line x1="264" y1="160" x2="384" y2="160"/><line x1="264" y1="190" x2="384" y2="190"/></g><path d="M279 55 H369 V175" fill="none" stroke="#b7800f" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="279" cy="55" r="7" fill="#d24b4b" stroke="#ffffff" stroke-width="2"/><circle cx="369" cy="175" r="7" fill="#1f5bd6" stroke="#ffffff" stroke-width="2"/><text x="320" y="218" font-size="16" fill="#17191c">가로 3칸 + 세로 4칸</text><text x="320" y="240" font-size="16" font-weight="700" fill="#4a5361">= 7칸</text><text x="532" y="26" font-size="17" font-weight="700" fill="#17191c">코사인 유사도</text><g stroke="#d6dde6" stroke-width="1.5"><line x1="476" y1="40" x2="476" y2="190"/><line x1="506" y1="40" x2="506" y2="190"/><line x1="536" y1="40" x2="536" y2="190"/><line x1="566" y1="40" x2="566" y2="190"/><line x1="596" y1="40" x2="596" y2="190"/><line x1="476" y1="40" x2="596" y2="40"/><line x1="476" y1="70" x2="596" y2="70"/><line x1="476" y1="100" x2="596" y2="100"/><line x1="476" y1="130" x2="596" y2="130"/><line x1="476" y1="160" x2="596" y2="160"/><line x1="476" y1="190" x2="596" y2="190"/></g><line x1="476" y1="190" x2="596" y2="130" stroke="#d24b4b" stroke-width="4" marker-end="url(#arrowRed)"/><line x1="476" y1="190" x2="521" y2="55" stroke="#1f5bd6" stroke-width="4" marker-end="url(#arrowBlue)"/><path d="M515.4 170.3 A44 44 0 0 0 489.9 148.3" fill="none" stroke="#17191c" stroke-width="2"/><text x="534" y="146" font-size="18" font-weight="700" fill="#17191c">θ</text><circle cx="476" cy="190" r="5" fill="#17191c"/><text x="532" y="218" font-size="16" fill="#17191c">두 방향 사이의 각도</text><text x="532" y="240" font-size="16" font-weight="700" fill="#4a5361">(방향이 비슷한 정도)</text></g>
</svg>
