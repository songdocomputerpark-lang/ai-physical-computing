<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" role="img" aria-labelledby="title desc">
<title id="title">cv2.circle로 화면 한가운데에 원 그리기</title>
<desc id="desc">왼쪽은 가로 640, 세로 480 화면이다. 한가운데 (320, 240)에 흰 중심 점이 있고, 중심에서 오른쪽으로 원 둘레까지 반지름 화살표가 있으며, 노란 원이 그려져 있다. 왼쪽 위에는 Distance: 132가 노란 글자로 보인다. 오른쪽에는 cv2.circle(frame, (cx, cy), distance, (0, 255, 255), 3)을 한 줄씩 나눠 적고 차례로 그릴 사진, 중심, 반지름, 색(노랑), 굵기라고 풀었다. 아래에 cx, cy = w // 2, h // 2(46행)가 적혀 있다. 사이트가 직접 그린 그림.</desc>
<defs><marker id="arrowWhite" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#ffffff"/></marker></defs>
<rect width="640" height="280" fill="#ffffff"/>
<g font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="middle"><rect x="20" y="20" width="320" height="240" fill="#4a5361" rx="6"/><circle cx="180" cy="140" r="66" fill="none" stroke="#f5c542" stroke-width="5"/><line x1="180" y1="140" x2="240" y2="140" stroke="#ffffff" stroke-width="2.5" marker-end="url(#arrowWhite)"/><circle cx="180" cy="140" r="5" fill="#ffffff"/><text x="213" y="130" font-size="16" font-weight="700" fill="#ffffff">반지름</text><text x="180" y="168" font-size="16" fill="#ffffff">(320, 240)</text><text x="32" y="46" font-size="16" fill="#f5c542" text-anchor="start" font-family="ui-monospace, 'Cascadia Mono', Consolas, 'D2Coding', 'Malgun Gothic', monospace">Distance: 132</text><text x="330" y="248" font-size="16" fill="#d6dde6" text-anchor="end">640×480 화면</text><text x="360" y="76" font-size="16" font-family="ui-monospace, 'Cascadia Mono', Consolas, 'D2Coding', 'Malgun Gothic', monospace" fill="#17191c" text-anchor="start" xml:space="preserve" style="white-space:pre">cv2.circle(frame,</text><text x="630" y="76" font-size="16" font-weight="700" fill="#1a4cb4" text-anchor="end">그릴 사진</text><text x="360" y="114" font-size="16" font-family="ui-monospace, 'Cascadia Mono', Consolas, 'D2Coding', 'Malgun Gothic', monospace" fill="#17191c" text-anchor="start" xml:space="preserve" style="white-space:pre">  (cx, cy),</text><text x="630" y="114" font-size="16" font-weight="700" fill="#1a4cb4" text-anchor="end">중심</text><text x="360" y="152" font-size="16" font-family="ui-monospace, 'Cascadia Mono', Consolas, 'D2Coding', 'Malgun Gothic', monospace" fill="#17191c" text-anchor="start" xml:space="preserve" style="white-space:pre">  distance,</text><text x="630" y="152" font-size="16" font-weight="700" fill="#15653a" text-anchor="end">반지름</text><text x="360" y="190" font-size="16" font-family="ui-monospace, 'Cascadia Mono', Consolas, 'D2Coding', 'Malgun Gothic', monospace" fill="#17191c" text-anchor="start" xml:space="preserve" style="white-space:pre">  (0, 255, 255),</text><text x="630" y="190" font-size="16" font-weight="700" fill="#1a4cb4" text-anchor="end">색(노랑)</text><text x="360" y="228" font-size="16" font-family="ui-monospace, 'Cascadia Mono', Consolas, 'D2Coding', 'Malgun Gothic', monospace" fill="#17191c" text-anchor="start" xml:space="preserve" style="white-space:pre">  3)</text><text x="630" y="228" font-size="16" font-weight="700" fill="#1a4cb4" text-anchor="end">굵기</text><text x="360" y="42" font-size="17" font-weight="700" fill="#17191c" text-anchor="start">원 그리기(47행)</text><text x="360" y="272" font-size="16" fill="#4a5361" text-anchor="start">cx, cy = w // 2, h // 2(46행)</text></g>
</svg>
