<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-labelledby="title desc">
<title id="title">따라하기 준비: 보드 A(esp32-01)와 보드 B(esp32-02)가 중계 서버를 거쳐 값과 명령을 주고받는다</title>
<desc id="desc">왼쪽 보드 A(통신 템플릿 3, esp32-01)는 esp32-01/rx를 받고 esp32-01/tx로 1초마다 숫자를 보낸다. 오른쪽 보드 B(친구 보드, esp32-02)에는 터치 센서가 있고, esp32-01/tx를 받고 터치하면 esp32-01/rx로 on, off를 보낸다. 가운데 중계 서버(같은 컴퓨터 탭 통로) 칸을 지나 파란 화살표가 보드 A에서 보드 B로 1, 2, 3을, 초록 화살표가 보드 B에서 보드 A로 on, off를 나른다. 아래에 1 두 예제를 같은 통신 접두어로 열어요, 2 보드 A, 보드 B 차례로 실행, 3 보드 B의 터치 센서를 누르면 보드 A의 LED가 켜져요가 적혀 있다. 사이트가 직접 그린 그림.</desc>
<defs>
<marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f5bd6"/></marker><marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#3b9360"/></marker>
</defs>
<rect width="640" height="330" fill="#ffffff"/>
<g font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif">
<rect x="10" y="16" width="224" height="196" rx="10" fill="#f4f6f9" stroke="#d6dde6" stroke-width="1.5"/>
<text x="122" y="42" font-size="16" font-weight="700" text-anchor="middle" fill="#17191c">보드 A (통신 템플릿 3)</text>
<rect x="28" y="60" width="70" height="44" rx="5" fill="#eaf1fe" stroke="#1a4cb4" stroke-width="2"/><rect x="49" y="68" width="28" height="18" rx="2" fill="#ffffff" stroke="#1a4cb4"/><circle cx="86" cy="94" r="5" fill="#3b9360" stroke="#1a4cb4" stroke-width="1.5"/>
<text x="112" y="80" font-size="16" font-weight="700" fill="#17191c" font-family="ui-monospace, 'Cascadia Mono', Consolas, 'D2Coding', 'Malgun Gothic', monospace">esp32-01</text>
<text x="112" y="102" font-size="16" fill="#4a5361">LED: IO2</text>
<text x="22" y="154" font-size="16" fill="#17191c">받기: esp32-01/rx</text>
<text x="22" y="180" font-size="16" fill="#17191c">보내기: esp32-01/tx</text>
<text x="22" y="202" font-size="16" fill="#4a5361">(1초마다 숫자)</text>
<rect x="406" y="16" width="224" height="196" rx="10" fill="#f4f6f9" stroke="#d6dde6" stroke-width="1.5"/>
<text x="518" y="42" font-size="16" font-weight="700" text-anchor="middle" fill="#17191c">보드 B (친구 보드)</text>
<rect x="424" y="60" width="70" height="44" rx="5" fill="#eaf1fe" stroke="#1a4cb4" stroke-width="2"/><rect x="445" y="68" width="28" height="18" rx="2" fill="#ffffff" stroke="#1a4cb4"/>
<rect x="430" y="86" width="14" height="12" rx="2" fill="#fff4d8" stroke="#b7800f" stroke-width="1.5"/>
<text x="508" y="80" font-size="16" font-weight="700" fill="#17191c" font-family="ui-monospace, 'Cascadia Mono', Consolas, 'D2Coding', 'Malgun Gothic', monospace">esp32-02</text>
<text x="508" y="102" font-size="16" fill="#4a5361">터치: IO17</text>
<text x="418" y="154" font-size="16" fill="#17191c">받기: esp32-01/tx</text>
<text x="418" y="180" font-size="16" fill="#17191c">보내기: esp32-01/rx</text>
<text x="418" y="202" font-size="16" fill="#4a5361">(터치하면 on, off)</text>
<rect x="250" y="16" width="140" height="196" rx="12" fill="#eaf1fe" stroke="#5b87e0" stroke-width="1.5"/>
<text x="320" y="44" font-size="16" font-weight="700" text-anchor="middle" fill="#1a4cb4">중계 서버</text>
<text x="320" y="66" font-size="16" text-anchor="middle" fill="#1a4cb4">(같은 컴퓨터</text>
<text x="320" y="88" font-size="16" text-anchor="middle" fill="#1a4cb4">탭 통로)</text>
<line x1="236" y1="118" x2="402" y2="118" stroke="#1f5bd6" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
<text x="320" y="140" font-size="16" text-anchor="middle" fill="#1a4cb4" font-family="ui-monospace, 'Cascadia Mono', Consolas, 'D2Coding', 'Malgun Gothic', monospace">1, 2, 3 …</text>
<line x1="402" y1="170" x2="236" y2="170" stroke="#3b9360" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
<text x="320" y="194" font-size="16" text-anchor="middle" fill="#15653a" font-family="ui-monospace, 'Cascadia Mono', Consolas, 'D2Coding', 'Malgun Gothic', monospace">on, off</text>
<circle cx="26" cy="244" r="12" fill="#1a4cb4"/><text x="26" y="249.5" font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
<text x="46" y="250" font-size="16" fill="#17191c">두 예제를 같은 통신 접두어로 열어요</text>
<circle cx="26" cy="274" r="12" fill="#1a4cb4"/><text x="26" y="279.5" font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
<text x="46" y="280" font-size="16" fill="#17191c">보드 A, 보드 B 차례로 [실행]</text>
<circle cx="26" cy="304" r="12" fill="#1a4cb4"/><text x="26" y="309.5" font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
<text x="46" y="310" font-size="16" fill="#17191c">보드 B의 터치 센서를 누르면 보드 A의 LED가 켜져요</text>
</g>
</svg>
