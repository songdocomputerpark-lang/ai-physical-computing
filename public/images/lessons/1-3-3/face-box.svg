<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" role="img" aria-labelledby="title desc">
<title id="title">얼굴 가장자리의 점 네 개로 얼굴을 감싸는 상자 그리기</title>
<desc id="desc">왼쪽에 정면을 보는 얼굴이 있고, 이마 위 끝(10번), 턱 끝(152번), 얼굴 왼쪽 끝(234번), 얼굴 오른쪽 끝(454번)에 빨간 점이 찍혀 있다. 네 점에 닿는 초록 네모가 얼굴을 감싸고, 왼쪽 위 모서리는 (x1, y1), 오른쪽 아래 모서리는 (x2, y2)다. 오른쪽에 네 번호의 자리와 계산이 적혀 있다: x1 = 234번의 x × w = 209, y1 = 10번의 y × h = 81, x2 = 454번의 x × w = 430, y2 = 152번의 y × h = 379. w와 h는 화면의 너비 640, 높이 480이다. 사이트가 직접 그린 그림(점 자리는 실습실 재생 입력과 같은 계산).</desc>
<rect width="640" height="380" fill="#ffffff"/>
