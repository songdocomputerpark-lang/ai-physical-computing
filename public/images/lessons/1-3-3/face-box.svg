ejoin="round">234</text><circle cx="300.6" cy="206.9" r="6.5" fill="#d24b4b" stroke="#ffffff" stroke-width="2"/><text x="312.6" y="212.9" font-size="17" font-weight="700" fill="#17191c" text-anchor="start" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">454</text><rect x="86.4" y="60.5" width="10" height="10" fill="#3b9360" stroke="#ffffff" stroke-width="2"/><rect x="295.6" y="343.2" width="10" height="10" fill="#3b9360" stroke="#ffffff" stroke-width="2"/><text x="99.4" y="55.5" font-size="16" font-weight="700" fill="#15653a" text-anchor="start" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">(x1, y1)</text><text x="292.6" y="372.2" font-size="16" font-weight="700" fill="#15653a" text-anchor="end" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">(x2, y2)</text><circle cx="392" cy="72" r="6" fill="#d24b4b" stroke="#ffffff" stroke-width="2"/><text x="408" y="78" font-size="17" font-weight="700" fill="#17191c" text-anchor="start">10번</text><text x="468" y="78" font-size="17" fill="#17191c" text-anchor="start">이마 위 끝</text><circle cx="392" cy="102" r="6" fill="#d24b4b" stroke="#ffffff" stroke-width="2"/><text x="408" y="108" font-size="17" font-weight="700" fill="#17191c" text-anchor="start">152번</text><text x="468" y="108" font-size="17" fill="#17191c" text-anchor="start">턱 끝</text><circle cx="392" cy="132" r="6" fill="#d24b4b" stroke="#ffffff" stroke-width="2"/><text x="408" y="138" font-size="17" font-weight="700" fill="#17191c" text-anchor="start">234번</text><text x="468" y="138" font-size="17" fill="#17191c" text-anchor="start">얼굴 왼쪽 끝</text><circle cx="392" cy="162" r="6" fill="#d24b4b" stroke="#ffffff" stroke-width="2"/><text x="408" y="168" font-size="17" font-weight="700" fill="#17191c" text-anchor="start">454번</text><text x="468" y="168" font-size="17" fill="#17191c" text-anchor="start">얼굴 오른쪽 끝</text><text x="384" y="226" font-size="16" fill="#17191c" text-anchor="start">x1 = 234번의 x × w</text><text x="630" y="226" font-size="16" font-weight="700" fill="#15653a" text-anchor="end">= 209</text><text x="384" y="254" font-size="16" fill="#17191c" text-anchor="start">y1 = 10번의 y × h</text><text x="630" y="254" font-size="16" font-weight="700" fill="#15653a" text-anchor="end">= 81</text><text x="384" y="282" font-size="16" fill="#17191c" text-anchor="start">x2 = 454번의 x × w</text><text x="630" y="282" font-size="16" font-weight="700" fill="#15653a" text-anchor="end">= 430</text><text x="384" y="310" font-size="16" fill="#17191c" text-anchor="start">y2 = 152번의 y × h</text><text x="630" y="310" font-size="16" font-weight="700" fill="#15653a" text-anchor="end">= 379</text><text x="384" y="350" font-size="16" fill="#4a5361" text-anchor="start">w, h: 화면의 너비 640, 높이 480</text></g>
</svg>
