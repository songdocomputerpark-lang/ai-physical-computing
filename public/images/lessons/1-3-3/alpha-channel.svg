<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 384" width="640" height="384" role="img" aria-labelledby="title desc">
<title id="title">알파 채널: 픽셀마다 투명한 정도를 적은 네 번째 숫자와 겹쳐 그리는 식</title>
<desc id="desc">왼쪽에 투명한 곳을 바둑판 무늬로 보인 가면 그림(mask.png)이 있다. 보라색 몸통의 한 픽셀은 (184, 63, 91, 255)로 알파 255라 가면 색이 보이고, 눈 구멍의 한 픽셀은 (0, 0, 0, 0)으로 알파 0이라 투명하다. 숫자 차례는 파랑, 초록, 빨강, 알파다. 오른쪽에는 가면 색과 원래 색을 겹친 결과 세 가지가 색 칸으로 있다: a = 1이면 가면 색만, a = 0.5면 반반 섞인 색, a = 0이면 원래 색 그대로다. 아래 식: 결과 = 가면 색 × a + 원래 색 × (1 − a), a = 알파 ÷ 255(0이면 투명, 1이면 가면 색). 사이트가 직접 그린 그림.</desc>
<defs><pattern id="checker" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#ffffff"/><rect width="8" height="8" fill="#dfe4eb"/><rect x="8" y="8" width="8" height="8" fill="#dfe4eb"/></pattern></defs>
<rect width="640" height="384" fill="#ffffff"/>
<g font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="middle"><text x="320" y="28" font-size="19" font-weight="700" fill="#17191c">알파 채널: 픽셀마다 투명한 정도를 적은 네 번째 숫자</text><rect x="24" y="50" width="176" height="220" fill="url(#checker)" stroke="#7b8594"/><g transform="translate(24 50) scale(0.4400 0.4400)">
<path fill="#5b3fb8" stroke="#e0b23a" stroke-width="8" stroke-linejoin="round" fill-rule="evenodd" d="M 26 200 C 58 118, 150 108, 200 158 C 250 108, 342 118, 374 200 C 384 262, 332 302, 286 294 C 250 288, 220 264, 200 264 C 180 264, 150 288, 114 294 C 68 302, 16 262, 26 200 Z M 74 216 a 46 30 0 1 0 92 0 a 46 30 0 1 0 -92 0 Z M 234 216 a 46 30 0 1 0 92 0 a 46 30 0 1 0 -92 0 Z"/>
<ellipse cx="120" cy="216" rx="46" ry="30" fill="none" stroke="#e0b23a" stroke-width="6"/>
<ellipse cx="280" cy="216" rx="46" ry="30" fill="none" stroke="#e0b23a" stroke-width="6"/>
<path d="M 200 166 l 13 22 l -13 22 l -13 -22 Z" fill="#f3d67a"/>
<path d="M 44 130 l 6 14 l 15 1 l -12 10 l 4 15 l -13 -8 l -13 8 l 4 -15 l -12 -10 l 15 -1 Z" fill="#e0b23a"/>
<path d="M 356 130 l 6 14 l 15 1 l -12 10 l 4 15 l -13 -8 l -13 8 l 4 -15 l -12 -10 l 15 -1 Z" fill="#e0b23a"/>
</g><text x="112" y="294" font-size="16" fill="#4a5361">mask.png(바둑판 = 투명)</text><circle cx="50.4" cy="129.2" r="5" fill="#ffffff" stroke="#17191c" stroke-width="2"/><circle cx="76.8" cy="145" r="5" fill="#ffffff" stroke="#17191c" stroke-width="2"/><path d="M50.4 129.2 L230 86" fill="none" stroke="#17191c" stroke-width="1.5"/><path d="M76.8 145 L230 170" fill="none" stroke="#17191c" stroke-width="1.5"/><rect x="232" y="64" width="176" height="62" rx="8" fill="#f4f6f9" stroke="#7b8594"/><text x="242" y="89" font-size="16" fill="#17191c" text-anchor="start" font-family="ui-monospace, 'Cascadia Mono', Consolas, 'D2Coding', 'Malgun Gothic', monospace">(184, 63, 91, 255)</text><text x="242" y="114" font-size="16" fill="#17191c" text-anchor="start">알파 255: 가면 색</text><rect x="232" y="148" width="176" height="62" rx="8" fill="#f4f6f9" stroke="#7b8594"/><text x="242" y="173" font-size="16" fill="#17191c" text-anchor="start" font-family="ui-monospace, 'Cascadia Mono', Consolas, 'D2Coding', 'Malgun Gothic', monospace">(0, 0, 0, 0)</text><text x="242" y="198" font-size="16" fill="#17191c" text-anchor="start">알파 0: 투명</text><text x="320" y="238" font-size="16" fill="#4a5361" text-anchor="middle">숫자 차례: 파랑, 초록, 빨강, 알파</text><text x="530" y="60" font-size="16" font-weight="700" fill="#17191c">겹친 결과</text><rect x="448" y="72" width="44" height="40" rx="6" fill="rgb(91, 63, 184)" stroke="#7b8594"/><text x="502" y="89" font-size="16" font-weight="700" fill="#17191c" text-anchor="start">a = 1</text><text x="502" y="109" font-size="16" fill="#17191c" text-anchor="start">가면 색만</text><rect x="448" y="128" width="44" height="40" rx="6" fill="rgb(162, 131, 175)" stroke="#7b8594"/><text x="502" y="145" font-size="16" font-weight="700" fill="#17191c" text-anchor="start">a = 0.5</text><text x="502" y="165" font-size="16" fill="#17191c" text-anchor="start">반반 섞임</text><rect x="448" y="184" width="44" height="40" rx="6" fill="rgb(232, 199, 165)" stroke="#7b8594"/><text x="502" y="201" font-size="16" font-weight="700" fill="#17191c" text-anchor="start">a = 0</text><text x="502" y="221" font-size="16" fill="#17191c" text-anchor="start">원래 색 그대로</text><rect x="24" y="312" width="592" height="60" rx="10" fill="#eaf1fe" stroke="#1f5bd6"/><text x="320" y="338" font-size="17" font-weight="700" fill="#17191c">결과 = 가면 색 × a + 원래 색 × (1 − a)</text><text x="320" y="361" font-size="16" fill="#17191c">a = 알파 ÷ 255 (0이면 투명, 1이면 가면 색)</text></g>
</svg>
