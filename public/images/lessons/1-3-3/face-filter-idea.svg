<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 316" width="640" height="316" role="img" aria-labelledby="title desc">
<title id="title">얼굴을 따라 움직이는 가면 필터</title>
<desc id="desc">스마트폰 화면 두 개가 있다. 왼쪽 화면에서는 정면을 보는 얼굴의 두 눈 위에 보라색 가면이 얹혀 있다. 오른쪽 화면에서는 얼굴이 오른쪽으로 옮겨 가고 작아졌는데(카메라에서 멀어짐), 가면도 얼굴을 따라 옮겨 가고 작아져 여전히 두 눈 위에 있다. 가운데 화살표에 "얼굴을 따라가요"라고 적혀 있고, 아래 문장은 "프레임마다 얼굴의 자리와 크기를 새로 재서 가면을 맞춰 그려요"다. 사이트가 직접 그린 그림(얼굴은 실습실 재생 입력과 같은 계산, 가면은 실습실이 넣어 주는 mask.png와 같은 그림).</desc>
