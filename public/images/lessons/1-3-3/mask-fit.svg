<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 372" width="640" height="372" role="img" aria-labelledby="title desc">
<title id="title">가면 그림을 얼굴 크기로 늘이고 줄여 얼굴 왼쪽 위에서부터 그리기</title>
<desc id="desc">왼쪽에 가로 400, 세로 500인 mask.png가 있고, 투명한 부분은 바둑판 무늬, 가면은 그림의 위쪽에 있다. resize 화살표를 지나 오른쪽의 가로 640, 세로 480 화면으로 간다. 화면 속 얼굴 위에 가면 그림을 얼굴 너비 220, 얼굴 높이 297로 바꾼 파란 점선 네모가 겹쳐 있고, 그 왼쪽 위 모서리는 (209, 81) — 234번 점의 x와 10번 점의 y다. 가면은 네모의 위쪽, 두 눈 위에 온다. 아래 문장: 가면 그림의 위쪽에만 가면이 있어서, 얼굴 높이만큼 늘이면 눈 높이에 온다. 사이트가 직접 그린 그림(숫자는 실습실 재생 입력의 정면 얼굴로 잰 값).</desc>
