<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 620" width="360" height="620" role="img" aria-labelledby="title desc">
<title id="title">규칙 기반과 학습 기반 비교: 같은 사진 6장을 날짜 순서로 줄 세우기와 비슷한 사진끼리 묶기</title>
<desc id="desc">위 칸의 기존 프로그램은 사람이 정한 규칙(날짜 순서)대로 사진1, 사진4, 사진3, 사진2, 사진6, 사진5를 줄 세워(왼쪽에서 오른쪽, 윗줄에서 아랫줄 차례) 바다 사진과 숲 사진이 섞인다. 아래 칸의 인공지능 프로그램은 예시에서 배운 기준으로 파란색이 많은 사진1, 사진3, 사진5를 바다 묶음에, 초록색이 많은 사진2, 사진4, 사진6을 숲 묶음에 넣는다. 파도 무늬는 바다 사진, 나무 무늬는 숲 사진이다. 휴대폰처럼 좁은 화면에서 읽기 쉽게 같은 내용을 세로로 다시 배치한 그림이다. 사이트가 직접 그린 그림(INVENTORY S08).</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 Z" fill="#4a5361"/>
</marker>
<symbol id="sea" viewBox="0 0 92 68">
<rect x="1" y="1" width="90" height="66" rx="10" fill="#dbe7fb" stroke="#1f5bd6" stroke-width="2"/>
<path d="M30 15 q4 -6 8 0 t8 0 t8 0 t8 0" fill="none" stroke="#1f5bd6" stroke-width="2.5" stroke-linecap="round"/>
</symbol>
<symbol id="forest" viewBox="0 0 92 68">
<rect x="1" y="1" width="90" height="66" rx="10" fill="#e8f6ee" stroke="#15653a" stroke-width="2"/>
<path d="M37 19 L46 6 L55 19 Z" fill="#15653a"/>
<rect x="44" y="19" width="4" height="4" fill="#15653a"/>
</symbol>
</defs>
<rect width="360" height="620" fill="#ffffff"/>
<g font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif">
<rect x="10" y="10" width="340" height="280" rx="14" fill="#f4f6f9" stroke="#d6dde6"/>
<text x="24" y="38" font-size="17" font-weight="700" fill="#17191c">① 기존 프로그램:</text>
<text x="24" y="60" font-size="17" font-weight="700" fill="#17191c">날짜 순서대로 줄 세우기</text>

<use href="#sea" x="28" y="74" width="92" height="68"/>
<use href="#forest" x="134" y="74" width="92" height="68"/>
<use href="#sea" x="240" y="74" width="92" height="68"/>
<use href="#forest" x="28" y="160" width="92" height="68"/>
<use href="#forest" x="134" y="160" width="92" height="68"/>
<use href="#sea" x="240" y="160" width="92" height="68"/>
<g text-anchor="middle" fill="#17191c">
<text x="74" y="115" font-size="15" font-weight="700">사진1</text>
<text x="74" y="133" font-size="14">3월 14일</text>
<text x="180" y="115" font-size="15" font-weight="700">사진4</text>
<text x="180" y="133" font-size="14">3월 30일</text>
<text x="286" y="115" font-size="15" font-weight="700">사진3</text>
<text x="286" y="133" font-size="14">4월 20일</text>
<text x="74" y="201" font-size="15" font-weight="700">사진2</text>
<text x="74" y="219" font-size="14">5월 2일</text>
<text x="180" y="201" font-size="15" font-weight="700">사진6</text>
<text x="180" y="219" font-size="14">5월 27일</text>
<text x="286" y="201" font-size="15" font-weight="700">사진5</text>
<text x="286" y="219" font-size="14">6월 11일</text>
</g>
<line x1="30" y1="151" x2="330" y2="151" stroke="#4a5361" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="30" y1="237" x2="330" y2="237" stroke="#4a5361" stroke-width="2" marker-end="url(#arrow)"/>
<text x="24" y="259" font-size="14" fill="#4a5361">날짜가 빠른 것부터 —</text>
<text x="24" y="279" font-size="14" fill="#4a5361">바다 사진과 숲 사진이 섞여요</text>

<rect x="10" y="300" width="340" height="310" rx="14" fill="#f4f6f9" stroke="#d6dde6"/>
<text x="24" y="328" font-size="17" font-weight="700" fill="#17191c">② 인공지능 프로그램:</text>
<text x="24" y="350" font-size="17" font-weight="700" fill="#17191c">예시에서 배운 기준으로 묶기</text>
<rect x="22" y="364" width="316" height="112" rx="12" fill="#ffffff" stroke="#1f5bd6" stroke-width="2"/>
<text x="36" y="388" font-size="15" font-weight="700" fill="#1a4cb4">바다 묶음 — 파란색이 많아요</text>
<rect x="22" y="486" width="316" height="112" rx="12" fill="#ffffff" stroke="#15653a" stroke-width="2"/>
<text x="36" y="510" font-size="15" font-weight="700" fill="#15653a">숲 묶음 — 초록색이 많아요</text>
<use href="#sea" x="34" y="398" width="92" height="68"/>
