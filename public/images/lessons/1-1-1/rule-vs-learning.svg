<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 424" width="640" height="424" role="img" aria-labelledby="title desc">
<title id="title">규칙 기반과 학습 기반 비교: 같은 사진 6장을 날짜 순서로 줄 세우기와 비슷한 사진끼리 묶기</title>
<desc id="desc">위 칸의 기존 프로그램은 사람이 정한 규칙(날짜 순서)대로 사진1, 사진4, 사진3, 사진2, 사진6, 사진5를 줄 세워 바다 사진과 숲 사진이 섞인다. 아래 칸의 인공지능 프로그램은 예시에서 배운 기준으로 파란색이 많은 사진1, 사진3, 사진5를 바다 묶음에, 초록색이 많은 사진2, 사진4, 사진6을 숲 묶음에 넣는다. 파도 무늬는 바다 사진, 나무 무늬는 숲 사진이다. 사이트가 직접 그린 그림(INVENTORY S08).</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 Z" fill="#4a5361"/>
</marker>
<symbol id="sea" viewBox="0 0 82 74">
<rect x="1" y="1" width="80" height="72" rx="10" fill="#dbe7fb" stroke="#1f5bd6" stroke-width="2"/>
<path d="M25 18 q4 -6 8 0 t8 0 t8 0 t8 0" fill="none" stroke="#1f5bd6" stroke-width="2.5" stroke-linecap="round"/>
</symbol>
<symbol id="forest" viewBox="0 0 82 74">
<rect x="1" y="1" width="80" height="72" rx="10" fill="#e8f6ee" stroke="#15653a" stroke-width="2"/>
<path d="M32 23 L41 9 L50 23 Z" fill="#15653a"/>
<rect x="39" y="23" width="4" height="4" fill="#15653a"/>
</symbol>
</defs>
<rect width="640" height="424" fill="#ffffff"/>
<g font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif">
<rect x="12" y="12" width="616" height="178" rx="14" fill="#f4f6f9" stroke="#d6dde6"/>
<text x="28" y="44" font-size="19" font-weight="700" fill="#17191c">① 기존 프로그램: 날짜 순서대로 줄 세우기</text>

