<use href="#sea" x="528" y="60" width="82" height="74"/>
<g text-anchor="middle" fill="#17191c">
<text x="69" y="107" font-size="18" font-weight="700">사진1</text>
<text x="69" y="126" font-size="15">3월 14일</text>
<text x="169" y="107" font-size="18" font-weight="700">사진4</text>
<text x="169" y="126" font-size="15">3월 30일</text>
<text x="269" y="107" font-size="18" font-weight="700">사진3</text>
<text x="269" y="126" font-size="15">4월 20일</text>
<text x="369" y="107" font-size="18" font-weight="700">사진2</text>
<text x="369" y="126" font-size="15">5월 2일</text>
<text x="469" y="107" font-size="18" font-weight="700">사진6</text>
<text x="469" y="126" font-size="15">5월 27일</text>
<text x="569" y="107" font-size="18" font-weight="700">사진5</text>
<text x="569" y="126" font-size="15">6월 11일</text>
</g>
<line x1="40" y1="152" x2="600" y2="152" stroke="#4a5361" stroke-width="2" marker-end="url(#arrow)"/>
<text x="40" y="176" font-size="16" fill="#4a5361">날짜가 빠른 것부터 — 바다 사진과 숲 사진이 섞여요</text>

<rect x="12" y="204" width="616" height="208" rx="14" fill="#f4f6f9" stroke="#d6dde6"/>
<text x="28" y="236" font-size="19" font-weight="700" fill="#17191c">② 인공지능 프로그램: 예시에서 배운 기준으로 묶기</text>
<rect x="28" y="252" width="288" height="146" rx="12" fill="#ffffff" stroke="#1f5bd6" stroke-width="2"/>
<text x="42" y="278" font-size="16" font-weight="700" fill="#1a4cb4">바다 묶음 — 파란색이 많아요</text>
<rect x="330" y="252" width="286" height="146" rx="12" fill="#ffffff" stroke="#15653a" stroke-width="2"/>
<text x="344" y="278" font-size="16" font-weight="700" fill="#15653a">숲 묶음 — 초록색이 많아요</text>
