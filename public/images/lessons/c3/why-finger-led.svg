<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 244" width="640" height="244" role="img" aria-labelledby="title desc">
<title id="title">카메라가 본 편 손가락 개수를 숫자 하나로 보내 네오픽셀 LED를 그만큼 켜는 흐름</title>
<desc id="desc">왼쪽부터 차례로 카메라, 검지, 중지, 약지를 편 손(편 손가락 3개), 숫자 3이 적힌 파란 칸(&quot;3&quot;과 줄바꿈), ESP32 보드, LED 16개가 둥글게 놓인 네오픽셀 링이 화살표로 이어진다. 링에서는 LED 3개만 켜져 있다. 아래에 인공지능이 본 것을 숫자 하나로 줄여 보내면, 보드는 그 숫자로 장치를 움직인다고 적혀 있다. 손은 사람을 찍은 사진이 아니라 계산으로 만든 좌표로 그렸다. 사이트가 직접 그린 그림.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#4a5361"/></marker>
</defs>
<rect width="640" height="244" fill="#ffffff"/>
