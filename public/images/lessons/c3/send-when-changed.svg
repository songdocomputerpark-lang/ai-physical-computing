<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 306" width="640" height="306" role="img" aria-labelledby="title desc">
<title id="title">bridge.send()는 값이 바뀔 때만 보내고, bridge.event()는 같은 값도 장면마다 보낸다</title>
<desc id="desc">맨 위 줄에 장면마다 센 손가락 수 2, 2, 2, 2, 3, 3, 3, 3, 3, 5, 5, 5가 동그라미로 있다. 가운데 bridge.send() 줄은 값이 바뀐 장면에서만 파란 칸 2, 3, 5를 보내고 나머지 장면은 비어 있다. 아래 bridge.event() 줄은 열두 장면 모두 노란 칸으로 값을 보낸다. 아래에 send는 값이 바뀔 때만 보내서 12장에서 3번, event는 같은 값도 장면마다 보내서 12장에서 12번이라고 적혀 있다. 사이트가 직접 그린 그림.</desc>
