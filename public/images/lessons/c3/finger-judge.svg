<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 396" width="640" height="396" role="img" aria-labelledby="title desc">
<title id="title">편 손가락 판정: 기준점에서 손가락 끝까지의 거리와 뿌리 관절까지의 거리를 견준다</title>
<desc id="desc">왼쪽에 검지, 중지, 약지를 펴고 엄지와 소지를 접은 손이 점과 선(손 랜드마크)으로 그려져 있다. 손목(0)에서 검지 끝(8)까지 파란 실선, 검지 뿌리(5)까지 주황 점선이 있는데 파란 선이 더 길어 검지는 펴졌다. 손목에서 소지 끝(20)까지 파란 선은 소지 뿌리(17)까지 주황 점선보다 짧아 소지는 접혔다. 오른쪽 표: 엄지(기준점 17) 접힘 0, 검지 펴짐 1, 중지 펴짐 1, 약지 펴짐 1, 소지 접힘 0이라 01110이 되고 1이 3개라 3이다. 아래 범례에 파란 실선은 기준점에서 끝, 주황 점선은 기준점에서 뿌리 관절이며, 끝이 더 멀면 펴짐(1), 가까우면 접힘(0)이라고 적혀 있다. 손은 계산으로 만든 좌표로 그렸다. 사이트가 직접 그린 그림.</desc>
