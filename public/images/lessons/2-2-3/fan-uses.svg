<title id="title">생활 속 팬 모터</title>
<desc id="desc">세 칸 그림. 노트북 옆의 냉각 팬은 뜨거워지면 빨리 돌고, 공기청정기 윗면의 팬은 공기가 나쁘면 세게 돌아 바람을 위로 내보내고, 냉장고 안의 팬은 찬 공기를 골고루 보낸다. 사이트가 직접 그린 그림.</desc>
