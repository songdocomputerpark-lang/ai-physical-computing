<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" role="img" aria-labelledby="title desc">
<title id="title">speed 값과 PWM duty, 팬의 빠르기</title>
<desc id="desc">위에 duty = int(1023 × speed ÷ 100) 식이 있다. 네 줄: speed=0은 duty 0이라 신호가 늘 꺼져 팬이 멈추고, speed=30은 duty 306이라 짧게 켜져 천천히, speed=70은 duty 716이라 길게 켜져 빠르게, speed=100은 duty 1023이라 늘 켜져 가장 빠르게 돈다. 팬 옆의 빨간 호가 많을수록 빠르다. 아래에 켜진 시간이 길수록 모터가 평균적으로 더 센 힘을 받아 빨리 돈다고 적혀 있다. 사이트가 직접 그린 그림.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#4a5361"/></marker></defs>
<rect width="640" height="380" fill="#ffffff"/>
