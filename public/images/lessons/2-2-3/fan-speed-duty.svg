<text x="320" y="26" font-size="17" font-weight="700" fill="#17191c" text-anchor="middle">speed(0~100)를 duty(0~1023)로 바꿔 빠르기를 정해요</text>
<text x="320" y="54" font-size="16" fill="#1f5bd6" text-anchor="middle" font-family="'Consolas', 'D2Coding', 'Menlo', monospace">duty = int(1023 × speed ÷ 100)</text>
