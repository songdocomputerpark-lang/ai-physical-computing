<text x="22" y="120" font-size="15" fill="#4a5361" font-family="'Consolas', 'D2Coding', 'Menlo', monospace">duty 0</text>
<polyline points="170.0,118.0 230.0,118.0 230.0,118.0 290.0,118.0 290.0,118.0 350.0,118.0 350.0,118.0 410.0,118.0" fill="none" stroke="#1f5bd6" stroke-width="3" stroke-linejoin="round"/>
