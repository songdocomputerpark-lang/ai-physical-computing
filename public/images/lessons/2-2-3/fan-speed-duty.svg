<path d="M475.0 288.5 A26 26 0 0 1 487.6 306.5" fill="none" stroke="#d92b2b" stroke-width="2.5" stroke-linecap="round"/>
<path d="M478.5 282.4 A33 33 0 0 1 494.5 305.3" fill="none" stroke="#d92b2b" stroke-width="2.5" stroke-linecap="round"/>
<path d="M482.0 276.4 A40 40 0 0 1 501.4 304.1" fill="none" stroke="#d92b2b" stroke-width="2.5" stroke-linecap="round"/>
<text x="510" y="317" font-size="16" font-weight="700" fill="#17191c">가장 빠르게</text>
<text x="320" y="366" font-size="15" fill="#4a5361" text-anchor="middle">켜진 시간이 길수록 모터가 평균적으로 더 센 힘을 받아 빨리 돌아요.</text>
