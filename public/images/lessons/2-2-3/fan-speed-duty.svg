<text x="22" y="308" font-size="16" font-weight="700" fill="#17191c" font-family="'Consolas', 'D2Coding', 'Menlo', monospace">speed=100</text>
<text x="22" y="330" font-size="15" fill="#4a5361" font-family="'Consolas', 'D2Coding', 'Menlo', monospace">duty 1023</text>
