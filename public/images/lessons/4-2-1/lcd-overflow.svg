<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" width="640" height="350" role="img" aria-labelledby="title desc">
<title id="title">LCD 한 줄은 16칸이라 둘째 줄의 넘친 세 글자가 첫 줄 맨 앞을 덮는다</title>
<desc id="desc">LCD 칸 그림 세 줄이 있다. 첫째 줄은 먼저 쓴 첫 줄 X:1920  Y:1080이다. 둘째 줄은 d_c:0     r_c:0로 16칸을 채우고, 오른쪽에 점선으로 그린 넘친 3칸(빈칸)이 있다. 넘친 3칸에서 나온 화살표가 셋째 줄로 이어지는데, 셋째 줄은 LCD에 실제로 보이는 첫 줄로 맨 앞 세 칸이 빈칸으로 덮여 920  Y:1080만 보인다. 아래에 둘째 줄의 글은 19글자이고 16칸을 넘은 3글자가 첫 줄 맨 앞 세 칸을 덮는다는 설명이 있다. 사이트가 직접 그린 그림.</desc>
