<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 366" width="640" height="366" role="img" aria-labelledby="title desc">
<title id="title">마우스 x 좌표 0부터 3840까지를 서보 각도 0도부터 180도까지로 비례해서 바꾼다</title>
<desc id="desc">위 눈금은 마우스 x 좌표 0, 960, 1920, 2880, 3840이고, 바로 아래 눈금은 서보 각도 0도, 45도, 90도, 135도, 180도이다. 같은 자리끼리 점선으로 이어져 있다. 두 눈금의 오른쪽 절반(좌표 1920부터, 각도 90도부터)은 주황색으로 칠해져 있고, 화면이 1920×1080이면 오지 않는 값이라는 설명이 붙어 있다. 왼쪽 아래 상자에는 각도 = x × 180 ÷ 3840 식과 1920이면 90, 2880이면 135라는 계산이 있고, 소수점 아래는 버린다고 적혀 있다. 오른쪽 아래에는 x가 2880일 때 서보 팔이 135도를 가리키는 반원 눈금 그림이 있다. 사이트가 직접 그린 그림.</desc>
<rect width="640" height="366" fill="#ffffff"/>
<g font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif">
<text x="320" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#17191c">화면 x 좌표를 서보 각도로 바꿔요</text>

<text x="60" y="62" font-size="16" font-weight="700" fill="#17191c">마우스 x 좌표</text>
<text x="450" y="90" text-anchor="middle" font-size="16" fill="#8a4600">1920×1080 화면에서는 오지 않는 값</text>

<!-- 위 눈금: x 좌표 -->
<rect x="320" y="101" width="260" height="14" fill="#fde7cc" stroke="#b25e00" stroke-width="1"/>
<line x1="60" y1="108" x2="580" y2="108" stroke="#17191c" stroke-width="2"/>
<g stroke="#17191c" stroke-width="2">
<line x1="60" y1="100" x2="60" y2="116"/><line x1="190" y1="100" x2="190" y2="116"/><line x1="320" y1="100" x2="320" y2="116"/><line x1="450" y1="100" x2="450" y2="116"/><line x1="580" y1="100" x2="580" y2="116"/>
</g>
<g font-size="16" fill="#17191c" text-anchor="middle" font-family="'Consolas', 'D2Coding', monospace">
<text x="60" y="134">0</text><text x="190" y="134">960</text><text x="320" y="134">1920</text><text x="450" y="134">2880</text><text x="580" y="134">3840</text>
</g>

<!-- 잇는 점선 -->
<g stroke="#7b8594" stroke-width="1.5" stroke-dasharray="4 4">
<line x1="60" y1="140" x2="60" y2="168"/><line x1="190" y1="140" x2="190" y2="168"/><line x1="320" y1="140" x2="320" y2="168"/><line x1="450" y1="140" x2="450" y2="168"/><line x1="580" y1="140" x2="580" y2="168"/>
</g>

<!-- 아래 눈금: 각도 -->
<rect x="320" y="169" width="260" height="14" fill="#fde7cc" stroke="#b25e00" stroke-width="1"/>
<line x1="60" y1="176" x2="580" y2="176" stroke="#1f5bd6" stroke-width="2"/>
<g stroke="#1f5bd6" stroke-width="2">
<line x1="60" y1="168" x2="60" y2="184"/><line x1="190" y1="168" x2="190" y2="184"/><line x1="320" y1="168" x2="320" y2="184"/><line x1="450" y1="168" x2="450" y2="184"/><line x1="580" y1="168" x2="580" y2="184"/>
</g>
<g font-size="16" fill="#1a4cb4" text-anchor="middle" font-weight="700">
<text x="60" y="204">0°</text><text x="190" y="204">45°</text><text x="320" y="204">90°</text><text x="450" y="204">135°</text><text x="580" y="204">180°</text>
</g>
<text x="60" y="226" font-size="16" font-weight="700" fill="#17191c">서보 각도</text>

<!-- 식 -->
<rect x="10" y="240" width="300" height="112" rx="10" fill="#f4f6f9" stroke="#7b8594" stroke-width="1.5"/>
<text x="24" y="266" font-size="17" font-weight="700" fill="#17191c">각도 = x × 180 ÷ 3840</text>
<g font-size="16" fill="#17191c" font-family="'Consolas', 'D2Coding', monospace">
<text x="24" y="292">1920 × 180 ÷ 3840 = 90</text>
<text x="24" y="316">2880 × 180 ÷ 3840 = 135</text>
</g>
<text x="24" y="340" font-size="16" fill="#4a5361">소수점 아래는 버려요(int).</text>

<!-- 서보 -->
<path d="M400 312 A70 70 0 0 1 540 312" fill="none" stroke="#7b8594" stroke-width="1.5" stroke-dasharray="3 3"/>
<g font-size="16" fill="#4a5361">
<text x="394" y="316" text-anchor="end">0°</text>
<text x="470" y="236" text-anchor="middle">90°</text>
<text x="546" y="316">180°</text>
</g>
<rect x="448" y="312" width="44" height="22" rx="3" fill="#4a5361"/>
<line x1="470" y1="312" x2="518" y2="264" stroke="#1f5bd6" stroke-width="5" stroke-linecap="round"/>
<circle cx="470" cy="312" r="4" fill="#ffffff" stroke="#17191c" stroke-width="1.5"/>
<text x="470" y="356" text-anchor="middle" font-size="16" fill="#17191c">x가 2880이면 팔이 135°</text>
</g>
</svg>
