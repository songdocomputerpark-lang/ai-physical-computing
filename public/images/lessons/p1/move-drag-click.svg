<path d="M448 184 A14 14 0 0 1 476 184 L476 198 A14 14 0 0 1 448 198 Z" fill="#ffffff" stroke="#17191c" stroke-width="2"/><path d="M449.5 184 A12.5 12.5 0 0 1 462 171.5 L462 187.64 L449.5 187.64 Z" fill="#1f5bd6"/><path d="M462 171.5 A12.5 12.5 0 0 1 474.5 184 L474.5 187.64 L462 187.64 Z" fill="#ffffff"/><line x1="448" y1="187.64" x2="476" y2="187.64" stroke="#17191c" stroke-width="2"/><line x1="462" y1="170" x2="462" y2="187.64" stroke="#17191c" stroke-width="2"/>
<text x="488" y="188" font-size="16" fill="#4a5361">그 자리에서</text>
<text x="488" y="210" font-size="16" fill="#4a5361">눌렀다 떼요</text>
<text x="530" y="252" font-size="16" font-weight="700" text-anchor="middle" fill="#1a4cb4">단추나 아이콘이 눌려요</text>
</g>
</svg>
