<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 316" width="640" height="316" role="img" aria-labelledby="title desc">
<title id="title">키보드 함수: typewrite는 글자를 한 글자씩 치고, hotkey는 여러 키를 함께 누른다</title>
<desc id="desc">위 칸: typewrite(&quot;hi\n&quot;, interval=0.1)이 h, i, Enter 키를 0.1초 간격으로 차례로 눌러 메모장에 hi를 치고 줄을 바꾼다. 아래 칸: hotkey(ctrl, s)가 1 Ctrl 누름, 2 S 누름, 3 S 뗌, 4 Ctrl 뗌 차례로 움직인다. 누를 때는 적은 차례대로, 뗄 때는 거꾸로 떼서 Ctrl+S를 함께 누른 것과 같아지고 저장 창이 열린다. 사이트가 직접 그린 그림.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#4a5361"/></marker>
</defs>
<rect width="640" height="316" fill="#ffffff"/>
<g font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif">
<text x="16" y="30" font-size="16" font-weight="700" fill="#17191c" font-family="ui-monospace, 'Cascadia Mono', Consolas, 'D2Coding', 'Malgun Gothic', monospace">typewrite(&quot;hi\n&quot;, interval=0.1)</text>
<rect x="24" y="48" width="56" height="46" rx="7" fill="#ffffff" stroke="#17191c" stroke-width="2"/>
<rect x="28" y="86" width="48" height="4" rx="2" fill="#d6dde6"/>
<text x="52" y="78" font-size="18" font-weight="700" text-anchor="middle" fill="#17191c" font-family="ui-monospace, 'Cascadia Mono', Consolas, 'D2Coding', 'Malgun Gothic', monospace">h</text>
<rect x="136" y="48" width="56" height="46" rx="7" fill="#ffffff" stroke="#17191c" stroke-width="2"/>
<rect x="140" y="86" width="48" height="4" rx="2" fill="#d6dde6"/>
<text x="164" y="78" font-size="18" font-weight="700" text-anchor="middle" fill="#17191c" font-family="ui-monospace, 'Cascadia Mono', Consolas, 'D2Coding', 'Malgun Gothic', monospace">i</text>
<rect x="248" y="48" width="90" height="46" rx="7" fill="#ffffff" stroke="#17191c" stroke-width="2"/>
<rect x="252" y="86" width="82" height="4" rx="2" fill="#d6dde6"/>
<text x="293" y="78" font-size="18" font-weight="700" text-anchor="middle" fill="#17191c">Enter</text>
<line x1="84" y1="71" x2="132" y2="71" stroke="#4a5361" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="196" y1="71" x2="244" y2="71" stroke="#4a5361" stroke-width="2" marker-end="url(#arrow)"/>
<text x="108" y="116" font-size="16" text-anchor="middle" fill="#4a5361">0.1초</text>
<text x="220" y="116" font-size="16" text-anchor="middle" fill="#4a5361">0.1초</text>
<line x1="344" y1="71" x2="392" y2="71" stroke="#4a5361" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="398" y="44" width="226" height="76" rx="4" fill="#ffffff" stroke="#7b8594" stroke-width="1.5"/>
<rect x="398" y="44" width="226" height="14" rx="4" fill="#1a4cb4"/>
<text x="410" y="84" font-size="18" fill="#17191c" font-family="ui-monospace, 'Cascadia Mono', Consolas, 'D2Coding', 'Malgun Gothic', monospace">hi</text>
<line x1="410" y1="94" x2="410" y2="112" stroke="#17191c" stroke-width="2"/>
<text x="511" y="142" font-size="16" text-anchor="middle" fill="#4a5361">한 글자씩 치고 줄을 바꿔요</text>
<line x1="16" y1="160" x2="624" y2="160" stroke="#d6dde6" stroke-width="1.5"/>
<text x="16" y="190" font-size="16" font-weight="700" fill="#17191c" font-family="ui-monospace, 'Cascadia Mono', Consolas, 'D2Coding', 'Malgun Gothic', monospace">hotkey('ctrl', 's')</text>
<rect x="16" y="206" width="140" height="44" rx="10" fill="#eaf1fe" stroke="#5b87e0" stroke-width="1.5"/>
<circle cx="38" cy="228" r="12" fill="#1a4cb4"/><text x="38" y="233.5" font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
<text x="58" y="234" font-size="16" font-weight="700" fill="#1a4cb4">Ctrl 누름</text>
<line x1="157" y1="228" x2="169" y2="228" stroke="#4a5361" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="170" y="206" width="140" height="44" rx="10" fill="#eaf1fe" stroke="#5b87e0" stroke-width="1.5"/>
<circle cx="192" cy="228" r="12" fill="#1a4cb4"/><text x="192" y="233.5" font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
<text x="212" y="234" font-size="16" font-weight="700" fill="#1a4cb4">S 누름</text>
<line x1="311" y1="228" x2="323" y2="228" stroke="#4a5361" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="324" y="206" width="140" height="44" rx="10" fill="#f4f6f9" stroke="#d6dde6" stroke-width="1.5"/>
<circle cx="346" cy="228" r="12" fill="#1a4cb4"/><text x="346" y="233.5" font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
<text x="366" y="234" font-size="16" font-weight="700" fill="#17191c">S 뗌</text>
<line x1="465" y1="228" x2="477" y2="228" stroke="#4a5361" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="478" y="206" width="140" height="44" rx="10" fill="#f4f6f9" stroke="#d6dde6" stroke-width="1.5"/>
<circle cx="500" cy="228" r="12" fill="#1a4cb4"/><text x="500" y="233.5" font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">4</text>
<text x="520" y="234" font-size="16" font-weight="700" fill="#17191c">Ctrl 뗌</text>
<text x="16" y="278" font-size="16" fill="#4a5361">누를 때는 적은 차례대로, 뗄 때는 거꾸로 떼요.</text>
<text x="16" y="302" font-size="16" fill="#4a5361">Ctrl+S를 함께 누른 것과 같아서 저장 창이 열려요.</text>
</g>
</svg>
