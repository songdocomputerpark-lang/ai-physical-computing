<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" width="640" height="290" role="img" aria-labelledby="title desc">
<title id="title">사람이 마우스와 키보드로 하던 조작을 PyAutoGUI 코드가 대신하는 모습</title>
<desc id="desc">위 줄: 사람이 손으로 마우스와 키보드를 움직여 컴퓨터 화면을 조작한다. 아래 줄: moveTo(300, 300), click(), write(hello) 같은 파이썬 코드를 PyAutoGUI가 받아 마우스와 키보드를 대신 움직인다. 두 줄 모두 같은 컴퓨터 화면으로 이어져, 화면에 커서가 움직이고 메모장에 hello가 쳐진다. 사이트가 직접 그린 그림.</desc>
