<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 494" width="360" height="494" role="img" aria-labelledby="title desc">
<title id="title">부품 모듈의 핀 구성: GND, VCC와 신호 핀</title>
<desc id="desc">부품마다 핀 이름을 색 칩으로 나란히 보여 주고, 그 아래 줄에 쓰는 부품을 적었다. 모든 부품에 GND(검정)와 VCC(빨강)가 있고, 나머지 노란 칩이 신호 핀이다. 3핀 GND, VCC, SIG는 버저, 레이저, 진동 모터, 서보모터. 3핀 GND, VCC, DIN은 네오픽셀. 4핀 GND, VCC, SDA, SCL은 문자 LCD와 OLED(I2C 통신). 4핀 GND, VCC, TX, RX는 MP3 플레이어(UART 통신). 4핀 GND, VCC, InA, InB는 팬 모터. 5핀 GND, VCC, R, G, B는 RGB LED. 휴대폰처럼 좁은 화면에서 읽기 쉽게 같은 내용을 세로로 다시 배치한 그림이다. 사이트가 직접 그린 그림.</desc>
