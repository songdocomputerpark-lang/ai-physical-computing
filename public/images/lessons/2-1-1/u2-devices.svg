<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 316" width="640" height="316" role="img" aria-labelledby="title desc">
<title id="title">ESP32 보드 하나로 움직여 볼 장치들</title>
<desc id="desc">왼쪽의 ESP32 보드에서 네 갈래로 선이 뻗어 화면(문자 LCD, OLED), 빛(RGB LED, 레이저, 네오픽셀), 소리(버저, MP3 플레이어), 움직임(팬 모터, 서보모터) 장치로 이어진다. 사이트가 직접 그린 그림.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 Z" fill="#4a5361"/>
</marker>
</defs>
<rect width="640" height="316" fill="#ffffff"/>
<g font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif">
<!-- 보드에서 네 갈래로 -->
<g fill="none" stroke="#4a5361" stroke-width="2.5">
<path d="M162 158 H192"/>
<path d="M192 44 V272"/>
<path d="M192 44 H216" marker-end="url(#arrow)"/>
<path d="M192 120 H216" marker-end="url(#arrow)"/>
<path d="M192 196 H216" marker-end="url(#arrow)"/>
<path d="M192 272 H216" marker-end="url(#arrow)"/>
</g>
<!-- ESP32 보드 -->
<rect x="12" y="103" width="150" height="110" rx="14" fill="#22384d"/>
<rect x="30" y="118" width="18" height="6" rx="1" fill="#d9a520"/>
<rect x="56" y="118" width="18" height="6" rx="1" fill="#d9a520"/>
<rect x="82" y="118" width="18" height="6" rx="1" fill="#d9a520"/>
<rect x="108" y="118" width="18" height="6" rx="1" fill="#d9a520"/>
<rect x="30" y="192" width="18" height="6" rx="1" fill="#d9a520"/>
<rect x="56" y="192" width="18" height="6" rx="1" fill="#d9a520"/>
<rect x="82" y="192" width="18" height="6" rx="1" fill="#d9a520"/>
<rect x="108" y="192" width="18" height="6" rx="1" fill="#d9a520"/>
<text x="87" y="160" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">ESP32</text>
<text x="87" y="184" font-size="17" fill="#dfe7f1" text-anchor="middle">보드</text>

<!-- 화면 -->
<rect x="220" y="12" width="408" height="64" rx="12" fill="#f4f6f9" stroke="#d6dde6"/>
<rect x="236" y="30" width="40" height="28" rx="4" fill="#22384d"/>
<rect x="240" y="34" width="32" height="20" rx="2" fill="#3d7be0"/>
<text x="292" y="51" font-size="19" font-weight="700" fill="#17191c">화면</text>
<text x="362" y="51" font-size="17" fill="#17191c">문자 LCD, OLED</text>

<!-- 빛 -->
<rect x="220" y="88" width="408" height="64" rx="12" fill="#f4f6f9" stroke="#d6dde6"/>
<g stroke="#b7800f" stroke-width="2.5" stroke-linecap="round">
<path d="M256 101 V105"/><path d="M256 135 V139"/><path d="M237 120 H241"/><path d="M271 120 H275"/>
<path d="M243 107 L246 110"/><path d="M266 130 L269 133"/><path d="M269 107 L266 110"/><path d="M246 130 L243 133"/>
</g>
<circle cx="256" cy="120" r="10" fill="#f2b705"/>
<text x="292" y="127" font-size="19" font-weight="700" fill="#17191c">빛</text>
<text x="362" y="127" font-size="17" fill="#17191c">RGB LED, 레이저, 네오픽셀</text>

<!-- 소리 -->
<rect x="220" y="164" width="408" height="64" rx="12" fill="#f4f6f9" stroke="#d6dde6"/>
<path d="M238 189 H247 L258 180 V212 L247 203 H238 Z" fill="#4a5361"/>
<path d="M264 189 Q270 196 264 203" fill="none" stroke="#4a5361" stroke-width="2.5" stroke-linecap="round"/>
<path d="M269 183 Q280 196 269 209" fill="none" stroke="#4a5361" stroke-width="2.5" stroke-linecap="round"/>
<text x="292" y="203" font-size="19" font-weight="700" fill="#17191c">소리</text>
<text x="362" y="203" font-size="17" fill="#17191c">버저, MP3 플레이어</text>

<!-- 움직임 -->
<rect x="220" y="240" width="408" height="64" rx="12" fill="#f4f6f9" stroke="#d6dde6"/>
<g fill="#4a5361">
<ellipse cx="256" cy="261" rx="5" ry="10"/>
<ellipse cx="256" cy="261" rx="5" ry="10" transform="rotate(120 256 272)"/>
<ellipse cx="256" cy="261" rx="5" ry="10" transform="rotate(240 256 272)"/>
</g>
<circle cx="256" cy="272" r="4" fill="#ffffff" stroke="#4a5361" stroke-width="2"/>
<text x="292" y="279" font-size="19" font-weight="700" fill="#17191c">움직임</text>
<text x="362" y="279" font-size="17" fill="#17191c">팬 모터, 서보모터</text>
</g>
</svg>
