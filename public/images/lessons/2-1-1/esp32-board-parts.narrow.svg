<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 399" width="360" height="399" role="img" aria-labelledby="title desc">
<title id="title">ESP32 개발 보드의 부분과 이름</title>
<desc id="desc">위에서 본 ESP32 개발 보드에 번호가 붙어 있다. 1 왼쪽 가장자리의 USB-C 단자, 2 왼쪽 위의 리셋(EN) 버튼, 3 왼쪽 아래의 BOOT 버튼(GPIO 0), 4 작은 내장 LED(GPIO 2), 5 오른쪽의 ESP32-WROOM-32 모듈, 6 위아래 가장자리를 따라 늘어선 핀 머리(GPIO), 7 아래 줄의 I2C 핀 두 개(SDA 21번, SCL 22번). 아래에 번호별 이름표가 한 줄씩 있다. 휴대폰처럼 좁은 화면에서 읽기 쉽게 보드 그림을 줄이고 번호와 글자는 제 크기로 다시 적은 그림이다. 사이트가 직접 그린 그림.</desc>
<rect width="360" height="399" fill="#ffffff"/>
<svg x="0" y="0" width="360" height="191" viewBox="24 4 512 272">
