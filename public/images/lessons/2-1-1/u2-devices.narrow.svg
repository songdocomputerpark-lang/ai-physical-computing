<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 374" width="360" height="374" role="img" aria-labelledby="title desc">
<title id="title">ESP32 보드 하나로 움직여 볼 장치들</title>
<desc id="desc">위의 ESP32 보드에서 선이 네 갈래로 뻗어 화면(문자 LCD, OLED), 빛(RGB LED, 레이저, 네오픽셀), 소리(버저, MP3 플레이어), 움직임(팬 모터, 서보모터) 장치로 이어진다. 휴대폰처럼 좁은 화면에서 읽기 쉽게 같은 내용을 세로로 다시 배치한 그림이다. 사이트가 직접 그린 그림.</desc>
