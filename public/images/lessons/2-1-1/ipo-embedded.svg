<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 312" width="640" height="312" role="img" aria-labelledby="title desc">
<title id="title">피지컬 컴퓨팅의 입력 장치, 처리 장치, 출력 장치와 임베디드 시스템</title>
<desc id="desc">점선으로 둘러싼 임베디드 시스템 안에 세 상자가 화살표로 이어진다. 입력 장치(센서, 버튼, 스위치)가 알아챈 데이터를 처리 장치(마이크로컨트롤러, 안에 펌웨어)가 판단해 출력 장치(LED, 모터, 스피커, 디스플레이)를 움직인다. 아래 예: BOOT 버튼을 누르면 ESP32가 판단해 내장 LED를 켠다. 사이트가 직접 그린 그림.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 Z" fill="#4a5361"/>
</marker>
</defs>
<rect width="640" height="312" fill="#ffffff"/>
<g font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif">
<text x="20" y="26" font-size="17" font-weight="700" fill="#1a4cb4">임베디드 시스템</text>
<text x="152" y="26" font-size="16" fill="#4a5361">한 가지 일을 하도록 만든 작은 컴퓨터 시스템</text>
<rect x="8" y="38" width="624" height="214" rx="16" fill="none" stroke="#5b87e0" stroke-width="2" stroke-dasharray="8 6"/>

<!-- 입력 장치 -->
<rect x="24" y="56" width="176" height="180" rx="14" fill="#f4f6f9" stroke="#7b8594"/>
<text x="112" y="86" font-size="19" font-weight="700" fill="#17191c" text-anchor="middle">입력 장치</text>
<text x="112" y="110" font-size="16" fill="#4a5361" text-anchor="middle">알아채기</text>
<rect x="84" y="124" width="56" height="40" rx="8" fill="#dfe7f1" stroke="#7b8594"/>
<circle cx="112" cy="144" r="12" fill="#4a5361"/>
<text x="112" y="194" font-size="16" fill="#17191c" text-anchor="middle">센서, 버튼,</text>
<text x="112" y="216" font-size="16" fill="#17191c" text-anchor="middle">스위치</text>

<line x1="202" y1="146" x2="228" y2="146" stroke="#4a5361" stroke-width="2.5" marker-end="url(#arrow)"/>

<!-- 처리 장치 -->
<rect x="232" y="56" width="176" height="180" rx="14" fill="#eaf1fe" stroke="#5b87e0"/>
<text x="320" y="86" font-size="19" font-weight="700" fill="#17191c" text-anchor="middle">처리 장치</text>
<text x="320" y="110" font-size="16" fill="#4a5361" text-anchor="middle">판단하고 제어하기</text>
<g stroke="#d9a520" stroke-width="3">
<path d="M284 130 H292"/><path d="M284 142 H292"/><path d="M284 154 H292"/>
<path d="M348 130 H356"/><path d="M348 142 H356"/><path d="M348 154 H356"/>
</g>
<rect x="292" y="120" width="56" height="46" rx="6" fill="#22384d"/>
<text x="320" y="149" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">MCU</text>
<text x="320" y="194" font-size="16" fill="#17191c" text-anchor="middle">마이크로컨트롤러</text>
<text x="320" y="216" font-size="16" fill="#17191c" text-anchor="middle">(안에 펌웨어)</text>

<line x1="410" y1="146" x2="436" y2="146" stroke="#4a5361" stroke-width="2.5" marker-end="url(#arrow)"/>

<!-- 출력 장치 -->
<rect x="440" y="56" width="176" height="180" rx="14" fill="#f4f6f9" stroke="#7b8594"/>
<text x="528" y="86" font-size="19" font-weight="700" fill="#17191c" text-anchor="middle">출력 장치</text>
<text x="528" y="110" font-size="16" fill="#4a5361" text-anchor="middle">내보내고 움직이기</text>
<g stroke="#b7800f" stroke-width="2.5" stroke-linecap="round">
<path d="M528 121 V126"/><path d="M528 162 V167"/><path d="M505 144 H510"/><path d="M546 144 H551"/>
<path d="M512 128 L516 132"/><path d="M540 156 L544 160"/><path d="M544 128 L540 132"/><path d="M516 156 L512 160"/>
</g>
<circle cx="528" cy="144" r="13" fill="#f2b705"/>
<text x="528" y="194" font-size="16" fill="#17191c" text-anchor="middle">LED, 모터,</text>
<text x="528" y="216" font-size="16" fill="#17191c" text-anchor="middle">스피커, 디스플레이</text>

<!-- 이 차시의 예 -->
<rect x="8" y="264" width="624" height="42" rx="10" fill="#fff4d8" stroke="#b7800f"/>
<text x="320" y="291" font-size="17" fill="#17191c" text-anchor="middle">예: BOOT 버튼을 누름 → ESP32가 판단 → 내장 LED가 켜짐</text>
</g>
</svg>
