<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" role="img" aria-labelledby="title desc">
<title id="title">손 랜드마크 21곳의 번호</title>
<desc id="desc">편 손 위에 21개 점이 번호와 함께 찍혀 있다. 손목이 0번이고, 엄지는 1~4번, 검지는 5~8번, 중지는 9~12번, 약지는 13~16번, 새끼손가락은 17~20번이다. 손목 0번과 손가락 끝 4, 8, 12, 16, 20번은 크게 표시했고, 검지의 5~8번 점과 선은 파란색이다. 오른쪽에 같은 내용의 설명이 있다. 사이트가 직접 그린 그림.</desc>
