<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" role="img" aria-labelledby="title desc">
<title id="title">이전 좌표와 현재 좌표를 이어 선이 되는 과정</title>
<desc id="desc">프레임 1, 2, 3, 4에서 찍힌 검지 끝 점들이 이웃끼리 초록 선으로 이어져 곡선이 된다. 3번 점에는 이전 좌표, 4번 점에는 현재 좌표라는 이름표가 있고 둘 사이의 선이 가장 굵다. 5번 프레임은 손이 없어 빨간 가위표와 "→ (0, 0)"이 있고, 이전 좌표가 (0, 0)으로 돌아가 선이 끊긴다. 6, 7, 8번 프레임에서 새 선이 다시 시작된다. 사이트가 직접 그린 그림.</desc>
<rect width="640" height="250" fill="#ffffff"/>
<g font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="middle"><line x1="50" y1="150" x2="115" y2="102" stroke="#3b9360" stroke-width="5" stroke-linecap="round"/><line x1="115" y1="102" x2="190" y2="84" stroke="#3b9360" stroke-width="5" stroke-linecap="round"/><line x1="190" y1="84" x2="262" y2="106" stroke="#3b9360" stroke-width="7" stroke-linecap="round"/><line x1="400" y1="162" x2="470" y2="118" stroke="#3b9360" stroke-width="5" stroke-linecap="round"/><line x1="470" y1="118" x2="548" y2="104" stroke="#3b9360" stroke-width="5" stroke-linecap="round"/><circle cx="50" cy="150" r="7" fill="#17191c" stroke="#ffffff" stroke-width="2"/><text x="50" y="134" font-size="16" font-weight="700" fill="#17191c">1</text><circle cx="115" cy="102" r="7" fill="#17191c" stroke="#ffffff" stroke-width="2"/><text x="115" y="86" font-size="16" font-weight="700" fill="#17191c">2</text><circle cx="190" cy="84" r="7" fill="#17191c" stroke="#ffffff" stroke-width="2"/><text x="190" y="68" font-size="16" font-weight="700" fill="#17191c">3</text><circle cx="262" cy="106" r="7" fill="#17191c" stroke="#ffffff" stroke-width="2"/><text x="262" y="90" font-size="16" font-weight="700" fill="#17191c">4</text><circle cx="400" cy="162" r="7" fill="#17191c" stroke="#ffffff" stroke-width="2"/><text x="400" y="146" font-size="16" font-weight="700" fill="#17191c">6</text><circle cx="470" cy="118" r="7" fill="#17191c" stroke="#ffffff" stroke-width="2"/><text x="470" y="102" font-size="16" font-weight="700" fill="#17191c">7</text><circle cx="548" cy="104" r="7" fill="#17191c" stroke="#ffffff" stroke-width="2"/><text x="548" y="88" font-size="16" font-weight="700" fill="#17191c">8</text><g stroke="#d24b4b" stroke-width="3" stroke-linecap="round"><line x1="322" y1="118" x2="342" y2="138"/><line x1="342" y1="118" x2="322" y2="138"/></g><text x="332" y="104" font-size="16" font-weight="700" fill="#17191c">5</text><text x="332" y="164" font-size="16" fill="#a3232a">손 없음</text><text x="332" y="186" font-size="16" fill="#a3232a">→ (0, 0)</text><text x="190" y="208" font-size="16" fill="#1a4cb4">이전 좌표</text><line x1="190" y1="190" x2="190" y2="98" stroke="#1f5bd6" stroke-width="1.5" stroke-dasharray="4 4"/><text x="262" y="232" font-size="16" fill="#1a4cb4">현재 좌표</text><line x1="262" y1="214" x2="262" y2="120" stroke="#1f5bd6" stroke-width="1.5" stroke-dasharray="4 4"/><text x="400" y="208" font-size="16" fill="#4a5361">새로 시작</text><text x="20" y="30" font-size="16" fill="#4a5361" text-anchor="start">숫자 = 프레임 차례, 초록 선 = cv2.line(이전 좌표, 현재 좌표)</text></g>
</svg>
