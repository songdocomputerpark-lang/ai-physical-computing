<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="title desc">
<title id="title">수학 좌표계와 픽셀 좌표계 비교</title>
<desc id="desc">왼쪽 수학 좌표계는 원점 (0, 0)이 왼쪽 아래에 있고, x축은 오른쪽으로, y축은 위쪽으로 커진다. 모눈 위에 점 (3, 1)이 있다. 오른쪽 픽셀 좌표계는 가로 640, 세로 480 화면의 원점 (0, 0)이 왼쪽 위에 있고, x축은 오른쪽으로, y축은 아래쪽으로 커지며 오른쪽 아래 끝이 (640, 480)이다. 화면 안에 점 (320, 120)이 있다. 사이트가 직접 그린 그림.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#4a5361"/></marker></defs>
<rect width="640" height="300" fill="#ffffff"/>
<g font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="middle"><text x="160" y="28" font-size="18" font-weight="700" fill="#17191c">수학 좌표계</text><g stroke="#d6dde6" stroke-width="1"><line x1="116" y1="232" x2="116" y2="66.4"/><line x1="162" y1="232" x2="162" y2="66.4"/><line x1="208" y1="232" x2="208" y2="66.4"/><line x1="254" y1="232" x2="254" y2="66.4"/><line x1="70" y1="186" x2="281.6" y2="186"/><line x1="70" y1="140" x2="281.6" y2="140"/><line x1="70" y1="94" x2="281.6" y2="94"/></g><line x1="70" y1="232" x2="295.4" y2="232" stroke="#17191c" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="70" y1="232" x2="70" y2="52.599999999999994" stroke="#17191c" stroke-width="2.5" marker-end="url(#arrow)"/><text x="299.4" y="254" font-size="16" font-weight="700" fill="#17191c">x</text><text x="54" y="58.599999999999994" font-size="16" font-weight="700" fill="#17191c">y</text><circle cx="70" cy="232" r="5" fill="#17191c"/><text x="70" y="256" font-size="16" fill="#17191c">(0, 0)</text><circle cx="208" cy="186" r="7" fill="#1f5bd6" stroke="#ffffff" stroke-width="2"/><text x="220" y="174" font-size="17" font-weight="700" fill="#1a4cb4" text-anchor="start">(3, 1)</text><text x="160" y="288" font-size="16" fill="#4a5361">원점은 왼쪽 아래, y는 위로 커져요</text><text x="492" y="28" font-size="18" font-weight="700" fill="#17191c">픽셀 좌표계(OpenCV)</text><rect x="380" y="62" width="224" height="168" fill="#f4f6f9" stroke="#17191c" stroke-width="2.5"/><line x1="380" y1="50" x2="622" y2="50" stroke="#17191c" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="366" y1="62" x2="366" y2="246" stroke="#17191c" stroke-width="2.5" marker-end="url(#arrow)"/><text x="630" y="55" font-size="16" font-weight="700" fill="#17191c">x</text><text x="366" y="268" font-size="16" font-weight="700" fill="#17191c">y</text><circle cx="380" cy="62" r="5" fill="#17191c"/><text x="358" y="42" font-size="16" fill="#17191c">(0, 0)</text><g stroke="#1f5bd6" stroke-width="1.5" stroke-dasharray="5 4"><line x1="492" y1="62" x2="492" y2="104"/><line x1="380" y1="104" x2="492" y2="104"/></g><circle cx="492" cy="104" r="7" fill="#1f5bd6" stroke="#ffffff" stroke-width="2"/><text x="504" y="128" font-size="17" font-weight="700" fill="#1a4cb4" text-anchor="start">(320, 120)</text><text x="604" y="254" font-size="16" fill="#4a5361" text-anchor="end">(640, 480)</text><text x="492" y="288" font-size="16" fill="#4a5361">원점은 왼쪽 위, y는 아래로 커져요</text></g>
</svg>
