<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" width="640" height="270" role="img" aria-labelledby="title desc">
<title id="title">허공에서 손끝으로 그린 별이 화면에 선으로 남는 모습</title>
<desc id="desc">왼쪽에는 검지만 편 손이 허공에서 별 모양을 따라 움직였고, 손끝이 지나간 길이 회색 점선으로 보인다. 손끝(파란 점)은 별의 오른쪽 꼭짓점에 있다. 가운데 화살표에 "좌표를 이어요"라고 적혀 있고, 오른쪽의 Draw 창에는 같은 별 모양이 초록 선으로 그려져 있다. 사이트가 직접 그린 그림.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#4a5361"/></marker></defs>
<rect width="640" height="270" fill="#ffffff"/>
