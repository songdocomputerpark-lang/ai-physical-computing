<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 418" width="360" height="418" role="img" aria-labelledby="title desc">
<title id="title">웹캠 프레임과 도화지를 반씩 섞어 보여 주기</title>
<desc id="desc">왼쪽 위는 손이 보이는 웹캠 프레임으로 반복할 때마다 새로 읽는다. 오른쪽 위는 검은 도화지(canvas)에 초록 곡선이 그려져 있고 이 선은 계속 남는다. 더하기 기호와 아래로 향한 화살표를 지나 아래의 보여 주는 화면에는 어두워진 손 영상 위에 초록 곡선이 함께 보인다. 맨 아래에 cv2.addWeighted(frame, 0.5, canvas, 0.5, 0)이 적혀 있다. 휴대폰처럼 좁은 화면에서 읽기 쉽게 같은 내용을 세로로 다시 배치한 그림이다. 사이트가 직접 그린 그림.</desc>
