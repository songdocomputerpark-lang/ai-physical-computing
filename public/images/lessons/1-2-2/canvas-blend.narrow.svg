<text x="85" y="24" font-size="15" font-weight="700" fill="#17191c">웹캠 프레임</text>
<text x="275" y="24" font-size="15" font-weight="700" fill="#17191c">도화지(canvas)</text>
<text x="180" y="102" font-size="30" font-weight="700" fill="#4a5361">+</text>
<text x="85" y="168" font-size="14" fill="#4a5361">매번 새로 읽어요</text>
<text x="275" y="168" font-size="14" fill="#4a5361">선이 계속 남아요</text>
<text x="180" y="232" font-size="15" font-weight="700" fill="#17191c">보여 주는 화면</text>
<text x="180" y="376" font-size="14" fill="#4a5361">반씩 섞어요</text>
<text x="180" y="404" font-size="13" font-family="ui-monospace, 'Cascadia Mono', Consolas, 'D2Coding', 'Malgun Gothic', monospace" fill="#17191c">cv2.addWeighted(frame, 0.5, canvas, 0.5, 0)</text>
