<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="640" height="220" role="img" aria-labelledby="title desc">
<title id="title">d 키로 그리기 모드를 켜고 끄기</title>
<desc id="desc">왼쪽 상자는 그리기 꺼짐 상태(drawing_enabled = False)로 손이 움직여도 선을 긋지 않는다. 실행하면 여기서 시작한다. 오른쪽 상자는 그리기 켜짐 상태(drawing_enabled = True)로 검지 끝을 따라 선을 긋는다. 위쪽 화살표(꺼짐에서 켜짐)와 아래쪽 화살표(켜짐에서 꺼짐)에 모두 d 키라고 적혀 있고, 꺼질 때 이전 좌표를 (0, 0)으로 되돌린다. 사이트가 직접 그린 그림.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#4a5361"/></marker><marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f5bd6"/></marker></defs>
<rect width="640" height="220" fill="#ffffff"/>
<g font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="middle"><rect x="40" y="58" width="230" height="116" rx="14" fill="#f4f6f9" stroke="#7b8594" stroke-width="2"/><text x="155" y="90" font-size="19" font-weight="700" fill="#17191c">그리기 꺼짐</text><text x="155" y="116" font-size="16" font-family="ui-monospace, 'Cascadia Mono', Consolas, 'D2Coding', 'Malgun Gothic', monospace" fill="#4a5361">drawing_enabled = False</text><text x="155" y="144" font-size="16" fill="#17191c">손이 움직여도 선을</text><text x="155" y="164" font-size="16" fill="#17191c">긋지 않아요</text><rect x="370" y="58" width="230" height="116" rx="14" fill="#e8f6ee" stroke="#3b9360" stroke-width="2.5"/><text x="485" y="90" font-size="19" font-weight="700" fill="#15653a">그리기 켜짐</text><text x="485" y="116" font-size="16" font-family="ui-monospace, 'Cascadia Mono', Consolas, 'D2Coding', 'Malgun Gothic', monospace" fill="#15653a">drawing_enabled = True</text><text x="485" y="144" font-size="16" fill="#17191c">검지 끝을 따라</text><text x="485" y="164" font-size="16" fill="#17191c">선을 그어요</text><path d="M274 92 C310 62, 330 62, 364 92" fill="none" stroke="#4a5361" stroke-width="2.5" marker-end="url(#arrow)"/><text x="320" y="62" font-size="17" font-weight="700" fill="#17191c">d 키</text><path d="M366 142 C330 172, 310 172, 276 142" fill="none" stroke="#4a5361" stroke-width="2.5" marker-end="url(#arrow)"/><text x="320" y="190" font-size="17" font-weight="700" fill="#17191c">d 키</text><text x="320" y="212" font-size="16" fill="#4a5361">(꺼질 때 이전 좌표는 (0, 0)으로)</text><text x="40" y="28" font-size="16" font-weight="700" fill="#1a4cb4" text-anchor="start">실행하면 여기서 시작</text><line x1="110" y1="36" x2="110" y2="54" stroke="#1f5bd6" stroke-width="2.5" marker-end="url(#arrowBlue)"/></g>
</svg>
