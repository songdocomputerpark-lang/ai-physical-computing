<line x1="205.0" y1="80" x2="205.0" y2="100" stroke="#7b8594" stroke-width="2"/>
<rect x="217.0" y="72" width="6" height="30" fill="#b25e00"/>
<line x1="235.0" y1="80" x2="235.0" y2="100" stroke="#7b8594" stroke-width="2"/>
<line x1="250.0" y1="80" x2="250.0" y2="100" stroke="#7b8594" stroke-width="2"/>
<line x1="265.0" y1="80" x2="265.0" y2="100" stroke="#7b8594" stroke-width="2"/>
<line x1="280.0" y1="80" x2="280.0" y2="100" stroke="#7b8594" stroke-width="2"/>
<line x1="295.0" y1="80" x2="295.0" y2="100" stroke="#7b8594" stroke-width="2"/>
<line x1="310.0" y1="80" x2="310.0" y2="100" stroke="#7b8594" stroke-width="2"/>
<line x1="325.0" y1="80" x2="325.0" y2="100" stroke="#7b8594" stroke-width="2"/>
<line x1="340.0" y1="80" x2="340.0" y2="100" stroke="#7b8594" stroke-width="2"/>
<line x1="355.0" y1="80" x2="355.0" y2="100" stroke="#7b8594" stroke-width="2"/>
<line x1="370.0" y1="80" x2="370.0" y2="100" stroke="#7b8594" stroke-width="2"/>
<line x1="385.0" y1="80" x2="385.0" y2="100" stroke="#7b8594" stroke-width="2"/>
<line x1="400.0" y1="80" x2="400.0" y2="100" stroke="#7b8594" stroke-width="2"/>
<line x1="415.0" y1="80" x2="415.0" y2="100" stroke="#7b8594" stroke-width="2"/>
<line x1="430.0" y1="80" x2="430.0" y2="100" stroke="#7b8594" stroke-width="2"/>
<line x1="445.0" y1="80" x2="445.0" y2="100" stroke="#7b8594" stroke-width="2"/>
<line x1="460.0" y1="80" x2="460.0" y2="100" stroke="#7b8594" stroke-width="2"/>
<line x1="475.0" y1="80" x2="475.0" y2="100" stroke="#7b8594" stroke-width="2"/>
<line x1="490.0" y1="80" x2="490.0" y2="100" stroke="#7b8594" stroke-width="2"/>
<line x1="505.0" y1="80" x2="505.0" y2="100" stroke="#7b8594" stroke-width="2"/>
<line x1="520.0" y1="80" x2="520.0" y2="100" stroke="#7b8594" stroke-width="2"/>
<line x1="535.0" y1="80" x2="535.0" y2="100" stroke="#7b8594" stroke-width="2"/>
<line x1="550.0" y1="80" x2="550.0" y2="100" stroke="#7b8594" stroke-width="2"/>
<line x1="565.0" y1="80" x2="565.0" y2="100" stroke="#7b8594" stroke-width="2"/>
<line x1="580.0" y1="80" x2="580.0" y2="100" stroke="#7b8594" stroke-width="2"/>
<line x1="595.0" y1="80" x2="595.0" y2="100" stroke="#7b8594" stroke-width="2"/>
<text x="214.0" y="120" font-size="16" font-weight="700" fill="#8a4600">↑ 클릭 칸이 1인 글</text>
<text x="70" y="148" font-size="16" font-weight="700" fill="#17191c">기본 예제의 초록 LED</text>
<rect x="70" y="156" width="525.0" height="26" rx="4" fill="#f4f6f9" stroke="#7b8594" stroke-width="1.5"/>
<rect x="220.0" y="156" width="15.0" height="26" fill="#2fbf5b" stroke="#15653a" stroke-width="1.5"/>
<text x="245.0" y="175" font-size="16" fill="#17191c">0.1초 뒤 다음 글(클릭 0)이 오면 바로 꺼져요</text>
<text x="70" y="218" font-size="16" font-weight="700" fill="#17191c">탐구 예제의 초록 LED</text>
<rect x="70" y="226" width="525.0" height="26" rx="4" fill="#f4f6f9" stroke="#7b8594" stroke-width="1.5"/>
<rect x="220.0" y="226" width="300.0" height="26" fill="#2fbf5b" stroke="#15653a" stroke-width="1.5"/>
<text x="370.0" y="245" text-anchor="middle" font-size="16" font-weight="700" fill="#0b3d1f">켜져 있어요(2초)</text>
<line x1="520.0" y1="222" x2="520.0" y2="256" stroke="#15653a" stroke-width="2" stroke-dasharray="5 4"/>
<text x="70" y="278" font-size="16" fill="#17191c">켠 시각을 ticks_ms()로 적어 두고, 2000ms가 지나면 꺼요</text>
<line x1="70" y1="294" x2="595.0" y2="294" stroke="#4a5361" stroke-width="1.5"/>
<line x1="70" y1="294" x2="70" y2="302" stroke="#4a5361" stroke-width="1.5"/>
<text x="70" y="320" text-anchor="middle" font-size="16" fill="#4a5361">0초</text>
<line x1="220" y1="294" x2="220" y2="302" stroke="#4a5361" stroke-width="1.5"/>
<text x="220" y="320" text-anchor="middle" font-size="16" fill="#4a5361">1초</text>
<line x1="370" y1="294" x2="370" y2="302" stroke="#4a5361" stroke-width="1.5"/>
<text x="370" y="320" text-anchor="middle" font-size="16" fill="#4a5361">2초</text>
<line x1="520" y1="294" x2="520" y2="302" stroke="#4a5361" stroke-width="1.5"/>
<text x="520" y="320" text-anchor="middle" font-size="16" fill="#4a5361">3초</text>
</g>
</svg>
