<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-labelledby="title desc">
<title id="title">한 번만 오는 클릭 신호를 기본 예제는 0.1초만, 탐구 예제는 타이머로 2초 동안 LED에 붙잡아 둔다</title>
<desc id="desc">맨 위 줄은 보드가 0.1초마다 받는 글이고, 1초에 받은 글 하나만 클릭 칸이 1이다. 가운데 줄의 기본 예제 초록 LED는 1초에 켜졌다가 0.1초 뒤 다음 글(클릭 0)이 오면 바로 꺼진다. 아래 줄의 탐구 예제 초록 LED는 1초부터 3초까지 2초 동안 켜져 있다. 켠 시각을 ticks_ms()로 적어 두고 2000ms가 지나면 check_leds()가 끈다는 설명이 있다. 사이트가 직접 그린 그림.</desc>
<rect width="640" height="330" fill="#ffffff"/>
<g font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif">
<text x="320" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#17191c">한 번만 오는 클릭을 2초 동안 붙잡아요</text>
<text x="70" y="64" font-size="16" font-weight="700" fill="#17191c">보드가 받는 글(0.1초마다)</text>
<line x1="70.0" y1="80" x2="70.0" y2="100" stroke="#7b8594" stroke-width="2"/>
<line x1="85.0" y1="80" x2="85.0" y2="100" stroke="#7b8594" stroke-width="2"/>
<line x1="100.0" y1="80" x2="100.0" y2="100" stroke="#7b8594" stroke-width="2"/>
<line x1="115.0" y1="80" x2="115.0" y2="100" stroke="#7b8594" stroke-width="2"/>
<line x1="130.0" y1="80" x2="130.0" y2="100" stroke="#7b8594" stroke-width="2"/>
<line x1="145.0" y1="80" x2="145.0" y2="100" stroke="#7b8594" stroke-width="2"/>
<line x1="160.0" y1="80" x2="160.0" y2="100" stroke="#7b8594" stroke-width="2"/>
<line x1="175.0" y1="80" x2="175.0" y2="100" stroke="#7b8594" stroke-width="2"/>
