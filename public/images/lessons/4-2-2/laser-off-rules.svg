<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" width="640" height="350" role="img" aria-labelledby="title desc">
<title id="title">보드가 값을 받다가 끊겼을 때 원본 심화 예제, 심화 예제 사이트판, 탐구 예제 사이트판의 레이저가 켜져 있는 시간</title>
<desc id="desc">맨 위 줄은 0.5초부터 2초까지 0.1초마다 받은 글이고, 그 뒤로는 보내기를 멈춘다. 첫째 줄 원본 심화 예제는 끄는 줄이 주석이라 0.5초에 한 번 켜진 레이저가 끝까지 켜져 있어 위험하다. 둘째 줄 심화 예제 사이트판은 글을 받을 때만 잠깐씩 켜져서 깜빡이듯 보이고 글이 끊기면 꺼진다. 셋째 줄 탐구 예제 사이트판은 0.5초부터 켜져 있다가 마지막 글을 받은 2초에서 2초가 더 지난 4초에 꺼진다. 사이트가 직접 그린 그림.</desc>
<rect width="640" height="350" fill="#ffffff"/>
<g font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif">
<text x="320" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#17191c">값이 끊기면 레이저는 어떻게 될까요?</text>
<text x="70" y="62" font-size="16" font-weight="700" fill="#17191c">보드가 받는 글</text>
<line x1="130.0" y1="70" x2="130.0" y2="92" stroke="#7b8594" stroke-width="2"/>
<line x1="142.0" y1="70" x2="142.0" y2="92" stroke="#7b8594" stroke-width="2"/>
<line x1="154.0" y1="70" x2="154.0" y2="92" stroke="#7b8594" stroke-width="2"/>
