<rect x="226.0" y="204" width="7" height="26" fill="#c8323a"/>
<rect x="238.0" y="204" width="7" height="26" fill="#c8323a"/>
<rect x="250.0" y="204" width="7" height="26" fill="#c8323a"/>
<rect x="262.0" y="204" width="7" height="26" fill="#c8323a"/>
<rect x="274.0" y="204" width="7" height="26" fill="#c8323a"/>
<rect x="286.0" y="204" width="7" height="26" fill="#c8323a"/>
<rect x="298.0" y="204" width="7" height="26" fill="#c8323a"/>
<rect x="310.0" y="204" width="7" height="26" fill="#c8323a"/>
<text x="330.0" y="223" font-size="16" fill="#17191c">받을 때만 켜지고, 끊기면 꺼져요</text>
<text x="70" y="264" font-size="16" font-weight="700" fill="#17191c">탐구 예제 사이트판(마지막 값 뒤 2초)</text>
<rect x="70" y="272" width="540.0" height="26" rx="4" fill="#f4f6f9" stroke="#7b8594" stroke-width="1.5"/>
<rect x="130.0" y="272" width="420.0" height="26" fill="#c8323a" stroke="#a3232a" stroke-width="1.5"/>
<text x="430.0" y="291" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">2초 더 켜져 있다가 꺼져요</text>
<line x1="310.0" y1="268" x2="310.0" y2="302" stroke="#17191c" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="550.0" y1="268" x2="550.0" y2="302" stroke="#17191c" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="70" y1="314" x2="610.0" y2="314" stroke="#4a5361" stroke-width="1.5"/>
<line x1="70" y1="314" x2="70" y2="322" stroke="#4a5361" stroke-width="1.5"/>
<text x="70" y="340" text-anchor="middle" font-size="16" fill="#4a5361">0초</text>
<line x1="190" y1="314" x2="190" y2="322" stroke="#4a5361" stroke-width="1.5"/>
<text x="190" y="340" text-anchor="middle" font-size="16" fill="#4a5361">1초</text>
<line x1="310" y1="314" x2="310" y2="322" stroke="#4a5361" stroke-width="1.5"/>
<text x="310" y="340" text-anchor="middle" font-size="16" fill="#4a5361">2초</text>
<line x1="430" y1="314" x2="430" y2="322" stroke="#4a5361" stroke-width="1.5"/>
<text x="430" y="340" text-anchor="middle" font-size="16" fill="#4a5361">3초</text>
<line x1="550" y1="314" x2="550" y2="322" stroke="#4a5361" stroke-width="1.5"/>
<text x="550" y="340" text-anchor="middle" font-size="16" fill="#4a5361">4초</text>
</g>
</svg>
