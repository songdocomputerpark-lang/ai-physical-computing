<line x1="178.0" y1="70" x2="178.0" y2="92" stroke="#7b8594" stroke-width="2"/>
<line x1="190.0" y1="70" x2="190.0" y2="92" stroke="#7b8594" stroke-width="2"/>
<line x1="202.0" y1="70" x2="202.0" y2="92" stroke="#7b8594" stroke-width="2"/>
<line x1="214.0" y1="70" x2="214.0" y2="92" stroke="#7b8594" stroke-width="2"/>
<line x1="226.0" y1="70" x2="226.0" y2="92" stroke="#7b8594" stroke-width="2"/>
<line x1="238.0" y1="70" x2="238.0" y2="92" stroke="#7b8594" stroke-width="2"/>
<line x1="250.0" y1="70" x2="250.0" y2="92" stroke="#7b8594" stroke-width="2"/>
<line x1="262.0" y1="70" x2="262.0" y2="92" stroke="#7b8594" stroke-width="2"/>
<line x1="274.0" y1="70" x2="274.0" y2="92" stroke="#7b8594" stroke-width="2"/>
<line x1="286.0" y1="70" x2="286.0" y2="92" stroke="#7b8594" stroke-width="2"/>
<line x1="298.0" y1="70" x2="298.0" y2="92" stroke="#7b8594" stroke-width="2"/>
<line x1="310.0" y1="70" x2="310.0" y2="92" stroke="#7b8594" stroke-width="2"/>
<text x="330.0" y="87" font-size="16" fill="#4a5361">여기서 보내기를 멈춰요</text>
<text x="70" y="128" font-size="16" font-weight="700" fill="#17191c">원본 심화 예제(끄는 줄이 주석)</text>
<rect x="70" y="136" width="540.0" height="26" rx="4" fill="#f4f6f9" stroke="#7b8594" stroke-width="1.5"/>
<rect x="130.0" y="136" width="480.0" height="26" fill="#c8323a" stroke="#a3232a" stroke-width="1.5"/>
<text x="370.0" y="155" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">한 번 켜지면 계속 켜져 있어요(위험)</text>
<text x="70" y="196" font-size="16" font-weight="700" fill="#17191c">심화 예제 사이트판(값이 없으면 바로 끔)</text>
<rect x="70" y="204" width="540.0" height="26" rx="4" fill="#f4f6f9" stroke="#7b8594" stroke-width="1.5"/>
<rect x="130.0" y="204" width="7" height="26" fill="#c8323a"/>
<rect x="142.0" y="204" width="7" height="26" fill="#c8323a"/>
<rect x="154.0" y="204" width="7" height="26" fill="#c8323a"/>
