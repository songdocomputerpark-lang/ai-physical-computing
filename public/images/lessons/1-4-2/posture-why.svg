<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 312" width="640" height="312" role="img" aria-labelledby="title desc">
<title id="title">바른 자세와 기운 자세: 두 어깨의 높이 차이로 알아봐요</title>
<desc id="desc">왼쪽 칸은 두 어깨가 거의 같은 높이인 바른 자세로, 어깨 높이 차이가 작아 "좋아요"라고 알려 준다. 오른쪽 칸은 한쪽 어깨가 내려간 기운 자세로, 두 어깨의 높이 차이를 화살표로 보여 주고 "자세가 틀어졌어요!"라고 알려 준다. 사이트가 직접 그린 그림.</desc>
