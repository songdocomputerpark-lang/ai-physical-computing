<circle cx="114" cy="150" r="7" fill="#d24b4b" stroke="#ffffff" stroke-width="1.5"/>
<text x="162" y="276" font-size="16" fill="#17191c" text-anchor="middle">어깨 높이 차이가 작아요</text>
<rect x="222" y="58" width="76" height="34" rx="17" fill="#e8f6ee" stroke="#3b9360"/>
<text x="260" y="81" font-size="16" font-weight="700" fill="#15653a" text-anchor="middle">좋아요</text>

