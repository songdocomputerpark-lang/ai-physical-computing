<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="title desc">
<title id="title">어깨 두 점의 정규화 좌표를 픽셀 좌표로 바꿔 높이 차이 구하기</title>
<desc id="desc">왼쪽은 가로 640픽셀, 세로 480픽셀 영상에 찍힌 어깨 두 점이다. 11번 점(left_shoulder)은 x 0.60, y 0.40이고 12번 점(right_shoulder)은 x 0.35, y 0.50이다. 두 점의 높이를 점선으로 그어 그 사이의 세로 차이를 화살표로 보인다. 오른쪽 계산: ly = int(0.40 × 480) = 192, ry = int(0.50 × 480) = 240, 높이 차이 abs(192 − 240) = 48. 48은 기준값 40보다 크므로 "자세가 틀어졌습니다!"를 쓴다. 사이트가 직접 그린 그림.</desc>
<rect width="640" height="360" fill="#ffffff"/>
<g font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif">
<text x="160" y="32" font-size="17" font-weight="700" fill="#17191c" text-anchor="middle">영상(640×480 픽셀)</text>
<rect x="16" y="48" width="288" height="216" rx="6" fill="#2a3140"/>
<line x1="16" y1="134.4" x2="304" y2="134.4" stroke="#ffd166" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="16" y1="156" x2="304" y2="156" stroke="#ffd166" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="286" y1="138" x2="286" y2="152" stroke="#ffd166" stroke-width="2.5"/>
<path d="M281 141 L286 134 L291 141 Z" fill="#ffd166"/>
<path d="M281 149 L286 156 L291 149 Z" fill="#ffd166"/>
<g fill="none" stroke="#e6e9ee" stroke-width="3" stroke-linecap="round">
<path d="M188.8 134.4 L116.8 156"/>
<path d="M188.8 134.4 L200 264"/>
<path d="M116.8 156 L110 264"/>
</g>
<circle cx="154" cy="96" r="17" fill="none" stroke="#e6e9ee" stroke-width="3"/>
<circle cx="188.8" cy="134.4" r="7" fill="#ff6b6b" stroke="#2a3140" stroke-width="1.5"/>
<circle cx="116.8" cy="156" r="7" fill="#ff6b6b" stroke="#2a3140" stroke-width="1.5"/>
<text x="198" y="124" font-size="16" font-weight="700" fill="#ffffff">11번 점</text>
<text x="104" y="184" font-size="16" font-weight="700" fill="#ffffff" text-anchor="end">12번 점</text>
<text x="160" y="290" font-size="16" fill="#4a5361" text-anchor="middle">점선 두 줄 사이 = 높이 차이</text>

<rect x="320" y="16" width="304" height="328" rx="14" fill="#f4f6f9" stroke="#d6dde6"/>
<text x="336" y="46" font-size="17" font-weight="700" fill="#17191c">① 정규화 좌표 → 픽셀</text>
<g font-size="16" fill="#17191c" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace">
<text x="336" y="76">11번 y 0.40 → ly</text>
<text x="352" y="100">int(0.40 × 480) = 192</text>
<text x="336" y="128">12번 y 0.50 → ry</text>
<text x="352" y="152">int(0.50 × 480) = 240</text>
</g>
<text x="336" y="188" font-size="17" font-weight="700" fill="#17191c">② 높이 차이</text>
<g font-size="16" fill="#17191c" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace">
<text x="352" y="216">abs(192 − 240) = 48</text>
</g>
<text x="336" y="252" font-size="17" font-weight="700" fill="#17191c">③ 기준값(40)과 비교</text>
<g font-size="16" fill="#17191c" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace">
<text x="352" y="280">48 &gt; 40 → 참</text>
</g>
<rect x="336" y="292" width="272" height="38" rx="10" fill="#fff4d8" stroke="#b7800f"/>
<text x="472" y="317" font-size="16" font-weight="700" fill="#7a4a00" text-anchor="middle">"자세가 틀어졌습니다!"</text>
</g>
</svg>
