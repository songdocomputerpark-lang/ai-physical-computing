<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" role="img" aria-labelledby="title desc">
<title id="title">코끝과 두 눈 가운데의 가로 차이(diff)로 고개 방향 판정하기</title>
<desc id="desc">얼굴 세 개가 나란히 있다. 왼쪽 얼굴은 화면 왼쪽으로 고개를 돌려 코끝(빨간 점)이 두 눈 가운데(파란 점선)보다 왼쪽에 있다. 코 x 291 − 두 눈 가운데 x 312 = −21이라 Left다. 가운데 얼굴은 정면을 보아 코 320 − 가운데 319 = 1이라 Center다. 오른쪽 얼굴은 화면 오른쪽으로 고개를 돌려 코 348 − 가운데 326 = 22라 Right다. 두 눈의 바깥쪽 끝은 노란 마름모다. 아래 띠는 diff가 −10보다 작으면 Left, −10부터 +10까지는 Center, +10보다 크면 Right라는 판정 구간이다. 숫자는 가로 640 화면 기준 픽셀이다. 사이트가 직접 그린 그림(얼굴은 실습실 재생 입력과 같은 계산).</desc>
<defs><marker id="arrowLeft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f5bd6"/></marker><marker id="arrowRight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#3b9360"/></marker><marker id="arrowCenter" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#4a5361"/></marker></defs>
