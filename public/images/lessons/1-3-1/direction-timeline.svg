<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-labelledby="title desc">
<title id="title">재생 입력으로 고개를 한 번 돌리는 동안의 diff 그래프와 횟수가 느는 순간</title>
<desc id="desc">가로축은 0초부터 6초까지의 시간, 세로축은 코끝과 두 눈 가운데의 가로 차이 diff(픽셀, −30부터 +30)다. +10과 −10에 점선이 있고, +10보다 위는 Right 칸(연한 초록), −10보다 아래는 Left 칸(연한 파랑), 그 사이는 Center다. 그래프는 0에서 출발해 약 1.7초에 가장 낮은 −28까지 내려갔다가 0으로 돌아오고, 약 4.3초에 가장 높은 +28까지 올라갔다 내려온다. 그래프가 처음 Left 칸에 들어가는 순간(약 0.5초, 파란 동그라미)에 left_count가 0에서 1로, 처음 Right 칸에 들어가는 순간(약 3.3초, 초록 마름모)에 right_count가 0에서 1로 는다. 아래 문장: Left 칸, Right 칸에 들어가는 순간에만 1씩 늘고 머무는 동안에는 그대로다. 사이트가 직접 그린 그림(값은 실습실 재생 입력과 같은 계산).</desc>
<rect width="640" height="330" fill="#ffffff"/>
<g font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="middle"><text x="320" y="26" font-size="18" font-weight="700" fill="#17191c">재생 입력 '고개 돌리기' 한 바퀴(6초, 90장) 동안의 diff</text><rect x="86" y="50" width="530" height="66.66666666666666" fill="#e8f6ee"/><rect x="86" y="183.33333333333331" width="530" height="66.66666666666669" fill="#eaf1fe"/><line x1="86" y1="116.66666666666666" x2="616" y2="116.66666666666666" stroke="#3b9360" stroke-width="1.5" stroke-dasharray="6 4"/><line x1="86" y1="183.33333333333331" x2="616" y2="183.33333333333331" stroke="#1f5bd6" stroke-width="1.5" stroke-dasharray="6 4"/><line x1="86" y1="150" x2="616" y2="150" stroke="#d6dde6" stroke-width="1"/><rect x="86" y="50" width="530" height="200" fill="none" stroke="#7b8594"/><text x="78" y="55" font-size="16" fill="#4a5361" text-anchor="end">+30</text><text x="78" y="121.66666666666666" font-size="16" fill="#4a5361" text-anchor="end">+10</text><text x="78" y="155" font-size="16" fill="#4a5361" text-anchor="end">0</text><text x="78" y="188.33333333333331" font-size="16" fill="#4a5361" text-anchor="end">−10</text><text x="78" y="255" font-size="16" fill="#4a5361" text-anchor="end">−30</text><text x="608" y="70" font-size="16" font-weight="700" fill="#15653a" text-anchor="end">Right</text><text x="608" y="216.66666666666669" font-size="16" font-weight="700" fill="#1f5bd6" text-anchor="end">Left</text><text x="608" y="140" font-size="16" font-weight="700" fill="#4a5361" text-anchor="end">Center</text><path d="M86 146.7 L91.9 153.3 L97.8 160 L103.7 166.7 L109.6 170 L115.4 173.3 L121.3 180 L127.2 186.7 L133.1 190 L139 193.3 L144.9 200 L150.8 203.3 L156.7 206.7 L162.6 213.3 L168.4 213.3 L174.3 220 L180.2 223.3 L186.1 226.7 L192 230 L197.9 233.3 L203.8 233.3 L209.7 236.7 L215.6 236.7 L221.4 240 L227.3 240 L233.2 243.3 L239.1 243.3 L245 240 L250.9 240 L256.8 236.7 L262.7 236.7 L268.6 233.3 L274.4 233.3 L280.3 226.7 L286.2 223.3 L292.1 220 L298 213.3 L303.9 206.7 L309.8 200 L315.7 193.3 L321.6 190 L327.4 180 L333.3 173.3 L339.2 166.7 L345.1 156.7 L351 146.7 L356.9 143.3 L362.8 133.3 L368.7 123.3 L374.6 116.7 L380.4 110 L386.3 103.3 L392.2 100 L398.1 90 L404 86.7 L409.9 80 L415.8 73.3 L421.7 73.3 L427.6 66.7 L433.4 63.3 L439.3 63.3 L445.2 60 L451.1 60 L457 56.7 L462.9 56.7 L468.8 56.7 L474.7 56.7 L480.6 56.7 L486.4 60 L492.3 60 L498.2 63.3 L504.1 66.7 L510 66.7 L515.9 73.3 L521.8 73.3 L527.7 80 L533.6 83.3 L539.4 86.7 L545.3 93.3 L551.2 93.3 L557.1 100 L563 103.3 L568.9 110 L574.8 113.3 L580.7 116.7 L586.6 126.7 L592.4 130 L598.3 133.3 L604.2 140 L610.1 143.3" fill="none" stroke="#17191c" stroke-width="2.5"/><circle cx="127.2" cy="186.7" r="7" fill="#1f5bd6" stroke="#ffffff" stroke-width="2"/><path d="M380.4 102.2 L388.2 110 L380.4 117.8 L372.6 110 Z" fill="#3b9360" stroke="#ffffff" stroke-width="2"/><text x="139.2" y="220.7" font-size="16" font-weight="700" fill="#1f5bd6" text-anchor="start" font-family="ui-monospace, 'Cascadia Mono', Consolas, 'D2Coding', 'Malgun Gothic', monospace" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">left_count 0 → 1</text><text x="366.4" y="96" font-size="16" font-weight="700" fill="#15653a" text-anchor="end" font-family="ui-monospace, 'Cascadia Mono', Consolas, 'D2Coding', 'Malgun Gothic', monospace" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">right_count 0 → 1</text><text x="86" y="272" font-size="16" fill="#4a5361">0</text><text x="174.3" y="272" font-size="16" fill="#4a5361">1</text><text x="262.7" y="272" font-size="16" fill="#4a5361">2</text><text x="351" y="272" font-size="16" fill="#4a5361">3</text><text x="439.3" y="272" font-size="16" fill="#4a5361">4</text><text x="527.7" y="272" font-size="16" fill="#4a5361">5</text><text x="616" y="272" font-size="16" fill="#4a5361">6</text><text x="351" y="296" font-size="16" fill="#4a5361">시간(초)</text><text x="22" y="150" font-size="16" fill="#4a5361" transform="rotate(-90 22 150)">diff(픽셀)</text><text x="320" y="322" font-size="16" fill="#17191c">Left 칸, Right 칸에 들어가는 순간에만 1씩 늘어요. 머무는 동안에는 그대로예요.</text></g>
</svg>
