<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="title desc">
<title id="title">페이스 매시 중단원에서 만들 세 프로그램</title>
<desc id="desc">세 칸이 나란히 있다. 왼쪽(1-3-1)은 왼쪽으로 고개를 돌린 얼굴로, 코끝에 빨간 점, 두 눈의 바깥쪽 끝에 노란 마름모가 있고 왼쪽 위에 Direction: Left라고 적혀 있다. 가운데(1-3-2)는 입을 크게 벌린 얼굴로, 입 둘레 여섯 곳에 노란 점이 있고 왼쪽 위에 MAR: 0.49라고 적혀 있다. 오른쪽(1-3-3)은 두 눈 위에 보라색 가면 그림을 얹은 얼굴이다. 사이트가 직접 그린 그림(얼굴은 실습실 재생 입력과 같은 계산으로 만든 선 그림).</desc>
