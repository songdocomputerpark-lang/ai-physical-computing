<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 540" width="400" height="540" role="img" aria-labelledby="title desc">
<title id="title">눈 종횡비(EAR): 눈 둘레 점 6개의 세로 거리와 가로 거리로 눈을 감았는지 알아봐요</title>
<desc id="desc">위 칸은 뜬 눈, 아래 칸은 감은 눈이다. 두 눈 모두 눈 둘레에 점 p1~p6이 있다. p1과 p4는 눈의 양 끝, p2와 p3은 위 눈꺼풀, p6과 p5는 아래 눈꺼풀이다. 세로 거리 A는 p2와 p6 사이, B는 p3과 p5 사이, 가로 거리 C는 p1과 p4 사이다. 뜬 눈은 A와 B가 60, C가 200이라 EAR = (60 + 60) ÷ (2 × 200) = 0.3이고, 감은 눈은 A와 B가 10으로 줄어 EAR = (10 + 10) ÷ (2 × 200) = 0.05다. 맨 아래 줄: EAR = (A + B) ÷ (2 × C), 눈을 감으면 A와 B가 줄어 EAR이 작아진다. 사이트가 직접 그린 그림.</desc>
<rect width="400" height="540" fill="#ffffff"/>
<g font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif">
<!-- 위: 뜬 눈 -->
<rect x="12" y="12" width="376" height="224" rx="14" fill="#f4f6f9" stroke="#d6dde6"/>
<text x="200" y="42" font-size="19" font-weight="700" fill="#17191c" text-anchor="middle">눈을 떴을 때</text>
<path d="M100 126 Q200 54.6 300 126 Q200 197.4 100 126 Z" fill="#ffffff" stroke="#4a5361" stroke-width="2.5"/>
<line x1="100" y1="126" x2="300" y2="126" stroke="#b7800f" stroke-width="2.5" stroke-dasharray="7 5"/>
<line x1="160" y1="96" x2="160" y2="156" stroke="#1f5bd6" stroke-width="3"/>
<line x1="240" y1="96" x2="240" y2="156" stroke="#1f5bd6" stroke-width="3"/>
<g fill="#d24b4b" stroke="#ffffff" stroke-width="1.5">
<circle cx="100" cy="126" r="6"/><circle cx="300" cy="126" r="6"/>
<circle cx="160" cy="96" r="6"/><circle cx="240" cy="96" r="6"/>
<circle cx="160" cy="156" r="6"/><circle cx="240" cy="156" r="6"/>
</g>
<g font-size="18" fill="#17191c">
<text x="90" y="132" text-anchor="end">p1</text>
<text x="310" y="132">p4</text>
<text x="160" y="84" text-anchor="middle">p2</text>
<text x="240" y="84" text-anchor="middle">p3</text>
<text x="160" y="180" text-anchor="middle">p6</text>
<text x="240" y="180" text-anchor="middle">p5</text>
</g>
<g font-size="18" font-weight="700">
<text x="150" y="118" fill="#1f5bd6" text-anchor="end">A</text>
<text x="250" y="118" fill="#1f5bd6">B</text>
<text x="200" y="148" fill="#7a4a00" text-anchor="middle">C</text>
</g>
<text x="200" y="214" font-size="17" fill="#17191c" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace">(60 + 60) ÷ (2 × 200) <tspan fill="#15653a" font-weight="700">= 0.3</tspan></text>

<!-- 아래: 감은 눈 -->
<rect x="12" y="248" width="376" height="204" rx="14" fill="#f4f6f9" stroke="#d6dde6"/>
<text x="200" y="278" font-size="19" font-weight="700" fill="#17191c" text-anchor="middle">눈을 감았을 때</text>
<path d="M100 356 Q200 344.1 300 356 Q200 367.9 100 356 Z" fill="#ffffff" stroke="#4a5361" stroke-width="2.5"/>
<line x1="100" y1="356" x2="300" y2="356" stroke="#b7800f" stroke-width="2.5" stroke-dasharray="7 5"/>
<line x1="160" y1="351" x2="160" y2="361" stroke="#1f5bd6" stroke-width="3"/>
<line x1="240" y1="351" x2="240" y2="361" stroke="#1f5bd6" stroke-width="3"/>
<g fill="#d24b4b" stroke="#ffffff" stroke-width="1.5">
<circle cx="100" cy="356" r="6"/><circle cx="300" cy="356" r="6"/>
<circle cx="160" cy="351" r="5"/><circle cx="240" cy="351" r="5"/>
<circle cx="160" cy="361" r="5"/><circle cx="240" cy="361" r="5"/>
</g>
<g font-size="18" fill="#17191c">
<text x="90" y="362" text-anchor="end">p1</text>
<text x="310" y="362">p4</text>
<text x="160" y="336" text-anchor="middle">p2</text>
<text x="240" y="336" text-anchor="middle">p3</text>
<text x="160" y="386" text-anchor="middle">p6</text>
<text x="240" y="386" text-anchor="middle">p5</text>
</g>
<text x="200" y="424" font-size="17" fill="#17191c" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace">(10 + 10) ÷ (2 × 200) <tspan fill="#a3232a" font-weight="700">= 0.05</tspan></text>

<!-- 맨 아래 줄 -->
<rect x="12" y="464" width="376" height="64" rx="12" fill="#eaf1fe" stroke="#5b87e0"/>
<text x="200" y="490" font-size="18" font-weight="700" fill="#17191c" text-anchor="middle">EAR = (A + B) ÷ (2 × C)</text>
<text x="200" y="515" font-size="16" fill="#17191c" text-anchor="middle">눈을 감으면 A, B가 줄어 EAR이 작아져요</text>
</g>
</svg>
