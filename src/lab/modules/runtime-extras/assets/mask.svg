<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" role="img" aria-labelledby="mask-title mask-desc">
  <title id="mask-title">가면 그림(mask.png의 원본)</title>
  <desc id="mask-desc">눈 두 개가 뚫린 자주색 가장 무도회 가면. 1-3-3 심화 실습이 얼굴 크기에 맞춰 얹는 사이트 자체 제작 그림이고, 배경과 눈 구멍은 투명해요.</desc>
  <!-- 사이트가 직접 그린 그림(PLAN §9 "직접 그린 SVG를 PNG(RGBA)로"). 브라우저가 400×500 PNG로 그려 파이썬 작업 폴더의 mask.png가 된다(assets.ts).
       가로 = 얼굴 너비, 세로 = 이마~턱 높이에 맞춰 늘어나므로 가면은 위쪽 1/3(눈 높이)에 두고 아래는 비워 둔다.
       도형과 색만 쓰고 바깥 그림·바깥 주소는 쓰지 않는다(tests/unit/runtime-extras/assets.test.ts가 검사). -->
  <!-- 가면 몸통. 눈 구멍 두 개는 fill-rule evenodd로 뚫려 있어 투명하다. -->
  <path
    fill="#5b3fb8"
    stroke="#e0b23a"
    stroke-width="8"
    stroke-linejoin="round"
    fill-rule="evenodd"
    d="M 26 200 C 58 118, 150 108, 200 158 C 250 108, 342 118, 374 200 C 384 262, 332 302, 286 294 C 250 288, 220 264, 200 264 C 180 264, 150 288, 114 294 C 68 302, 16 262, 26 200 Z
       M 74 216 a 46 30 0 1 0 92 0 a 46 30 0 1 0 -92 0 Z
       M 234 216 a 46 30 0 1 0 92 0 a 46 30 0 1 0 -92 0 Z"
  />
  <!-- 눈 구멍 테두리 -->
  <ellipse cx="120" cy="216" rx="46" ry="30" fill="none" stroke="#e0b23a" stroke-width="6" />
  <ellipse cx="280" cy="216" rx="46" ry="30" fill="none" stroke="#e0b23a" stroke-width="6" />
  <!-- 코 위 마름모 장식과 광택 -->
  <path d="M 200 166 l 13 22 l -13 22 l -13 -22 Z" fill="#f3d67a" />
  <path d="M 60 176 C 90 150, 130 142, 170 150" fill="none" stroke="#8f78d6" stroke-width="6" stroke-linecap="round" />
  <path d="M 230 150 C 270 142, 310 150, 340 176" fill="none" stroke="#8f78d6" stroke-width="6" stroke-linecap="round" />
  <!-- 양쪽 끝 별 장식 -->
  <path d="M 44 130 l 6 14 l 15 1 l -12 10 l 4 15 l -13 -8 l -13 8 l 4 -15 l -12 -10 l 15 -1 Z" fill="#e0b23a" />
  <path d="M 356 130 l 6 14 l 15 1 l -12 10 l 4 15 l -13 -8 l -13 8 l 4 -15 l -12 -10 l 15 -1 Z" fill="#e0b23a" />
</svg>
